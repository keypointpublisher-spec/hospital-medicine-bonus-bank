t", "Stop the antibiotic and observe", "Assume the diagnosis is wrong and discharge him", "Repeat the urinalysis only", "Image the kidneys, since obstruction, abscess, or a stone may be present"], "k": 4, "e": "No improvement on active therapy should prompt thinking about obstruction, abscess, a stone, a resistant organism, or a wrong diagnosis. Ultrasound shows hydronephrosis and CT shows stones, gas, and abscess."}, {"c": 14, "s": "Ch 14, section Nephrolithiasis and obstruction", "q": "A 57-year-old man with severe flank pain radiating to the groin is restless and writhing. Before attributing the pain to a stone, what is the most important step in the evaluation?", "o": ["Give an opioid and defer the examination until the pain is controlled, since a stone is the likeliest cause of this pain", "Examine the abdomen, pulses, and genitalia, since a leaking aortic aneurysm, torsion, or appendicitis can mimic colic", "Assume a stone based on the restlessness alone, since writhing is typical of colic", "Order only a urinalysis", "Skip the genital examination, as it rarely matters in colic, and obtain imaging of the kidneys"], "k": 1, "e": "Renal colic is classically severe, wavelike, and restless, but a leaking aneurysm, torsion, appendicitis, and ectopic pregnancy can look the same. The abdomen, pulses, and genitalia must be examined."}, {"c": 14, "s": "Ch 14, section Nephrolithiasis and obstruction", "q": "A 44-year-old man with a known solitary kidney presents with a ureteral stone, controlled pain, and no fever. What is the best disposition?", "o": ["Discharge for a trial of passage without follow-up, since pain is controlled and he is afebrile", "Discharge with an alpha-blocker alone", "Wait for a rising creatinine before calling urology", "Admit and involve urology early, since a solitary kidney carries higher risk", "Treat as a simple outpatient with a single return precaution, since he has no fever or pain"], "k": 3, "e": "A small stone can go home for a trial of passage only when pain is controlled, there is no infection, and kidney function is normal. A solitary kidney is one of the reasons to admit and involve urology early."}, {"c": 14, "s": "Ch 14, section Nephrolithiasis and obstruction", "q": "A 63-year-old man with renal colic has acute kidney injury and heart failure. Which pain strategy is best?", "o": ["Use an NSAID because it works best for colic, regardless of kidney function, and avoid opioids", "Withhold analgesia until the creatinine improves, to avoid masking the course of the injury", "Force a large diuresis to wash out the stone", "Use only oral fluids and reassurance", "Use an opioid because an NSAID is unsafe here, and replace deficits with fluid rather than forcing a diuresis"], "k": 4, "e": "NSAIDs work well for colic but are risky in acute kidney injury, heart failure, and in some patients on anticoagulants. An opioid is the alternative, and fluids replace deficits rather than being pushed to force a diuresis."}, {"c": 14, "s": "Ch 14, section Nephrolithiasis and obstruction", "q": "A 32-year-old woman with a small stone has controlled pain with oral therapy, no fever, normal kidney function, and a normal urinalysis. Which plan is reasonable?", "o": ["Immediate stent placement under anesthesia", "Admission with intravenous antibiotics for presumed infection of the stone", "A trial of passage at home with return precautions", "Immediate lithotripsy", "Percutaneous nephrostomy"], "k": 2, "e": "A small stone with controlled pain, no infection, and normal kidney function can go home for a trial of passage with return precautions. Drainage is reserved for obstruction with infection, a solitary or damaged kidney, or uncontrolled pain."}, {"c": 14, "s": "Ch 14, section Sexually transmitted infection and genitourinary cancers", "q": "A 29-year-old man is admitted with fever and urethral discharge. Besides testing for the organisms you suspect, which additional step is advised?", "o": ["Offer HIV and syphilis testing, take a sexual history without judgment, and treat partners", "Test only for the single suspected organism", "Skip a sexual history if the patient seems uncomfortable, and treat on the examination alone", "Defer partner notification indefinitely", "Avoid any further testing after the first positive result, since the cause is already known"], "k": 0, "e": "Inpatients with possible sexually transmitted infection should have a nonjudgmental sexual history, targeted testing, and an offer of HIV and syphilis testing. Partner treatment and reporting of notifiable infections follow local rules."}, {"c": 14, "s": "Ch 14, section Urinary retention and hematuria", "q": "A 72-year-old woman has new urinary retention with low back pain, saddle numbness, and new leg weakness. What is the best next step?", "o": ["Place a catheter and discharge her with outpatient follow-up for the back pain", "Examine perineal sensation, rectal tone, and leg strength, and arrange urgent imaging", "Give an alpha-blocker and reassess in the morning, since retention is usually prostatic", "Attribute the retention to constipation and give a laxative and fluids", "Order a urinalysis only"], "k": 1, "e": "New retention with back pain, saddle numbness, leg weakness, or loss of bowel control is a neurologic emergency, such as cauda equina syndrome. The neurologic examination and urgent imaging cannot wait."}, {"c": 14, "s": "Ch 14, section Urinary retention and hematuria", "q": "A 75-year-old man has chronic urinary retention and a catheter is placed. His urine output then becomes very large. Which action is best?", "o": ["Stop the catheter immediately", "Recognize postobstructive diuresis, track output and electrolytes, and replace losses", "Restrict all fluids until output falls, to limit the loss and protect the bladder", "Ignore the output because it is expected to normalize on its own once the bladder has emptied", "Give a loop diuretic to improve drainage and relieve any bladder distension"], "k": 1, "e": "After relief of chronic retention a postobstructive diuresis can cause large urine volumes and electrolyte losses. Creatinine, electrolytes, and output should be followed and losses replaced with care."}, {"c": 14, "s": "Ch 14, section Urinary retention and hematuria", "q": "A 50-year-old man has a positive urine dipstick for blood. Microscopy shows no red cells. What is the most likely explanation?", "o": ["Bladder cancer, which usually shows red cells under the microscope when present", "Glomerulonephritis, which would show red cells or red cell casts on microscopy", "Renal colic, which would show red cells in the urine in most patients", "Contamination of the sample from a catheter, a collection container, or the perineal skin", "Myoglobin or hemoglobin in the urine, since a dipstick can read positive without red cells"], "k": 4, "e": "A dipstick can read positive for myoglobin or hemoglobin without red cells, so hematuria is confirmed by looking at the specimen and by microscopy. Without red cells on microscopy, the finding is not true hematuria."}, {"c": 14, "s": "Ch 14, section Urinary retention and hematuria", "q": "A 38-year-old woman has brown, cola-colored urine with protein, red cell casts, and a rising creatinine. What is the most likely source and best approach?", "o": ["A bladder source, which needs cystoscopy first before any other testing is done", "A urethral source, which needs reassurance", "A stone, which needs lithotripsy", "A glomerular source, which needs kidney evaluation", "A prostate source, which needs a PSA"], "k": 3, "e": "Brown or cola-colored urine with protein, red cell casts, and a rising creatinine points to a glomerular source. A urologic source more often gives clots, bright red urine, and no proteinuria."}, {"c": 14, "s": "Ch 14, section Urinary retention and hematuria", "q": "A 77-year-old man with gross hematuria, falling urine output, and suprapubic distension has a rising bladder scan volume. What is the best first action?", "o": ["A small-caliber catheter placed without irrigation, since clots will pass on their own", "Oral fluids and observation", "An immediate CT with no catheter", "A large-bore catheter with irrigation per urology, and a repeat hemoglobin", "Stopping all monitoring until the bleeding stops and the urine has cleared"], "k": 3, "e": "Clots can cause retention, so the first priority in hospital is making sure the patient can void. A large-bore catheter with irrigation and urology input relieves clot retention, while the hemoglobin and coagulation tests are checked."}, {"c": 14, "s": "Ch 14, section Sexually transmitted infection and genitourinary cancers", "q": "A 19-year-old man develops sudden severe testicular pain. What should be assumed until proven otherwise?", "o": ["Epididymitis, with outpatient antibiotics and a review in the clinic later in the week", "A urinary tract infection", "Testicular torsion, with prompt examination or ultrasound and urgent urology", "A muscle strain", "Referred pain from a kidney stone, which needs analgesia and a urinalysis"], "k": 2, "e": "Sudden scrotal pain in a young man is torsion until proven otherwise. Epididymitis can be treated, but torsion must be excluded by prompt examination or ultrasound."}, {"c": 14, "s": "Ch 14, section Sexually transmitted infection and genitourinary cancers", "q": "A 70-year-old man with known prostate cancer has new back pain, leg weakness, and urinary symptoms. What is the best plan?", "o": ["Outpatient imaging next week, with pain control and a clinic visit meanwhile", "Urgent spinal imaging and a call to neurosurgery or radiation oncology", "Treat for a urinary infection and review the symptoms after the course", "Order a PSA and wait for the result before arranging any imaging of the spine", "Physical therapy referral"], "k": 1, "e": "Cord compression in a man with known or suspected prostate cancer is an emergency. New back pain, weakness, or urinary symptoms need urgent imaging of the spine and specialist input."}, {"c": 14, "s": "Ch 14, section Sexually transmitted infection and genitourinary cancers", "q": "A 68-year-old man is in the hospital with acute urinary retention after instrumentation. A resident wants to check a PSA to screen for prostate cancer today. What is the best advice?", "o": ["Order it now, since it is more accurate during acute illness and the result will not need repeating after discharge", "Order it daily to follow the trend while he remains in the hospital with retention", "Treat the result as diagnostic for cancer and start a referral to oncology at once", "Defer screening to outpatient care, since a PSA drawn during acute illness, retention, or instrumentation is hard to interpret", "Use it to decide on antibiotics"], "k": 3, "e": "A PSA drawn during acute illness, retention, or instrumentation is hard to interpret. Screening decisions belong in outpatient care."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 31-year-old woman with type 1 diabetes is made NPO for a procedure tomorrow. The admitting resident writes to hold all insulin until she eats. What is the best correction?", "o": ["Agree, since an NPO patient needs no insulin until she is eating again, and recheck the glucose in the morning", "Replace basal insulin with oral agents, which are safer in a patient who is not eating", "Give only correction insulin until she eats, and restart basal insulin once the diet resumes", "Hold insulin and give dextrose continuously, and watch for low glucose while she is NPO", "Continue basal insulin, because in type 1 diabetes it is not held even when nothing is taken by mouth, with scheduled glucose checks"], "k": 4, "e": "Insulin-deficient patients need insulin at all times, and stopping basal insulin can precipitate DKA. Nutritional insulin is omitted when the patient is not eating, but basal insulin continues, usually with close glucose checks."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 62-year-old man with type 2 diabetes takes an SGLT2 inhibitor at home and is admitted with poor oral intake and a viral illness. What is the best approach to this drug?", "o": ["Continue it, because it lowers glucose safely in any illness and protects the kidney and heart", "Double the dose to cover stress hyperglycemia", "Continue it and check urine ketones only if the glucose is high, since low glucose rules out ketoacidosis", "Hold it only if the glucose is above target", "Hold it, since it can cause ketoacidosis with near-normal glucose during acute illness"], "k": 4, "e": "SGLT2 inhibitors should be held in acute illness, poor intake, or before procedures because they can cause ketoacidosis even when the glucose is near normal. The glucose level does not protect against this risk."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 56-year-old woman on a weekly GLP-1 receptor agonist is scheduled for elective surgery. The surgical team and anesthesia reference different guidance. What does the chapter advise?", "o": ["Follow the 2023 guidance in every case, since it is the oldest and best established", "Ignore the drug and proceed", "Recognize that the 2023, 2024, and 2025 sources differ, state which one you follow, and defer to the anesthesia policy", "Always cancel the surgery", "Assume the 2025 consensus has been fully verified and print its fasting intervals as the standard for every patient on the ward"], "k": 2, "e": "The 2023 ASA guidance advised considering holding the drug, a 2024 multisociety guidance reversed this for most patients, and a 2025 consensus also advised no need to stop. Because the positions differ, the practical step is to name which one you follow and send the patient to the anesthesia policy."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 64-year-old man in a medical ward has a glucose that was high on one reading this morning and normal since. A resident wants to start high-dose insulin. According to ADA 2026 as described in the chapter, what is the better approach?", "o": ["Treat every single high reading with a large correction dose, whatever the earlier values or the trend", "Start insulin only when ketones are present, regardless of the glucose level or the trend", "Wait for an A1C result before any treatment", "Act on a pattern, intensifying at a persistent glucose of 180 mg/dL or higher confirmed on two occasions within 24 hours", "Intensify only after three consecutive high readings on separate days, confirmed by a repeat A1C each time"], "k": 3, "e": "The practical principle is to act on a pattern and avoid overtreating a single reading. The ADA 2026 text sets a threshold of 180 mg/dL or higher confirmed on two occasions within 24 hours."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 59-year-old woman with a glucose of 160 mg/dL on admission has no known diabetes and no recent A1C. What does the chapter advise regarding A1C?", "o": ["Skip it, because an A1C is meaningless in the hospital and the admission glucose alone settles the diagnosis", "Check it only after discharge", "Check an A1C if no recent result exists, since it separates stress hyperglycemia from diabetes", "Check it only if the glucose is extremely high or she develops ketones", "Check it only in patients already on insulin"], "k": 2, "e": "An A1C is advised for anyone with diabetes or new hyperglycemia who has no recent result. The ADA 2026 standards advise one for anyone with diabetes or a glucose above 140 mg/dL if there is none from the prior 3 months."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 67-year-old man on prednisone for an inflammatory flare received escalated insulin. Over the next week the steroid is tapered quickly, and he is found with a fasting glucose that is falling every day. What is the best action?", "o": ["Keep the same insulin doses to avoid rebound hyperglycemia as the steroid wears off", "Increase the nutritional insulin", "Add a sulfonylurea", "Stop glucose checks until the steroid is finished, since insulin is already on board", "Reduce the insulin as the steroid dose falls, and check fasting glucose"], "k": 4, "e": "The steroid dose may change daily, so insulin must be reassessed daily and cut as the steroid is tapered, or hypoglycemia follows. A falling fasting glucose after a steroid reduction is the early sign."}, {"c": 15, "s": "Ch 15, section Inpatient glycemic management and insulin orders", "q": "A 73-year-old man receives continuous tube feeds and a scheduled insulin regimen matched to the feeds. The feeds stop suddenly for a procedure. What is the main risk, and what is the best plan?", "o": ["Hyperglycemia, so increase the insulin dose", "Hypoglycemia, so plan to stop or cover insulin with dextrose when feeds are interrupted", "Hyperkalemia, so give calcium", "Hypernatremia, so give free water", "No change is needed, since tube feeds do not affect insulin needs once the dose has been set for the day"], "k": 1, "e": "Insulin must match the nutrition schedule. If feeds stop suddenly, hypoglycemia can follow, so the order set should include a plan to stop or cover with dextrose."}, {"c": 15, "s": "Ch 15, section Diabetic ketoacidosis and hyperosmolar hyperglycemic state", "q": "An 80-year-old man with type 2 diabetes and pneumonia is drowsy and severely dehydrated after several days of poor intake. He has a very high glucose, high osmolality, and little ketosis. What is the main treatment emphasis?", "o": ["Immediate high-rate insulin with minimal fluid, because the glucose is very high and the priority is lowering it", "Bicarbonate infusion", "Fluid restriction to protect the heart", "Fluid first, then insulin once fluid is under way and potassium is known, plus thromboprophylaxis", "Fast correction of the osmolality for rapid recovery, with frequent checks of the sodium"], "k": 3, "e": "HHS patients are profoundly dehydrated, so fluid is the main treatment and insulin follows. Correcting too fast is a risk, and these patients are at risk for venous thrombosis."}, {"c": 15, "s": "Ch 15, section Diabetic ketoacidosis and hyperosmolar hyperglycemic state", "q": "A 26-year-old woman in diabetic ketoacidosis has been on an insulin infusion. Her glucose is now in the normal range, but the anion gap is still elevated. What is the best action?", "o": ["Add dextrose and continue the insulin infusion until the gap has closed", "Stop the insulin because the glucose is normal and the ketones will clear on their own", "Stop the infusion and switch to a sliding scale once the glucose is in the normal range", "Give bicarbonate to close the gap", "Stop fluids and observe"], "k": 0, "e": "Glucose falls faster than ketosis clears, and insulin is what closes the anion gap. Stopping the infusion early lets ketosis persist and the acidosis return."}, {"c": 15, "s": "Ch 15, section Diabetic ketoacidosis and hyperosmolar hyperglycemic state", "q": "A 38-year-old man with type 1 diabetes in DKA has improved and is eating. The team plans to stop the insulin infusion now. What should be done first?", "o": ["Stop the infusion first and give basal insulin later in the day, once he has finished the meal", "Give no basal insulin until discharge, since he is eating and the glucose is controlled", "Give subcutaneous basal insulin, with nutritional insulin as he eats, before the infusion stops", "Give nutritional insulin alone", "Switch to oral agents"], "k": 2, "e": "Intravenous insulin acts for a very short time, so stopping it without overlap risks rebound ketoacidosis. ADA 2026 advises giving basal insulin 2 to 4 hours before stopping the infusion."}, {"c": 15, "s": "Ch 15, section Diabetic ketoacidosis and hyperosmolar hyperglycemic state", "q": "A 49-year-old woman taking an SGLT2 inhibitor has vomiting and deep breathing. Her glucose is only mildly elevated, but she has a high anion gap acidosis and positive ketones. What is the diagnosis?", "o": ["Diabetic ketoacidosis, since a near-normal glucose in an SGLT2 inhibitor user is still DKA", "Not DKA, because the glucose is not high enough to explain either the acidosis or the positive ketones", "Hyperosmolar hyperglycemic state, with severe dehydration and little ketosis", "Simple starvation", "Lactic acidosis only, by exclusion, since the glucose is not high"], "k": 0, "e": "SGLT2 inhibitors can cause ketoacidosis with a near-normal glucose, and about 10 percent of DKA is euglycemic. Ketones and the acid-base picture, not the glucose alone, make the diagnosis."}, {"c": 15, "s": "Ch 15, section Hypoglycemia", "q": "A 54-year-old man without diabetes has a symptomatic low glucose during an episode. Whipple's triad is documented. What is the best step in the evaluation during the episode?", "o": ["Treat first and never test, since the cause rarely changes management", "Wait until the next fast to collect any blood, so that the test can be done under supervision", "Collect blood for glucose, insulin, C-peptide, and related tests before treating, without delaying treatment", "Test only a urine sample", "Draw blood only the next morning, after an overnight fast on the ward"], "k": 2, "e": "During a documented episode, the sample for glucose, insulin, C-peptide, and related tests gives the most useful information when taken before treatment. Treatment should not be delayed to do it."}, {"c": 15, "s": "Ch 15, section Hypoglycemia", "q": "A 70-year-old woman with a low glucose can swallow safely. The nurse proposes a snack of cheese and nuts. What is the best correction?", "o": ["Cheese and nuts are the preferred treatment because protein and fat last longer", "Give glucagon even though she can swallow safely, to raise the glucose faster", "Wait 30 minutes before any treatment", "Use rapid-acting carbohydrate; protein and fat are not the treatment", "Give a protein shake only"], "k": 3, "e": "Rapid-acting sugars are the treatment for hypoglycemia in a patient who can swallow, with recheck and repeat treatment until the glucose recovers. A longer-lasting carbohydrate is added if the next meal is delayed."}, {"c": 15, "s": "Ch 15, section Thyroid emergencies and thyroid disease on the ward", "q": "A 52-year-old woman with a known history of hyperthyroidism and fever, delirium, and severe tachycardia is diagnosed with thyroid storm. Which sequence of drug classes is correct?", "o": ["Give iodine first, before any antithyroid drug, to block hormone release as fast as possible", "Give iodine alone", "Give a beta-blocker only", "Antithyroid drug before iodine, then add beta blockade and a glucocorticoid", "Give levothyroxine to stabilize the axis and replace the hormone that will be lost"], "k": 3, "e": "Iodine blocks hormone release and is given only after the antithyroid drug has started. Giving iodine before the antithyroid drug can feed more hormone production."}, {"c": 15, "s": "Ch 15, section Thyroid emergencies and thyroid disease on the ward", "q": "A 76-year-old woman is diagnosed with myxedema coma and is hypothermic. A nurse suggests warming her quickly with a heating blanket. What is the best advice?", "o": ["Use active external rewarming to restore the temperature fast and reduce the strain on the heart and brain", "Warm her only after the thyroid hormone course is complete, since heat would blunt its effect", "Cool her to reduce metabolism", "Give no steroid until the cortisol result is known, even if she remains hypotensive", "Rewarm passively, since active rewarming risks vasodilation and collapse, and give thyroid hormone and a steroid"], "k": 4, "e": "Active rewarming is a listed error in myxedema coma because it can cause collapse. Treatment is intravenous thyroid hormone with intravenous steroid and support, taking blood for cortisol and thyroid tests first but not waiting for them."}, {"c": 15, "s": "Ch 15, section Thyroid emergencies and thyroid disease on the ward", "q": "A 65-year-old man in the ICU has a low T3 and a slightly abnormal TSH after sepsis. He has no goiter and no thyroid history. A resident wants to start thyroid hormone. What is the best advice?", "o": ["Do not treat the nonthyroidal illness pattern; repeat the tests after recovery", "Start thyroid hormone because the TSH is abnormal and the T3 is low, to restore the axis", "Start an antithyroid drug to bring the abnormal TSH back toward normal", "Order a thyroid scan today", "Give iodine"], "k": 0, "e": "Acute illness lowers T3 and recovery can transiently raise TSH, so most abnormal thyroid tests in sick patients reflect illness and not thyroid disease. Treating a sick-euthyroid pattern is a pitfall."}, {"c": 15, "s": "Ch 15, section Adrenal insufficiency and stress-dose steroids", "q": "A 63-year-old woman has septic shock that is fluid unresponsive. Her chart lists no endocrine disease, but her family says she has taken prednisone daily for months. What is the best next step?", "o": ["Withhold steroids because she has no adrenal diagnosis on the chart and the family history is unreliable", "Give stress-dose glucocorticoid, since chronic steroid use can suppress the adrenal axis", "Wait for a corticotropin stimulation test result before giving any steroid", "Give only a vasopressor", "Check a PSA"], "k": 1, "e": "Steroid-induced suppression is the commonest cause of adrenal insufficiency in hospital, and the history of all steroid use should be sought. Stress-dose cover should not wait for a test."}, {"c": 15, "s": "Ch 15, section Adrenal insufficiency and stress-dose steroids", "q": "A 45-year-old man with known adrenal insufficiency has a febrile illness but is tolerating oral medication. According to the guideline described, what should his usual oral steroid dose become?", "o": ["It should be held to avoid masking the fever, then restarted when she is well", "It should be increased, by doubling or tripling the usual daily oral dose", "It should be reduced by half", "It should be unchanged", "It should be replaced with fludrocortisone alone, which covers the stress response"], "k": 1, "e": "The guideline directs that patients with known adrenal insufficiency double or triple the usual daily oral dose in a febrile illness. If they are vomiting or cannot take oral drugs, they switch to a parenteral steroid."}, {"c": 15, "s": "Ch 15, section Hypercalcemia and metabolic bone disease", "q": "A 72-year-old woman has a high calcium and a high or inappropriately normal PTH. What does this pattern point to?", "o": ["Primary hyperparathyroidism, which leads to urine calcium, vitamin D testing, and referral", "Malignancy with PTH-related protein, which would usually suppress the PTH level", "Vitamin D intoxication, which would usually suppress the PTH level", "Granulomatous disease, which would usually suppress the PTH level", "Thyrotoxicosis as the sole cause, which would suppress the PTH and needs no parathyroid work-up"], "k": 0, "e": "A high or inappropriately normal PTH with high calcium points to the parathyroid glands, such as primary hyperparathyroidism. A suppressed PTH points away from them and toward malignancy, vitamin D excess, or granulomatous disease."}, {"c": 15, "s": "Ch 15, section Pituitary disorders and incidental findings", "q": "A 48-year-old man with suspected panhypopituitarism and low blood pressure is about to start levothyroxine. What is the best sequence?", "o": ["Start levothyroxine first, then add a steroid later once the blood pressure has recovered and the thyroid tests improve", "Give a glucocorticoid first, since thyroid hormone speeds cortisol clearance and can precipitate adrenal crisis", "Start growth hormone", "Give levothyroxine alone and monitor the TSH to guide the dose over time", "Wait for TSH to guide all therapy, since the pituitary controls the thyroid"], "k": 1, "e": "In hypopituitarism the loss of ACTH and cortisol is the key concern, and thyroid hormone can precipitate crisis when given first. Free thyroxine, not TSH, is used to judge thyroid function when the pituitary fails."}, {"c": 16, "s": "Ch 16, section Anemia: approach and transfusion thresholds", "q": "A 70-year-old man is admitted with fatigue and a new anemia. He is hemodynamically stable and the team plans to transfuse one unit. Which step should come first?", "o": ["Start the unit now and send the nutritional samples afterward to save time", "Draw iron, B12, folate, and reticulocyte samples before the unit", "Order a bone marrow biopsy before any other test", "Give the unit and then repeat the hemoglobin before any other test", "Skip the nutritional tests because transfusion will correct the cause"], "k": 1, "e": "Transfused blood can hide the cause of anemia, so the diagnostic samples are drawn first. Sending them afterward is the strongest distractor, because the transfused sample no longer reflects the patient's own marrow and stores."}, {"c": 16, "s": "Ch 16, section Anemia: approach and transfusion thresholds", "q": "A 58-year-old woman has anemia. The reticulocyte count is low despite the anemia. What does this finding most directly suggest?", "o": ["The marrow is responding appropriately to ongoing blood loss", "Hemolysis is the most likely cause", "The anemia is purely dilutional", "The sample was drawn after a transfusion", "The marrow is failing or starved of a needed substrate"], "k": 4, "e": "A reticulocyte count separates a marrow that is responding, where the count rises, from one that is failing or starved, where it does not. Hemolysis would usually raise the count, which is why it is the main distractor."}, {"c": 16, "s": "Ch 16, section Anemia: approach and transfusion thresholds", "q": "A hospitalized patient's hemoglobin has fallen quickly over one day. Which is the most appropriate working assumption?", "o": ["Laboratory error until a repeat shows otherwise", "Anemia of chronic disease", "Bleeding or hemolysis until proven otherwise", "Expected phlebotomy loss in all cases", "Nutritional deficiency that needs iron first"], "k": 2, "e": "A fast fall in hemoglobin points to bleeding or hemolysis, so look at stool, urine, wounds, drains, and line sites and check hemolysis markers. Chronic disease and nutritional deficits develop over a longer time and do not explain a rapid drop."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A 45-year-old man has a platelet count that has fallen sharply in the laboratory report, but he has no bleeding and looks well. Before chasing a cause, what is the best next step?", "o": ["Transfuse platelets to restore a safe count", "Check the smear and repeat the count in a citrate tube", "Start a heparin-free anticoagulant", "Begin steroids for presumed immune thrombocytopenia now", "Order a bone marrow biopsy"], "k": 1, "e": "Platelets can clump in the EDTA tube and read falsely low, and a smear with a citrate repeat settles this. Treatment for immune or marrow causes before confirming the count is premature."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A 62-year-old woman has fever, confusion, a rising creatinine, a low platelet count, and fragmented red cells on the smear. Which is the best next move?", "o": ["Urgent hematology call for presumed thrombotic thrombocytopenic purpura", "Platelet transfusion now to correct the low count and reduce bleeding risk", "Reassurance, observation on the ward, and repeat labs in the morning", "Empiric heparin infusion to treat the presumed clotting disorder", "Routine outpatient hematology referral after discharge"], "k": 0, "e": "Fragments with a low platelet count, kidney injury, and neurologic change is TTP until hematology says otherwise, and it needs same-day treatment. Platelet transfusion can feed the process, so it is not given for the number alone."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A 60-year-old man on a heparin product for a week has a falling platelet count and a new swollen calf. Which statement about the danger of heparin-induced thrombocytopenia is correct?", "o": ["The main danger is spontaneous bleeding from the low count", "The main danger is hemolysis", "The main danger is arterial and venous clotting, not bleeding", "The danger resolves as soon as the platelet count is above baseline", "The condition is not immune mediated"], "k": 2, "e": "HIT is an immune reaction against heparin and platelet factor 4 complexes that activates platelets, so despite the name the harm is thrombosis. Bleeding is the expected harm of most low counts, which is why it is the tempting distractor."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A 66-year-old woman with a high pretest probability of HIT is awaiting the antibody result. Which action is most appropriate now?", "o": ["Continue heparin until the antibody returns positive and confirms it", "Switch to warfarin alone", "Stop all heparin and start a non-heparin anticoagulant now", "Give platelets to raise the count first", "Reduce the heparin dose and recheck daily"], "k": 2, "e": "HIT is a clinical diagnosis supported by a test, so with intermediate or high suspicion you act first. Warfarin alone is not used in the acute phase."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A resident says a positive antibody screen proves HIT in a patient with only a mild platelet drop six weeks after heparin exposure. What is the best teaching point?", "o": ["The assay is perfectly specific, so any positive result confirms HIT and ends the workup", "The 4Ts replaces the need for any laboratory test in patients with suspected HIT", "Pretest probability should be ignored once an assay is ordered and resulted by the laboratory", "The assay can be positive without disease, so the 4Ts is used to judge pretest probability", "The antibody test should never be sent"], "k": 3, "e": "The antibody assay alone can be positive in patients without the disease, so clinical reasoning with thrombocytopenia, timing, thrombosis, and other causes frames the result. Treating a positive assay as proof leads to overtreatment."}, {"c": 16, "s": "Ch 16, section Thrombocytopenia, including heparin-induced thrombocytopenia", "q": "A 59-year-old woman with suspected HIT has all heparin orders stopped, yet her platelets continue to fall and a nurse flushes her central line each shift. What is the most likely missed step?", "o": ["Flushes contain no heparin and are not a plausible source of ongoing exposure", "The heparin was stopped too early", "Warfarin should be added immediately", "Platelet transfusion is needed", "Heparin is still entering through line flushes and must be removed"], "k": 4, "e": "A patient can receive heparin through flushes, heparin-coated catheters, or a dialysis circuit, so nurses and pharmacy should list every exposure. Warfarin alone is not used acutely, so adding it is not the fix."}, {"c": 16, "s": "Ch 16, section Venous thromboembolism prophylaxis and treatment", "q": "A 82-year-old woman weighing 58 kg with creatinine 1.1 mg/dL is starting apixaban for a new deep vein thrombosis. Which statement about dosing is correct?", "o": ["She should receive 2.5 mg twice daily because of her age and low weight", "She should receive the standard maintenance dose from day one to reduce her bleeding risk", "She should receive 10 mg once daily because of her age and weight", "The label gives no VTE regimen for patients of this age or weight", "The atrial fibrillation reduction rule does not apply; VTE starts with a higher dose"], "k": 4, "e": "The reduction for age, weight, and creatinine belongs to the atrial fibrillation indication; for VTE the regimen is 10 mg twice daily for 7 days, then 5 mg twice daily. Starting the maintenance dose from day one underdoses the patient."}, {"c": 16, "s": "Ch 16, section Venous thromboembolism prophylaxis and treatment", "q": "A 64-year-old man with metastatic colon cancer is admitted with a pulmonary embolism and needs initial parenteral therapy. Which choice matches the ASH 2021 cancer guidance as summarized?", "o": ["Low molecular weight heparin over unfractionated heparin", "Unfractionated heparin over low molecular weight heparin initially", "Aspirin alone", "A vitamin K antagonist alone as the first choice for this patient", "No anticoagulation until chemotherapy ends"], "k": 0, "e": "For cancer-associated VTE, the summary prefers LMWH over unfractionated heparin for initial treatment and accepts a DOAC or LMWH. A vitamin K antagonist is favored in antiphospholipid syndrome or advanced liver disease, not as the cancer default."}, {"c": 16, "s": "Ch 16, section Venous thromboembolism prophylaxis and treatment", "q": "A hospital pharmacist notes that the ASH 2018 medical-patient guideline advises against DOACs for in-hospital prophylaxis, while one rivaroxaban label lists a regimen for acutely ill medical patients. How should a hospitalist handle this?", "o": ["Assume the guideline is an error and ignore it in practice", "Recognize the sources differ and follow the hospital protocol", "Assume the label always overrides guidelines because it is regulatory", "Use both agents together", "Avoid all prophylaxis"], "k": 1, "e": "The guideline reflects a judgment about benefit and bleeding, and the label records what the regulator approved; the two are not the same position. In practice you follow your hospital's protocol."}, {"c": 16, "s": "Ch 16, section Anticoagulant selection, reversal, and bleeding", "q": "A 71-year-old woman had a lumbar puncture yesterday while on enoxaparin. She now reports new back pain and leg weakness. What is the best action?", "o": ["Treat as a possible spinal hematoma with urgent spine imaging", "Reassure and give analgesia for post-puncture back pain, then recheck tomorrow", "Wait for the next scheduled neurologic check before imaging", "Give the next enoxaparin dose on time", "Order outpatient imaging"], "k": 0, "e": "Enoxaparin carries a boxed warning for spinal or epidural hematoma with neuraxial procedures, and a new deficit is an emergency. Waiting for the next scheduled check is the main distractor and loses time."}, {"c": 16, "s": "Ch 16, section Anticoagulant selection, reversal, and bleeding", "q": "A 74-year-old man on an anticoagulant has a minor nosebleed that stops with pressure. Hemodynamics are normal. What is the most appropriate approach?", "o": ["Emergency reversal with the specific agent", "Immediate transfusion of red cells and plasma", "Local measures and a held dose, without reversal", "Permanent discontinuation of all antithrombotic therapy", "Four-factor prothrombin complex concentrate"], "k": 2, "e": "Reversal is reserved for life-threatening bleeding because reversal agents can provoke clotting in someone who needed the anticoagulant. For minor bleeding, hold the drug and treat the site."}, {"c": 16, "s": "Ch 16, section Anticoagulant selection, reversal, and bleeding", "q": "A 69-year-old man on a factor Xa inhibitor has a life-threatening bleed and the team orders idarucizumab. What is the problem?", "o": ["Idarucizumab is only effective after a platelet transfusion has been given", "Idarucizumab reverses all anticoagulants equally", "It should be given only after the next dose", "Idarucizumab reverses dabigatran only, not a factor Xa inhibitor", "It is contraindicated in kidney disease"], "k": 3, "e": "Idarucizumab is a specific antidote for dabigatran, so the drug and last dose must be confirmed before ordering any reversal. It does not work on factor Xa inhibitors."}, {"c": 16, "s": "Ch 16, section Anticoagulant selection, reversal, and bleeding", "q": "A 67-year-old man had a lower gastrointestinal bleed on an anticoagulant that has now stopped after treatment. What does the lower GI bleeding guideline summary suggest about the anticoagulant?", "o": ["Never restart it", "Restart it only after a clinic visit weeks later", "Switch permanently to aspirin", "Restart it after the bleeding stops", "Restart only if a specific reversal agent is on hand"], "k": 3, "e": "The summary advises restarting the anticoagulant after bleeding stops (strong recommendation, moderate certainty), weighing clot risk against bleed risk. Permanent discontinuation exposes the patient to the original clot risk."}, {"c": 16, "s": "Ch 16, section Anticoagulant selection, reversal, and bleeding", "q": "A 70-year-old man with atrial fibrillation on warfarin is scheduled for elective surgery. According to the 2022 CHEST perioperative guideline as summarized, what is advised about heparin bridging?", "o": ["Bridge routinely with full-dose heparin", "Bridge only if the platelet count is normal", "Replace warfarin with aspirin", "Bridge with a DOAC", "Recommend against bridging with heparin"], "k": 4, "e": "The summary recommends against heparin bridging in atrial fibrillation for elective surgery (strong recommendation). Routine bridging adds bleeding risk without clear benefit."}, {"c": 16, "s": "Ch 16, section Transfusion medicine and its complications", "q": "A 55-year-old woman develops chills, back pain, and falling blood pressure soon after the start of a red cell transfusion. What should be done first?", "o": ["Slow the infusion and observe", "Give a diuretic and continue the unit while monitoring vital signs closely", "Restart with a new unit immediately", "Stop the transfusion, keep the line open with saline, and call the blood bank", "Wait for symptoms to settle before notifying the blood bank or the treating physician"], "k": 3, "e": "Stop the transfusion first and sort the reaction out second, since this picture suggests an acute hemolytic reaction from a mismatch. Continuing the unit to see what happens is the pitfall."}, {"c": 16, "s": "Ch 16, section Transfusion medicine and its complications", "q": "After a transfusion a 78-year-old man becomes short of breath with hypoxia. His blood pressure is high and his lungs are wet. Which diagnosis fits best and what distinguishes it from lung injury?", "o": ["Circulatory overload, because pressure is high and diuretics help", "Lung injury, because pressure is high and the lungs are wet", "Allergic reaction, because of the wet lungs and the shortness of breath", "Bacterial contamination, because high pressure and hypoxia follow a unit", "Febrile nonhemolytic reaction, because of the hypoxia and wet lungs"], "k": 0, "e": "Overload and lung injury both cause breathlessness and low oxygen, but overload comes with high pressure and a response to diuretics, while lung injury often comes with low pressure and fever."}, {"c": 16, "s": "Ch 16, section Oncologic emergencies and chemotherapy adverse effects", "q": "A 50-year-old woman on chemotherapy has a fever and no obvious focus. Which approach is correct?", "o": ["Treat as a viral illness and recheck in 24 hours if the fever persists", "Treat as sepsis: cultures, prompt broad antimicrobials, and no wait for the neutrophil count", "Wait for the neutrophil count before starting antimicrobials, then tailor treatment to the result", "Give antipyretics and observe", "Withhold antibiotics until cultures are positive for a specific organism"], "k": 1, "e": "Fever may be the only sign of serious infection when neutrophils are low, so treatment is not delayed for the count. Calling it viral is the named pitfall."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A 68-year-old man is found by a nurse with a new left facial droop and slurred speech after waking from a nap. Nobody knows when it began. What time starts the clock?", "o": ["The time the nurse discovered the deficit on the ward", "The time of the first head CT scan after arrival", "The time he went to sleep, his last known well", "The time the stroke team arrived at the bedside", "The time he first reported symptoms to the nurse"], "k": 2, "e": "The clock starts at last known well, the last moment someone knows the patient was normal, and not at discovery. For a patient who wakes with a deficit, that is when he went to sleep, which is why extended-window imaging exists."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A hospitalized 73-year-old woman suddenly cannot speak and has a weak right arm. After airway, breathing, and circulation, which pair of actions belongs in the first minutes?", "o": ["Order a lipid panel and start a statin", "Check a fingerstick glucose and call the stroke team", "Request an echocardiogram and wait for the result", "Send a urinalysis and cultures only", "Give aspirin by mouth before any swallow check"], "k": 1, "e": "Low glucose can cause focal deficits and is a quick fix, and the stroke team must be called early because treatment depends on the clock. A swallow screen comes before oral intake, which makes oral aspirin the unsafe distractor."}, {"c": 17, "s": "Ch 17, section Movement disorders and neuro-ophthalmology on the ward", "q": "A 71-year-old man with Parkinson disease is admitted with a hip fracture. He waited a long time in the emergency department and his levodopa dose was missed. He is now rigid and cannot swallow. What is the most appropriate step?", "o": ["Restore his home drugs on his own schedule and avoid abrupt withdrawal", "Stop all dopaminergic drugs until he can swallow safely and the fracture is fixed", "Add metoclopramide for nausea and resume his oral drugs after surgery", "Give haloperidol for agitation and adjust the Parkinson drugs later", "Wait for a neurology outpatient visit before changing any medicine"], "k": 0, "e": "Late or missed doses worsen rigidity and swallowing, and abrupt withdrawal can cause a life-threatening state resembling neuroleptic malignant syndrome. Metoclopramide and haloperidol block dopamine and make matters worse."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A 66-year-old woman on the ward has a sudden right-sided weakness. What is the main reason a noncontrast head CT is usually the first image?", "o": ["It reliably shows early ischemic infarction within the first hours", "It replaces the need for vessel imaging", "It is needed only after thrombolysis", "It identifies the culprit vessel in every suspected stroke case", "It separates hemorrhage from ischemia, guiding next steps"], "k": 4, "e": "The first image separates bleeding from a blocked vessel, which determines treatment. It does not exclude early ischemia and does not replace vessel imaging in suspected large vessel occlusion."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A CT in a 75-year-old anticoagulated woman with sudden headache, vomiting, and a deficit shows intracerebral hemorrhage. What is the best set of actions?", "o": ["Stop antithrombotics, call neurosurgery and neurology, and discuss reversal", "Give thrombolysis within the treatment window to restore flow to the brain", "Add dual antiplatelet therapy to prevent further vascular events", "Continue the anticoagulant and recheck imaging tomorrow, since the bleed may stop", "Start intensive glucose control and observe on the ward"], "k": 0, "e": "Hemorrhage means antithrombotic therapy is stopped and specialists are called, with reversal discussed if she was anticoagulated. Thrombolysis or antiplatelet therapy would worsen bleeding."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A 64-year-old man with an acute stroke has a markedly high blood pressure on the ward. The covering resident writes a routine order to bring it down quickly. What is the best response?", "o": ["Lower it quickly to a normal range because high pressure always harms the brain", "Leave it entirely unmonitored", "Apply the same target to every patient regardless of treatment received", "Hold antihypertensives and call the stroke team for a pressure range", "Give a double dose of the home antihypertensive"], "k": 3, "e": "A routine order can reduce flow to viable brain, and the right range depends on reperfusion and on whether the bleed is ischemic or hemorrhagic. The stroke team gives the range and you write it as an order."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A 70-year-old man has had a stroke and is awake and hungry. The family offers him a drink. What is the best approach?", "o": ["Keep him nil by mouth until a bedside swallow screen is done", "Allow thin liquids because he is awake", "Allow food only if his wife supervises", "Give crushed pills with water", "Start tube feeding for every stroke patient at once"], "k": 0, "e": "A bedside swallow screen before oral intake may reduce pneumonia and can guide further testing. Aspiration pneumonia is a common and preventable complication."}, {"c": 17, "s": "Ch 17, section Acute stroke and transient ischemic attack", "q": "A 62-year-old man has sudden dysarthria, double vision, and quadriparesis suggesting basilar artery occlusion within the first day. How does the guideline summary treat thrombectomy in carefully selected patients?", "o": ["Class 1 within 24 hours when selection criteria are met", "Contraindicated because of the high risk of bleeding", "Class 3, harm, because of the risk of hemorrhage", "Only after a prolonged period of observation without improvement", "Only if thrombolysis has been tried first and has failed"], "k": 0, "e": "Basilar occlusion within 24 hours, with low pre-stroke disability and sufficient stroke scale and imaging scores, earns class 1 in the summary. The criteria are for the stroke team to apply."}, {"c": 17, "s": "Ch 17, section Seizure and status epilepticus", "q": "A 40-year-old man's seizure stopped after a benzodiazepine, and he is now awake. A colleague wants to consider the problem solved. What is the most important next step?", "o": ["Return him to the ward without further orders or a cause search", "Look for the cause and order the agent your protocol uses", "Stop all monitoring because he is awake", "Assume epilepsy and change nothing about his care", "Withhold labs until the next seizure occurs"], "k": 1, "e": "A seizure that stops after a benzodiazepine can return when it wears off, so find the cause and continue protection per protocol. Stopping at the seizure and not the cause is a named pitfall."}, {"c": 17, "s": "Ch 17, section Seizure and status epilepticus", "q": "A 52-year-old man on the ward is on tramadol and bupropion, and has a first generalized seizure. Which approach fits best?", "o": ["Label him as having epilepsy and start lifelong anticonvulsant therapy without further workup", "Add a third threshold-lowering drug to control his symptoms", "Treat only the seizure and ignore the medication list", "Defer all testing until discharge from hospital", "Stop the threshold-lowering drug and check glucose, electrolytes, and head imaging"], "k": 4, "e": "First seizures in hospitalized patients are usually provoked, and some drugs lower the threshold. Searching for the cause comes before labeling epilepsy."}, {"c": 17, "s": "Ch 17, section Seizure and status epilepticus", "q": "A 58-year-old woman remains unresponsive well after a convulsion, with subtle eyelid twitching. What should be requested?", "o": ["A lumbar puncture only", "A repeat dose of her oral home medicine", "Reassurance that postictal states are normal and expected", "An EEG, to look for nonconvulsive status epilepticus", "A urinalysis only"], "k": 3, "e": "Nonconvulsive status epilepticus should be considered in unexplained confusion or coma, especially after a convulsion, and EEG confirms it. Failure to wake after a convulsion is a prompt for EEG."}, {"c": 17, "s": "Ch 17, section Altered mental status and encephalopathy", "q": "A 45-year-old man has fever, headache, a stiff neck, and confusion. CT and lumbar puncture will take hours. What is the best next step?", "o": ["Hold antimicrobials until CT and lumbar puncture are completed", "Give only an antipyretic and observe", "Wait for the lumbar puncture results", "Draw blood cultures and start antimicrobials, then image", "Begin steroids alone"], "k": 3, "e": "When meningitis is a serious possibility, antimicrobials are not delayed for imaging or lumbar puncture. Add antiviral cover while herpes encephalitis is possible."}, {"c": 17, "s": "Ch 17, section Altered mental status and encephalopathy", "q": "A 56-year-old man with heavy alcohol use is confused and unsteady, with abnormal eye movements. He is about to receive intravenous dextrose. What should be done?", "o": ["Give the dextrose first and thiamine tomorrow", "Withhold thiamine until Wernicke is confirmed by imaging", "Give thiamine only after a normal CT", "Give a sedative instead", "Give thiamine before or with the glucose"], "k": 4, "e": "A glucose load can worsen thiamine deficiency, so thiamine is given early in at-risk patients. A normal CT does not exclude Wernicke encephalopathy."}, {"c": 17, "s": "Ch 17, section Altered mental status and encephalopathy", "q": "A 78-year-old woman has postoperative delirium with severe agitation that threatens harm after behavioral measures failed. Which statement matches the AGS best practice summary?", "o": ["Benzodiazepines are first line for all delirium, including severe agitation", "Antipsychotics are recommended for routine prevention in all older surgical patients", "Antipsychotics are reserved for severe agitation, at the lowest dose for the shortest time", "Cholinesterase inhibitors should be newly started perioperatively to prevent postoperative delirium", "Opioid-heavy pain control is preferred"], "k": 2, "e": "The statement found insufficient evidence for antipsychotics as prevention and reserves them for severe agitation, while advising against benzodiazepines as first line except in withdrawal. It also advises against newly prescribing cholinesterase inhibitors perioperatively."}, {"c": 17, "s": "Ch 17, section Movement disorders and neuro-ophthalmology on the ward", "q": "A 60-year-old man has sudden droopy eyelid with the eye turned down and out and a dilated pupil. What is the most appropriate step?", "o": ["Reassure and arrange routine outpatient eye review after discharge", "Prescribe artificial tears and lubricating ointment for the eye", "Emergency vessel imaging and a neurosurgical call", "Wait several days for the pupil to normalize on its own", "Start a migraine treatment and observe at the bedside"], "k": 2, "e": "A third nerve palsy with a dilated pupil suggests a compressing aneurysm. It needs emergency imaging rather than routine follow-up."}, {"c": 17, "s": "Ch 17, section Headache, neuropathy, and neuromuscular emergencies", "q": "A 47-year-old man has weakness and absent reflexes with sensory loss, ascending over days after a recent infection. A second patient has fatigable ptosis, bulbar weakness, and normal reflexes without sensory loss. Which feature best separates the two?", "o": ["Myasthenic crisis has absent reflexes and prominent sensory loss", "Both have identical reflex findings and sensory findings", "Guillain-Barre syndrome has lost reflexes, whereas myasthenic crisis has normal reflexes", "Guillain-Barre syndrome has normal reflexes and no sensory symptoms, unlike myasthenic crisis", "Myasthenia always has autonomic instability and absent reflexes"], "k": 2, "e": "Reflexes are lost in Guillain-Barre syndrome and normal in myasthenic crisis, and sensory loss is common in the former and absent in the latter. Guillain-Barre syndrome also has frequent autonomic instability."}, {"c": 17, "s": "Ch 17, section Headache, neuropathy, and neuromuscular emergencies", "q": "A 55-year-old man with Guillain-Barre syndrome needs treatment. Which statement is correct?", "o": ["Steroids alone are the standard treatment, given with supportive care", "Neurology starts intravenous immunoglobulin or plasma exchange", "No disease-modifying treatment exists and only observation helps", "Antibiotics cure the condition", "Treatment is deferred until intubation becomes necessary"], "k": 1, "e": "Treatment is by neurology with immunoglobulin or plasma exchange, and steroids alone are not effective. Supportive care includes thromboembolism prevention and airway protection."}, {"c": 17, "s": "Ch 17, section Headache, neuropathy, and neuromuscular emergencies", "q": "A 66-year-old woman with myasthenia gravis is admitted with pneumonia and the team plans a fluoroquinolone and an infusion of magnesium. What is the concern?", "o": ["They have no effect on the neuromuscular junction in a patient with myasthenia gravis", "They are the preferred treatment of myasthenia in this setting", "They improve fatigable weakness", "They are safe because she is on immunotherapy for her myasthenia", "These drugs can worsen neuromuscular transmission; check with pharmacy first"], "k": 4, "e": "Fluoroquinolones, aminoglycosides, macrolides, and magnesium may worsen the junction, though the best list comes from pharmacy. Checking the interaction list before starting is the fix."}, {"c": 17, "s": "Ch 17, section Central nervous system tumors, demyelinating disease, and spinal cord disease", "q": "A 59-year-old man with a suspected brain mass has a headache, vomiting, and a falling level of consciousness. A resident proposes a lumbar puncture to look for infection. What is the best response?", "o": ["Proceed immediately with lumbar puncture to look for infection or hemorrhage", "Perform the puncture after sedating him to keep him still", "Lay him flat and wait for him to improve", "Avoid lumbar puncture because of herniation risk; image first", "Delay all imaging until the puncture is done"], "k": 3, "e": "Lowering spinal fluid pressure below a mass can cause herniation, so image first when a mass or papilledema is possible. Raise the head of the bed, secure the airway, and call neurosurgery and the ICU."}, {"c": 17, "s": "Ch 17, section Movement disorders and neuro-ophthalmology on the ward", "q": "A 64-year-old man started on a new serotonergic drug has agitation, tremor, clonus, fever, sweating, and diarrhea. Which diagnosis and first move fit?", "o": ["Neuroleptic malignant syndrome, so give more dopamine blocking drugs", "Serotonin syndrome, so stop serotonergic drugs and support him", "Acute dystonia, so continue the drug and give fluids", "Tardive dyskinesia, so wait", "Wernicke encephalopathy, so give dextrose alone and observe"], "k": 1, "e": "Clonus and hyperreflexia point to serotonin syndrome, whereas slowly evolving lead-pipe rigidity points to neuroleptic malignant syndrome. Stopping the offending drug and supporting the patient is the first move."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A 48-year-old sedated ICU patient has no rash but becomes hypotensive with high airway pressures minutes after an intravenous drug is given. What is the best action?", "o": ["Rule out anaphylaxis because there are no hives", "Give an antihistamine and wait for the effect", "Order a tryptase and delay treatment until the result returns", "Suspect anaphylaxis and give intramuscular epinephrine", "Give only a steroid"], "k": 3, "e": "Anaphylaxis can occur without skin findings, and collapse minutes after a new exposure is enough to start treatment. The cost of unneeded epinephrine is small and the cost of withholding it is large."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A 35-year-old woman with anaphylaxis needs epinephrine. Which route and site does the chapter favor, and why?", "o": ["Subcutaneous in the abdomen, because it is slower and considered safer", "Intravenous bolus in all cases, because it acts fastest", "Intramuscular in the lateral thigh, for fast and reliable absorption", "Nebulized, because it avoids the need for injection", "Oral, because it is the least invasive route"], "k": 2, "e": "The label lists intramuscular or subcutaneous routes, and most clinicians choose the lateral thigh intramuscularly for fast, reliable absorption. A slower route delays the effect when seconds matter."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A 29-year-old man with an acute asthma attack develops hives and hypotension after a new drug. What does the 2026 GINA acute-care guidance suggest?", "o": ["Treat only the bronchospasm with a bronchodilator and monitor", "Give a steroid and wait for it to take effect", "Delay epinephrine because of the asthma and cardiac risk", "Avoid epinephrine in asthma because it worsens wheeze", "Give epinephrine first when anaphylaxis coexists with asthma"], "k": 4, "e": "The guidance says to treat anaphylaxis first with epinephrine when it coexists with asthma. Treating the wheeze alone leaves the shock untreated."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A nurse asks why diphenhydramine and a steroid should not be given before epinephrine in anaphylaxis. What is the best answer?", "o": ["They relieve itch and hives but do not treat airway swelling or shock", "They are more effective than epinephrine for airway swelling and shock", "They are contraindicated in all patients with anaphylaxis", "They reverse hypotension quickly and reliably in shock", "They prevent a biphasic reaction with certainty if given early"], "k": 0, "e": "Antihistamines and glucocorticoids are adjuncts. The delay in giving epinephrine is the thing that kills."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A 52-year-old man had anaphylaxis after an antibiotic and has recovered after epinephrine. What is the best plan?", "o": ["Return him to a routine bed with routine vital signs and no observation", "Keep him monitored and document the culprit in the allergy field", "Discharge at once without documentation of the culprit", "Record the reaction only in the progress note, not the allergy field", "Repeat the same antibiotic tomorrow to test tolerance"], "k": 1, "e": "Anaphylaxis can return after seeming to resolve, so the patient should be watched. Documenting the culprit prevents the next team from repeating it."}, {"c": 18, "s": "Ch 18, section Anaphylaxis and drug allergy", "q": "A 60-year-old woman has a penicillin allergy label from childhood described only as 'stomach upset.' How should this label be viewed?", "o": ["Any label is permanent and must stand regardless of history", "Nausea is not an allergy; a specific history may support removing the label", "It proves a severe allergy to penicillin", "It makes all beta-lactams absolutely contraindicated, so the label must stay forever", "History should not be taken for old labels"], "k": 1, "e": "Many allergy labels are wrong, and a short, specific history separates true reactions such as hives, swelling, wheeze, or collapse from side effects. A wrong label leads to broader antibiotics and longer stays."}, {"c": 18, "s": "Ch 18, section Cutaneous drug reactions and severe skin disease", "q": "A 44-year-old man has painful dusky skin, blisters, mouth erosions, and fever after a new drug. Which disposition is best?", "o": ["Continue the drug and give an antihistamine for the rash", "Treat at home with a topical steroid and oral fluids", "Stop all suspected drugs and transfer to a burn unit or ICU", "Wait to see whether the rash peels before acting", "Apply adhesive dressings to all erosions to protect the skin"], "k": 2, "e": "SJS or TEN behaves like a burn, with fluid and heat loss, infection risk, and pain, so a burn unit or ICU is the safe choice. Adhesive dressings pull loosened skin and should be avoided."}, {"c": 18, "s": "Ch 18, section Cutaneous drug reactions and severe skin disease", "q": "A 55-year-old woman has SJS or TEN and a colleague wants to start a specific systemic agent as standard. What is the best statement?", "o": ["One systemic agent is proven to be the standard for every patient with the condition", "Supportive care has no role", "Systemic drugs are always required", "Adjuncts should be started before stopping the culprit drug", "Stopping the drug and supportive care are the base; adjunct therapy is disputed"], "k": 4, "e": "The only treatment that is certain is to stop the causative drug and support the patient. Societies and centers differ on adjunct systemic therapy."}, {"c": 18, "s": "Ch 18, section Cutaneous drug reactions and severe skin disease", "q": "A 38-year-old man started a new antibiotic and develops many small sterile pustules on red skin with fever. What is the most likely pattern and course?", "o": ["DRESS, requiring weeks of observation without stopping the drug", "Simple morbilliform rash needing no action or drug change", "SJS or TEN requiring no change", "Gout flare", "AGEP, usually self-limited after stopping the drug"], "k": 4, "e": "Rapid onset of many small sterile pustules on red skin with fever is AGEP, which is usually self-limited. DRESS features facial swelling, eosinophilia, and organ injury instead."}, {"c": 18, "s": "Ch 18, section Systemic lupus, vasculitis, and giant cell arteritis", "q": "A 34-year-old woman with lupus on immunosuppression has a fever. The team suspects a flare and wants to escalate immunosuppression. What is the best approach?", "o": ["Assume a flare and escalate immediately, since lupus is the known diagnosis here", "Treat fever as infection until proven otherwise and search before escalating", "Withhold all testing until the fever resolves", "Reduce all monitoring while the fever is evaluated", "Start a biologic first to cover both possibilities"], "k": 1, "e": "A lupus flare and sepsis can look identical, and immunosuppression given for the wrong one can kill. The decision to escalate follows a careful search for infection."}, {"c": 18, "s": "Ch 18, section Systemic lupus, vasculitis, and giant cell arteritis", "q": "A 49-year-old man with fever, weight loss, and multiple organ signs is suspected to have vasculitis. Which condition must be excluded before immunosuppression?", "o": ["Simple dehydration from poor oral intake and low appetite", "A resolved viral illness with lingering symptoms", "Infective endocarditis, a mimic of vasculitis", "Seasonal allergy with systemic symptoms", "Ankle sprain with secondary joint swelling"], "k": 2, "e": "Blood cultures and exclusion of endocarditis come first because it can mimic vasculitis and would worsen with immunosuppression. This is why cultures are part of the early workup."}, {"c": 18, "s": "Ch 18, section Systemic lupus, vasculitis, and giant cell arteritis", "q": "A 41-year-old man has joint pain and a positive antinuclear antibody but a normal examination otherwise. What is the best interpretation?", "o": ["A positive result alone proves lupus in a patient with joint pain, regardless of exam", "It excludes lupus if the result is only weakly positive", "It requires immediate high-dose steroids to prevent organ damage", "The antibody is common in healthy people, so the clinical picture decides", "It is specific for vasculitis and confirms the diagnosis"], "k": 3, "e": "An antinuclear antibody should not be given more weight than it carries, because it is common in healthy people. It is used as a screen with specific antibodies directed by rheumatology."}, {"c": 18, "s": "Ch 18, section Systemic lupus, vasculitis, and giant cell arteritis", "q": "A 57-year-old man with hematuria, rising creatinine, and hemoptysis is on a general ward. Which is the best disposition?", "o": ["Routine ward care with outpatient follow-up after discharge", "A monitored bed with same-day specialist input", "Discharge with oral antibiotics and outpatient review", "Wait until the antibodies return before any action", "Observation without specialist contact until the antibodies return"], "k": 1, "e": "The urgent question is whether an organ is threatened, and kidney and lung involvement cannot wait. A patient with joint pain and a rash but stable organs can often be worked up on the ward."}, {"c": 18, "s": "Ch 18, section Gout, septic joint, and acute arthritis", "q": "A 72-year-old woman with a hot knee and no fever is being considered for gout. What is the best next step?", "o": ["Aspirate the joint and send fluid for cell count, culture, and crystals", "Start colchicine without a tap to treat presumed gout", "Assume infection is excluded by the lack of fever and the likely diagnosis of gout", "Delay a tap until she is febrile or the knee worsens", "Obtain only a uric acid level to confirm gout"], "k": 0, "e": "Absence of fever does not exclude infection, especially in older adults. The tap, with culture, is the test that decides."}, {"c": 18, "s": "Ch 18, section Gout, septic joint, and acute arthritis", "q": "A resident wants to aspirate a hot knee through an area of cellulitis. What is the best response?", "o": ["Proceed because infection is already assumed, so the tap changes nothing", "Inject steroid through the skin to settle the inflammation", "Skip the tap and treat with antibiotics alone", "Do not aspirate through infected skin; seek another route or get help", "Wait for the cellulitis to clear for several days before any tap"], "k": 3, "e": "Aspirating through infected skin risks seeding the joint, so other help should be sought. Delaying drainage in a possible septic joint is also dangerous."}, {"c": 18, "s": "Ch 18, section Gout, septic joint, and acute arthritis", "q": "A 63-year-old man with chronic gout on allopurinol has a flare after surgery. What is the best approach to his urate-lowering drug?", "o": ["Stop it abruptly because it is the likely cause of the flare", "Double the dose to lower urate faster", "Continue his usual urate-lowering drug and treat the flare", "Start a second urate-lowering drug immediately to control the flare", "Discontinue permanently after the flare"], "k": 2, "e": "Stopping an existing urate-lowering drug during a flare can worsen it. Starting a new one is for the clinician who will follow the patient."}, {"c": 18, "s": "Ch 18, section Immunosuppressed patients and steroid management", "q": "A 70-year-old man on long-term prednisone has been told to hold oral medicines before surgery. What is the best order?", "o": ["Convert to a parenteral steroid in an equivalent dose", "Skip the steroid for now since he is nil by mouth", "Reduce the dose by half to limit surgical risk", "Give the dose after surgery only if he becomes hypotensive", "Stop steroids permanently before surgery"], "k": 0, "e": "A chronic steroid user who is nil by mouth should receive the steroid parenterally, because skipping it can cause adrenal crisis. Write it in the plan and review at each handoff."}, {"c": 18, "s": "Ch 18, section Immunosuppressed patients and steroid management", "q": "A 56-year-old woman with primary adrenal insufficiency on oral hydrocortisone has a febrile illness. According to the 2016 guideline as read, what is the sick-day adjustment?", "o": ["Stop the replacement until the fever has settled", "Give no change to her usual daily dose", "Halve the dose to avoid excess steroid", "Use only a topical steroid until she recovers", "Double or triple her usual dose"], "k": 4, "e": "For febrile illness, patients on oral replacement double or triple the usual daily dose. Stopping or reducing the steroid during illness risks crisis."}, {"c": 18, "s": "Ch 18, section Immunosuppressed patients and steroid management", "q": "A 68-year-old man on long-term steroids is hypotensive with missed doses. A resident plans to use the primary adrenal insufficiency crisis dose of 100 mg of hydrocortisone, then 200 mg over 24 hours. What caveat applies?", "o": ["The dose is proven for steroid-induced suppression by the 2024 guideline itself", "Dose confirmation is never needed for emergency steroid dosing", "The dose applies only to children and not to adults", "That dose is from primary insufficiency guidance, so applying it here is an extrapolation", "The doses are identical across all sources, with no differences between guidelines or conditions"], "k": 3, "e": "The hydrocortisone doses in the chapter come from the primary adrenal insufficiency guideline, while the 2024 guideline on glucocorticoid-induced insufficiency was read without its doses. Treat first, then confirm the dose."}, {"c": 18, "s": "Ch 18, section Immunosuppressed patients and steroid management", "q": "A 61-year-old man with well-controlled diabetes starts high-dose steroids for a vasculitis flare. What change to the inpatient glucose plan is expected?", "o": ["Use insulin timed to the steroid's action, expecting needs to rise and then fall", "No change, because steroids do not affect glucose control in patients with diabetes", "Stop all insulin while he is on steroids", "Fix a single basal dose for the whole stay regardless of the steroid", "Treat only if he becomes symptomatic from high glucose"], "k": 0, "e": "High-dose steroids raise glucose, so the hospital glucose plan has to change when they start. Needs for mealtime and correction insulin rise and then fall as the steroid is tapered."}, {"c": 19, "s": "Ch 19, section Preoperative risk stratification", "q": "A surgical team asks you to write a note for a 74-year-old man with diabetes before elective hip replacement. Which note best reflects good practice?", "o": ["States that the patient is cleared for surgery with low risk and signs off without further comment on medicines or monitoring", "Lists the patient's diagnoses and defers every decision to the anesthesiologist", "States the risk in words, gives drug by drug instructions and monitoring, and names what would change the advice", "Recommends a stress test and an echocardiogram in all cases so the note is complete and nothing is left open", "Describes the risk as acceptable and omits medicine instructions to keep the note short and easy to read"], "k": 2, "e": "A consult is an estimate of risk and a plan, not a clearance. The note should put short recommendations first and state what was not done and why. The word cleared hides what was assessed and what should happen."}, {"c": 19, "s": "Ch 19, section Preoperative risk stratification", "q": "A hospitalist is asked to assess a patient before a scheduled operation. Which question should be asked first when layering perioperative risk?", "o": ["How urgent is the operation?", "What is the result of the most recent stress test?", "What does the patient's electrocardiogram show?", "Which medicines can be stopped to simplify the plan?", "Does the patient need a natriuretic peptide level?"], "k": 0, "e": "Urgency comes first because it decides whether any evaluation can delay the operation. The operation, the patient's conditions, and function follow, and testing comes last and only if it would change care. Starting with tests reverses this order."}, {"c": 19, "s": "Ch 19, section Cardiac risk and when to test", "q": "A 66-year-old man with hypertension and good exercise tolerance is scheduled for cataract surgery. A colleague suggests a pharmacologic stress test to be safe. What is the best response?", "o": ["Order the stress test, since any patient over 65 should have one before receiving any form of anesthesia", "Order an echocardiogram instead, since it carries no cost and gives more information than a stress test", "Order the stress test only if the patient has diabetes, because diabetes alone decides whether testing is needed", "Delay the surgery until a cardiology visit is completed", "No stress test, because routine testing is not recommended when surgical risk is low or capacity is adequate"], "k": 4, "e": "Guidance recommends against routine stress testing in patients with adequate function or low surgical risk. Both conditions apply here. Age alone or a diagnosis such as diabetes does not make a test useful if the result will not change the plan."}, {"c": 19, "s": "Ch 19, section Cardiac risk and when to test", "q": "A 70-year-old woman with known heart failure becomes more breathless and gains weight over three days. She is scheduled for an elective operation next week. What is the best recommendation?", "o": ["Proceed as planned because heart failure therapy is continued through surgery and the weight can be watched", "Postpone the elective operation and treat the decompensated heart failure first", "Proceed and add a new beta-blocker on the morning of surgery", "Order a stress test and operate if it is normal", "Hold all heart failure drugs until after surgery"], "k": 1, "e": "Decompensated heart failure is an unstable cardiac condition, and the approach is to treat it and postpone elective surgery. Continuing therapy through surgery applies to stable patients. A new beta-blocker on the day of surgery is specifically discouraged."}, {"c": 19, "s": "Ch 19, section Managing cardiac medications around surgery", "q": "The admission order for a patient with a coronary stent scheduled for surgery reads hold all home medicines. Which correction is best?", "o": ["Keep the order, since fasting patients should take nothing by mouth before an operation of any kind", "Change it to continue all home medicines without exceptions, including the antiplatelet drugs and the diuretic, until discharge", "Hold only the statin and continue everything else", "Replace it with drug by drug instructions marked take, hold, or restart when, naming who decided on antiplatelets", "Leave the order and ask the nurse to decide at the bedside, drug by drug, on the morning of surgery"], "k": 3, "e": "A blanket hold stops beta-blockers, statins, and antiplatelet drugs that should continue. The safe approach is an explicit instruction for each drug. Continuing everything is also wrong, since some drugs such as SGLT2 inhibitors are held."}, {"c": 19, "s": "Ch 19, section Managing cardiac medications around surgery", "q": "A 71-year-old man with a drug-eluting stent needs surgery that cannot be delayed. Which plan for his antiplatelet drugs is best?", "o": ["Continue aspirin, and decide about holding the P2Y12 inhibitor jointly with surgery, anesthesia, and cardiology", "Stop aspirin and the P2Y12 inhibitor together to minimize bleeding, since the stent no longer needs any protection", "Continue both drugs and tell no one", "Stop aspirin and continue only the P2Y12 inhibitor, since that drug alone protects the stent", "Replace both drugs with a heparin infusion without discussion among the surgical and cardiology teams"], "k": 0, "e": "Aspirin is continued in stent patients when surgery cannot be delayed, and a P2Y12 inhibitor is held only after a team decision. Stopping all antiplatelet drugs is the most dangerous error because it risks stent thrombosis."}, {"c": 19, "s": "Ch 19, section Managing cardiac medications around surgery", "q": "A 69-year-old woman takes an ACE inhibitor and the anesthesia team asks that it be held on the morning of surgery. What is the most important instruction to write in the postoperative orders?", "o": ["Never restart it during the hospital stay, even once the operation is over and the patient is stable", "Restart it only after discharge at the first clinic visit, whatever the blood pressure and kidney function", "A clear restart condition, since delayed restart is associated with higher 30 day mortality", "Replace it permanently with a diuretic", "Restart it at double the dose to make up for missed doses, once the blood pressure allows"], "k": 2, "e": "Whether to hold on the morning of surgery is shared with anesthesia, but the restart should be as soon as reasonable. A delayed restart of ACE inhibitors and ARBs has been linked to higher mortality at 30 days. Writing the restart condition prevents the drug from being forgotten."
