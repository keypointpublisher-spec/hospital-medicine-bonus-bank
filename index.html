ient with controlled hypertension", "A patient with an innocent flow murmur and a normal echocardiogram", "A patient with a prosthetic heart valve", "A patient who had a stress test last year", "A patient with a family history of endocarditis"], "k": 2, "e": "Prophylaxis is reserved for patients at highest risk of a bad outcome from endocarditis, such as those with a prosthetic valve or prior endocarditis. A flow murmur with a normal echocardiogram or hypertension does not qualify. The exact list of conditions and regimens should come from the primary guideline."}, {"c": 5, "s": "Ch 5, section Infective endocarditis and other cardiovascular infections", "q": "A 60-year-old man with a prosthetic aortic valve has fever and positive blood cultures. A transthoracic echocardiogram is nondiagnostic, but suspicion remains high. What is the best next test?", "o": ["Transesophageal echocardiography", "Repeat transthoracic echocardiography in several weeks", "No further imaging since cultures are sufficient", "A routine chest film only", "Stress testing"], "k": 0, "e": "Transesophageal echocardiography is used when suspicion remains high, the transthoracic study is nondiagnostic, or a prosthetic valve or device is involved. The modified Duke criteria combine microbiologic, imaging and clinical findings, but they support the diagnosis and do not replace judgment."}, {"c": 5, "s": "Ch 5, section Infective endocarditis and other cardiovascular infections", "q": "A 47-year-old woman being treated for endocarditis develops a new conduction block on her ECG. What does this suggest?", "o": ["A benign finding that needs no action beyond a routine repeat ECG at the next scheduled clinic visit", "A side effect that proves the antibiotic is working and the infection is clearing", "A recording artifact from lead placement that is unrelated to the infection", "Extension of infection into the valve ring, needing early cardiology and cardiac surgery input", "An indication to stop all monitoring, because the tracing is no longer informative"], "k": 3, "e": "A new conduction block suggests extension of infection into the valve ring, which is one of the triggers to escalate to cardiology, infectious diseases and early cardiac surgery. Others include heart failure, abscess, persistent bacteremia on appropriate therapy, a prosthetic valve and recurrent emboli."}, {"c": 5, "s": "Ch 5, section Infective endocarditis and other cardiovascular infections", "q": "A 52-year-old man has one of two blood culture sets growing Staphylococcus aureus. A resident suggests it is a contaminant. What is the best response?", "o": ["Dismiss it since only one set is positive and skin contamination is the usual explanation for that organism", "Repeat cultures only if he becomes septic, since a single positive set is not reliable", "Start antibiotics only if the fever persists for a week, then reassess with new cultures", "Obtain no imaging and rely on the culture result alone to guide the antibiotic course", "Treat it as real until proved otherwise: look for a focus, repeat cultures and usually obtain an echocardiogram"], "k": 4, "e": "Staphylococcus aureus in the blood is never a contaminant until proved otherwise. It needs a hunt for a focus, repeat cultures to document clearance and, in most cases, an echocardiogram."}, {"c": 5, "s": "Ch 5, section Infective endocarditis and other cardiovascular infections", "q": "A 49-year-old man with endocarditis has a new focal neurologic deficit. A resident wants to start a therapeutic anticoagulant for embolic prevention. What is the best next step?", "o": ["Start heparin immediately to prevent further emboli, then image once stable", "Neurologic examination and imaging before any anticoagulant, because septic emboli can bleed", "Give a thrombolytic without imaging, since a new deficit is most likely a clot", "Wait for the deficit to resolve on its own and give nothing, with no imaging unless it worsens", "Apply a compression stocking and observe, since the risk is venous rather than cerebral"], "k": 1, "e": "Septic emboli can cause hemorrhage, including from a mycotic aneurysm, so the neurologic status should be checked before any anticoagulant or surgical decision. Imaging comes before any antithrombotic decision. Neurology should be involved."}, {"c": 5, "s": "Ch 5, section Infective endocarditis and other cardiovascular infections", "q": "Which patient with Staphylococcus aureus bacteremia may be a candidate for a short fixed course counted from the first negative culture?", "o": ["A patient with a prosthetic valve and vegetation", "A patient with a spinal abscess", "A patient with no deep or metastatic focus of infection", "A patient with persistent bacteremia on therapy", "A patient with a vascular graft infection"], "k": 2, "e": "The IDSA and ESCMID statements define lower-risk groups without deep or metastatic foci as eligible for a fixed course counted from the first negative culture. Endocarditis and other deep foci fall outside the short course. The statement was read only partially."}, {"c": 5, "s": "Ch 5, section Pericarditis, effusion, and tamponade", "q": "A 36-year-old man has sharp chest pain that eases when he sits forward and worsens with breathing. His ECG shows diffuse ST elevation with PR depression. A colleague suggests heparin and urgent thrombolysis. What is the best action?", "o": ["Hold anything that bleeds and get a bedside echocardiogram, since this is pericarditis, not occlusion", "Give thrombolysis immediately, because ST elevation in several leads means a large infarct", "Give a large dose of nitroprusside to lower the pressure and relieve the pain", "Start a therapeutic anticoagulant first, then obtain imaging once the heparin infusion is running on the ward", "Send him for emergency surgery because the diffuse changes suggest a mechanical complication"], "k": 0, "e": "Diffuse ST elevation with PR depression in a patient who feels better leaning forward points to pericarditis, not a regional coronary occlusion. Anticoagulation or thrombolysis can turn a benign effusion into a hemorrhagic one. A second look at the leads and an echocardiogram come before anything that bleeds."}, {"c": 5, "s": "Ch 5, section Pericarditis, effusion, and tamponade", "q": "A 40-year-old woman with idiopathic pericarditis is stable. Which initial treatment is best supported by the chapter?", "o": ["Early high-dose corticosteroids as first-line therapy, because they shorten the course and prevent recurrence", "Anticoagulation alone to prevent pericardial clot formation", "Diuretics alone to reduce the pericardial fluid and pain", "A nonsteroidal drug plus colchicine, with gastric protection and activity restriction", "Antibiotics for all cases, since most pericarditis is bacterial in origin"], "k": 3, "e": "First-line therapy for idiopathic or viral pericarditis is a nonsteroidal drug plus colchicine, with gastric protection and rest. Corticosteroids are reserved for specific causes or failure of first-line therapy because early steroids are linked to recurrence."}, {"c": 5, "s": "Ch 5, section Pericarditis, effusion, and tamponade", "q": "A 55-year-old man with trauma and a volume-depleted state is hypotensive and tachycardic with muffled heart sounds, but his neck veins are flat. An echocardiogram shows an effusion with right-sided chamber collapse. What does this illustrate?", "o": ["Flat neck veins exclude tamponade, so the echocardiographic findings should be disregarded as artifact", "The classic picture is often incomplete, and flat neck veins can occur in a volume-depleted patient", "Tamponade depends only on effusion volume, not on how quickly the fluid accumulated", "Tamponade is a laboratory diagnosis made from the cardiac biomarkers and the blood count", "Echocardiography is unreliable in this setting, so the diagnosis rests on the physical signs"], "k": 1, "e": "The classic triad is often incomplete, and the neck veins may be flat in a volume-depleted patient. Tamponade is physiology, not size, with speed of accumulation mattering more than volume. Echocardiography shows right-sided chamber collapse and a plethoric inferior vena cava."}, {"c": 5, "s": "Ch 5, section Pericarditis, effusion, and tamponade", "q": "A 62-year-old man after cardiac surgery has raised neck veins with Kussmaul sign and leg edema, but no evidence of left-sided failure. What is the best first move for suspected constriction?", "o": ["Emergency pericardial drainage as for tamponade", "Anti-inflammatory therapy alone", "Vasodilator infusion", "Pacemaker placement", "Diuresis and specialist evaluation"], "k": 4, "e": "In constriction, neck veins are raised with Kussmaul sign, and the first move is diuresis with specialist evaluation. Edema without left-sided failure is an early sign of constriction. Drainage is the first move for tamponade, not constriction."}, {"c": 5, "s": "Ch 5, section Aortic dissection and acute vascular syndromes", "q": "A 59-year-old man has abrupt tearing chest pain, a pulse deficit, and is hemodynamically unstable. CT is not yet reported, but the pretest probability of ascending aortic dissection is high. What is the best action?", "o": ["Wait for the final CT report before calling anyone, so the surgeon receives a confirmed written diagnosis", "Treat only with an oral antihypertensive and observe on the ward", "Call cardiac surgery before the CT report is final, and transfer at once if no team is available", "Discharge with outpatient imaging", "Start thrombolysis for presumed infarction"], "k": 2, "e": "Type A dissection, which involves the ascending aorta, is a surgical emergency. When the pretest probability is high and the patient is unstable, cardiac surgery should be called before the CT report is final. Without a surgical team, transfer immediately."}, {"c": 5, "s": "Ch 5, section Aortic dissection and acute vascular syndromes", "q": "A 64-year-old man with chest pain and ST elevation also has a pressure difference between his arms and tearing back pain. A resident wants to give heparin and activate the catheterization laboratory. What is the best response?", "o": ["Image the aorta before any anticoagulant, antiplatelet or thrombolytic", "Give aspirin and heparin first, then image the aorta if the angiogram is unrevealing", "Give thrombolysis to treat the ST elevation and re-check the ECG afterward", "Order only a troponin and wait for the result before deciding on any imaging", "Start a vasodilator alone and defer imaging until the pain has settled completely"], "k": 0, "e": "Dissection can occlude a coronary ostium and mimic infarction, so a patient can reach the catheterization laboratory by mistake. If the history or examination suggests dissection, the aorta should be imaged before antithrombotic therapy. Aortic dissection treatment starts with pain control and heart rate reduction."}, {"c": 5, "s": "Ch 5, section Aortic dissection and acute vascular syndromes", "q": "A 72-year-old man with hypotension, severe back and flank pain and a pulsatile abdominal mass is suspected of having a ruptured abdominal aortic aneurysm. He is unstable. Where should he go?", "o": ["The CT scanner for full characterization first", "The medical ward for observation", "The outpatient vascular clinic", "The operating room, rather than the CT scanner", "The cardiac catheterization laboratory"], "k": 3, "e": "A ruptured abdominal aortic aneurysm presents with hypotension, back or flank pain and a pulsatile mass. An unstable patient needs the operating room, not the CT scanner. Time is tissue for vascular emergencies."}, {"c": 5, "s": "Ch 5, section Aortic dissection and acute vascular syndromes", "q": "A 70-year-old woman has severe abdominal pain with a soft, minimally tender abdomen. Her lactate is normal. Atrial fibrillation is known. What should be suspected?", "o": ["Mesenteric ischemia is excluded by a normal lactate, since lactate rises early in any form of bowel injury", "Acute mesenteric ischemia, since lactate rises late and pain is out of proportion to the examination", "Gastroenteritis, since the abdomen is soft and the pain is likely to settle with fluids", "Functional abdominal pain, since the examination and the laboratory tests are unremarkable", "Constipation, since the abdomen is soft and the bowel habit is probably the cause"], "k": 1, "e": "Acute mesenteric ischemia presents with abdominal pain out of proportion to the examination, and lactate rises late. Embolic and thrombotic occlusion of visceral vessels share one rule, time is tissue, and the vascular surgeon should hear about it early."}, {"c": 5, "s": "Ch 5, section Hypertensive urgency and emergency", "q": "A 33-year-old man with cocaine intoxication has severe hypertension, agitation and chest discomfort. Which approach is most appropriate?", "o": ["Give a pure beta-blocker as first treatment to slow the heart rate and lower the pressure quickly", "Give a rapid oral agent to drop the pressure quickly before treating anything else", "Ignore the agitation and treat only the blood pressure number on the monitor", "Give a sedative and no monitoring, since the agitation is the only problem", "Treat pain and agitation first, and avoid a pure beta-blocker in catecholamine excess"], "k": 4, "e": "In cocaine or stimulant users, pain and agitation are treated first, then the pressure. In catecholamine excess, a pure beta-blocker can worsen pressure and needs specialist advice."}, {"c": 5, "s": "Ch 5, section Hypertensive urgency and emergency", "q": "A 66-year-old man in the ICU has been on a prolonged nitroprusside infusion for refractory hypertension and his kidney function is failing. Which complication should be watched for?", "o": ["Hypercalcemia", "Reflex bradycardia as the only expected adverse effect", "Cyanide and thiocyanate toxicity", "Hypermagnesemia", "Pure volume overload"], "k": 2, "e": "Nitroprusside is used in refractory cases in an ICU, with an arterial line and a toxicity watch. Cyanide and thiocyanate toxicity are risks with prolonged use or kidney failure. Hydralazine's concerns are an unpredictable fall and reflex tachycardia."}, {"c": 5, "s": "Ch 5, section Peripheral arterial disease and limb ischemia", "q": "A 68-year-old man has just had a revascularization for an acutely ischemic leg. Now his calf is tense and painful, the urine is dark and the potassium is rising. What is the best next step?", "o": ["Call the surgeon about fasciotomy, treat hyperkalemia and give fluid", "Apply a tight compression wrap and elevate the leg until the swelling settles", "Restrict fluids to protect the heart", "Give a potassium supplement and observe overnight on the ward with repeat labs in the morning", "Delay any call until morning rounds"], "k": 0, "e": "Reperfusion of ischemic muscle can cause compartment syndrome, hyperkalemia, myoglobinuria and kidney injury. A tense painful calf, pain with passive stretch, dark urine and rising potassium are early signs. The surgeon should be asked about fasciotomy, and potassium, creatine kinase and creatinine should be checked."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "A 72-year-old man with severe COPD has a blood gas showing a high carbon dioxide level, a high bicarbonate and a near-normal pH. Prior records show similar values. How should this be interpreted?", "o": ["As an acute hypercapnic emergency requiring immediate intubation and ICU transfer", "As a likely chronic baseline, since acidosis is what signals an acute change", "As a laboratory error", "As proof that oxygen should be stopped entirely in every patient with chronic lung disease", "As a contraindication to all inhaled therapy"], "k": 1, "e": "Some patients live with a high carbon dioxide and raised bicarbonate, so an abnormal-looking gas may be baseline. Compare with prior gases and look at the pH, because acidosis is what signals an acute change and what the NIV recommendation addresses."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "Which COPD exacerbation patient most clearly meets the chapter's criteria for antibiotics?", "o": ["A patient with a clear-sputum cough and no change in dyspnea or sputum volume", "A patient who missed an inhaler dose and has no change in sputum color or volume", "A patient with isolated mild wheeze", "A patient with more purulent sputum plus more dyspnea or more sputum volume", "A patient whose only complaint is a runny nose"], "k": 3, "e": "Antibiotics are indicated when sputum is more purulent along with more dyspnea or more sputum volume, or when the patient needs ventilatory support. The core treatment also includes bronchodilators and a short systemic steroid course. Theophylline is not recommended."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "A 69-year-old man with a COPD exacerbation shows no improvement in work of breathing or mental status after the first day, and the gas shows no less acidosis. What is the best step?", "o": ["Widen the search for pneumothorax, embolism, heart failure, a mucus plug or pneumonia", "Continue the same plan unchanged and reassess only at the next morning round", "Add a sedative for comfort and reduce the frequency of nebulizer treatments", "Stop all bronchodilators and rely on steroids and antibiotics alone for the remainder of the stay", "Discharge with follow-up once the patient is comfortable at rest on room air"], "k": 0, "e": "If two or more of the four reassessment questions are answered no, the diagnosis, dose of support or a complication may be wrong. Poorly delivered drug looks like drug failure, so inhaler technique and nebulizer schedules are reviewed with the nurse and respiratory therapist."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "A 70-year-old man with COPD was placed on a high-flow mask by the ambulance crew and is now drowsy and does not wake to his name. His lips are dusky. What is the most appropriate immediate step?", "o": ["Increase the oxygen to maximum and observe, because dusky lips mean hypoxemia and the drowsiness will pass", "Give a benzodiazepine for agitation and recheck him after he has settled", "Reduce oxygen to the lowest effective amount, stop sedatives, repeat the gas, and start or adjust NIV", "Wait one hour before any reassessment, since the drowsiness is probably a medication effect", "Give only an oral steroid and arrange follow-up with the respiratory clinic"], "k": 2, "e": "New sleepiness after generous oxygen or a sedative suggests carbon dioxide narcosis. The first actions are to reduce oxygen to the lowest effective amount, stop sedatives, repeat the gas, start or adjust NIV, and call the ICU if there is no improvement."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "A 75-year-old woman with COPD has a high carbon dioxide but a normal pH and no acidosis. What does the ERS and ATS guidance suggest about NIV?", "o": ["Strongly recommends NIV in all COPD with hypercapnia, whatever the pH", "Recommends NIV only in asthma", "Recommends immediate intubation", "Makes the same recommendation regardless of pH", "Suggests against NIV in COPD with hypercapnia but without acidosis"], "k": 4, "e": "The guideline gives bilevel NIV a strong, high-certainty recommendation for COPD with acute or acute-on-chronic hypercapnic acidosis, but it suggests against NIV in hypercapnia without acidosis (conditional, low certainty). Acidosis is the key trigger."}, {"c": 6, "s": "Ch 6, section COPD exacerbation", "q": "A 73-year-old man with known heart failure has wheeze, orthopnea, leg edema and raised jugular veins. He has been treated with bronchodilators and steroids without improvement. What is the most appropriate approach?", "o": ["Reconsider cardiac wheeze, and treat with diuresis, a vasodilator and CPAP", "Escalate steroids only, and repeat the same bronchodilator course", "Add theophylline as a further bronchodilator and keep the current plan", "Stop all other investigations and continue bronchodilators and steroids alone for the night", "Assume a pure asthma attack and continue the same bronchodilator course"], "k": 0, "e": "Heart failure, pulmonary embolus or pneumothorax can wheeze, and treating with bronchodilators and steroids alone delays the right therapy. Orthopnea, edema and raised jugular veins point to a cardiac wheeze, whose first moves are diuresis, a vasodilator and CPAP. Theophylline is not recommended in COPD exacerbations."}, {"c": 6, "s": "Ch 6, section Asthma exacerbation", "q": "A 24-year-old man with severe asthma has been intubated. Shortly afterward he becomes hypotensive. What should be considered?", "o": ["Giving a higher respiratory rate immediately to clear the retained carbon dioxide more quickly", "Shortening the expiratory time so each breath is delivered more quickly", "Trapped air from breath stacking, relieved by briefly disconnecting the circuit", "Giving more sedation only, and continuing the current ventilator settings", "Increasing the tidal volume to improve ventilation and raise the pressure"], "k": 2, "e": "The ventilated asthmatic is at risk of air trapping. Using a low respiratory rate and a long expiratory time, accepting some carbon dioxide retention, helps, and a hypotensive patient after intubation might have trapped air that disconnecting the circuit lets out. Pneumothorax is also watched for."}, {"c": 6, "s": "Ch 6, section Oxygen, high-flow, and noninvasive ventilation", "q": "A 28-year-old woman has acute asthma. What is the ERS and ATS position on noninvasive ventilation in acute asthma?", "o": ["Strong recommendation for NIV in all asthma", "Strong recommendation against any NIV", "Recommended instead of bronchodilators", "Required before steroids", "No recommendation for or against it"], "k": 4, "e": "The ERS and ATS guideline makes no recommendation for or against NIV in acute asthma, and likewise none for de novo respiratory failure including pneumonia. A trial in a monitored setting is a specialist decision."}, {"c": 6, "s": "Ch 6, section Asthma exacerbation", "q": "A 31-year-old asthmatic is agitated, breathless and pulling at his mask. A colleague suggests a sedative. What is the best response?", "o": ["Give a benzodiazepine to calm him, since anxiety is probably driving the breathlessness and the pulling at the mask", "Avoid sedatives, because agitation usually means hypoxemia, and reassess oxygenation and breathing work", "Give a high-dose opioid to ease the sensation of breathlessness and calm him", "Restrain him and observe, since he is pulling at the mask and may harm himself", "Discharge him after he settles, once the wheeze has improved on examination"], "k": 1, "e": "Sedatives should not be given to an agitated asthmatic because agitation usually reflects hypoxemia. Severity is judged from the patient: speech, accessory muscle use, drowsiness and the chest. The gas is used for the tiring or drowsy patient."}, {"c": 6, "s": "Ch 6, section Community-acquired and aspiration pneumonia", "q": "An 84-year-old woman is brought from a nursing home with a recent fall, confusion and poor appetite but no fever. Her chest film shows a new infiltrate. What is true?", "o": ["Pneumonia is excluded without fever, because infection in the lung always causes a temperature rise", "Confusion cannot be due to pneumonia, since the infection is confined to the lung", "Falls always indicate a cardiac cause, so the infiltrate can be ignored", "Older patients may present with falls or confusion without fever, so pneumonia remains possible", "The chest film should be ignored, because the infiltrate is probably an old finding"], "k": 3, "e": "Older patients may present with falls, confusion or poor appetite, and without fever. Pneumonia should be considered with an infiltrate not explained by heart failure or atelectasis."}, {"c": 6, "s": "Ch 6, section Community-acquired and aspiration pneumonia", "q": "A 65-year-old man with pneumonia is on a vasopressor infusion for septic shock. According to the 2025 ATS update, how is his CAP classified?", "o": ["Severe, because vasopressors for septic shock are a major criterion", "Non-severe, because CURB-65 was not calculated at the bedside", "Non-severe, because he is an inpatient on a monitored ward", "Severe only if the Pneumonia Severity Index is high and CURB-65 is also elevated", "Unclassifiable"], "k": 0, "e": "The 2025 ATS update does not define severity by CURB-65 or the Pneumonia Severity Index. It uses one major criterion, invasive mechanical ventilation or vasopressors for septic shock, or several minor criteria. The severity category matters for the steroid advice."}, {"c": 6, "s": "Ch 6, section Community-acquired and aspiration pneumonia", "q": "Which situation is an exception to the shorter antibiotic courses suggested for pneumonia?", "o": ["Non-severe CAP with early clinical stability", "A patient who improves rapidly", "Empyema", "A mild case with a negative culture", "Resolved fever with normal vital signs"], "k": 2, "e": "Exceptions that need longer courses include Staphylococcus aureus, Pseudomonas aeruginosa, Legionella and other intracellular organisms, empyema, abscess and bacteremia. The shorter courses assume the patient reaches clinical stability, so the stopping point should be named at the outset."}, {"c": 6, "s": "Ch 6, section Community-acquired and aspiration pneumonia", "q": "A 71-year-old man with pneumonia is still not clinically stable on the third or fourth day of treatment. What is the best next step?", "o": ["Simply broaden the antibiotics and continue, since a resistant organism is by far the most likely explanation", "Stop all treatment and repeat the chest film after a rest from antibiotics", "Assume the diagnosis is correct and wait, because response is often delayed", "Discharge him for outpatient review, since he can be followed up as an outpatient", "Look for a collection, a resistant or atypical organism, a noninfectious look-alike or a host problem"], "k": 4, "e": "A patient who is not stable by the third or fourth day deserves new thinking. Consider empyema or abscess, resistant organisms, mimics such as heart failure, embolism, organizing pneumonia, drug reaction or malignancy, and immunosuppression."}, {"c": 6, "s": "Ch 6, section Community-acquired and aspiration pneumonia", "q": "A 58-year-old man vomited after heavy alcohol use and has mild hypoxemia a few hours later, with no fever and a quickly improving picture. What is the most reasonable view?", "o": ["Aspiration pneumonia, requiring broad antibiotics with anaerobic coverage immediately in every case", "Aspiration pneumonitis, a chemical injury that may resolve with supportive care alone", "Pulmonary embolism by definition, because the picture improved quickly", "A viral infection that needs steroids and antiviral treatment", "A fungal infection"], "k": 1, "e": "Aspiration pneumonitis is chemical injury from gastric contents, often within hours, and may resolve with supportive care. Aspiration pneumonia is bacterial infection in a patient with risk factors. Antibiotics are started when the picture is infectious or persistent, and anaerobic coverage is added only for lung abscess or empyema."}, {"c": 6, "s": "Ch 6, section Acute hypoxemic and hypercapnic respiratory failure", "q": "A 45-year-old man with a neuromuscular disease has increasing breathlessness but an acceptable oximeter reading. What is the best way to follow him?", "o": ["Follow the saturation alone, since it reflects ventilation in this setting", "Wait for the saturation to fall before escalating, since that is the earliest reliable sign", "Use only chest films", "Trend bedside measures of strength, since saturation can look acceptable before collapse", "Rely on the respiratory rate alone, since it rises early in every neuromuscular patient"], "k": 3, "e": "For the neuromuscular patient, follow bedside measures of strength over time and do not rely on the saturation. A tiring patient may look acceptable on the oximeter before collapse. Early NIV or intubation is the first move, with trending measurements."}, {"c": 6, "s": "Ch 6, section Acute hypoxemic and hypercapnic respiratory failure", "q": "A 50-year-old man with pneumonia is on high-flow nasal oxygen and is not intubated. Which statement about the newer global ARDS definition applies?", "o": ["It also classifies non-intubated patients on high-flow oxygen or NIV", "It requires intubation in all cases, so patients on high-flow oxygen are excluded", "It excludes any patient with pneumonia, since an infectious cause is a separate diagnosis", "It requires a normal chest film, since bilateral opacities indicate another disease", "It applies only to pediatric patients, who are classified separately"], "k": 0, "e": "ARDS is acute hypoxemic failure with bilateral opacities not fully explained by heart failure or fluid overload, within a week of a known insult or new symptoms. A newer global definition also allows non-intubated patients on high-flow oxygen or NIV."}, {"c": 6, "s": "Ch 6, section Acute hypoxemic and hypercapnic respiratory failure", "q": "A trainee asks how the ESICM 2023 and ATS 2024 ARDS guidelines differ on neuromuscular blockade. Which statement is correct?", "o": ["Both recommend routine continuous blockade for every ventilated patient", "Both recommend against any blockade", "ATS suggests early neuromuscular blockade in severe ARDS, while ESICM recommends against routine continuous blockade", "ESICM suggests early blockade in severe ARDS, while ATS recommends against routine continuous blockade", "Neither society addresses blockade"], "k": 2, "e": "The societies differ on prone duration, on neuromuscular blockade and on the strength of the ECMO recommendation. The chapter teaches the disagreement and advises answering an exam question for the guideline it names."}, {"c": 6, "s": "Ch 6, section Oxygen, high-flow, and noninvasive ventilation", "q": "A 66-year-old man on high-flow nasal oxygen for pneumonia has a stable saturation, but his respiratory rate and use of accessory muscles are rising. What is the best action?", "o": ["Reassure him since the saturation is stable and the oxygen is working as intended", "Reduce monitoring so that he can rest comfortably overnight", "Wait for the saturation to fall before acting, as it will signal the failure", "Remove the oxygen to test whether he still needs it", "Treat the stable saturation as false comfort and call the ICU early"], "k": 4, "e": "The advantage of high-flow oxygen is comfort, but the risk is the false comfort of a stable saturation while work of breathing rises and the patient tires. Count the respiratory rate yourself, watch the accessory muscles, and escalate early. Delayed intubation in a failing patient is associated with harm."}, {"c": 6, "s": "Ch 6, section Oxygen, high-flow, and noninvasive ventilation", "q": "A 70-year-old man with COPD and heart failure, ventilated for a prolonged period, has just passed a spontaneous breathing trial and is extubated. What does the ATS and American College of Chest Physicians 2017 guideline recommend?", "o": ["No support of any kind after extubation, since extubation means readiness", "Preventive NIV after extubation in high-risk patients, such as those with hypercapnia or COPD", "Reintubation as a routine precaution in every patient who was ventilated for a prolonged period", "Sedation to prevent anxiety", "Conventional oxygen only, with no additional ventilatory support at any point"], "k": 1, "e": "The guideline recommends preventive NIV after extubation for high-risk patients, such as those with hypercapnia, COPD or heart failure, ventilated for a prolonged period who passed a spontaneous breathing trial (strong, moderate). The ERS suggests NIV over high-flow oxygen in this group."}, {"c": 6, "s": "Ch 6, section Lung cancer, smoking cessation, and sleep apnea on the ward", "q": "A 64-year-old smoker is admitted for pneumonia. An imaging report notes a lung mass with a recommendation for follow-up. What is the best discharge plan?", "o": ["Omit it from the summary since the pneumonia is the reason for admission and the mass is incidental", "Mention it only in the radiology report", "Advise him to ask his family doctor if he remembers", "List the mass as an active problem, name an owner and book follow-up before he leaves", "Wait for symptoms to appear"], "k": 3, "e": "Admissions are where a mass or nodule is found by chance and then lost in the discharge summary. The next step should be ordered before discharge, the finding written into the discharge summary, and an owner named."}, {"c": 6, "s": "Ch 6, section Lung cancer, smoking cessation, and sleep apnea on the ward", "q": "A 55-year-old smoker is admitted with a COPD exacerbation and is anxious and irritable. What is the best bedside approach to tobacco?", "o": ["Treat withdrawal with nicotine replacement on admission, advise quitting, and arrange a quitline referral", "Ignore tobacco during the admission and raise it at the next clinic visit once he is stable and recovered", "Lecture him for a long time about the harms of tobacco until he agrees to quit", "Withhold nicotine replacement so that he is motivated to stay quit after discharge", "Prescribe a sedative for the irritability and defer any discussion of tobacco"], "k": 0, "e": "A hospital stay is a teachable moment. Ask every patient about tobacco, treat withdrawal with nicotine replacement, advise to quit, and arrange follow-up and a quitline referral. A short, structured conversation works better than a lecture."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A 66-year-old woman is 3 days after a knee replacement. She has new breathlessness, pleuritic pain and a fast heart rate, and a clot is more likely than any other diagnosis. A colleague suggests sending a D-dimer first. What is the best response?", "o": ["Send it, because a negative result excludes embolism in every patient, even when clinical suspicion is high", "It adds little here, because it is usually positive after surgery; go on to imaging while treating", "Send it, because a positive result confirms the diagnosis and avoids a scan", "Send it and repeat it daily until the value falls to normal", "Skip all imaging and rely on a leg ultrasound alone to exclude embolism"], "k": 1, "e": "A D-dimer rises with surgery, infection, cancer, pregnancy and age, so a positive result in a recently operated patient says almost nothing. It is useful only to rule the diagnosis out in a low-probability patient. A negative leg ultrasound does not exclude a pulmonary embolism."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A 72-year-old man on the ward develops shock, and a pulmonary embolism is plausible. He is too unstable to go to the scanner. A bedside echocardiogram shows a dilated, hypokinetic right ventricle. What does this finding allow?", "o": ["It can support treatment while you arrange definitive imaging", "It excludes a pulmonary embolism if the left ventricle looks normal", "It makes any further imaging unnecessary for the rest of the admission", "It confirms a pneumothorax as the cause of the shock", "It means treatment must wait until a CT pulmonary angiogram is done"], "k": 0, "e": "In a patient with shock and a plausible clot, a strained right ventricle on bedside echo is enough to support treatment while definitive imaging is arranged. The reverse does not hold: a normal bedside echo does not exclude embolism in a stable patient. Waiting for the scan in an unstable patient is the error."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A young woman has a likely pulmonary embolism, a clear chest film, and a strong wish to limit radiation exposure. Which test is a reasonable alternative to a CT pulmonary angiogram?", "o": ["A D-dimer alone, whatever the pretest probability", "A repeat chest film in the morning", "A bedside echo used to exclude the diagnosis", "A leg ultrasound used to exclude the diagnosis if it is normal", "A ventilation-perfusion scan"], "k": 4, "e": "A ventilation-perfusion scan works well when the chest film is clear and is also useful when contrast is a problem or radiation is a particular concern. The D-dimer is only a rule-out tool in low-probability patients. A normal echo or leg ultrasound does not exclude embolism."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A 58-year-old man with a recent hip operation has a high clinical probability of pulmonary embolism. He has no bleeding and the wound is dry. The scanner is not available for some time. What is the best action?", "o": ["Hold all treatment until imaging confirms the clot and a specialist has reviewed it", "Wait for a positive D-dimer before treating", "Give aspirin and reassess after the scan", "Start treatment only once troponin has been measured", "Start anticoagulation now while the imaging is arranged"], "k": 4, "e": "When a clot is likely and the bleeding risk is acceptable, treatment is started in parallel with testing, not after it. Delay exposes the patient to collapse. None of the other steps is required before anticoagulation."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A 60-year-old man with a newly diagnosed pulmonary embolism has a normal blood pressure, but his heart rate keeps climbing, his lactate is rising and his limbs are cool. CT shows an enlarged right ventricle. Which interpretation is best?", "o": ["He is category B and can go home once oxygen is weaned", "A normal pressure makes him low risk, so ordinary ward care with routine vital signs is adequate", "He is category A because the clot was found on a scan", "He should be treated as category D, with a monitored bed and a plan for falling pressure", "He is category E, because any rise in lactate means persistent hypotension"], "k": 3, "e": "The right ventricle can fail before the systemic pressure falls, so a rising heart rate, lactate and cool limbs in a normotensive patient with right ventricular strain mean normotensive shock physiology, which is category D. Category E needs persistent hypotension or cardiopulmonary failure. A normal pressure is not reassuring here."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: diagnosis and risk stratification", "q": "A 47-year-old man has an unsuspected pulmonary embolism found on a scan done for cancer staging. He has no symptoms. How does the 2026 AHA/ACC scheme classify him?", "o": ["Category B, symptomatic with low severity", "Category A, where outpatient care may be judged on clot burden and risk", "Category C, because every clot raises severity", "Category D, because cancer implies incipient right heart failure even without symptoms", "Category E, because the diagnosis is new"], "k": 1, "e": "Category A is the asymptomatic group, for example an incidental finding, and disposition rests on clot burden and risk. Category B requires symptoms. Categories C to E are the hospitalized, higher-severity groups."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: treatment and thrombolysis decisions", "q": "A 70-year-old man with a pulmonary embolism has severe kidney impairment, and reperfusion may be needed within hours. He is hospitalized and needs parenteral anticoagulation. Which choice best fits?", "o": ["Low molecular weight heparin, because its strongest class applies to every circumstance", "Unfractionated heparin, because it can be stopped and reversed quickly", "A vitamin K antagonist started alone with no parenteral overlap", "No anticoagulant until reperfusion has been completed", "Aspirin until kidney function recovers"], "k": 1, "e": "The guideline prefers low molecular weight heparin in hospitalized patients, but unfractionated heparin remains reasonable when reperfusion may be imminent, kidney function is poor, or bleeding risk is high and a short half-life matters. Delaying anticoagulation until after reperfusion is not appropriate."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: treatment and thrombolysis decisions", "q": "A 55-year-old woman with a very high body mass index has a stable pulmonary embolism. She has no antiphospholipid syndrome and no advanced liver disease. Which oral anticoagulant approach fits the 2026 guideline?", "o": ["A direct oral anticoagulant, because obesity does not change the preference", "Warfarin, because direct oral anticoagulants are not allowed in patients with obesity", "Lifelong aspirin", "An inferior vena cava filter in place of anticoagulation", "Delaying treatment until weight falls"], "k": 0, "e": "The guideline prefers a direct oral anticoagulant over a vitamin K antagonist for eligible patients, and this explicitly includes patients with obesity. The exceptions are antiphospholipid syndrome and advanced liver disease. A filter does not replace anticoagulation."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: treatment and thrombolysis decisions", "q": "A 58-year-old man with advanced cirrhosis is admitted with a stable acute pulmonary embolism. Which plan best fits the guideline?", "o": ["A direct oral anticoagulant, because it is always preferred", "No anticoagulation, because cirrhosis rules it out", "Warfarin, overlapped with parenteral therapy until the INR is in range", "Aspirin alone", "Parenteral therapy alone for the whole course, never transitioned to oral treatment"], "k": 2, "e": "Advanced liver disease is one of the two exceptions that point to a vitamin K antagonist, and warfarin is overlapped with a parenteral drug until the INR is in range. Cirrhosis does not remove the need for treatment. Aspirin is inadequate."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: treatment and thrombolysis decisions", "q": "A 62-year-old woman had a first pulmonary embolism after a knee replacement and has done well. The clot was strongly provoked by the surgery. What is the best treatment plan?", "o": ["Continue anticoagulation indefinitely without any planned review of the stop date", "Stop now and arrange no follow-up", "Plan a defined course with a documented stop date and early follow-up", "Switch to lifelong aspirin", "Repeat a CT pulmonary angiogram every year to check for residual clot"], "k": 2, "e": "For a first, strongly provoked embolism, the guideline advises stopping at the end of a defined course rather than continuing indefinitely. Write the reason and the planned stop date in the discharge note and arrange follow-up early after diagnosis and again within a few months. Indefinite therapy is for unprovoked, cancer-associated or recurrent clots."}, {"c": 7, "s": "Ch 7, section Pulmonary embolism: treatment and thrombolysis decisions", "q": "A 66-year-old man with a large pulmonary embolism and persistent hypotension had an intracranial hemorrhage recently. Which statement best guides reperfusion?", "o": ["Systemic lysis weighs heavily against, so catheter-based or surgical options matter", "Systemic lysis is the only acceptable option", "All reperfusion and anticoagulation must be withheld", "Aspirin is the preferred reperfusion strategy", "Reperfusion should wait until the patient is no longer hypotensive and has been stabilized"], "k": 0, "e": "Recent intracranial hemorrhage is a strong reason against systemic lysis, and these are the patients for whom catheter-based or surgical options matter. Persistent hypotension is itself the reason reperfusion is considered, so waiting for it to resolve defeats the purpose. Anticoagulation decisions are separate and individualized."}, {"c": 7, "s": "Ch 7, section Pleural effusion and pneumothorax", "q": "A 54-year-old man has a pleural effusion on a chest film and needs a diagnostic tap. How should the puncture site be chosen?", "o": ["By percussing the dull area and marking the lowest point", "By the film alone, entering at the lowest rib space", "By placing a chest tube first and imaging afterward", "By choosing the side with the most diminished vocal fremitus and the dullest percussion note", "With bedside ultrasound, which also shows whether fluid is free or walled off"], "k": 4, "e": "Ultrasound confirms the fluid, shows whether it is free or loculated, and guides a safe needle site. The physical exam is not a substitute for choosing where to puncture. Doing ultrasound before every pleural procedure also avoids draining a consolidated lung or a poorly placed empyema."}, {"c": 7, "s": "Ch 7, section Pleural effusion and pneumothorax", "q": "A 68-year-old woman with heart failure has been diuresed, and her pleural fluid now meets laboratory criteria for an exudate. What is the best interpretation?", "o": ["It proves the effusion is malignant and needs oncology referral", "It confirms infection and requires drainage and a change of antibiotics", "Diuresis can make transudative fluid look like an exudate, so read it in clinical context", "It means heart failure is excluded as a cause", "It requires repeated daily thoracentesis until the fluid finally reads as a transudate again"], "k": 2, "e": "Diuresed heart failure fluid can look exudative, so the laboratory label alone should not decide the cause. Exudates arise from local pleural disease such as infection, cancer and embolism, but the clinical picture must be weighed. Repeated taps are not the answer."}, {"c": 7, "s": "Ch 7, section Pleural effusion and pneumothorax", "q": "A 63-year-old man with pneumonia has a pleural effusion, and aspiration returns frank pus. What is the best management?", "o": ["Antibiotics alone, since they penetrate pleural fluid well and the pus will resolve", "Diuretics and observation", "Drain the pleural space and give antibiotics, with early specialist involvement", "Corticosteroids alone", "Repeat the tap only if fever returns, and drain only if the fluid reaccumulates"], "k": 2, "e": "Pus (empyema), a positive stain or culture, a low pH or glucose, and loculation call for drainage in addition to antibiotics, because antibiotics penetrate the pleural space poorly and the fluid can organize. Early specialist involvement is better than a late rescue."}, {"c": 7, "s": "Ch 7, section Pleural effusion and pneumothorax", "q": "A 66-year-old man on a ventilator after surgery has a small pneumothorax on his morning film. His pressure and oxygenation are stable. What is the usual approach?", "o": ["Observation with oxygen and repeat imaging, as for a small primary spontaneous pneumothorax", "Increase the tidal volume to expand the lung", "No action unless the film worsens in a week", "Clamp the ventilator circuit briefly", "Drainage, because any pneumothorax in a ventilated patient usually needs it"], "k": 4, "e": "Positive pressure ventilation can convert a small air leak into a tension pneumothorax, so a pneumothorax in a ventilated patient, like any secondary pneumothorax, usually needs drainage. Observation is reserved for a small, minimally symptomatic primary pneumothorax."}, {"c": 7, "s": "Ch 7, section Pleural effusion and pneumothorax", "q": "A patient with a chest tube is bubbling steadily, and transport staff ask to clamp the tube for the trip to radiology. What is the best advice?", "o": ["Clamp it so the lung stays inflated during transport and the leak cannot continue", "Raise the drainage system above the chest for the trip to keep the lung expanded", "Remove the tube before transport", "Do not clamp a bubbling tube; keep the system below the chest", "Disconnect it and leave the end open to air"], "k": 3, "e": "Clamping a tube with an active air leak can trap air and produce a tension pneumothorax. The drainage system stays below the level of the chest, and a persistent leak is a reason to call for help. Removal is only for a stopped leak with the lung up."}, {"c": 7, "s": "Ch 7, section Interstitial and occupational lung disease", "q": "A 68-year-old man with known pulmonary fibrosis becomes suddenly worse. He has a fever, new leg swelling and a rising natriuretic peptide. Which approach is best?", "o": ["Label it an acute exacerbation on day one and begin treatment for it alone without further testing", "Stop all drugs and observe", "Reassure and discharge with outpatient follow-up", "Look for infection, heart failure and embolism before calling it an acute exacerbation", "Intubate at once, since fibrosis always fails"], "k": 3, "e": "Acute exacerbation of the fibrosis itself is a diagnosis of exclusion. Infection, heart failure or volume overload, embolism, drug injury, pneumothorax and aspiration all need to be considered, and a CT that answers several questions at once helps. Fever, leg swelling and a raised natriuretic peptide each point to something treatable."}, {"c": 7, "s": "Ch 7, section Interstitial and occupational lung disease", "q": "A 70-year-old retired metalworker who keeps birds and takes amiodarone has a dry cough and basal crackles, and high-resolution CT shows an interstitial pattern. Which step is most useful for finding the cause?", "o": ["A family history of colon cancer, because it best explains an interstitial pattern", "An alcohol history alone, because it explains most diffuse lung disease", "A detailed exposure and drug history, including work, birds and medications", "A sleep diary to look for nocturnal hypoxemia", "Measuring the abdominal girth to estimate restrictive lung volumes"], "k": 2, "e": "Exposure history (occupation, birds, mold, drugs) is the most useful single question in diffuse lung disease, and it is the one most often skipped. Amiodarone is a recognized cause of drug-induced lung injury, and exposures matter for removing the patient from the source."}, {"c": 7, "s": "Ch 7, section Pulmonary hypertension", "q": "A 66-year-old man with breathlessness has a raised pulmonary pressure on echocardiography. Which statement best guides the next step?", "o": ["Start a pulmonary vasodilator at once, as pulmonary arterial hypertension is the most common group overall", "Left heart disease is the most common cause, so a heart evaluation usually comes before a vasodilator", "Chronic thromboembolic disease is the most common cause", "Lung disease is the most common cause, so only a chest film is needed", "Echocardiography alone confirms the group"], "k": 1, "e": "Pulmonary hypertension from left heart disease is the most common group, and treating the wrong group can do harm, so pulmonary vasodilators are not started for left heart or lung causes without specialist input. Echocardiography gives an estimate, but right heart catheterization confirms the diagnosis and group."}, {"c": 7, "s": "Ch 7, section Pulmonary hypertension", "q": "A 59-year-old woman with known pulmonary hypertension is admitted with infection. Her pressure is low and her neck veins are distended. A resident orders a large fluid bolus. What is the best response?", "o": ["Avoid a large bolus; judge filling with ultrasound and give small steps", "Give the bolus, since low pressure always means underfilling of the circulation", "Stop her pulmonary vasodilator to lower the right heart load during the infection", "Lower her systemic pressure to protect the right ventricle from strain", "Intubate immediately to improve oxygenation"], "k": 0, "e": "In a failing right ventricle, extra volume stretches the ventricle, bows the septum and reduces left ventricular filling. The systemic pressure should be kept up because it perfuses the right ventricle, and a pulmonary vasodilator must not be interrupted. Intubation carries a risk of arrest and needs great caution."}, {"c": 7, "s": "Ch 7, section Upper airway disorders", "q": "A 64-year-old man on an angiotensin-converting enzyme inhibitor has lip and tongue swelling with no hives. It does not improve after epinephrine, an antihistamine and a steroid. What is the best next approach?", "o": ["Repeat the antihistamine and add a steroid until the swelling resolves", "Send him to the CT scanner alone to assess the extent of swelling", "Sedate him to reduce distress and lie him flat while waiting for the swelling to settle", "Treat it as bradykinin swelling: stop the drug and get an airway expert early", "Discharge him once the lips look better and the swelling has not spread"], "k": 3, "e": "Allergic swelling comes with hives and responds to epinephrine, antihistamine and steroid; bradykinin swelling does not, and it needs an early airway decision. The patient should stay upright and monitored, never sent to radiology alone, and avoid sedation or lying flat, because swelling can progress for hours."}, {"c": 8, "s": "Ch 8, section Recognizing the deteriorating patient", "q": "A ward nurse reports a NEWS2 total of 3, but one single parameter scored 3. What level of risk and response does the NEWS2 chart assign?", "o": ["Low to medium risk, with an urgent ward-based response", "Low risk, with a routine ward-based response", "Medium risk, with an urgent response as for a total of 5 or 6", "High risk, with an emergency response including airway management", "No additional response, because the total is low"], "k": 0, "e": "A single parameter scoring 3 moves the patient to low to medium risk and an urgent ward-based response even when the total is low. The emergency response with critical care skills is reserved for higher totals. A low total does not cancel a single extreme parameter."}, {"c": 8, "s": "Ch 8, section Recognizing the deteriorating patient", "q": "A hospital is choosing one screening tool for inpatients who may have sepsis. Which choice matches the 2026 Surviving Sepsis Campaign guideline?", "o": ["qSOFA alone, because it is the most specific tool for inpatients", "NEWS, NEWS2, MEWS or SIRS, rather than qSOFA as the single tool", "A lactate level alone", "Procalcitonin alone", "Clinical gestalt only, since no score or screening program is ever recommended"], "k": 1, "e": "The guideline recommends one of NEWS, NEWS2, MEWS or SIRS over qSOFA as a lone screening tool, with strong recommendation and moderate certainty. qSOFA remains a useful prompt that a patient is worsening. No score or biomarker replaces judgment, because sepsis is a clinical diagnosis."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A 35-year-old man with a traumatic brain injury develops septic shock and needs crystalloid resuscitation. Which fluid does the guideline favor in this setting?", "o": ["A balanced crystalloid, as in every other septic patient", "Albumin alone", "A starch solution", "A gelatin solution", "0.9% saline, rather than a balanced crystalloid"], "k": 4, "e": "Balanced crystalloid is preferred over saline in general, but saline is preferred in traumatic brain injury. Albumin should be avoided in this setting, starches are recommended against, and gelatin is suggested against."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A resident proposes a hydroxyethyl starch solution for volume resuscitation in a patient with septic shock. What does the guideline say?", "o": ["It prefers starches over crystalloids", "It accepts starches whenever saline is unavailable", "It recommends against starches only in kidney injury", "It rates starches as equal to balanced crystalloid", "It recommends against starch fluids"], "k": 4, "e": "The guideline makes a strong recommendation against starches, with high certainty, and suggests against gelatin. Crystalloids are the first fluid, with balanced crystalloid preferred over 0.9% saline except in traumatic brain injury."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A patient with septic shock has had her initial fluid and a repeat lactate is still above normal, though it is falling. What does the guideline advise?", "o": ["Give fluid boluses until the lactate has returned to normal, whatever the bedside exam shows", "Stop measuring lactate once the first value is back", "Give sodium bicarbonate routinely to correct lactic acidemia and restore perfusion", "Measure lactate only after vasopressors are started", "Keep repeating lactate to follow the trend, but do not give fluid only to normalize it"], "k": 4, "e": "Lactate is repeated about every 2 hours with the aim of a fall, but fluid should not be given only to normalize it. The guideline does not advise sodium bicarbonate for lactic acidemia. Lactate is measured in possible, probable or definite sepsis, not only in shock."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A 62-year-old man is in septic shock. Compared with the 2021 version, which statement about corticosteroids reflects the 2026 guideline?", "o": ["It recommends against corticosteroids in septic shock, even when vasopressors are required", "It strongly mandates one named agent at a fixed dose for every patient", "It requires adrenal testing before any steroid is given to a patient in shock", "It suggests IV corticosteroids in septic shock and dropped the earlier vasopressor qualifier", "It suggests steroids only for patients with a normal lactate and no ongoing vasopressor need"], "k": 3, "e": "The 2026 statement is a conditional suggestion for IV corticosteroids in septic shock, with the vasopressor qualifier removed. It names no agent and no dose, so the hospital protocol and pharmacy guide use. What the panel's survey users do in practice is not itself a recommendation."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A febrile, hypotensive patient arrives, and the resident wants to wait for a procalcitonin result before deciding on antibiotics. How does the guideline place procalcitonin?", "o": ["Procalcitonin should decide whether the first dose is given and when", "Procalcitonin is required to confirm sepsis before any antibiotic treatment can safely begin", "Procalcitonin replaces cultures and any clinical evaluation", "Procalcitonin is useful only for choosing the antibiotic class, not the timing", "Clinical evaluation decides whether to start; procalcitonin may help decide when to stop"], "k": 4, "e": "The guideline uses clinical evaluation, not procalcitonin, to start antimicrobials. Procalcitonin together with clinical evaluation can support stopping when the duration is unclear. Waiting for a laboratory value delays a time-critical dose."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A patient with septic shock has received the first dose of a beta-lactam. How should the maintenance doses be given, according to the guideline?", "o": ["As rapid pushes at each dose", "By switching to oral dosing once the first dose is in", "Only after drug levels are returned", "By prolonged infusion", "As short bursts timed to peak concentration"], "k": 3, "e": "After the first dose, the guideline recommends prolonged infusion of beta-lactams for maintenance, a strong recommendation with moderate certainty. The first dose itself should not be delayed."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A 70-year-old with sepsis from pneumonia has no known colonization with resistant organisms, no resistant infection in the past year, no prolonged broad-spectrum use and no stay in a high-prevalence unit. What does the guideline suggest about empiric coverage?", "o": ["Cover multidrug-resistant organisms in every septic patient, whatever the risk", "Suggest against empiric multidrug-resistant coverage when risk is low", "Add empiric antifungal therapy routinely", "Cover resistant organisms only if procalcitonin is raised or the white count is high", "Add anaerobic cover to every regimen"], "k": 1, "e": "Cover for a specific multidrug-resistant organism is reserved for high-risk patients. The guideline also suggests against empiric antifungals and adding anaerobic cover only when specific risk factors are present. Broad cover for everyone adds harm without clear benefit."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A 66-year-old with septic shock is hemodynamically stable on a low-dose vasopressor and has a mildly low hemoglobin with no bleeding. What is the guideline's approach to transfusion?", "o": ["A liberal strategy aiming to normalize hemoglobin in every septic patient", "Transfuse for tachycardia alone, without regard to the hemoglobin value", "Transfuse routinely before ICU transfer to build a safety reserve", "A restrictive strategy, since a higher threshold did not improve mortality in trials", "Give IV iron instead of making any transfusion decision, since hemoglobin never matters"], "k": 3, "e": "The guideline recommends a restrictive transfusion strategy, a strong recommendation with moderate certainty, and in the TRISS trial the lower threshold was not significantly different in 90-day mortality while using far fewer units. The 2026 pages read give no threshold, so use your hospital's policy."}, {"c": 8, "s": "Ch 8, section Sepsis and septic shock", "q": "A septic patient has a fever and the nurse asks about giving an antipyretic to bring it down. What does the guideline say?", "o": ["It strongly recommends treating every fever with an antipyretic as first-line care", "It suggests ice-water cooling as the first-line way to lower fever in every septic patient", "It suggests against antipyretics for fever itself; pain or symptoms are separate reasons", "It recommends NSAIDs only, with no other antipyretic", "It forbids antipyretics for any reason, including pain or other symptoms"], "k": 2, "e": "The suggestion against antipyretics for fever in sepsis is conditional with very low certainty. It does not apply when a drug is given for pain, symptom control or other reasons to treat temperature."}, {"c": 8, "s": "Ch 8, section Shock: types, vasopressors, and resuscitation", "q": "A 74-year-old man is hypotensive with cool hands, wet lungs, distended neck veins and new ischemic ECG changes. A colleague orders the sepsis fluid bundle. What is the best response?", "o": ["Give the standard weight-based crystalloid volume to all hypotensive patients, whatever the cause", "Start antibiotics only and withhold other care", "Name the shock as cardiogenic, avoid reflex fluid, and involve cardiology and the ICU early", "Treat it as obstructive and place a chest drain", "Treat it as hypovolemic and give blood"], "k": 2, "e": "The fluid suggestion is for sepsis-induced hypoperfusion; in cardiogenic shock with wet lungs it may do harm. The shock type must be named before choosing a volume, and the cardiogenic pattern calls for supporting the pump."}, {"c": 8, "s": "Ch 8, section Shock: types, vasopressors, and resuscitation", "q": "A 60-year-old woman becomes acutely hypotensive after a cardiac procedure. She has raised neck veins and clear lungs. What is the best first direction of treatment?", "o": ["Give a vasopressor alone and observe", "Treat it as hypovolemic and give volume until the neck veins flatten", "Treat it as septic shock with broad antibiotics", "Relieve the obstruction, for example by draining a tamponade", "Start an inotrope and a diuretic"], "k": 3, "e": "Raised neck veins with shock and clear lungs, of sudden onset, suggest an obstructive cause, and tamponade needs a drain. Obstructive shock calls for relieving the obstruction rather than a sepsis bundle."}, {"c": 8, "s": "Ch 8, section Shock: types, vasopressors, and resuscitation", "q": "A 69-year-old with cardiogenic shock is hypotensive and needs a vasopressor. According to the 2025 cardiology concise guidance described in the chapter, which statement is correct?", "o": ["Phenylephrine alone is the preferred first infusion because it avoids heart rate effects", "Vasopressin is the preferred first agent for most hypotensive patients", "Norepinephrine is reasonable first for most; avoid phenylephrine as the sole first infusion", "Mechanical circulatory support is routine for every patient as soon as the blood pressure begins to fall", "Large fluid boluses are the first step whatever the filling pressures"], "k": 2, "e": "The guidance favors norepinephrine for most hypotensive patients, advises against phenylephrine as the sole first infusion, uses the lowest dose for the shortest time, and does not recommend vasopressin first. It also does not support routine mechanical circulatory support in every patient."}, {"c": 8, "s": "Ch 8, section Mechanical ventilation basics and ARDS", "q": "A ventilated woman with ARDS is 5 feet tall and heavy. How should her tidal volume be calculated?", "o": ["Per kilogram of her actual scale weight, since the lungs scale with body mass", "Per kilogram of adjusted weight, as is done for sepsis fluids", "From her body mass index", "Per kilogram of predicted body weight, from her height and sex", "From her oxygen saturation"], "k": 3, "e": "Tidal volume is set from predicted body weight, which comes from height and sex, never from the scale. Using actual weight gives a breath far larger than small lungs can safely take. Adjusted or ideal weight applies to the fluid volume in sepsis, not to ventilator settings."}, {"c": 8, "s": "Ch 8, section Mechanical ventilation basics and ARDS", "q": "A ventilated patient suddenly desaturates, the high-pressure alarm sounds, and his blood pressure falls. What is the best first action?", "o": ["Increase sedation to calm any ventilator asynchrony and wait for the alarm to settle on its own", "Disconnect from the ventilator and bag with 100% oxygen while checking the tube and lungs", "Increase PEEP to recruit the collapsed lung", "Send the patient to CT as soon as the saturation allows", "Give a large fluid bolus and observe the response before checking the equipment"], "k": 1, "e": "Sudden deterioration on the ventilator requires removing the machine from the question: bag the patient and check displacement, obstruction, pneumothorax and equipment failure. Call for help early. Waiting or adding sedation delays recognition of a reversible cause."}, {"c": 8, "s": "Ch 8, section Sedation, analgesia, and ICU delirium", "q": "A ventilated patient becomes agitated. Which first response is best?", "o": ["Look for pain, hypoxemia, withdrawal or a drug effect before sedating more", "Increase the sedative infusion until he is calm and comfortable", "Add haloperidol immediately to settle the agitation and protect the endotracheal tube", "Move to deep sedation until the agitation has fully settled", "Add melatonin and observe through the night without further assessment"], "k": 0, "e": "Agitation is a sign to look for treatable causes, including infection, urinary retention and constipation, before adding a drug. Pain is treated first, and light sedation is suggested over deep sedation. Increasing sedation can hide a reversible problem."}, {"c": 8, "s": "Ch 8, section Sedation, analgesia, and ICU delirium", "q": "A team wants to lower the risk of delirium in ventilated patients. Which approach is supported by the PADIS guidance described in the chapter?", "o": ["Multicomponent nondrug measures, including noise and light reduction and early mobilization", "Prophylactic haloperidol for all ventilated patients starting on the day of intubation", "Prophylactic statins started on admission for every patient", "Bright light therapy alone, without any other measures", "Prophylactic ketamine for all patients at high risk of delirium"], "k": 0, "e": "The 2018 guideline suggests against haloperidol, atypical antipsychotics, dexmedetomidine, statins or ketamine for prevention. Multicomponent interventions, noise and light reduction and early mobilization are suggested, and bright light therapy is not."}, {"c": 8, "s": "Ch 8, section When to call the ICU, and when to talk about goals", "q": "A 79-year-old woman lacks capacity and her condition is deteriorating. Her son says the family wants everything done. How should the team approach goals of care?", "o": ["Ask the surrogate what the patient would say, and start the discussion early", "Ask the family what they want, since the family decides on the patient's behalf", "Wait for a standardized trigger before any discussion", "Defer the conversation until after an arrest", "Order a formal palliative care consultation for every patient automatically on admission"], "k": 0, "e": "For a patient who cannot speak, the surrogate is asked what she would choose, not what the family wants. The guideline suggests discussing goals early, within 72 hours, and suggests against routine formal palliative consultation for everyone, favoring clinician judgment. Starting a ventilator by default can deliver care the patient would have refused."}, {"c": 8, "s": "Ch 8, section Cardiac arrest on the ward: first minutes and the day after", "q": "A 70-year-old man is comatose after a witnessed cardiac arrest and has just been rewarmed. His family asks for a prognosis on the first day. What does the 2025 guidance in the chapter advise?", "o": ["Decide from a single examination on the first day after the arrest", "Wait until at least 72 hours after normothermia and sedatives end, and use more than one test", "Use end-tidal carbon dioxide alone as the main prognostic test", "Prognosticate as soon as he is rewarmed, regardless of any residual sedation or drug effect", "Base the decision on pupils at arrival alone, as they predict outcome reliably"], "k": 1, "e": "Early prognosis is unreliable, so the guidance waits at least 72 hours after temperature control and sedative withdrawal and uses multimodal testing. A single test or early examination risks a wrong conclusion."}, {"c": 8, "s": "Ch 8, section Recognizing the deteriorating patient", "q": "A hospitalist is asked how strongly the evidence supports rapid response systems. Which summary is most accurate?", "o": ["Randomized trials proved a large reduction in hospital mortality, ICU admissions and length of stay", "Rapid response teams increase mortality and should be replaced by scoring alone", "Cochrane found little or no difference in mortality; use the system, but a normal score is not permission to stay away", "The Cochrane review made a strong recommendation to use them, based on high-certainty evidence", "They work only when the NEWS2 total is 7 or more, and never for single-parameter triggers"], "k": 2, "e": "The Cochrane review included 11 studies, 4 of them randomized, and the randomized trials were at high risk of bias; the authors made no strong recommendations. A score and a team are only as good as the response they trigger, and calling early remains sound practice."}, {"c": 9, "s": "Ch 9, section Skin and soft-tissue infection and necrotizing infection", "q": "A 62-year-old man has had red, itchy, mildly swollen lower legs on both sides for weeks. They are not very warm or painful, and an outside team started antibiotics for cellulitis. What is the best approach?", "o": ["Consider a mimic such as stasis dermatitis and reconsider the antibiotics", "Extend the antibiotics to cover resistant organisms and continue for several more weeks", "Order CT of both legs to look for deep infection", "Arrange surgical exploration of both legs for necrotizing infection", "Add a second antibiotic for synergy against skin organisms"], "k": 0, "e": "Cellulitis is typically one limb, warm, tender and spreading. Bilateral, itchy, less painful legs are more often stasis or contact dermatitis, and antibiotics give harm without benefit. Marking the edge gives an objective trend."}, {"c": 9, "s": "Ch 9, section Skin and soft-tissue infection and necrotizing infection", "q": "A 45-year-old woman is otherwise well and has a tender, fluctuant mass on the buttock. Ultrasound shows a collection under the skin. What is the key step?", "o": ["Drain it and culture the pus", "Oral antibiotics alone, since they penetrate pus well", "Mark the edge and treat as cellulitis", "Apply compression and observe", "Start an antifungal"], "k": 0, "e": "An abscess needs drainage, and antibiotics alone do not penetrate a pus collection well. Ultrasound shows a collection beneath skin that looks like cellulitis. Antibiotics are added for systemic illness, diabetes, immune compromise, or a large or hard-to-drain abscess."}, {"c": 9, "s": "Ch 9, section Bacteremia and the unknown source", "q": "A well 50-year-old man with no device has one of two blood culture bottles growing coagulase-negative staphylococcus. What is the best step?", "o": ["Start a prolonged course of intravenous antibiotics immediately without further cultures", "Ignore it as a contaminant and never repeat the cultures", "Remove every line in the hospital and culture each catheter tip", "Treat as endocarditis with a prolonged intravenous course", "Treat it as a likely contaminant and repeat cultures from separate sites"], "k": 4, "e": "Organisms that often contaminate, such as coagulase-negative staphylococci, in a single bottle may not be real. Treating a contaminant adds exposure and complications. Staphylococcus aureus, gram-negative rods and Candida are almost always real."}, {"c": 9, "s": "Ch 9, section Bacteremia and the unknown source", "q": "A 71-year-old woman with bacteremia from a urinary source remains febrile on appropriate therapy. What is the best next step?", "o": ["Stop the antibiotics and wait to see whether the fever resolves", "Add an antifungal routinely to cover a possible fungal source", "Look again for a focus such as an undrained collection or an infected line", "Assume drug fever and observe without looking for another focus", "Change the antibiotic to a broader agent without further search for a source"], "k": 2, "e": "Persistent fever or positive cultures on appropriate therapy should trigger a new search for another focus rather than stopping at the first source. A change of drug without finding the problem repeats the mistake in the worked case."}, {"c": 9, "s": "Ch 9, section Bacteremia and the unknown source", "q": "A team is planning the treatment course for Staphylococcus aureus bacteremia and asks when to start counting the days. What does the chapter advise?", "o": ["From the first negative culture, not the first dose", "From the first antibiotic dose given in the emergency room", "From the day of admission to the hospital", "From the first positive culture drawn on admission", "From the day of discharge from the hospital"], "k": 0, "e": "The practical rule is to count days from culture clearance, after repeat cultures show the bloodstream is clear. Infectious disease should be involved early. The clock for complicated infections also starts after source control or clearance."}, {"c": 9, "s": "Ch 9, section Bacteremia and the unknown source", "q": "A 68-year-old man is septic and a central line is the suspected source. Cultures grow Candida. What is the usual approach to the line?", "o": ["Retain it and treat through the line", "Never remove any central line", "Draw all future cultures only from the line", "It usually comes out, because the organism is hard to clear", "Replace it with a new line at once and leave the old one in place"], "k": 3, "e": "The line usually comes out when the patient is septic, when the organism is hard to clear (Staphylococcus aureus, Candida, gram-negative rods), or when there is a tunnel infection or metastatic focus. If a line is to be kept, a peripheral set should be drawn as well for comparison."}, {"c": 9, "s": "Ch 9, section Central nervous system infection", "q": "A 58-year-old man has fever, severe headache, confusion and a stiff neck. CT has not been done and a lumbar puncture would take time. What is the best approach?", "o": ["Wait for CT first, then do the lumbar puncture, and only after both start antibiotics", "Draw blood cultures and give antibiotics now, with a steroid in the right setting", "Wait for CSF results before any treatment, even in a sick patient", "Acyclovir alone until the CSF results return", "Observe overnight and reassess in the morning"], "k": 1, "e": "In suspected bacterial meningitis, the order is cultures, then treatment, then imaging if needed, and antibiotics are not delayed for imaging or puncture in a sick patient. Hours without antibiotics cost brain."}, {"c": 9, "s": "Ch 9, section Central nervous system infection", "q": "A 76-year-old immunosuppressed woman has headache and confusion with a normal neck exam. A resident says meningitis is excluded because the classic triad is absent. What is the best response?", "o": ["He is right; a normal neck exam rules out meningitis in this age group", "Meningitis is excluded unless there is a rash or a high fever at presentation", "Only a documented fever makes the diagnosis possible in older adults", "Many patients lack the full triad; older or immunosuppressed patients may have none", "Observation without cultures or antibiotics is adequate until a stiff neck or rash develops"], "k": 3, "e": "The classic triad is not a rule-out. Older and immunosuppressed patients may have few typical signs. A normal neck exam does not exclude meningitis, and the decision rests on the whole clinical picture."}, {"c": 9, "s": "Ch 9, section Central nervous system infection", "q": "A 74-year-old man has suspected bacterial meningitis. Which addition to the empiric plan does the chapter highlight for his age group?", "o": ["Antifungal coverage in every case", "Anaerobic coverage in every case", "No change from the standard plan in any patient, whatever the age", "Delay antibiotics until the lumbar puncture is completed", "Coverage for Listeria, according to the hospital protocol"], "k": 4, "e": "Listeria coverage is added in older adults and the immunocompromised, and coverage for resistant organisms is added after neurosurgery or with a shunt, according to the hospital's protocol. The other options are not supported."}, {"c": 9, "s": "Ch 9, section Central nervous system infection", "q": "A 22-year-old student is admitted with fever, rash and suspected meningococcal disease. Which additional step is appropriate?", "o": ["No precautions until the culture is positive and the organism is identified", "Contact precautions with soap-and-water hand washing only, and no health department notice", "Airborne precautions in a negative-pressure room only, with no contact tracing", "Droplet precautions, with notice to infection prevention and the health department", "Isolate only after the lumbar puncture has been completed and reported"], "k": 3, "e": "Some organisms need droplet precautions for the patient and prophylaxis for contacts, and suspected meningococcal disease should be reported to infection prevention and the health department. Precautions start on suspicion, not on a positive culture."}, {"c": 9, "s": "Ch 9, section Bone, joint, and prosthetic infection", "q": "A 52-year-old man has a hot, swollen knee, and crystals are seen in the aspirated fluid. What is the best interpretation?", "o": ["Crystals prove gout, so no further work-up or drainage is needed", "Cultures are unnecessary when crystals are present in the fluid", "Antibiotics alone, with no drainage or repeat aspiration of the joint, are sufficient", "Crystals do not exclude infection, since gout and sepsis can coexist; send culture", "Defer aspiration until an MRI is done and the joint has been rested"], "k": 3, "e": "A hot, swollen, painful joint is septic arthritis until shown otherwise. Aspirate for Gram stain, culture, cell count and crystals, and treat with antibiotics plus joint drainage. Aspiration should not wait for MRI."}, {"c": 9, "s": "Ch 9, section Bone, joint, and prosthetic infection", "q": "A 63-year-old man with bacteremia has back pain and fever but no neurologic deficit yet. What is the best approach?", "o": ["Plain films of the spine, which reliably detect early disease", "Wait for a neurologic deficit to appear before ordering any imaging", "Discharge with an NSAID and advice to rest the back until it settles", "CT of the head to look for a septic e
