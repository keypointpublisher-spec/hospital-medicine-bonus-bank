<!DOCTYPE html>
<html lang="en-US"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Medicine Bedside Manual: Bonus Question Bank</title>
<style>
:root{--w:#5A3A22;--o:#5C6B14;--ot:#F0F2DA;--p:#FBF6DC;--r:#C84406;--g:#5F6458}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font:17px/1.45 Georgia,'Times New Roman',serif}
header{background:var(--w);color:#fff;padding:18px 16px}
header h1{margin:0;font:700 22px/1.2 Calibri,Carlito,Arial,sans-serif}
header p{margin:4px 0 0;font:15px Calibri,Carlito,Arial,sans-serif;color:var(--ot)}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font:700 20px Calibri,Carlito,Arial,sans-serif;color:var(--w);border-bottom:2px solid var(--o);padding-bottom:4px;margin:20px 0 10px}
button{font:600 16px Calibri,Carlito,Arial,sans-serif;cursor:pointer;border-radius:6px;border:1.5px solid var(--o);background:#fff;color:var(--w);padding:10px 14px;min-height:44px}
button.primary{background:var(--o);color:#fff}
button:disabled{opacity:.45;cursor:default}.opt:disabled{opacity:1;color:#222}.opt.right:disabled,.opt.wrong:disabled{opacity:1}
button:focus-visible,a:focus-visible{outline:3px solid var(--r);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.modes button{flex:1 1 220px}
.chs{list-style:none;padding:0;margin:0}
.chs li{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.chs .name{flex:1;text-align:left;background:var(--ot)}
.chs .name span{color:var(--g);font-weight:400}
.chs .rnd{flex:0 0 auto}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font:600 15px Calibri,Carlito,Arial,sans-serif;color:var(--g);margin-bottom:8px}
.tag{font:14px Calibri,Carlito,Arial,sans-serif;color:var(--o)}
.stem{font-size:18px;margin:8px 0 14px}
.opts{list-style:none;padding:0;margin:0}
.opts li{margin:0 0 8px}
.opt{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start;font:17px/1.35 Georgia,serif;font-weight:400;background:#fff}
.opt .l{flex:0 0 26px;font:700 16px Calibri,Carlito,Arial,sans-serif;color:var(--w)}
.opt.sel{background:var(--p);border-color:var(--w)}
.opt.right{background:var(--ot);border:2px solid var(--o)}
.opt.wrong{background:#fff;border:2px solid var(--r)}
.opt.right .l::after{content:" ✓"}
.opt.wrong .l::after{content:" ✗"}
.exp{background:var(--p);border:1.5px solid var(--w);border-radius:6px;padding:12px 14px;margin:14px 0}
.exp h3{margin:0 0 6px;font:700 16px Calibri,Carlito,Arial,sans-serif;color:var(--w)}
.verdict{font:700 16px Calibri,Carlito,Arial,sans-serif;margin-bottom:6px}
.verdict.ok{color:var(--o)}.verdict.no{color:var(--r)}
.hidden{display:none}
.score{background:var(--ot);border:1.5px solid var(--o);border-radius:6px;padding:10px 14px;margin:10px 0}
table{border-collapse:collapse;width:100%;font:15px Calibri,Carlito,Arial,sans-serif}
th{background:var(--o);color:#fff;text-align:left;padding:5px 8px}td{padding:5px 8px;border-bottom:1px solid #d6d9bd}
footer{max-width:760px;margin:24px auto 30px;padding:0 16px;font:13px Calibri,Carlito,Arial,sans-serif;color:var(--g)}
@media(max-width:480px){body{font-size:16px}.stem{font-size:17px}}
</style></head><body>

<script type="application/json" id="payload">{"q": [{"c": 1, "s": "Ch 1, section 1.1 The admission decision", "q": "A 70-year-old man is admitted from the emergency department with worsening pneumonia. He needs a titrated vasopressor infusion to keep his blood pressure acceptable. Which reasoning best guides the choice of bed?", "o": ["His diagnosis is pneumonia, so a general ward bed matches the diagnosis and the usual pathway", "Observation status is chosen first, and the bed then follows the payer category and the expected length of stay", "He needs a treatment only a higher level of care can provide, so a general ward bed is not appropriate", "The bed should be the lowest level that his insurer will approve", "A ward bed is acceptable if telemetry is ordered with a stop date"], "k": 2, "e": "The level of care is chosen by how sick the patient is now and what could change, and a titrated infusion is a treatment a ward cannot give. The bed matches the risk, not the diagnosis, and payer status never drives the clinical decision. Telemetry on a ward does not supply the nursing ratio or organ support that the infusion requires."}, {"c": 1, "s": "Ch 1, section 1.1 The admission decision", "q": "A ward patient has a total early warning score in the low range, but one single parameter scores 3. According to the NEWS2 response table, what is the expected response?", "o": ["Routine ward-based response only", "Emergency response with critical care skills", "No response, because the total is low", "Immediate transfer to the ICU", "Urgent ward-based response"], "k": 4, "e": "A single parameter scoring 3 triggers a low to medium risk category with an urgent ward-based response, even when the total is low. An emergency response with airway skills is reserved for a total of 7 or more. Ignoring the single extreme parameter because the total is low misses the purpose of the score."}, {"c": 1, "s": "Ch 1, section 1.1 The admission decision", "q": "A hospital uses NEWS2. A patient's total score is 7 or more. Which response does the NEWS2 table link to this result?", "o": ["Urgent ward-based response by the primary nurse", "Emergency response by a team with critical care skills", "Routine ward-based response with hourly vital signs", "Urgent response by the primary team within the same shift, with a senior review", "Observation until the next scheduled round"], "k": 1, "e": "A total of 7 or more is the high-risk band and calls for an emergency response with critical care skills. A total of 5 or 6 is medium risk and calls for an urgent response, which is the closest distractor. Remember that the score is an alarm that prompts a look at the patient, not a diagnosis."}, {"c": 1, "s": "Ch 1, section 1.1 The admission decision", "q": "A patient asks why it matters whether he is placed in observation or admitted as an inpatient, since he will be in the same hospital bed either way. What is the most accurate answer?", "o": ["It means the care is of a lower clinical standard than inpatient care, with fewer nursing checks and fewer physician visits", "It is reserved for patients who are too well to need any hospital treatment or testing", "Inpatient status guarantees a longer hospital stay and a higher level of nursing care", "The two differ only in paperwork and have no effect on the patient's coverage afterward", "It is an outpatient status, and the difference can change coverage, including skilled nursing coverage"], "k": 4, "e": "Observation and inpatient are payment and regulatory categories, and the clinical standard of care is the same. The practical effect is on coverage and on what happens after discharge, including coverage of a skilled nursing stay for some Medicare beneficiaries. Status does not measure the severity of illness."}, {"c": 1, "s": "Ch 1, section 1.1 The admission decision", "q": "A hospitalist is unsure which status a patient should be assigned. Which division of responsibility is correct?", "o": ["The hospitalist applies the payer rules and case management makes the clinical judgment about the patient's status", "The hospitalist documents facts and reasoning, while case management and the physician advisor apply payer rules", "Status is chosen by the emergency physician and cannot be changed", "The patient chooses the status after reading the notice", "Status is decided by the number of consultants involved"], "k": 1, "e": "The ordering clinician makes the clinical judgment and documents how sick the patient is, what could go wrong, what is planned, and how long hospital care is expected to be needed. Case management and the physician advisor apply the payer rules, which change over time. Mixing the roles lets status drive the clinical plan."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A 78-year-old woman has had shortness of breath for years and arrives this morning with worsening dyspnea. Which part of the admission history should the hospitalist pursue first to avoid labeling this simply as her chronic condition?", "o": ["Her full family history, taken in detail from every relative", "A complete list of her past surgeries and their dates", "Her preferred hospital and pharmacy for future care", "Why now: what changed to bring her in today rather than last week", "Her insurance type and the name of her primary care office"], "k": 3, "e": "The hospital history must answer why now, because a patient with long-standing symptoms who presents today has a precipitant that should be found. Family history and surgical lists may matter later but do not explain the change. Finding the precipitant guides both diagnosis and treatment."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "During medication history, which group of drugs should the hospitalist ask about first because they carry the most risk?", "o": ["Vitamins, herbal products, and other dietary supplements", "Anticoagulants, insulin, opioids, and sedatives", "Topical creams, eye drops and ear drops", "Over-the-counter antacids and laxatives", "Allergy nasal sprays and cough syrups"], "k": 1, "e": "The text advises asking about anticoagulants, insulin, opioids, and sedatives first because errors with them carry the most harm. Supplements and over-the-counter products should still be asked about, but they are not the priority. Ask what the patient actually takes, not only what was prescribed."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A patient's chart lists penicillin allergy. When asked, the patient says she felt nauseated after one dose many years ago. What is the best way to record this?", "o": ["Record anaphylaxis, to be safe in any future prescribing", "Record the reaction as she describes it: nausea is not anaphylaxis", "Delete the entry without documenting anything about it", "Record the drug name only, with no description of a reaction", "Record a rash, since most reported penicillin reactions involve the skin"], "k": 1, "e": "The history of allergy should capture what happened, not just the drug name. Nausea is a side effect and is not the same as an anaphylactic reaction. Accurate descriptions prevent both unsafe exposures and the unnecessary loss of useful drugs."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A 66-year-old man is admitted in stable condition. Which action best reflects the guidance on code status and surrogate decision makers?", "o": ["Wait until he deteriorates, then ask the nurse to find a family member to decide", "Assume full code and document the assumption", "Discuss code status now while he is stable, and record his surrogate by name", "Record the surrogate as 'family' without a name", "Defer the conversation until the day of discharge"], "k": 2, "e": "These conversations are easier on a stable day than in a crisis, and the surrogate should be recorded by name. Assuming full code with no discussion is a listed common error. A vague entry such as family gives the night team no one to call."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "Which baseline description in an admission note will be most useful to a clinician comparing the patient's condition on day three?", "o": ["Neuro intact, no focal deficits", "Doing well, no acute distress", "Exam unremarkable overall", "Alert, oriented, walks with a walker", "Appears comfortable at rest"], "k": 3, "e": "A baseline written in words that someone else can compare is more useful than a summary label such as neuro intact. The walker and orientation are observable and will show change. The other options give no specific findings to compare."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A 59-year-old man with a history of peptic ulcer bleeding is admitted with an acute medical illness and is at high bleeding risk. Which venous thromboembolism prevention approach matches the guideline summary in the chapter?", "o": ["Mechanical prophylaxis, since drug prophylaxis needs acceptable bleeding risk", "A direct oral anticoagulant started for in-hospital prophylaxis despite the bleeding history", "No prophylaxis of any kind, whatever his risk level", "Pharmacologic prophylaxis regardless of his bleeding risk", "Extended prophylaxis after discharge as the default plan"], "k": 0, "e": "The 2018 ASH guideline summary advises pharmacologic prophylaxis for acutely ill medical inpatients when bleeding risk is acceptable and mechanical prophylaxis when it is not. It also advises avoiding direct oral anticoagulants for in-hospital prophylaxis and prefers low molecular weight heparin. Giving pharmacologic prophylaxis in active bleeding risk is a listed error."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A 72-year-old woman with pneumonia has a hemoglobin that is lower than normal but stable. She has no symptoms and no coronary disease, heart failure, or stroke. A colleague suggests transfusing to reach a round-number hemoglobin. What does the Society of Hospital Medicine Choosing Wisely list advise?", "o": ["Transfuse every patient whose value is below the normal range for age and sex", "Transfuse whenever the patient or family asks for it", "Transfuse to one fixed threshold in all patients alike", "Avoid transfusing to arbitrary hemoglobin thresholds in such patients", "Repeat the hemoglobin hourly until the value rises"], "k": 3, "e": "The list advises against transfusion to arbitrary thresholds in patients without symptoms or coronary disease, heart failure, or stroke. Treating a number rather than a patient exposes the patient to transfusion risk without benefit. Repeating blood tests hourly would also conflict with the advice against repetitive testing during stability."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A 64-year-old man with diabetes is admitted with cellulitis and has no hemoglobin A1C result on file. What do the American Diabetes Association standards, as summarized in the chapter, advise?", "o": ["Check a hemoglobin A1C, in addition to checking glucose", "Skip A1C because glucose values are enough", "Order A1C only if the patient has a known complication", "Repeat A1C every day of the stay", "Defer A1C to a clinic visit a year later"], "k": 0, "e": "The standards advise A1C testing for patients with diabetes or hyperglycemia who are admitted without a recent value. A glucose reflects only the moment, whereas A1C gives the baseline. Daily repetition would be low-value testing."}, {"c": 1, "s": "Ch 1, section 1.2 The admission history, examination, and orders", "q": "A night physician is covering a patient and has little time. Which part of the admission note will be most useful to that physician?", "o": ["The full emergency department record, pasted into the note without any summary", "The past surgical history from many years ago", "The list of consultants and their office phone numbers", "The insurance authorization number for the stay", "The contingency line: what to do if the patient worsens overnight"], "k": 4, "e": "A good admission note has a one-line summary, an assessment, a problem-based plan, and a contingency that tells the night physician what to do if the patient worsens. A pasted record has no thinking in it and carries forward errors. The contingency is the part the night physician will actually use."}, {"c": 1, "s": "Ch 1, section 1.3 Daily rounds, progress notes, and the problem list", "q": "A resident writes tomorrow's progress note by copying today's note and changing the date. The physical exam text is unchanged although the patient was not examined. What is the recommended fix?", "o": ["Delete the old exam and write today's, or state that none was done", "Keep the text, because it is probably still accurate today", "Add a line stating that the previous exam was reviewed", "Copy the exam findings from the nursing note instead", "Remove the exam section from the note template entirely"], "k": 0, "e": "Copy-forward carries yesterday's exam, assessment, and mistakes into today's note. The note should reflect the examination actually performed, and if none was done, it should say so. Only an honest note lets later readers trust the record."}, {"c": 1, "s": "Ch 1, section 1.3 Daily rounds, progress notes, and the problem list", "q": "A hospitalist is ordering the problems on a patient's list. The problem driving the stay is pneumonia, but the patient also has a new rhythm disturbance that could harm him soonest. How should these be ranked?", "o": ["Alphabetically, so that the list stays neutral and consistent from one day to the next", "Only the rhythm problem, deleting pneumonia from the list", "The rhythm problem last, because it is the newest entry", "Pneumonia first as the driver, the rhythm problem second as the soonest threat", "Strictly by the date each problem was first recorded"], "k": 3, "e": "The list should be short and ranked, with the problem driving the stay first and the one that could hurt the patient soonest second, even when they are not the same. Resolved problems move off the active list. Ranking by date or alphabet loses the clinical meaning."}, {"c": 1, "s": "Ch 1, section 1.3 Daily rounds, progress notes, and the problem list", "q": "A patient labeled 'pneumonia' on admission is not improving on the expected schedule, yet the assessment line has not changed in four notes. What is the best first action?", "o": ["Continue the same plan for several more days and reassess", "Add the word probable to the diagnosis and carry on", "Restate the problem in plain symptoms and rebuild the differential", "Defer to the previous team's impression of the case", "Order the same tests again and wait for the results"], "k": 2, "e": "A provisional label can harden by repetition until a different cause is missed. When a patient does not follow the expected course, the first action is to restate the problem and rebuild the differential. Adding a hedge word does not test the hypothesis."}, {"c": 1, "s": "Ch 1, section 1.4 Handoffs and cross-cover", "q": "The mnemonic I-PASS bundles several elements of a safe handoff. Which element does the 'S' at the end ask the receiver to do?", "o": ["Summarize the whole chart aloud", "Synthesize by restating the plan back to the sender", "Sign the handoff document electronically before leaving the unit", "Schedule the next admission", "Submit the list to the pharmacy"], "k": 1, "e": "I-PASS covers illness severity, a patient summary, an action list, situational awareness with contingency planning, and synthesis by the receiver. The receiver's read-back confirms that the plan was understood. A handoff is not complete until the receiver has restated the plan."}, {"c": 1, "s": "Ch 1, section 1.5 Working with nurses, pharmacy, case management, and consultants", "q": "A hospitalist wants help from nephrology for a patient whose creatinine has doubled since admission. Which consult request follows the chapter's advice?", "o": ["Write only: renal consult, abnormal labs, please see the patient", "Write that the kidney numbers are off and ask them to advise", "Say creatinine has doubled and you need help deciding whether and when to dialyze", "Leave a chart message asking for a kidney opinion when convenient", "Write that nephrology is requested because the patient is a difficult case to manage on the ward"], "k": 2, "e": "A consult is a question and should say what has been done, what the concern is, and how soon an answer is needed. A bare one-word request leaves the consultant guessing. For urgent matters, call rather than rely on a chart message."}, {"c": 1, "s": "Ch 1, section 1.5 Working with nurses, pharmacy, case management, and consultants", "q": "Which patient should prompt the hospitalist to involve case management and social work on the first hospital day?", "o": ["A woman with a clear home setting, a willing caregiver, and no new care needs", "A patient who will certainly be discharged in a few hours", "A patient whose only concern is a mild cough", "A patient whose family visits daily and manages all medicines", "A man who lives alone, has fallen, and may need help with daily activities"], "k": 4, "e": "Early involvement is advised when the patient lives alone or the caregiver is stretched, needs help with daily activities or has fallen, or has housing, substance use, or payment barriers. Barriers take time to fix, so naming them on day one means they are solved by the time the patient is ready. The other patients show no such barrier."}, {"c": 1, "s": "Ch 1, section 1.6 Early discharge planning from day one", "q": "Which of the following is one of the conditions in Medicare's Hospital Readmissions Reduction Program as described in the chapter?", "o": ["Heart failure", "Cellulitis", "Diabetic ketoacidosis", "Urinary tract infection", "Acute kidney injury"], "k": 0, "e": "The program targets excess readmissions for a defined list that includes acute myocardial infarction, COPD, heart failure, pneumonia, coronary artery bypass grafting, and elective hip or knee replacement, with the penalty capped at 3 percent. The chapter notes that the lesson is less about the penalty and more about patients who leave without a clear plan returning. Cellulitis, ketoacidosis, and urinary infection are not on the printed list."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "A hospitalist builds a differential for a 70-year-old man with acute dyspnea. The list is ranked three ways: most likely, most dangerous, and most treatable. Pulmonary embolism is not the most likely cause but is dangerous and treatable. How should it be handled?", "o": ["Keep it on the list until it has been actively made less likely", "Remove it, because it is not the most likely cause of the dyspnea", "Move it to the end of the note and stop considering it", "Keep it only if the patient is under 60", "Remove it once a different diagnosis fits most of the findings seen so far"], "k": 0, "e": "The three rankings often differ, and must-not-miss items stay on the working list until their likelihood has been actively reduced. Dropping a dangerous, treatable diagnosis because another one fits most findings is the premature closure trap. The question is what test or action best separates the candidates."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "Which situation is a signal to switch deliberately from fast pattern recognition to slow analytic reasoning?", "o": ["The presentation matches a familiar pattern and the patient is improving", "The case is routine and the stakes are low", "The patient has been seen by the same team before", "The diagnosis was confirmed by an expert and all findings fit", "The patient is not following the expected course"], "k": 4, "e": "Switch deliberately to slow mode when the patient is not following the expected course, when a finding does not fit, or when the stakes are high. Slow thinking is safer but expensive, so it cannot be used for every decision. Fast thinking works best when the pattern is complete and the case is truly familiar."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "A hospitalist writes a one-line problem representation. Which version follows the recommended approach?", "o": ["An older man with two days of fever, productive cough, and new hypoxemia", "Pneumonia, rule out sepsis", "A difficult patient from the nursing home with multiple complaints", "Likely community-acquired pneumonia, treat per the usual protocol and reassess", "Another respiratory admission"], "k": 0, "e": "A good problem representation uses the key facts and states what is acute, chronic, and new, rather than naming a diagnosis. A diagnostic label in the first line builds an anchor that the later steps must fight. Facts keep the differential open."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "A nurse reports a markedly abnormal finding that is equally common in all three diagnoses on the hospitalist's differential. How should the finding be used?", "o": ["It strongly raises the most dangerous diagnosis on the list", "It rules out the least likely diagnosis on the list", "It does not discriminate among them, however abnormal it looks", "It proves that all three diagnoses are present together", "It should be left out of the chart because it adds nothing"], "k": 2, "e": "A finding helps only if it changes the ranking, so before recording it, ask which diagnoses it raises and which it lowers. A finding equally common in every candidate does not discriminate. This is the so-what test."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "A patient on hospital day three has not followed the expected script. A hospitalist decides to perform a diagnostic time-out. What should be written down?", "o": ["Only the working diagnosis and the plan going forward", "The names of the consultants who have been contacted so far and their opinions", "The working diagnosis, evidence for and against it, and what else it could be", "Only the evidence that supports the working diagnosis", "The expected date of discharge and the discharge destination for the patient"], "k": 2, "e": "The time-out is a built-in pause in which the working diagnosis, the supporting and opposing evidence, and the alternatives are written down. Listing only supporting evidence feeds confirmation bias. The goal is to interrupt anchoring before it hardens."}, {"c": 2, "s": "Ch 2, section 2.1 From presentation to differential diagnosis", "q": "A hospitalist treating a septic-appearing patient asks whether a single biomarker can confirm or exclude sepsis. What does the chapter state?", "o": ["Sepsis is a clinical diagnosis, and no single biomarker rules it in or out", "A normal biomarker excludes sepsis and ends the evaluation", "An elevated biomarker confirms sepsis and ends the evaluation", "Sepsis is a laboratory diagnosis based on a single blood test", "Almost every patient treated for sepsis has a proven infection"], "k": 0, "e": "The guideline summary states that sepsis is a clinical diagnosis, with no biomarker that settles it, and that about 10 to 30 percent of patients treated for sepsis end with a noninfectious diagnosis. This should not delay treatment in a sick patient. It should prompt continued questions about what else it could be after the first doses."}, {"c": 2, "s": "Ch 2, section 2.2 Pre-test and post-test probability at the bedside", "q": "For a patient with a very low pre-test probability of a disease, what is the usual action according to the chapter's table?", "o": ["Do not test and reassure, because positives will mostly be false", "Order the most sensitive test available, to be safe", "Treat empirically, since the disease is dangerous", "Order several confirmatory tests together at once", "Admit for observation and repeat the testing serially"], "k": 0, "e": "Below the testing threshold, the disease is so unlikely that no test is worth the cost and the false positives. Positive results in this setting are mostly false. Testing is most helpful between the thresholds."}, {"c": 2, "s": "Ch 2, section 2.2 Pre-test and post-test probability at the bedside", "q": "A hospitalist considers how the harm of treatment affects the treatment threshold. Which statement is correct?", "o": ["The more harmful the treatment, the lower the probability needed before treating it", "The more harmful the treatment, the higher the probability needed to treat", "Treatment harm has no effect on the threshold", "The threshold depends only on the test's sensitivity", "The threshold is the same for all diseases"], "k": 1, "e": "The thresholds move with the stakes: the more dangerous the disease and the safer the treatment, the lower the treatment threshold, and the more harmful the treatment, the higher it is. A dangerous disease with a safe treatment is treated at low probability. Treatment harm therefore raises the bar."}, {"c": 2, "s": "Ch 2, section 2.2 Pre-test and post-test probability at the bedside", "q": "A patient is judged to have a high pre-test probability of a serious disease. The initial test is negative. How should the result be interpreted?", "o": ["The disease is excluded, and no further thought is needed", "The disease is confirmed anyway, despite the negative result", "The pre-test estimate should now be discarded entirely", "A negative result may not lower the probability enough to settle it", "The test must have been run in error and is invalid"], "k": 3, "e": "Where the patient starts matters: a negative result in someone who already looks very likely to have the disease may not be reassuring enough. A test moves the estimate but does not hand over certainty. The sensible response is to weigh how far the result moved you relative to the thresholds."}, {"c": 2, "s": "Ch 2, section 2.3 Sensitivity, specificity, and likelihood ratios in practice", "q": "A test result has a likelihood ratio close to 1. What does this imply?", "o": ["The result is strongly diagnostic of the disease", "The test is perfectly specific for the disease", "The disease is excluded by this result", "The test is sensitive but not specific for the disease", "The result barely changes the probability of disease"], "k": 4, "e": "A likelihood ratio above 1 raises the probability of disease and below 1 lowers it, and the farther from 1 the larger the move. Values near 1 barely change the picture. A label of positive or negative alone can mislead."}, {"c": 2, "s": "Ch 2, section 2.3 Sensitivity, specificity, and likelihood ratios in practice", "q": "A colleague says, 'A sensitive test that is negative rules the disease out' and applies it to a patient who already looks very likely to have the disease. What is the best response?", "o": ["The shortcut applies to every patient, whatever the pre-test probability", "Only specificity matters when the pre-test probability is high", "The shortcut fails when pre-test probability is very high", "The test should be repeated until it eventually turns positive", "Likelihood ratios cannot be applied to a patient like this"], "k": 2, "e": "The mnemonics hold at the extremes and fail when the pre-test probability is already very low or very high. The likelihood ratio is preferred because it can be applied to the patient in front of you. Ask where the patient started."}, {"c": 2, "s": "Ch 2, section 2.3 Sensitivity, specificity, and likelihood ratios in practice", "q": "A 62-year-old man in the hospital has a troponin that is mildly elevated, with no symptoms suggesting ischemia and a baseline ECG. Which statement about troponin is most accurate?", "o": ["It measures injury, not cause, so read it with symptoms, ECG, and trend", "It diagnoses myocardial infarction by itself in any setting or clinical context", "It can only be raised by acute coronary occlusion", "A single normal value is enough to rule out injury", "It is raised only in patients who have primary heart disease of the coronary arteries"], "k": 0, "e": "A troponin result is a measurement of myocardial injury and is raised in many conditions, including sepsis, heart failure, kidney disease, and pulmonary embolism. Its meaning depends on context. The chapter also advises against sending a troponin when there is no reason to suspect ischemia and then chasing the result."}, {"c": 2, "s": "Ch 2, section 2.3 Sensitivity, specificity, and likelihood ratios in practice", "q": "A patient presents with symptoms and signs of an acute stroke, and the team is also waiting for an ECG and troponin. What does the chapter say about these tests?", "o": ["Treatment should wait for the troponin", "The ECG and troponin must not delay treatment", "The ECG must be completed before imaging", "Troponin is the key test for diagnosing stroke", "All tests must be completed before any decision"], "k": 1, "e": "In suspected stroke, imaging is urgent and the ECG and troponin must not delay treatment. This is an example of high-value testing not meaning less testing, as some emergencies should not wait for a test. The principle is to order promptly when the disease is dangerous and time-sensitive."}, {"c": 2, "s": "Ch 2, section 2.4 Cognitive biases and diagnostic error", "q": "A patient with agitation and confusion is sent to psychiatry on arrival, and no one checks for a medical cause such as delirium. Which bias does this best illustrate?", "o": ["Availability", "Triage cueing", "Anchoring on a laboratory result", "Overconfidence", "Diagnostic momentum"], "k": 1, "e": "Triage cueing occurs when the first service or setting steers the evaluation. The countermeasure is a medical screen for any new psychiatric presentation. Diagnostic momentum is a label passed between clinicians, which is not what happens here."}, {"c": 2, "s": "Ch 2, section 2.4 Cognitive biases and diagnostic error", "q": "A patient is described at handoff as 'drunk, probably intoxicated,' and no one considers a head injury. What is the best countermeasure?", "o": ["Accept the description because it came from a colleague", "Wait for the alcohol level before deciding anything", "Document the description and move on", "Ask the patient to come back later", "Re-take the history yourself and examine the patient"], "k": 4, "e": "Framing occurs when the way a case arrives shapes the thinking, and the countermeasure is to re-take the history yourself. An intoxication label can hide an injury. Waiting or accepting the label simply preserves the frame."}, {"c": 2, "s": "Ch 2, section 2.4 Cognitive biases and diagnostic error", "q": "A trauma patient has a clearly visible fracture, and the team stops the survey after finding it. A second injury is missed. Which bias is this?", "o": ["Fundamental attribution error", "Framing", "Availability", "Search satisficing", "Confirmation bias"], "k": 3, "e": "Search satisficing is stopping after the first abnormal finding, and the countermeasure is to finish the survey. Confirmation bias is favoring data that support a favored idea, which is different. The fix is a habit of completing the evaluation."}, {"c": 2, "s": "Ch 2, section 2.5 Choosing tests wisely: high-value testing", "q": "A resident wants to order a test for a stable patient. Which question best applies the high-value testing framework?", "o": ["Is the test covered by the patient's insurance and ordered by the usual team?", "Can the test be added to the standard morning panel to save a separate draw?", "Has the nurse requested the test?", "What will I do if the result is positive, and if it is negative?", "Will the result be available before rounds?"], "k": 3, "e": "The test must change something, so ask what will be done with each result. If the answer is the same either way, the test adds cost without value. Convenience and coverage do not address that question."}, {"c": 2, "s": "Ch 2, section 2.5 Choosing tests wisely: high-value testing", "q": "According to the Surviving Sepsis Campaign guideline as summarized in the chapter, what is procalcitonin's role?", "o": ["Procalcitonin alone should decide whether to start or continue antimicrobials", "Procalcitonin is useless for any decision about starting or stopping antimicrobials", "Clinical evaluation alone decides on starting; procalcitonin may help with stopping", "Procalcitonin should replace clinical evaluation in every case of suspected sepsis", "Procalcitonin identifies the causative organism in sepsis"], "k": 2, "e": "The guideline advises using clinical evaluation, not procalcitonin, to decide on starting antimicrobials, and suggests combining procalcitonin with clinical evaluation to help decide when to stop. A test can be useful for one decision and not for another. It does not identify the organism."}, {"c": 2, "s": "Ch 2, section 2.6 Reading the numbers: common laboratory pitfalls", "q": "A blood sample is drawn from an arm that has an intravenous infusion running above the site. The results do not fit the patient. What should be done?", "o": ["Treat the abnormal values immediately", "Redraw from the opposite arm", "Average the result with the previous result", "Assume the infusion has no effect", "Discard all prior results"], "k": 1, "e": "Drawing above an infusion can dilute the sample or add the infusate's contents. A result that does not fit the patient should prompt a repeat on a clean sample, drawn from the opposite arm. Treat the patient only if they look unwell or the value is plausible and dangerous."}, {"c": 2, "s": "Ch 2, section 2.6 Reading the numbers: common laboratory pitfalls", "q": "A patient admitted with an acute insult has a normal creatinine on day one. What is the correct interpretation?", "o": ["Kidney injury is excluded by a normal value on day one", "Creatinine rises immediately after an acute kidney insult", "Creatinine overestimates injury in patients with muscle loss", "Creatinine is only useful for following chronic disease", "Creatinine lags, so a normal value on day one does not exclude injury"], "k": 4, "e": "In acute injury, creatinine rises hours to days after the insult, so an early normal value is not reassuring. In muscle loss, creatinine actually overestimates kidney function. Trend and context matter more than a single value."}, {"c": 2, "s": "Ch 2, section 2.6 Reading the numbers: common laboratory pitfalls", "q": "A hospitalist uses the anion gap to screen for an acid-base disturbance in a patient with a very low albumin. What should be kept in mind?", "o": ["A low albumin falsely raises the calculated gap", "Albumin has no effect on the calculated gap at all", "The gap is never affected by any laboratory condition", "A low albumin hides a raised gap, so it may look normal", "A low albumin always indicates the presence of ketoacidosis"], "k": 3, "e": "The gap depends on albumin, and a low albumin hides a raised gap. The chapter also notes that the gap is not a good way to define resolution of diabetic ketoacidosis. Interpret it with the albumin in mind."}, {"c": 3, "s": "Ch 3, section 3.1 Chest pain evaluation in the hospitalized patient", "q": "A 73-year-old diabetic woman on the surgical ward, two days after surgery, suddenly develops breathlessness and sweating. She reports no chest pain. Which statement best explains why ischemia must still be considered?", "o": ["Ischemia always causes severe and unmistakable chest pain", "Sweating makes a cardiac cause less likely in a postoperative patient", "Painless presentations occur only in outpatients with diabetes", "Breathlessness in a postoperative patient points to a pulmonary cause alone", "Inpatients often present with anginal equivalents such as new dyspnea or sweating"], "k": 4, "e": "Sedated, postoperative, diabetic, older patients, and women often report pressure, breathlessness, nausea, or just feeling off. Anginal equivalents include new dyspnea, sudden sweating, unexplained hypotension, new arrhythmia, and acute pulmonary edema. Waiting for a classic story risks missing the infarction."}, {"c": 3, "s": "Ch 3, section 3.1 Chest pain evaluation in the hospitalized patient", "q": "A hospitalized 55-year-old man has sudden tearing chest pain radiating to the back, with different blood pressures in the two arms. What is the best approach before starting antithrombotic therapy?", "o": ["Start dual antiplatelet therapy and anticoagulation at once", "Consider aortic dissection first and arrange urgent imaging", "Give an antacid and reassess in the morning", "Order an outpatient stress test", "Treat as pericarditis"], "k": 1, "e": "Tearing pain through to the back with a pulse or pressure difference and a widened mediastinum suggests aortic dissection. Antithrombotics should not be given until dissection has been considered, and urgent imaging is the next step. Starting reflexive ACS therapy could cause harm."}, {"c": 3, "s": "Ch 3, section 3.1 Chest pain evaluation in the hospitalized patient", "q": "A patient with chest pain has a clear chest radiograph. How should the radiograph be interpreted regarding a coronary event?", "o": ["It rules out an acute coronary syndrome when it is clear and the patient is stable", "It confirms an acute coronary syndrome when it is abnormal", "It replaces the need for an ECG in chest pain", "It helps with competing causes but cannot rule a coronary event in or out", "It identifies the culprit coronary artery in most cases of acute chest pain in hospital"], "k": 3, "e": "Chest radiography helps with competing causes but says nothing definitive about a coronary event. The ECG and troponin remain the core tests. A normal film should not be taken as reassurance."}, {"c": 3, "s": "Ch 3, section 3.1 Chest pain evaluation in the hospitalized patient", "q": "A hospitalist is deciding whether to move a patient with chest pain to a monitored bed. Which finding most clearly supports the move?", "o": ["A ventricular arrhythmia", "A normal ECG with no pain for two days", "Reproducible chest wall tenderness alone", "A flat troponin with a baseline ECG", "Pain that follows a meal and resolves with antacids"], "k": 0, "e": "Move the patient to a monitored bed if he has ongoing pain, an ischemic ECG, a rising troponin, hemodynamic instability, a ventricular arrhythmia, or heart failure. Meal-related or positional pain and reproducible tenderness suggest other causes, which remain diagnoses of exclusion after the ECG and troponin."}, {"c": 3, "s": "Ch 3, section 3.1 Chest pain evaluation in the hospitalized patient", "q": "A hospitalist wants to apply the HEART, TIMI, or GRACE score to a hospitalized patient with several competing illnesses. How does the chapter describe the role of these tools?", "o": ["They are mandatory and should decide the disposition on their own in every case", "They combine inputs into one estimate and prompt thinking, not replace judgment", "They replace the ECG in the evaluation of chest pain in hospitalized patients", "They apply only to outpatients and never to inpatients", "They identify the culprit coronary vessel in ACS"], "k": 1, "e": "The chapter describes these tools by purpose, as combining several inputs into a single risk estimate, with no printed cutoffs. In inpatients with competing illnesses, a score is a prompt to think. It never replaces the bedside look or the ECG."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "Two patients with identical ischemic symptoms and the same ECG have different troponin results: one is within the normal range and the other shows necrosis. What distinguishes unstable angina from NSTEMI?", "o": ["Troponin: normal in unstable angina, showing necrosis in NSTEMI", "The severity of the pain, which is worse in NSTEMI", "The presence of ST elevation on the ECG tracing", "The patient's age and the number of risk factors", "Whether the patient needs aspirin as part of the plan"], "k": 0, "e": "Unstable angina means ischemic symptoms without myocardial necrosis, whereas NSTEMI shows troponin release. Because the two cannot be told apart at the bedside, they are managed together at first. The troponin eventually declares which one the patient has."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "A 65-year-old man with suspected NSTE-ACS has been taking aspirin daily. The ward team follows the guideline loading approach. What should be done about aspirin?", "o": ["Withhold aspirin, because he already takes it every day and is protected", "Give a chewed, nonenteric-coated loading dose despite his daily aspirin", "Give an enteric-coated tablet swallowed whole as the loading step, then continue", "Switch to an anticoagulant in place of aspirin for now", "Give aspirin only after the angiography has been done and the anatomy is known"], "k": 1, "e": "The guideline loads aspirin 162 to 325 mg, chewed and nonenteric coated, even in patients already taking aspirin, then 75 to 100 mg daily. Enteric coating slows absorption, which is the main distractor. Aspirin is not replaced by an anticoagulant."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "A hospitalized man with suspected NSTE-ACS is hypotensive and has an inferior infarct with right ventricular involvement. Which drug class requires particular caution?", "o": ["Aspirin, because it lowers blood pressure", "Statins, because they lower cardiac output", "Oral anticoagulants, because they cause hypotension", "Nitrates, because they lower preload", "Cardiac rehabilitation, because it lowers volume"], "k": 3, "e": "Drugs that lower preload are risky when the patient is hypotensive, has a right ventricular infarct, or has taken a phosphodiesterase inhibitor. Check the blood pressure before giving a nitrate. Aspirin and statins are not affected by these concerns."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "A 60-year-old man with suspected NSTE-ACS has a normal oxygen saturation. What does the chapter say about supplemental oxygen?", "o": ["Give oxygen to every patient with chest pain", "Give oxygen only after the troponin returns", "Give oxygen only if the patient is hypoxemic", "Give high-flow oxygen to prevent infarct extension", "Avoid oxygen under all circumstances"], "k": 2, "e": "The early steps include giving oxygen only if the patient is hypoxemic. Routine oxygen in normoxemic patients is not part of the plan. The threshold itself is left for the reader to verify."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "A 69-year-old woman has NSTE-ACS and is judged to be at low risk. According to the guideline summary as taught in the chapter, which strategy is appropriate?", "o": ["Only an immediate invasive approach, in every such case regardless of risk", "Either a routine or a selective invasive approach, guided by risk", "Discharge without any further evaluation of the coronaries or the risk", "Fibrinolysis as the initial reperfusion strategy", "Only a stress test performed three months later"], "k": 1, "e": "Patients at intermediate or high risk should have an invasive approach with intent to revascularize in the same hospitalization, while low-risk patients can be managed with a routine or a selective invasive approach. Discharge without evaluation or fibrinolysis does not fit NSTE-ACS."}, {"c": 3, "s": "Ch 3, section 3.2 Unstable angina and non-ST-elevation myocardial infarction", "q": "A cardiologist plans percutaneous coronary intervention for a patient with multivessel disease after NSTE-ACS. Which statements match the guideline summaries?", "o": ["Only the culprit lesion should ever be treated, and femoral access is favored", "Medical therapy alone is always preferred", "Complete revascularization is favored, and radial access is favored over femoral access", "Surgery is mandatory for all multivessel disease", "Access site has no preferred route"], "k": 2, "e": "The guideline favors complete revascularization in both STEMI and NSTE-ACS with multivessel disease, and radial access is favored over femoral access. These are interventionalist decisions, but the hospitalist should know them to explain them to patients. The other options reverse or ignore the direction."}, {"c": 3, "s": "Ch 3, section 3.3 ST-elevation myocardial infarction and the first hours", "q": "A 64-year-old man on the ward has crushing chest pain, and the ECG shows ST elevation in contiguous leads. The first troponin has not yet resulted. What is the correct action?", "o": ["Wait for the troponin result before deciding on reperfusion", "Order a stress test for the next day instead", "Give an antacid and repeat the ECG in the morning", "Call the catheterization team or STEMI line now and say 'STEMI'", "Request an outpatient cardiology visit within the week"], "k": 3, "e": "A STEMI is a clinical and ECG diagnosis, and reperfusion should not wait for troponin. The ward role is to start the system and keep a defibrillator in the room. A false alarm costs less than a missed occlusion."}, {"c": 3, "s": "Ch 3, section 3.3 ST-elevation myocardial infarction and the first hours", "q": "In an inferior STEMI, a hospitalist wants additional ECG information. Which lead placement does the chapter say helps?", "o": ["Leads placed on the back only", "Leads placed over the abdomen", "A single lead on the neck", "No additional leads are ever useful", "Right-sided leads"], "k": 4, "e": "Right-sided leads help in inferior infarction, particularly for identifying right ventricular involvement, which also bears on nitrate use. Posterior infarction is also noted as a pattern that behaves like STEMI. The hospitalist should ask for help with difficult tracings."}, {"c": 3, "s": "Ch 3, section 3.3 ST-elevation myocardial infarction and the first hours", "q": "A patient with an acute infarction develops cardiogenic shock with congestion. According to the cardiogenic shock guidance cited in the chapter, which approach is correct?", "o": ["Give large fluid boluses first, then reassess the response much later", "Use routine mechanical support for every patient in shock from the start", "Avoid reflex fluid, treat congestion with loop diuretics, norepinephrine first", "Avoid all vasopressors until the echocardiogram is done and reviewed", "Wait for the morning echocardiogram before acting at all on the shock"], "k": 2, "e": "The guidance teaches that loop diuretics treat congestion, norepinephrine is a reasonable first vasopressor for most hypotensive patients, and routine mechanical support for all is discouraged. Reflex fluid boluses are to be avoided. Centers with advanced support should be contacted early."}, {"c": 3, "s": "Ch 3, section 3.4 Troponin interpretation and type 2 myocardial infarction", "q": "A 70-year-old man with chronic kidney disease has a troponin that is persistently raised and unchanged over serial measurements. He has no symptoms. Which term applies, and what is the implication?", "o": ["Acute type 1 infarction that requires emergency catheterization today", "Laboratory error that should be ignored and not repeated", "Chronic myocardial injury: trend it, and do not treat it as an ACS", "Pericarditis requiring an anti-inflammatory drug right away for the pain", "Type 2 infarction requiring full anticoagulation now regardless of bleeding risk"], "k": 2, "e": "A stable elevation suggests chronic injury, as in kidney disease or heart failure, whereas a rise or fall means an acute process. Infarction requires injury plus evidence of ischemia. Ignoring the value as an error discards real information."}, {"c": 3, "s": "Ch 3, section 3.4 Troponin interpretation and type 2 myocardial infarction", "q": "A 76-year-old woman with sepsis and hypotension has a troponin that rises and falls, with no evidence of plaque rupture and a severe anemia. What is the preferred initial management?", "o": ["Start dual antiplatelet therapy and heparin automatically for the troponin rise", "Treat the driver: restore oxygen delivery and treat sepsis, without routine antithrombotics", "Send her for urgent catheterization without further thought about the underlying cause", "Ignore the troponin value because the patient is septic and unstable", "Start fibrinolytic therapy for a presumed occlusion of a coronary artery"], "k": 1, "e": "Type 2 infarction is an imbalance between oxygen supply and demand, and the cure is usually to fix the cause. Antithrombotic therapy and an invasive strategy are not automatic and can cause harm in a bleeding or postoperative patient. Cardiology input is helpful when type 1 versus type 2 is unclear."}, {"c": 3, "s": "Ch 3, section 3.5 Antithrombotic and secondary-prevention therapy", "q": "An 80-year-old man is admitted with an NSTEMI. His admission LDL looks acceptable, and a resident suggests skipping the statin. What is the correct response?", "o": ["Order a high-intensity statin at admission, whatever the LDL", "Skip the statin, because the LDL is acceptable", "Defer the statin to the first clinic visit", "Give a low-intensity statin only, to avoid side effects in an older patient", "Start the statin only if the LDL exceeds a stated limit"], "k": 0, "e": "High-intensity statin therapy is part of the plan for essentially every patient with an acute coronary syndrome, and it should be started in the hospital. Omitting it because the LDL looks fine is a listed pitfall. Follow-up lipids should be planned."}, {"c": 3, "s": "Ch 3, section 3.5 Antithrombotic and secondary-prevention therapy", "q": "A hospitalist considers extending dual antiplatelet therapy in a patient with a recent gastrointestinal bleed and an upcoming surgery. What is the correct approach?", "o": ["Extend it automatically, because that is the default plan for these patients", "Stop all antiplatelet drugs at once without consultation with cardiology", "Add a third antiplatelet agent to protect the stent", "Continue dual therapy unchanged without any review", "The default changes, and cardiology and the primary team decide together"], "k": 4, "e": "Before extending DAPT, ask about recent bleeding, a bleeding source, and a need for an oral anticoagulant or surgery. If any is yes, the usual default changes. The decision should be shared with cardiology."}, {"c": 3, "s": "Ch 3, section 3.5 Antithrombotic and secondary-prevention therapy", "q": "A hospitalist wants to stop a P2Y12 inhibitor in a patient with a recently placed stent because of an upcoming elective surgery. What is the best step?", "o": ["Stop it immediately, because surgeons always require it before any operation", "Stop it only on the day of surgery, without discussion with anyone", "Switch to a nonsteroidal drug until after surgery", "Continue it indefinitely without any reassessment", "Do not stop it without cardiology advice, as the stent can thrombose"], "k": 4, "e": "A recently placed stent can thrombose when antiplatelet therapy stops early. Aspirin is generally continued and elective surgery is delayed after a stent. The plan requires cardiology advice."}, {"c": 3, "s": "Ch 3, section 3.5 Antithrombotic and secondary-prevention therapy", "q": "A 71-year-old man with a recent NSTEMI is starting dual antiplatelet therapy and has a history of gastrointestinal bleeding. Which addition does the guideline summary recommend?", "o": ["A second anticoagulant", "A nonsteroidal anti-inflammatory drug", "Dual therapy without any gastric protection", "A proton pump inhibitor", "Antacids taken only when symptoms occur"], "k": 3, "e": "The guideline recommends a proton pump inhibitor for patients at risk of gastrointestinal bleeding who are on antiplatelet therapy. Adding an anticoagulant or an anti-inflammatory drug would raise bleeding risk. Which patients count as high risk is left to local protocol."}, {"c": 3, "s": "Ch 3, section 3.7 Stable ischemic heart disease and stress testing decisions", "q": "A 67-year-old man admitted with chest pain has ongoing symptoms at rest, a rising troponin, and ischemic changes on the monitor. A colleague suggests a stress test to clarify the diagnosis. What is the best response?", "o": ["Do not stress test; treat as ACS and call cardiology", "Proceed with exercise testing after a light breakfast", "Choose pharmacologic stress because exercise is risky", "Schedule the stress test for two days from now, once the pain settles", "Cancel all further evaluation until symptoms settle"], "k": 0, "e": "Stress testing an unstable patient can induce infarction or arrhythmia. Ongoing symptoms, a rising troponin, or ischemic changes at rest mean the patient belongs on the acute coronary syndrome pathway. Stress testing is for stable patients when the result will change management."}, {"c": 4, "s": "Ch 4, section Acute decompensated heart failure", "q": "A 62-year-old woman is on day 2 of treatment for decompensated heart failure. She is still congested with warm extremities and a stable blood pressure. Her creatinine has risen slightly since admission. What is the best approach to diuresis?", "o": ["Stop all diuretics until the creatinine returns to the admission value, then restart at a lower intensity", "Give an intravenous fluid bolus to protect the kidneys and pause the diuretic for a day", "Continue decongestion with close monitoring, since a small creatinine rise is often tolerated", "Stop diuresis and discharge her once she feels better", "Hold the diuretic and start a vasodilator infusion instead"], "k": 2, "e": "Congestion itself can worsen kidney function, and a small rise while decongesting a well-perfused patient should not end treatment early. Persistent congestion at discharge predicts readmission and death. Stopping the diuretic or giving fluid would trade a lab number for ongoing congestion; stop and reassess only if she becomes dry, cold or hypotensive."}, {"c": 4, "s": "Ch 4, section Acute decompensated heart failure", "q": "Which statement about natriuretic peptide testing in a patient with acute dyspnea is correct?", "o": ["A high value confirms heart failure regardless of other conditions", "Values are lower than expected with kidney disease and atrial fibrillation", "The test replaces the need for echocardiography when elevated", "A normal value makes heart failure unlikely, but a high value is not specific", "Values rise in obesity, which makes interpretation easier"], "k": 3, "e": "Natriuretic peptides rise with age, kidney disease and atrial fibrillation, and run lower with obesity, so a high value can have many causes. A normal value is the useful result because it argues against heart failure. Even a high value does not remove the need for an echocardiogram to classify ejection fraction and valve disease."}, {"c": 4, "s": "Ch 4, section Guideline-directed therapy started in the hospital", "q": "A 66-year-old man with heart failure with reduced ejection fraction is admitted with congestion. He takes an evidence-based beta-blocker at home. He is warm, his blood pressure is acceptable and he is not in shock. What should be done with the beta-blocker?", "o": ["Continue it in most cases", "Stop it abruptly to avoid hypotension and restart it in clinic", "Replace it with a non-dihydropyridine calcium channel blocker", "Hold it until the creatinine is normal", "Stop it and start an ACE inhibitor and an ARNI together"], "k": 0, "e": "If a patient was on a beta-blocker at home and is not in shock, the usual choice is to continue it. Beta-blockers should not be stopped abruptly unless she is in shock, and they should not be newly started while a patient is cold or hypotensive. Non-dihydropyridine calcium channel blockers are avoided in reduced ejection fraction."}, {"c": 4, "s": "Ch 4, section Guideline-directed therapy started in the hospital", "q": "A 58-year-old woman with heart failure with reduced ejection fraction takes an ACE inhibitor. The team wants to move her to an ARNI. What is the key safety point?", "o": ["Give both for the first week to avoid rebound hypotension and loss of control", "Start the ARNI at the same time as the next scheduled ACE inhibitor dose to avoid a gap", "Potassium monitoring is unnecessary after the switch", "The switch is only safe once she is euvolemic and has been off all diuretics for the whole admission", "The ACE inhibitor and ARNI must not overlap, so a washout window is required"], "k": 4, "e": "The renin-angiotensin system inhibitor pillar includes ARNI, ACE inhibitor or ARB, but an ACE inhibitor must not be combined with an ARNI, and a washout window separates them. Potassium, creatinine and blood pressure still need monitoring, because hypotension, hyperkalemia and kidney injury are the main cautions. The interval itself is not specified here."}, {"c": 4, "s": "Ch 4, section Guideline-directed therapy started in the hospital", "q": "A 70-year-old man with diabetes and heart failure with reduced ejection fraction takes an SGLT2 inhibitor. He is admitted with vomiting and poor oral intake. Which complication should you look for?", "o": ["Hyperkalemic arrhythmia from the drug", "Euglycemic ketoacidosis", "Angioedema of the airway", "Digoxin-type toxicity", "Serotonin syndrome"], "k": 1, "e": "Cautions for the SGLT2 inhibitor pillar include genital infection, volume depletion and euglycemic ketoacidosis, and ketones should be checked when the patient is ill. The drug also needs a hold around surgery and attention to sick-day rules. Hyperkalemia and angioedema belong to the mineralocorticoid antagonist and renin-angiotensin pillars, not this one."}, {"c": 4, "s": "Ch 4, section Guideline-directed therapy started in the hospital", "q": "A 71-year-old man with a cold, mottled appearance, low urine output and low blood pressure has heart failure and is going to the ICU in cardiogenic shock. Which statement about vasoactive support matches the ACC 2025 teaching?", "o": ["Phenylephrine should be the sole first-line infusion", "Vasopressin is the preferred initial agent", "Norepinephrine is a reasonable first choice for most hypotensive patients", "Mechanical support should be started routinely in every patient", "Dobutamine has been shown to be better than milrinone"], "k": 2, "e": "The ACC 2025 cardiogenic shock document teaches norepinephrine as a reasonable first choice, discourages phenylephrine as the only first-line infusion, and does not make vasopressin the initial agent. It also discourages routine mechanical support for everyone and does not show dobutamine to be better than milrinone. Congestion is treated with loop diuretics."}, {"c": 4, "s": "Ch 4, section Acute decompensated heart failure", "q": "A 74-year-old woman has been on continuous telemetry on a medical floor for five days after a heart failure admission. The original reason has resolved, and no one has written a stop plan. What is the best action?", "o": ["Continue it until discharge by default, because stopping it needs a separate order", "Continue it indefinitely because heart failure patients always need continuous monitoring for the rest of the stay", "Keep it only while she sleeps", "Discontinue telemetry, since it should be started for a reason and stopped when the reason ends", "Replace it with hourly vital signs and a repeat chest film to confirm stability"], "k": 3, "e": "The Society of Hospital Medicine's Choosing Wisely list advises against continuous telemetry outside the ICU unless there is a protocol for stopping it. Telemetry has costs as well as benefits. The principle is to start it for a documented reason and stop it when that reason ends."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "A 69-year-old man with decompensated heart failure and a reduced ejection fraction has atrial fibrillation with a fast rate. He is stable. Which rate-control choice is least appropriate?", "o": ["Treating the underlying infection or volume problem first", "Intravenous diltiazem", "Intravenous magnesium as a low-risk adjunct", "Amiodarone if he becomes critically ill", "Digoxin, which acts more slowly"], "k": 1, "e": "Non-dihydropyridine calcium channel blockers are avoided when the ejection fraction is reduced or heart failure is decompensated. Treating the trigger comes first, amiodarone suits critically ill patients, digoxin is slower, and IV magnesium is a low-risk adjunct."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "A 28-year-old man has a very fast, irregular, wide-complex rhythm consistent with atrial fibrillation with pre-excitation. He is stable. What is the best approach?", "o": ["Give intravenous diltiazem for rate control", "Give intravenous digoxin", "Give a beta-blocker and observe", "Start oral rate control and discharge", "Avoid AV nodal blocking drugs and call cardiology"], "k": 4, "e": "Pre-excitation with AF presents as a wide, irregular, very fast rhythm, and AV nodal blockers should be avoided because they can speed conduction over the accessory pathway. Cardiology should be called. An unstable patient would instead need synchronized cardioversion."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "A 76-year-old woman develops new atrial fibrillation with hypotension and acute pulmonary edema. What is the most appropriate management?", "o": ["Synchronized cardioversion with ICU and anesthesia support", "Oral rate control and observation", "Start an oral anticoagulant and wait for the rate to settle", "Delay until a full echocardiogram is completed", "Give a nodal blocking drug and repeat it until the rate falls"], "k": 0, "e": "Hypotension, shock, acute pulmonary edema, ongoing ischemia or altered consciousness due to the rhythm means the patient is unstable, and the answer is synchronized cardioversion. The rest of the workup follows. Drug rate control is for stable patients with rapid ventricular response."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "An 80-year-old woman with atrial fibrillation has a high stroke risk and a high bleeding score. Her blood pressure is poorly controlled and she takes daily aspirin. What is the best approach?", "o": ["Withhold anticoagulation because the bleeding score is high and her blood pressure is poorly controlled", "Use aspirin alone in place of anticoagulation", "Stop all antithrombotic drugs for several months until the blood pressure is controlled", "Address fixable bleeding risks and still use anticoagulation based on her stroke risk", "Choose anticoagulation only if her AF is persistent rather than paroxysmal"], "k": 3, "e": "Bleeding scores such as HAS-BLED discriminate poorly and are used to find fixable risks, not to withhold anticoagulation. Uncontrolled hypertension, alcohol, anemia and antiplatelet drugs are reversible contributors. Anticoagulation follows thromboembolic risk, not the AF pattern."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "A 74-year-old man on a factor Xa inhibitor has a life-threatening gastrointestinal bleed. Which reversal option is currently available in the United States?", "o": ["Andexanet alfa, the specific factor Xa inhibitor antidote", "Idarucizumab, the specific antidote for dabigatran", "Prothrombin complex concentrate, off label", "Protamine sulfate, the reversal agent for heparin", "Vitamin K alone, given as the sole reversal agent"], "k": 2, "e": "Andexanet alfa was withdrawn from the US market on 22 December 2025, leaving prothrombin complex concentrate as the current off-label option for factor Xa inhibitors. Idarucizumab is the specific antidote for dabigatran, not for factor Xa inhibitors."}, {"c": 4, "s": "Ch 4, section Atrial fibrillation", "q": "A 72-year-old woman has stable atrial fibrillation of uncertain duration and is not anticoagulated. A colleague wants to cardiovert her today. What is the best advice?", "o": ["Cardiovert now, because she is stable and the symptoms are mild", "Ask cardiology about timing, imaging and anticoagulation first, since atrial clot may dislodge", "Cardiovert only if the heart rate is below a set value, since clot risk is unrelated to timing", "Give aspirin and proceed", "Cardiovert after stopping all rate-control drugs so the true rhythm can be seen first"], "k": 1, "e": "Cardioversion can dislodge a clot from the atrium. Unless the patient is unstable, the timing, imaging and anticoagulation should be settled with cardiology before cardioverting a rhythm of uncertain or longer duration. Stability alone does not make it safe."}, {"c": 4, "s": "Ch 4, section Supraventricular and ventricular arrhythmias", "q": "A 65-year-old woman on ondansetron and a fluoroquinolone develops polymorphic ventricular tachycardia with a long QT interval on the monitor. Which plan is best?", "o": ["Give an additional antiarrhythmic that prolongs the QT interval to suppress the ventricular rhythm", "Give a calcium channel blocker for presumed SVT because the rhythm looks fast and regular", "Observe without changing medications", "Start a beta-blocker infusion and continue the antibiotic while watching the monitor closely", "Remove QT-prolonging drugs, correct potassium and give magnesium, with defibrillation if unstable"], "k": 4, "e": "Polymorphic ventricular tachycardia with a long QT is torsades de pointes. The first steps are magnesium, removal of QT-prolonging drugs and correction of potassium. Unstable or pulseless patients need defibrillation. Adding another QT-prolonging drug would make it worse."}, {"c": 4, "s": "Ch 4, section Supraventricular and ventricular arrhythmias", "q": "A 34-year-old man has a stable, regular, narrow-complex tachycardia that converts after vagal maneuvers and adenosine given per protocol. What should follow?", "o": ["Discharge immediately without an ECG because the episode resolved with treatment", "Start an anticoagulant for presumed atrial fibrillation and arrange a delayed echocardiogram", "A full ECG in sinus rhythm to look for pre-excitation, and electrophysiology referral if episodes recur", "Give a calcium channel blocker prophylactically and stop monitoring since the rhythm has now converted fully", "Perform immediate synchronized cardioversion for safety even though the rhythm has converted"], "k": 2, "e": "After conversion, a full ECG in sinus rhythm looks for pre-excitation, and cardiology is called if the rhythm continues. Patients with recurrent episodes should have outpatient electrophysiology referral planned. Cardioversion is for unstable patients."}, {"c": 4, "s": "Ch 4, section Bradycardia, heart block, and pacemaker decisions", "q": "A 68-year-old man on a beta-blocker has a monitor strip showing second-degree AV block type 1. He is asymptomatic and his blood pressure is normal. What is the best approach?", "o": ["Review nodal-blocking drugs and monitor", "Place a transvenous temporary pacing wire now", "Arrange urgent permanent pacemaker implantation", "Start an atropine infusion", "Give a second nodal blocker to slow conduction further"], "k": 0, "e": "Type 1 second-degree block usually arises in the AV node and is often benign, so the direction is to review the drugs and monitor. It differs from type 2 and complete block, which arise below the node and can progress without warning."}, {"c": 4, "s": "Ch 4, section Bradycardia, heart block, and pacemaker decisions", "q": "A 52-year-old woman with a pacemaker develops fever, and blood cultures grow bacteria. The generator pocket is red and tender. What should be done?", "o": ["Treat as a superficial skin infection with a topical or oral antibiotic and observe at home without cultures", "Order an MRI of the chest as the first step and defer cultures until the result is back", "Remove nothing and avoid any specialist input until the fever has settled on its own", "Draw blood cultures before antibiotics if stable, examine the pocket, and call cardiology and infectious diseases", "Wait for the fever to resolve before drawing cultures, then decide on the antibiotic choice"], "k": 3, "e": "Fever with bacteremia in a patient with a device raises concern for device infection or lead endocarditis. Blood cultures before antibiotics when stable, a pocket examination and early cardiology and infectious diseases input are the steps. Device removal may be needed. MRI in a patient with a device also needs a compatible system and protocol."}, {"c": 4, "s": "Ch 4, section Bradycardia, heart block, and pacemaker decisions", "q": "A 70-year-old man with an acute inferior myocardial infarction develops AV block that is symptomatic but stable. What is the best expectation and plan?", "o": ["Implant a permanent pacemaker the same day because symptomatic block always needs a device", "Start a high-dose beta-blocker", "Ignore the rhythm because inferior infarctions never cause block and the monitor will alarm if needed", "Stop monitoring after the first strip", "Treat the infarction and observe, since the block is often transient and resolves with reperfusion"], "k": 4, "e": "In an inferior infarction, expect a transient block that often resolves with reperfusion. A reversible cause should be treated and the rhythm observed before a permanent device is implanted. The patient should remain on telemetry in a monitored bed."}, {"c": 4, "s": "Ch 4, section Syncope risk stratification", "q": "Which of the following events is best classified as true syncope?", "o": ["A loss of consciousness from profound hypoglycemia that corrects only after glucose is given", "Unresponsiveness lasting a long time after a head injury, with slow and incomplete recovery", "A brief faint with rapid onset after standing in a hot room, then full spontaneous recovery", "A prolonged episode of reduced responsiveness caused by intoxication", "Loss of consciousness from a stroke with a persistent deficit after the event"], "k": 2, "e": "Syncope is a brief transient loss of consciousness from global cerebral hypoperfusion with rapid onset, short duration and spontaneous full recovery. Seizure, hypoglycemia, intoxication, stroke and head injury are not syncope, though they can look like it at first."}, {"c": 4, "s": "Ch 4, section Syncope risk stratification", "q": "A 44-year-old woman faints after standing in a warm crowded room, with nausea and lightheadedness beforehand. She recovers quickly, has a normal exam, and a colleague proposes a head CT as the whole workup. What is the best plan?", "o": ["Order head CT and carotid imaging for everyone, because brain imaging is the core of any syncope evaluation", "Start with history, ECG, orthostatic pressures and medication review; image only for injury or focal signs", "Order tilt testing before an ECG, since the tilt result decides every later step", "Discharge without an ECG once the orthostatic pressures are normal", "Admit for echocardiography only, without history or ECG, to look for structural disease"], "k": 1, "e": "Details matter more than tests in syncope, and an ECG is advised for everyone. Brain and carotid imaging in routine syncope have a low yield. Imaging is added only for injury or focal neurologic signs."}, {"c": 4, "s": "Ch 4, section Cardiac devices and the hospitalized patient", "q": "A 79-year-old man with an ICD and advanced illness chooses comfort-focused care. What is the best plan regarding the device?", "o": ["Discuss deactivating shocks with the device team and patient or surrogate before he is actively dying", "Leave shocks on regardless of his wishes, because the device cannot be changed in hospital", "Remove the generator at the bedside", "Wait until after death to discuss it", "Ask nursing staff to place a magnet at the bedside without any discussion with the patient, surrogate or device team"], "k": 0, "e": "A patient with an ICD who chooses comfort-focused care can have shock therapies turned off. The conversation should occur with the device team and the patient or surrogate before he is actively dying, not after."}, {"c": 5, "s": "Ch 5, section Valvular heart disease", "q": "A 58-year-old man with a ruptured mitral chord develops sudden pulmonary edema and poor perfusion. The chest film shows a normal-sized heart, and the murmur is soft. Which approach should be avoided?", "o": ["Afterload reduction when pressure allows", "Inotropic support in a monitored setting", "Early surgical referral", "Giving drugs that slow the heart rate", "Urgent echocardiography"], "k": 3, "e": "Acute severe regurgitation hits a ventricle that has had no time to adapt, so it presents with pulmonary edema or shock and a surprisingly soft murmur. Slowing the heart rate is harmful, especially in acute aortic regurgitation where bradycardia and high afterload are poorly tolerated. Echocardiography and early cardiology and cardiac surgery input are the first actions."}, {"c": 5, "s": "Ch 5, section Valvular heart disease", "q": "A 44-year-old woman with mitral stenosis is admitted with pneumonia and develops a fast heart rate with new dyspnea. Which approach fits the physiology?", "o": ["Rate control and trigger treatment, avoiding sudden fluid loading", "Large fluid boluses to treat the tachycardia and restore the ventricular filling pressure", "A strong vasodilator to unload the ventricle and lower the pressure behind the valve", "Allow the fast rate to continue since it improves filling and keeps the ventricle full", "Give no rate-slowing therapy and no anticoagulation review until the infection has cleared"], "k": 0, "e": "In mitral stenosis, fast rates shorten diastolic filling time and are poorly tolerated, and sudden fluid loading is also risky. The usual help is rate control, treatment of the trigger and anticoagulation decisions. Atrial fibrillation changes how stenotic lesions behave."}, {"c": 5, "s": "Ch 5, section Valvular heart disease", "q": "A 55-year-old man has a mechanical heart valve and needs long-term anticoagulation. Which statement is correct?", "o": ["Any newer oral anticoagulant is equivalent to warfarin, so the choice rests on convenience", "No anticoagulation is needed after the first month because the valve surface becomes inert", "Aspirin alone is the standard", "Anticoagulation can be stopped for any procedure without a bridging or restart plan", "Warfarin remains the standard agent, and newer oral anticoagulants are not a substitute"], "k": 4, "e": "Warfarin remains the standard agent for mechanical valves. Premature discontinuation of an oral anticoagulant is itself a labeled risk for thrombotic events, so any interruption needs a specialist plan."}, {"c": 5, "s": "Ch 5, section Valvular heart disease", "q": "A 63-year-old man with a mechanical aortic valve on warfarin is bleeding heavily. The team asks whether to give a reversal agent. What is the best approach?", "o": ["Reverse immediately without discussion, since heavy bleeding always outweighs the risk of valve thrombosis or stroke", "Make a joint decision among the bleeding team, cardiology and pharmacy, because reversal carries thromboembolic risk", "Never reverse under any circumstances, because the valve thrombosis risk is always greater", "Leave the decision to nursing staff", "Reverse and then stop all anticoagulation permanently to prevent any further bleeding"], "k": 1, "e": "Reversal agents carry a boxed warning for thromboembolic complications, which matters especially in a patient with a mechanical valve. The decision to reverse is therefore a joint one among the bleeding team, cardiology and pharmacy."}, {"c": 5, "s": "Ch 5, section Valvular heart disease", "q": "Which patient is most clearly in the group for whom antibiotic prophylaxis before certain dental procedures is reserved?", "o": ["A pat
