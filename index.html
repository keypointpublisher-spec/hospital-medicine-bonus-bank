}, {"c": 19, "s": "Ch 19, section Managing cardiac medications around surgery", "q": "On postoperative day 1, a 64-year-old man whose antiplatelet drugs were stopped before surgery for a recent stent develops chest pain, new ST changes, and low blood pressure. What is the best first action?", "o": ["Reassure him that postoperative pain is expected, give an opioid, and recheck him at the next scheduled morning rounds", "Start a proton pump inhibitor and reassess in the morning, since this is probably acid reflux", "Order an outpatient stress test", "Give a large fluid bolus and take no other action until the next set of vital signs is recorded", "Call cardiology and the rapid response team, get an electrocardiogram and troponin, and restart antiplatelets as cardiology directs"], "k": 4, "e": "This picture suggests stent thrombosis after antiplatelet interruption, which is an emergency. Immediate cardiology involvement and restarting antiplatelet therapy are central. Attributing the pain to the incision delays treatment."}, {"c": 19, "s": "Ch 19, section Perioperative myocardial injury and atrial fibrillation", "q": "A 75-year-old woman has a raised troponin on the first day after a bowel resection. She has no chest pain. Which question should be asked first?", "o": ["Is the troponin value the same as her preoperative value from another hospital?", "Does she have symptoms or electrocardiogram changes of ischemia?", "Can the troponin be ignored because pain is masked by analgesia?", "Would the surgeon prefer to wait until discharge?", "Can antiplatelet therapy be stopped to prevent bleeding?"], "k": 1, "e": "The first step is to look for ischemic symptoms or electrocardiogram changes, which would call for treatment as an acute coronary syndrome and cardiology input. Only then do you search for nonischemic causes such as sepsis, anemia, and hypotension. Absence of pain does not mean absence of injury."}, {"c": 19, "s": "Ch 19, section Perioperative myocardial injury and atrial fibrillation", "q": "A 77-year-old man has a raised troponin on postoperative day 2 with a hemoglobin that has fallen, a heart rate of 120, and no ST changes. Which statement best describes the usual mechanism and approach?", "o": ["It is almost always a plaque rupture and needs urgent anticoagulation and a stent in every case, whatever the hemoglobin", "It is a laboratory artifact and needs no action, even when the hemoglobin has fallen", "It is a sign of pulmonary hypertension alone, so the right heart should be imaged first", "Supply and demand mismatch is usual, so the cause such as anemia or tachycardia is treated, not the artery", "It always requires immediate coronary angiography, whatever the hemoglobin and heart rate show"], "k": 3, "e": "Type 2 myocardial infarction from supply and demand mismatch is the usual postoperative form. Treating anemia, tachycardia, hypoxemia, hypotension, and pain addresses the cause. Antithrombotic therapy must be weighed against surgical bleeding with the surgeon and cardiology."}, {"c": 19, "s": "Ch 19, section Perioperative myocardial injury and atrial fibrillation", "q": "On postoperative day 3 a 68-year-old man develops atrial fibrillation with low blood pressure, ischemic chest pain, and altered mental status. What is the best management?", "o": ["Start slow oral rate control and reassess tomorrow", "Observe because new atrial fibrillation after surgery is transient and usually settles by itself", "Begin long-term anticoagulation and discharge", "Treat as unstable: call for help and prepare for urgent cardioversion", "Stop all fluids"], "k": 3, "e": "Hypotension, ischemic pain, pulmonary edema, or altered mental status make the arrhythmia unstable and call for urgent cardioversion. Triggers are corrected in parallel. Rate control alone is for stable patients."}, {"c": 19, "s": "Ch 19, section Perioperative myocardial injury and atrial fibrillation", "q": "A 79-year-old woman had a brief episode of atrial fibrillation after surgery that converted to sinus rhythm by morning. What should the discharge plan include?", "o": ["Nothing, since the rhythm was transient and has already converted", "A rhythm check after discharge and a documented anticoagulation decision", "Lifelong anticoagulation started automatically without weighing bleeding risk", "Stopping her beta-blocker to prevent recurrence", "Repeat surgery"], "k": 1, "e": "New atrial fibrillation after surgery warrants follow up and an anticoagulation decision. It often recurs, so dismissing it as transient is an error. The decision weighs thromboembolic risk against surgical bleeding."}, {"c": 19, "s": "Ch 19, section Pulmonary risk and postoperative pulmonary complications", "q": "A 62-year-old man is recovering from upper abdominal surgery. Which single measure is most effective for preventing pulmonary complications?", "o": ["Lung expansion with early walking and adequate pain control", "Routine chest radiographs every day, whether or not he has symptoms or signs", "Prolonged bed rest to protect the incision and reduce pain", "Routine nasogastric tube placement for every upper abdominal case", "Maximal sedation so he breathes slowly and rests comfortably"], "k": 0, "e": "Lung expansion maneuvers, early mobilization, and pain control that allows deep breathing and coughing reopen and protect the lung. Out of bed and walking is the best single measure. Nasogastric tubes and sedation add risk."}, {"c": 19, "s": "Ch 19, section Pulmonary risk and postoperative pulmonary complications", "q": "A 57-year-old man with known severe obstructive sleep apnea is recovering from abdominal surgery. Which plan is best?", "o": ["Use positive airway pressure at night only, since daytime naps carry no added risk for him", "Give a benzodiazepine for sleep and watch oxygen saturation, since sleep helps recovery after surgery", "Remove the device to allow cough", "Rely on pulse oximetry alone and stop other monitoring, because oxygen saturation shows ventilation well enough", "Continuous positive airway pressure whenever he sleeps, with minimized opioids and sedatives and ventilation monitoring"], "k": 4, "e": "Patients with sleep apnea should use positive airway pressure whenever they sleep, including daytime naps. Sedatives and opioids should be minimized, and ventilation should be monitored in high risk patients, not just saturation. Benzodiazepines add respiratory risk."}, {"c": 19, "s": "Ch 19, section Pulmonary risk and postoperative pulmonary complications", "q": "A postoperative nurse reports that a 72-year-old patient has a falling oxygen saturation and asks to increase the oxygen. What is the best approach?", "o": ["Raise the oxygen and leave the cause in place, since the saturation is the only problem", "Order a repeat troponin only and wait for the result before any examination", "Check respiratory rate and consciousness, examine the chest, and treat the cause such as atelectasis or oversedation", "Discontinue all monitoring once oxygen is increased, because the saturation will then be normal", "Give an additional opioid dose to reduce distress, since the breathlessness is probably from anxiety and not from the lungs"], "k": 2, "e": "Turning up oxygen without finding the cause leaves the problem in place. Respiratory rate and consciousness are checked first because sedation is often the problem. The fix may be mobilization, reducing sedatives, a diuretic, or escalation of care."}, {"c": 19, "s": "Ch 19, section Anesthesia considerations hospitalists should know", "q": "A 70-year-old woman on an enoxaparin prophylaxis regimen is scheduled for a procedure involving spinal anesthesia. What should the hospitalist tell the anesthesiologist?", "o": ["Only the name of the surgeon", "Every anticoagulant she takes, with the time of the last dose", "Nothing, as anticoagulants do not affect neuraxial anesthesia", "Only the dose of the antiplatelet drug", "That the anticoagulant was held, whether or not it was"], "k": 1, "e": "Enoxaparin carries a boxed warning for spinal or epidural hematoma with neuraxial anesthesia. The anesthesiologist needs each anticoagulant and the exact time of the last dose to set timing. After the procedure, new back pain, leg weakness, or bladder change is an emergency."}, {"c": 19, "s": "Ch 19, section Anesthesia considerations hospitalists should know", "q": "During induction a 40-year-old woman has sudden hypotension, high airway pressure, and a fall in oxygen saturation without hives after receiving several drugs. What is first line treatment?", "o": ["Diphenhydramine alone", "An oral corticosteroid", "Observation until the surgery ends", "Epinephrine", "A benzodiazepine"], "k": 3, "e": "Anaphylaxis during anesthesia may present as hypotension, bronchospasm, or desaturation rather than hives. Epinephrine is the first line treatment, and help should be called. Antihistamines and steroids are not substitutes."}, {"c": 19, "s": "Ch 19, section Anesthesia considerations hospitalists should know", "q": "A 73-year-old man takes prednisone daily and is about to have major surgery. A resident wants a morning cortisol level to decide whether stress cover is needed. What is the best response?", "o": ["Do not order it: routine testing is not advised on supraphysiologic doses, and stress-dose cover applies to major stress", "Order the level and withhold any steroid cover until the result returns, even if the pressure falls", "Give oral prednisone only, at the usual daily dose, with no added cover during or after the operation", "Order an adrenal stimulation test the day before and decide from the result, delaying surgery if needed", "Give no steroid and rely on a vasopressor if the pressure falls"], "k": 0, "e": "The guideline recommends against routine testing in people on supraphysiologic doses. Recent users under moderate or major stress should receive parenteral stress-dose cover. Waiting for tests delays treatment that is simple to give."}, {"c": 19, "s": "Ch 19, section Postoperative fever, hypotension, and delirium", "q": "A 66-year-old man has falling blood pressure on postoperative day 1 after abdominal vascular surgery. His drain output is bloody and his hemoglobin is falling. What is the best next step?", "o": ["Order a chest radiograph first and wait for the report before starting any treatment at the bedside", "Start a sedative and observe him until the next scheduled vital signs", "Call the surgeon to the bedside and start fluid or blood, since he is likely bleeding", "Wait for the next set of morning labs before making any change", "Give a diuretic and restrict fluid until the pressure recovers"], "k": 2, "e": "Hypovolemia from bleeding is the first cause to consider, and bloody drain output with falling hemoglobin supports it. A bleeding patient needs the surgeon at the bedside, not another test. Fluids or blood and control of the bleeding are the first steps."}, {"c": 19, "s": "Ch 19, section Postoperative fever, hypotension, and delirium", "q": "An 82-year-old woman is delirious on postoperative day 2 after taking an over the counter sleep aid containing a first-generation antihistamine. What is the best action?", "o": ["Continue the antihistamine because it is mild and sold without a prescription, and see how she does", "Add a second sedating drug at night to settle the agitation and restore sleep", "Start a cholinesterase inhibitor today, since it prevents delirium in older adults", "Give a benzodiazepine as the first treatment, since it calms the patient quickly", "Stop the antihistamine, since it is best avoided in older adults at risk of delirium, and look for other causes"], "k": 4, "e": "Guidance advises avoiding first-generation antihistamines and multiple anticholinergic drugs in older adults with delirium or at risk. Benzodiazepines are not first line except in alcohol or benzodiazepine withdrawal. Cholinesterase inhibitors should not be newly started perioperatively."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A 71-year-old woman on a DOAC for atrial fibrillation needs elective surgery in a week. Before writing a stop date, which set of questions is best?", "o": ["What is her preferred pharmacy and does she have a ride home after the procedure", "Whether the surgeon will accept any bleeding at all and whether she is fasting since the night before", "What her last INR was and whether she takes aspirin", "How many days the drug was taken and which brand was dispensed by the pharmacy", "Why is she anticoagulated, how bleeding prone is the procedure, and which drug and kidney clearance"], "k": 4, "e": "The plan depends on clot risk, the bleeding risk of the operation, and the specific drug with renal clearance. Writing these answers in the note helps prevent the patient arriving still anticoagulated or going home without a restart date. An INR is not the relevant measure for a DOAC."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A 75-year-old man on warfarin for atrial fibrillation is scheduled for a pacemaker implant. Which approach matches the CHEST 2022 position?", "o": ["Stop warfarin for a week and bridge with heparin until the day of the procedure", "Continue the vitamin K antagonist and confirm the INR is not supratherapeutic on the day", "Switch to a DOAC the day before, since it is easier to manage around a device implant and needs no INR", "Give high dose vitamin K the night before so the INR is certain to be normal", "Bridge only if the INR is therapeutic, after stopping warfarin in advance"], "k": 1, "e": "CHEST 2022 recommends continuing the vitamin K antagonist for pacemaker or defibrillator implant, with a strong recommendation. The INR is checked on the day to be sure it is not supratherapeutic. Bridging adds bleeding without proven benefit."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "Which statement about direct oral anticoagulants around surgery is supported by both CHEST 2022 and the PAUSE cohort?", "o": ["They are bridged with low molecular weight heparin when stopped, as with warfarin", "They are restarted immediately after any surgery", "They are stopped for the same interval regardless of procedure or kidney function", "They are not bridged, and restart is staged by the bleeding risk of the operation", "They are routinely reversed before elective surgery"], "k": 3, "e": "Both sources agree that DOACs are not bridged and that restart depends on the bleeding risk of the operation, later after high risk procedures. PAUSE was a prospective cohort, not a randomized trial. Reversal is a rescue for urgent surgery, not a plan."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A small 80-year-old woman has a creatinine that looks normal and takes dabigatran before an elective operation. What is the most important step when setting the stop date?", "o": ["Calculate creatinine clearance, because dabigatran is the most kidney dependent DOAC", "Rely on the creatinine value alone, since it is reported as normal", "Use the same interval as for apixaban, since all of the DOACs are cleared by the kidney in the same way", "Skip the interval and give heparin bridging until the day of surgery", "Stop the drug on the morning of surgery, whatever her clearance"], "k": 0, "e": "A normal creatinine does not mean normal clearance in a small older woman. Dabigatran depends most on the kidney, so the interval grows as clearance falls. Pharmacy can help confirm the interval."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A patient on warfarin is scheduled for surgery and the hospital protocol sets the stop date. What additional step does the chapter advise?", "o": ["Assume the INR is normal if warfarin was stopped", "Give oral vitamin K to every patient regardless of protocol or the INR result", "Check an INR before surgery rather than assuming it has fallen", "Bridge all patients", "Skip testing if the surgery is elective"], "k": 2, "e": "The hold interval should follow the hospital protocol, and the INR is measured before surgery. Vitamin K is given only according to that protocol. Assuming the INR has fallen leads to patients reaching the operating room anticoagulated."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A 67-year-old man on rivaroxaban will have spinal anesthesia. What is the hospitalist's role in the neuraxial plan?", "o": ["Set the neuraxial catheter intervals independently of the anesthesiologist", "Tell the anesthesiologist that DOACs have no neuraxial risk once the dose is held", "Restart the drug on the day of the block regardless of the plan or the catheter timing", "Give the anesthesiologist the drug, the last dose time, and the creatinine clearance", "Avoid mentioning the drug to prevent delays in the operating room schedule"], "k": 3, "e": "The labels for several anticoagulants carry boxed warnings for spinal or epidural hematoma with neuraxial anesthesia. The intervals are set by anesthesiology and the current guideline. The hospitalist supplies the key facts."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "A 73-year-old man with a recent coronary stent is scheduled for elective surgery on dual antiplatelet therapy. What is the safest approach?", "o": ["Do not stop dual antiplatelet therapy before calling the stent cardiologist", "Stop both drugs a week before to prevent bleeding, whatever the date of the stent", "Stop the aspirin and continue the P2Y12 inhibitor without discussion with the surgical team", "Continue all therapy and notify no one on the surgical or anesthesia teams", "Replace both with a DOAC"], "k": 0, "e": "Stopping antiplatelet therapy early after a stent risks stent thrombosis. The surgeon and cardiologist agree on timing and whether the stent is old enough for elective surgery. Aspirin is usually continued."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "The surgical team wrote a clear plan to stop a patient's anticoagulant but did not give any restart instruction. Which bailout best prevents harm?", "o": ["Assume the patient will restart it at home from the written instructions", "Let the patient decide when to restart it based on how the wound feels", "Put the restart in the order set, confirm it with the surgeon, and list it at discharge", "Delay all anticoagulation indefinitely until the next clinic visit is booked by the surgical office", "Restart it at once on the day of surgery regardless of bleeding or the surgeon's plan"], "k": 2, "e": "Every held anticoagulant needs a stop date, an earliest restart time, and an owner who confirms hemostasis. High bleeding risk procedures restart later. Omitting the restart is a common error."}, {"c": 20, "s": "Ch 20, section Anticoagulation bridging and interruption", "q": "Which statement about the American Society of Hematology 2018 recommendations for general medical patients is most accurate?", "o": ["They recommend DOACs for in-hospital prophylaxis in all patients regardless of bleeding risk", "They recommend extended prophylaxis after every discharge for all medical patients", "They apply directly to patients undergoing joint replacement without any adjustment", "They recommend no prophylaxis for any medical patient, including those with immobility", "They favor low molecular weight heparin, not a DOAC, in hospital, and do not apply to joint replacement"], "k": 4, "e": "These recommendations concern medical patients, favoring pharmacologic prophylaxis when bleeding risk is acceptable and mechanical prophylaxis when it is not. They do not recommend DOACs in hospital or extension after discharge. Orthopedic patients need a plan from the surgical context."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 62-year-old man with diabetes has an A1C above the preoperative goal for an elective operation. What does the 2026 ADA text advise?", "o": ["Cancel all elective operations for any elevated A1C until it is normal again", "Do not postpone surgery on A1C alone, but discuss timing for elective cases", "Postpone urgent operations until the A1C is controlled to the usual target", "Ignore the A1C and the glucose range once the operation is under way", "Start steroids to lower the A1C before the operation"], "k": 1, "e": "The 2026 text sets a goal for elective surgery but advises against postponing on A1C alone. An elevated A1C is a reason to talk with the surgeon about timing for elective cases, and it is not a reason to delay an urgent operation."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 58-year-old man with type 2 diabetes has not been eating after surgery and is receiving only sliding scale correction insulin. What is the best change?", "o": ["Continue sliding scale alone and increase the scale as glucose rises", "Stop all insulin", "Add basal insulin, because correction insulin alone is discouraged", "Switch to an oral sulfonylurea", "Add only prandial insulin"], "k": 2, "e": "The 2024 ADA text prefers basal, or basal plus correction, for non-critically ill patients with poor oral intake, and discourages correction insulin alone. The Beers criteria also warn that sliding scale insulin alone carries more hypoglycemia without better control in older adults."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 70-year-old woman is started on morning prednisone and develops afternoon and evening hyperglycemia with normal fasting values. Which approach fits?", "o": ["Use intermediate-acting insulin timed to the steroid, check glucose before meals and at bedtime, and reduce it with the taper", "Use only long-acting insulin at bedtime and keep the dose constant throughout the steroid course and the taper", "Stop checking glucose in the evening, since the high readings after the morning dose will pass", "Keep the high insulin dose after the steroid ends, since the glucose will stay high for several weeks", "Add a sulfonylurea at bedtime to cover the evening rise in glucose"], "k": 0, "e": "Glucocorticoids raise glucose mainly in the afternoon and evening after a morning dose, with little overnight effect. Insulin doses right at the peak of the steroid will cause hypoglycemia when the steroid stops, so the dose is reduced with the taper."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 66-year-old diabetic woman is alert and can swallow, and her glucose is below 70 mg/dL. What is the first treatment?", "o": ["A long-acting basal insulin dose to prevent a further fall", "Intramuscular glucagon in every case, even when she can swallow safely", "Observation with no recheck of the glucose until the next scheduled check", "A high protein meal only, since protein raises glucose most quickly", "Fast-acting carbohydrate by mouth, then recheck in 15 minutes"], "k": 4, "e": "A patient who can swallow is treated with 15 g of fast-acting carbohydrate and rechecked every 15 minutes until the glucose is above 70 mg/dL. Intravenous glucose or glucagon is for patients who cannot swallow. The regimen is reviewed after any severe episode."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 64-year-old man who stopped a long course of prednisone has refractory hypotension, vomiting, and low glucose on postoperative day 1. What is the best step?", "o": ["Wait for a morning cortisol before treating, since the diagnosis must be proven", "Give oral prednisone alone, since he is already familiar with it", "Withhold steroids and use only vasopressors until the blood pressure recovers", "Give parenteral glucocorticoid and fluids without waiting for a cortisol", "Order a pituitary MRI first and treat once the result is known"], "k": 3, "e": "Suspected adrenal crisis in a postoperative patient is treated with parenteral glucocorticoid and fluids at once. The 2024 guideline recommends against routine testing in people on supraphysiologic doses. Waiting delays life-saving treatment."}, {"c": 20, "s": "Ch 20, section Diabetes and steroid management around surgery", "q": "A 45-year-old woman with hyperthyroidism needs an elective operation. Which approach is best?", "o": ["Proceed immediately and treat the thyroid later, since the operation is elective", "Make her euthyroid with antithyroid drug pretreatment before surgery", "Give no antithyroid drug and rely on anesthesia to blunt the thyroid response", "Start thyroid hormone replacement to raise her levels before surgery", "Cancel the operation permanently"], "k": 1, "e": "A hyperthyroid patient needing elective surgery should be made euthyroid first, with a strong recommendation of low certainty. Thyroid storm is a postoperative emergency to recognize."}, {"c": 20, "s": "Ch 20, section Perioperative kidney injury", "q": "A patient with a risk of kidney injury needs contrast for a study. According to KDIGO 2012, which approach is supported?", "o": ["Iso-osmolar or low-osmolar contrast with intravenous isotonic saline or bicarbonate, and no prophylactic dialysis", "High-osmolar contrast with a diuretic given before the study to protect the kidneys", "Prophylactic dialysis after contrast, started on the day of the study to clear the dye", "Withholding all needed contrast studies in every patient at risk of kidney injury, whatever the clinical need", "Colloid volume expansion alone, with no change in the contrast agent used"], "k": 0, "e": "KDIGO 2012 suggests iso-osmolar or low-osmolar agents and volume expansion with isotonic saline or bicarbonate, and advises against prophylactic dialysis. The draft 2026 update is not final. A needed study should not be withheld."}, {"c": 20, "s": "Ch 20, section Perioperative kidney injury", "q": "A 63-year-old woman has low urine output on postoperative day 1 after pelvic surgery, with suprapubic discomfort and new agitation. What should be done before ordering anything else?", "o": ["Start a nephrology consult and a renal biopsy before checking the catheter", "Give a loop diuretic to make urine", "Begin renal replacement therapy", "Scan the bladder, and flush or replace the catheter, recording the volume", "Give a large fluid bolus without examination of the abdomen or the catheter"], "k": 3, "e": "Postrenal obstruction from retention or a blocked catheter is a common, cheap to diagnose cause of postoperative oliguria. A bladder scan is the cheapest test in the evaluation. Treating it as intrinsic injury with fluids or consults misses the problem."}, {"c": 20, "s": "Ch 20, section Neurologic complications and stroke risk", "q": "A 69-year-old man develops new facial droop and speech change on postoperative day 2 after vascular surgery. Which approach is best?", "o": ["Attribute it to residual anesthesia and observe until the symptoms clear by themselves", "Give a sedative and recheck his speech after he has slept", "Treat as stroke until imaging says otherwise, check glucose and last-known-well time, and call neurology", "Wait until the next morning for a neurology consult, since the symptoms are mild", "Start thrombolysis immediately without imaging, glucose check, or consulting anyone"], "k": 2, "e": "Any new focal finding is treated as a stroke until imaging and a stroke team say otherwise. Recent major surgery is a concern for thrombolysis, and the decision is made with the stroke team and the surgeon together."}, {"c": 20, "s": "Ch 20, section Postoperative infections and surgical site care", "q": "A 72-year-old man with an old urinary catheter has a positive urine culture but no fever, no suprapubic pain, and no other symptoms. What is the best approach?", "o": ["Treat with broad spectrum antibiotics for 14 days", "Leave the catheter and repeat the culture daily", "Start antifungal therapy", "Treat the culture result because it is above the surveillance threshold used by the laboratory", "Remove or replace the catheter and treat only if symptoms or signs develop"], "k": 4, "e": "NHSN criteria are for surveillance, not a bedside treatment rule. Treat the ill patient with a catheter, not the culture in an asymptomatic patient. The catheter should be removed when no longer needed."}, {"c": 20, "s": "Ch 20, section Postoperative infections and surgical site care", "q": "A 59-year-old man has diarrhea after antibiotics and a confirmed first episode of Clostridioides difficile infection. According to the 2021 IDSA and SHEA update, which drug choice is suggested?", "o": ["Metronidazole alone as first-line therapy for this episode", "Fidaxomicin is suggested, though vancomycin is acceptable", "Loperamide alone to stop the diarrhea quickly", "Bezlotoxumab alone, given in place of any antibiotic", "Oral vancomycin is contraindicated in this infection"], "k": 1, "e": "The 2021 update suggests fidaxomicin over standard vancomycin for an initial episode, a conditional recommendation, with vancomycin acceptable. For recurrent disease, fidaxomicin is also suggested, and bezlotoxumab carries a caution for heart failure."}, {"c": 21, "s": "Ch 21, section Principles of co-management and defining roles", "q": "A surgeon asks a hospitalist one specific question: is it safe to start a new drug in a surgical patient? The surgeon will write all orders. Which model fits?", "o": ["Co-management, in which each team writes orders in its own domain and shares the decisions", "Consultation, in which the primary team writes orders and the hospitalist advises", "Primary medical service, in which the hospitalist is attending", "Transfer of care with no surgical follow up", "Shared charting with no ownership of orders"], "k": 1, "e": "In the consultation model the primary team owns orders, and the consultant answers a single question. The risk is that advice is read but not followed. Co-management and primary medical service involve more shared or transferred ownership."}, {"c": 21, "s": "Ch 21, section Principles of co-management and defining roles", "q": "A patient is ready for discharge after co-management by medicine and orthopedics, and the two teams disagree about a drug. What is the best approach?", "o": ["Let each team send its own medication list, since each team knows best which drugs it started and why", "Ask the patient to choose which of the lists to follow once she is home", "Discharge now and settle it at the clinic visit after the patient goes home", "Resolve the disagreement before discharge, so the medication list is one document with one author", "Remove the drug from both lists to avoid any confusion for the patient"], "k": 3, "e": "A discharge medication list should be a single document with one author. Conflicting lists create errors. A discharge checklist also includes follow up, medication reconciliation, and teach-back."}, {"c": 21, "s": "Ch 21, section Principles of co-management and defining roles", "q": "A hospitalist writes a consult note recommending a change in a trauma patient's plan but does not call the trauma team. What does the chapter advise?", "o": ["Speak to the primary team directly, because a note alone is not communication", "Rely on the note, since it is in the chart and the team will read it when it suits them", "Page the trauma team only if the patient dies or leaves the unit", "Send the family the plan first and let them tell the team", "Communicate only at discharge, in the summary sent to the clinic"], "k": 0, "e": "The chapter advises speaking to the primary team on the first day and when the plan changes. Recommendations should be numbered, mark who orders each, and include an escalation trigger and a daily joint check."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A sedated 50-year-old trauma patient reports new localized pain in the forearm on hospital day 2. What is the best response?", "o": ["Attribute it to the earlier injury and increase the opioid dose at the next scheduled round", "Wait until discharge and mention it in the clinic", "Obtain only a urinalysis and a complete blood count", "Tell the patient to rest the arm and wait to see how it settles", "Report it to the trauma team and ask for imaging, not assume a musculoskeletal cause"], "k": 4, "e": "Pain, sedation, and intubation can hide injuries, which is why a tertiary survey is done after the first day. New localized pain should be reported with a request for imaging. Assuming it is minor risks a missed injury."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 40-year-old man with a head and spine injury has a high risk of clots and also a high risk of bleeding. What is the best approach to prophylaxis?", "o": ["Start full dose anticoagulation on day one, since clot risk outweighs bleeding risk", "Give no prophylaxis for the entire stay, since bleeding risk rules out every measure", "Use mechanical prophylaxis until bleeding risk allows drugs, timing the first dose with trauma and neurosurgery", "Start a DOAC at once, since oral drugs are the safest choice after an injury to the brain or spine", "Leave the decision to the nurse on duty once the patient is stable"], "k": 2, "e": "The timing of the first prophylactic dose after head, spine, solid organ, or pelvic injury is decided jointly. Mechanical prophylaxis is used in the meantime. The team should ask daily whether imaging is stable and prophylaxis can start."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A hospitalist prescribes opioids for a trauma inpatient. Which statement about the CDC 2022 opioid guideline is accurate?", "o": ["It provides an official inpatient equianalgesic table for all drugs", "It prohibits all inpatient opioid use, including for acute trauma pain or surgery", "It does not cover inpatient care but does cover prescribing at discharge", "It applies only to patients who are breastfeeding or pregnant", "It mandates benzodiazepines with opioids for all patients"], "k": 2, "e": "The guideline states it does not apply to hospitalized patients, and no official inpatient equianalgesic table exists in the sources read. Use a multimodal plan, the lowest effective dose, and avoid benzodiazepine combinations where possible."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 38-year-old woman after pituitary surgery has a falling sodium, volume loss, and natriuresis. A resident proposes fluid restriction. What is the main concern?", "o": ["Fluid restriction is always correct for a low sodium, whatever the volume status and urine findings", "Fluid restriction is correct for diabetes insipidus, because the urine is too dilute", "Volume status does not matter when the cause of the low sodium is known", "Urine studies are unnecessary because the sodium value alone points to the cause", "Fluid restriction harms cerebral salt wasting, because the treatments for the three sodium disorders are opposite"], "k": 4, "e": "SIADH, cerebral salt wasting, and diabetes insipidus differ in volume status and urine output. Volume loss with natriuresis suggests cerebral salt wasting, where restriction worsens the volume deficit. Identify the type before treating."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 55-year-old man after subarachnoid hemorrhage has a new low sodium. According to the chapter, what is the first laboratory step in the work-up?", "o": ["Serum cortisol in all cases", "Urine osmolality, interpreted with urine sodium and the volume exam", "A brain biopsy", "Repeat sodium after fluid restriction without any urine studies or volume exam", "Serum amylase"], "k": 1, "e": "Urine osmolality comes first. A low value points to excess water, while a higher value is interpreted with urine sodium and the volume examination. Correction must not overshoot, and nephrology and neurosurgery should be called together."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 62-year-old man with traumatic brain injury and cerebral edema needs intravenous fluids. Which statement is best?", "o": ["Hypotonic fluids are preferred in brain injury because they lower the pressure", "Fluid choice does not matter", "Plain water is the best resuscitation fluid for a patient with brain swelling", "Avoid hypotonic fluids in patients with brain injury and cerebral edema", "Only dextrose in water should be used, to avoid any sodium load"], "k": 3, "e": "Hypotonic fluids can worsen cerebral edema. Fluid choice in brain injury is deliberate, and saline is preferred over balanced fluid when needed in traumatic brain injury per the sepsis guideline."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 52-year-old woman with a brain tumor started dexamethasone and now has high glucose. Which plan is best?", "o": ["Time insulin to the steroid, check glucose before meals and at bedtime, and expect need to fall with the taper", "Stop all glucose checks, since the rise from dexamethasone is brief and harmless", "Use a fixed insulin dose that never changes, even as the steroid dose is lowered", "Treat with insulin only at the time of discharge, once the steroid course is finished and the tumor is treated", "Hold the steroid to avoid hyperglycemia, even though the tumor swelling needs it"], "k": 0, "e": "Dexamethasone raises glucose often more than expected. Insulin should follow the steroid's effect and be reduced with the taper, otherwise hypoglycemia can follow. Adrenal suppression after a prolonged course is another consideration."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 66-year-old non-bleeding medical inpatient on the neurosurgical service has no gastrointestinal bleeding risk factors. What does the Society of Hospital Medicine Choosing Wisely list advise about acid suppression?", "o": ["Avoid stress ulcer prophylaxis in medical inpatients unless the bleeding risk is high", "Give a proton pump inhibitor to every inpatient to prevent any ulcer", "Give an acid suppressant to all patients on steroids, whatever their other risk or illness", "Stress ulcer prophylaxis is required after neurosurgery in every patient", "Use it for convenience whenever the patient asks"], "k": 0, "e": "The list advises against stress ulcer prophylaxis for medical inpatients unless the risk of gastrointestinal bleeding is high. Add protection only when risk factors are present."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 48-year-old patient hospitalized with cancer-associated venous thromboembolism asks about treatment. Which statement matches ASH 2021 as summarized in the chapter?", "o": ["It favors unfractionated heparin over low molecular weight heparin for initial treatment in all patients", "It favors no prophylaxis in hospitalized cancer patients, whatever their bleeding risk", "It favors a DOAC over low molecular weight heparin for longer treatment and prophylaxis over none in hospitalized patients", "It favors warfarin alone for all cases", "It states that a DOAC is never acceptable"], "k": 2, "e": "The summary favors low molecular weight heparin over unfractionated heparin for initial treatment, accepts either a DOAC or low molecular weight heparin, favors a DOAC for the longer period, and favors prophylaxis in hospitalized patients. Tumor bleeding risk and interactions change the choice."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A 64-year-old man with prostate cancer has new back pain, leg weakness, and urinary retention. What is the best next step?", "o": ["Prescribe analgesics and discharge with outpatient follow up in clinic", "Treat as constipation with a laxative and reassess after a bowel movement", "Order outpatient imaging next week, since the pain is probably from the bone metastasis", "Reassure and observe for a day to see whether the weakness progresses", "Arrange emergency spine imaging and call oncology, radiation oncology, and neurosurgery"], "k": 4, "e": "New back pain with leg weakness or bladder changes in a cancer patient suggests spinal cord compression. This is an emergency requiring prompt imaging and specialty involvement. Delay can cost permanent function."}, {"c": 21, "s": "Ch 21, section Co-managing trauma, neurosurgical, and oncology patients", "q": "A hospitalist is asked about hospice eligibility for a patient with advanced cancer. Which statement is accurate?", "o": ["Hospice requires a prognosis of two years or less if the illness runs its normal course, with written certification", "The certification rule requires a prognosis of six months or less if the illness runs its normal course", "Hospice requires that the patient have no symptoms that need ongoing treatment", "Hospice certification needs no documentation from the physician at any stage", "Hospice requires a prognosis of one week or less if the illness runs its normal course"], "k": 1, "e": "The rule requires a prognosis of six months or less if the illness runs its normal course, with written certification and a narrative of clinical findings. Goals of care should be raised early with oncology and palliative care."}, {"c": 21, "s": "Ch 21, section Medical illness in pregnancy", "q": "A 29-year-old woman at 28 weeks of pregnancy has a creatinine that the laboratory reports as normal. What is the correct interpretation?", "o": ["A normal value is always reassuring, since the laboratory range applies in pregnancy", "Creatinine rises throughout pregnancy, so a high value is expected and needs no review or baseline", "Pregnancy does not affect kidney function, so the usual laboratory range applies", "A value in the usual range may be abnormal in pregnancy because filtration rises, so compare with a baseline", "Creatinine is unreliable and should never be measured in pregnant patients"], "k": 3, "e": "Glomerular filtration rises in pregnancy and creatinine falls. A value that looks normal may signal kidney dysfunction. The chapter lists this as a common pitfall."}, {"c": 21, "s": "Ch 21, section Medical illness in pregnancy", "q": "A 31-year-old woman in the second trimester has a respiratory rate of 26 and an arterial carbon dioxide that looks normal. What is the main concern?", "o": ["It is normal and reassuring, since the rate is only mildly raised and carbon dioxide is in range", "A normal carbon dioxide may signal impending respiratory failure, since mild respiratory alkalosis is expected", "Carbon dioxide rises in pregnancy, so a normal value shows good ventilation", "Respiratory rate is unreliable in pregnancy, so only the carbon dioxide counts", "Carbon dioxide should not be measured in pregnancy because the result is misleading"], "k": 1, "e": "Minute ventilation rises and carbon dioxide falls in pregnancy, so a mild respiratory alkalosis is normal. A carbon dioxide in the nonpregnant normal range may mean the patient is tiring."}, {"c": 21, "s": "Ch 21, section Medical illness in pregnancy", "q": "A resident wants to apply the ASH 2020 venous thromboembolism treatment recommendations, which prefer a DOAC over a vitamin K antagonist, to a pregnant patient with a pulmonary embolism. What is the best response?", "o": ["Apply them without change, since a clot is treated the same way in every patient", "Use them only in the first trimester, when the fetus is most vulnerable", "Use a DOAC in all pregnant patients, since the guideline prefers oral drugs", "Ignore anticoagulation entirely until after the delivery has taken place", "Do not apply them, since they concern the general population and not pregnancy"], "k": 4, "e": "The ASH 2020 treatment recommendations in the ledger concern the general population and should not be applied to pregnancy. D-dimer also rises in normal pregnancy, so diagnosis relies on clinical assessment and imaging chosen with radiology."}, {"c": 21, "s": "Ch 21, section Medication safety in pregnancy and lactation", "q": "A breastfeeding woman needs a new antihypertensive. What is the best approach?", "o": ["Check a lactation reference and ask pharmacy, without stopping breastfeeding for no reason", "Tell her to stop breastfeeding for all medicines, because any drug in the milk harms the infant", "Assume every drug is safe, since little of any drug reaches the milk", "Avoid treating the hypertension until she has finished breastfeeding", "Discard her milk for a week with every drug, then resume feeding"], "k": 0, "e": "Most drugs pass into milk in small amounts and are compatible with breastfeeding. Each should be checked in a lactation reference, and a woman should not be told to stop breastfeeding without a reason."}, {"c": 21, "s": "Ch 21, section Postpartum complications seen by medicine", "q": "A 33-year-old woman is on postpartum day 4 with a headache, high blood pressure, and visual changes. What is the best first action?", "o": ["Attribute it to post-dural puncture and send her home with oral analgesia", "Give only an analgesic and discharge, since headache is common after delivery", "Measure blood pressure, call obstetrics, and treat as postpartum preeclampsia", "Order only a headache diary and review it at the postpartum visit", "Delay the work-up until the outpatient visit, since symptoms are common"], "k": 2, "e": "Preeclampsia can first appear after delivery. Headache, visual change, right upper quadrant pain, or dyspnea needs a blood pressure measurement and a preeclampsia work-up. A woman with a headache and high blood pressure should not be discharged without an obstetric opinion."}, {"c": 21, "s": "Ch 21, section Postpartum complications seen by medicine", "q": "A 30-year-old woman discharged on her pregnancy insulin dose after delivery becomes shaky and diaphoretic at home. What principle explains this risk?", "o": ["Insulin requirement rises sharply after delivery, so the dose should be increased at once", "Insulin resistance is unchanged by delivery, so the pregnancy dose still fits her", "Postpartum patients cannot develop hypoglycemia while on a pregnancy dose", "Insulin need falls rapidly after delivery, so a pregnancy dose can cause hypoglycemia", "Pregnancy doses are always too low after delivery, so more insulin is needed"], "k": 3, "e": "After delivery of the placenta insulin resistance drops, so the requirement falls quickly. A woman discharged on a pregnancy dose is at risk of hypoglycemia, and the dose should be adjusted before discharge."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "An 86-year-old man on hospital day 3 for pneumonia is drowsy, slow to answer, and eating little. A nurse suggests he is depressed. What is the best next step?", "o": ["Start an antidepressant and reassess his mood once the pneumonia has cleared", "Reassure the family that quiet, withdrawn behavior is a normal part of recovery", "Screen for delirium and look for infection, retention, and drugs", "Order a sedative to restore his sleep and wake cycle overnight on the ward", "Defer any assessment until he is more alert"], "k": 2, "e": "Hypoactive delirium is quiet, is often called depression or tiredness, and is commonly missed, so it needs active screening and a search for causes. Starting an antidepressant treats a label rather than the acute brain failure and delays finding the cause. Adding a sedative would likely deepen the problem."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "An 80-year-old woman with dementia, admitted for a urinary infection, becomes confused every evening. Staff chart it as sundowning and plan no further evaluation. What is the best response?", "o": ["Accept sundowning as an expected part of her dementia and simply monitor her", "Start a nightly antipsychotic to prevent the evening confusion from recurring", "Wait for discharge, since familiar home surroundings will settle her", "Order a head scan before any other evaluation is considered", "Give a sedative at dusk each evening to protect her sleep"], "k": 0, "e": "Evening confusion in a hospitalized older adult is delirium until shown otherwise, and labeling it a feature of dementia stops the search for a reversible cause. A family-reported baseline and scheduled screening let you spot a change. A nightly antipsychotic is not prevention and adds risk."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "Which bedside check tests attention directly and can be used whatever delirium screening tool the hospital has chosen?", "o": ["Asking the patient to state her date of birth", "Asking the patient to name the hospital she is in", "Asking the patient to describe her home", "Asking the patient to recall three objects after five minutes", "Asking the patient to say the months of the year backward"], "k": 4, "e": "A quick attention check such as naming the months or days backward is useful with any tool, because an inattentive patient fails it even when she looks alert. Orientation and memory questions probe other domains and can be passed or failed for other reasons. The key question is always whether the finding is new or worse than baseline."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "A critical care team wants validated tools for regular delirium assessment in its ICU. Which pair does the SCCM PADIS guideline name?", "o": ["Braden scale and Morse scale", "CAM-ICU and ICDSC", "Padua score and IMPROVE score", "CIWA and COWS", "Beers criteria and STOPP criteria"], "k": 1, "e": "PADIS names the CAM-ICU and the ICDSC as validated tools for regular delirium assessment in the ICU. The other pairs are real instruments, but they address pressure injury and falls risk, VTE risk, withdrawal severity, and medication appropriateness, not delirium."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "A resident says all major sources agree on antipsychotics for treating established delirium. Which statement best corrects this?", "o": ["Both sources recommend scheduled antipsychotics for every delirious patient on the ward, starting at admission", "PADIS 2025 strongly recommends them for established delirium, while the AGS statement forbids all use of them", "The AGS statement recommends them to prevent delirium, and the PADIS update agrees with that advice for ICU patients", "The AGS statement allows narrow use for severe, harmful agitation, while PADIS 2025 gave no recommendation", "Both sources recommend benzodiazepines instead as the first-line treatment of delirium"], "k": 3, "e": "The sources differ: the AGS postoperative statement permits an antipsychotic only for severe, harmful agitation after behavioral measures fail, at the lowest dose for the shortest time, while the 2025 PADIS update gave no recommendation either way. The 2018 PADIS position against was replaced by this neutral one. No source supports routine use or prophylaxis."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "A pharmacist asks how the PADIS position on melatonin for ICU patients changed between 2018 and 2025. Which statement is correct?", "o": ["It moved from no recommendation to a conditional suggestion for melatonin", "It moved from suggesting melatonin to suggesting against it for ICU patients", "It moved from a strong recommendation to no recommendation", "It stayed a suggestion against melatonin in both versions", "It moved from suggesting melatonin to making no recommendation on its use"], "k": 0, "e": "PADIS 2018 made no recommendation on melatonin, and the 2025 update suggested it over none, as a conditional recommendation with low certainty. The other options reverse or invent the change. Because the 2025 status is provisional in the sources, wording should be checked against primary text."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "Which pair of elements belongs to the ICU ABCDEF bundle?", "o": ["Routine antipsychotic prophylaxis and bright light therapy", "Deep sedation by default and strict bed rest", "Scheduled benzodiazepine sedation and physical restraints", "Awakening and breathing trials, and family engagement", "Statin and ketamine prophylaxis against delirium"], "k": 3, "e": "The bundle covers pain assessment, awakening and breathing trials, choice of analgesia and sedation, delirium assessment, early mobility, and family engagement. The wrong options describe practices that the bundle and PADIS argue against, including deep sedation, restraints, and drug prophylaxis for delirium."}, {"c": 22, "s": "Ch 22, section 22.1 Delirium: prevention, recognition, and treatment", "q": "An 83-year-old woman becomes newly delirious on hospital day 4. Her urine culture is positive, but she has no urinary symptoms and is afebrile. Her bladder scan, bowel history, pain, oxygen saturation, and medication list have not yet been reviewed. What is the best approach?", "o": ["Treat the urine culture alone and reassess the delirium after a few days", "Work through the full cause list before blaming the urine culture", "Attribute the delirium to the positive culture and stop the search", "Start an antipsychotic because the positive culture explains the delirium", "Order a sedative and defer other checks until morning"], "k": 1, "e": "The cause table says to treat the infection source but not a urine culture alone. Retention, constipation, pain, hypoxia, and drugs are common, treatable causes that are easy to skip. Anchoring on a culture without symptoms risks missing them."}, {"c": 22, "s": "Ch 22, section 22.2 Falls and injury prevention", "q": "An 82-year-old man is found on the floor next to his bed. What is the best first action?", "o": ["Lift him back into bed first and then examine him in comfort once he is settled", "Complete the incident report before anyone touches him so the scene is documented", "Sit him in a chair to see whether he can bear weight", "Check only his glucose and skip the physical examination if it is normal", "Examine him where he lies for head injury, neck or hip pain, and neurologic change"], "k": 4, "e": "A fall is a clinical event, so the patient is examined before being moved, looking for head injury, cervical spine pain, hip pain, a shortened or rotated leg, and new neurologic signs. Moving him first risks worsening an unrecognized injury. Glucose, orthostatic vital signs, rhythm, drugs, and delirium are checked afterward to learn why he fell."}, {"c": 22, "s": "Ch 22, section 22.2 Falls and injury prevention", "q": "A unit places a yellow wristband on every patient flagged as a high fall risk, yet falls continue. Which change best addresses the problem?", "o": ["Add a second wristband color for patients who have already fallen more than once on the unit", "Place bed alarms on every flagged patient and keep them in bed to prevent any falls", "For each flagged patient, write interventions matched to the cause of risk and name who does them", "Move all flagged patients to rooms nearest the nursing station so staff can watch them", "Replace the wristband with a larger sign above each bed so every staff member sees it"], "k": 2, "e": "A band or sign only flags risk; it does not act on it. Prevention works when each finding leads to a specific, owned action, such as a toileting plan or an orthostatic blood pressure. Keeping patients in bed trades fall risk for deconditioning."}, {"c": 22, "s": "Ch 22, section 22.3 Hazards of immobility and bed rest", "q": "Which activity order best protects an older patient's function?", "o": ["Bed rest until physical therapy has evaluated her and clears her for any activity", "Activity as tolerated, with no helper named for her walking or transfers", "Strict bed rest with a bedside commode for toileting", "Out of bed to chair for meals, walk with a named helper, reassess daily", "Stay in bed with the bed alarm on until discharge planning begins"], "k": 3, "e": "Activity orders should state a goal, name who helps, list only the real safety limits, and be reassessed daily. A generic order of activity as tolerated with no help often means no activity. Bed rest has side effects in every organ system."}, {"c": 22, "s": "Ch 22, section 22.3 Hazards of immobility and bed rest", "q": "A stable, deconditioned older patient on a general ward has had continuous telemetry for four days with no stop date and no ongoing indication. What does the Society of Hospital Medicine Choosing Wisely list suggest?", "o": ["Avoid telemetry outside the ICU without a stopping protocol, so discontinue it", "Continue telemetry until discharge in case a dangerous arrhythmia appears later", "Add a bed alarm to improve safety while she remains on monitoring", "Convert to telemetry only at night to limit the tether during the day", "Keep telemetry because stopping it requires a cardiology consult first"], "k": 0, "e": "The list names continuous telemetry outside the ICU without a stopping protocol as a practice to avoid, partly because it adds tethers and alarms that limit walking. A tether with no current reason should be crossed off at the morning huddle. A bed alarm adds another barrier to mobility."}, {"c": 22, "s": "Ch 22, section 22.4 Pressure injury and skin integrity", "q": "Which positioning advice helps limit shear in a bed-bound patient at risk of pressure injury?", "o": ["Keep the head of the bed fully upright for comfort", "Rest the heels directly on the mattress", "Keep the head of the bed as low as is safe", "Massage firmly over any reddened bony area", "Keep the patient in one position to avoid disturbing sleep"], "k": 2, "e": "Sitting up increases shear, so the head of the bed should be as low as is safe. The heels should be floated off the bed, and the patient should be moved and offloaded rather than left in one position. Pressure relief and mobility are the foundation of prevention."}, {"c": 22, "s": "Ch 22, section 22.4 Pressure injury and skin integrity", "q": "On the morning skin check, a diabetic patient with a hip fracture has a persistent deep maroon discoloration of intact skin over the heel, and the heel feels warm. What is the best next step?", "o": ["Reassure the family that the discoloration will fade by itself with time", "Elevate the head of the bed to relieve pressure at the heel and reduce redness", "Document it as minor redness and recheck it at the next weekly skin round", "Wait for the skin to break down before involving wound care or the dietitian", "Consult wound care and assess perfusion, nutrition, and infection while offloading"], "k": 4, "e": "A deep tissue injury, like any new stage 3 or 4 injury, should prompt a wound care consult and a careful look at perfusion, nutrition, and infection. In a diabetic patient who cannot report symptoms, a heel injury can deepen into infection or worse. Waiting for the skin to open loses the chance to limit damage."}, {"c": 22, "s": "Ch 22, section 22.4 Pressure injury and skin integrity", "q": "On admission, a nurse finds a pressure injury over an older patient's sacrum that developed before arrival. What is the best approach to documentation?", "o": ["Wait 48 hours to see if it progresses before writing anything down", "Document it in the admission examination as present on arrival", "Document it only if it gets worse during the hospital stay", "Leave it out of the admission note to avoid assigning blame", "Record it at discharge in the summary for the next clinician"], "k": 1, "e": "Injuries present on arrival need to be documented on admission, which protects both the patient and the hospital by showing the starting point. Delaying documentation blurs whether the injury is hospital acquired. A full skin examination on admission and daily is part of prevention."}, {"c": 22, "s": "Ch 22, section 22.5 Polypharmacy and deprescribing", "q": "A 79-year-old woman with type 2 diabetes is admitted, and her only insulin order is a sliding scale. According to the Beers 2023 statement, which is correct?", "o": ["All insulin should be avoided in every adult over 65 years of age, whatever the regimen", "Sliding-scale insulin alone is best avoided, but the warning does not cover regimens with basal insulin", "Sliding-scale insulin alone is the preferred regimen in older adults because it lowers hypoglycemia risk", "The warning applies equally to regimens that include a basal insulin and to correction doses alone", "Only basal insulin should be avoided in older adults, and correction doses are preferred instead"], "k": 1, "e": "Beers advises avoiding sliding-scale insulin alone because it carries higher hypoglycemia risk without better control. The caution does not extend to regimens that include a basal insulin. The statement is a screen, not a ban on insulin."}, {"c": 22, "s": "Ch 22, section 22.5 Polypharmacy and deprescribing", "q": "A 78-year-old man takes a nightly benzodiazepine at home and is admitted with a painful fracture. The team plans to add an opioid. Which approach best fits the Beers criteria?", "o": ["Add the opioid and a second sedative for sleep so that he rests through the night", "Add the opioid and give both at bedtime so that they work together overnight", "Avoid combining them, start scheduled nonopioid analgesia, and reassess the benzodiazepine", "Stop the benzodiazepine abruptly with no review and start the opioid at once", "Add the opioid, since combining the two reduces the dose needed of each drug"], "k": 2, "e": "Beers advises avoiding opioids combined with benzodiazepines, and avoiding three or more central nervous system-active drugs together, because of cumulative sedation and falls. Pain is better treated with scheduled nonopioid drugs where possible. Adding more sedatives is the opposite of the advice."}, {"c": 22, "s": "Ch 22, section 22.5 Polypharmacy and deprescribing", "q": "A sleeping pill was started on admission for a 74-year-old patient who goes home tomorrow. What is the best way to prevent it from becoming a long-term drug?", "o": ["Write the indication and a stop or review date in the order and summary", "Continue it silently and let the primary clinician discover it after discharge", "Stop it on the day of discharge without telling anyone about the change", "Prescribe a long supply so the patient is not left without it at home", "List it in the summary without an indication or a plan to stop it"], "k": 0, "e": "Drugs started in the hospital often go home by habit when no one writes a stop plan. Each new drug should carry its indication and a stop or review date, and the discharge summary should explain what was started or stopped. Stopping silently leaves the next clinician unable to tell what happened."}, {"c": 22, "s": "Ch 22, section 22.6 Functional decline and the geriatric inpatient", "q": "A clinician is discussing goals of care with an 86-year-old frail patient who has advanced illness. Which statement about POLST is correct?", "o": ["It is meant for every adult regardless of current health status or prognosis", "It is meant only for patients in the last days of life, not for chronic illness", "It is meant only for patients admitted to the ICU or those on a ventilator", "It replaces the need for any goals-of-care conversation with the patient's family", "It is for people with serious illness or advanced frailty; advance directives are for all adults"], "k": 4, "e": "A goals conversation may lead to a POLST, which is aimed at people with serious illness or advanced frailty, while advance directives are for all adults. It does not replace the conversation itself. The source row is partial and gives no prognosis criterion."}, {"c": 22, "s": "Ch 22, section 22.6 Functional decline and the geriatric inpatient", "q": "A previously independent 82-year-old is deconditioned after a long stay and the team proposes facility placement 'for safety'. What is the best plan?", "o": ["Discharge her home alone with no therapy arranged", "Leave all mobility work to the receiving facility to decide", "Attribute the decline to aging and accept it as expected", "Set a function goal, plan therapy, and hand off a mobility plan", "Keep her in bed until she regains her strength"], "k": 3, "e": "Decline after a hospital stay often comes from bed rest, delirium, and tethers rather than the illness, so it can respond to therapy. A facility stay can extend the lost function if nobody is working on mobility there. The first questions should be which of those causes can be reversed."}, {"c": 23, "s": "Ch 23, section 23.1 Central line-associated bloodstream infection", "q": "A 66-year-old man has a central line that was placed for intravenous antibiotics that could also be given peripherally. He now has fever and rigors. What is the best approach?", "o": ["Wait until NHSN surveillance criteria are met before starting any clinical work-up of the fever", "Treat it as a presumed bloodstream infection, get cultures, and decide the same day on the line", "Give an antipyretic and keep the line for continued access to the veins", "Assume the fever is from the underlying illness unless a commensal grows in culture", "Send only a urine culture and review the results in the morning with the day team"], "k": 1, "e": "Fever or rigors in a patient with a central line is a bloodstream infection until shown otherwise, and the plan has two parts: treat the patient and decide what to do with the line. Surveillance definitions are for reporting, not for deciding when to act. A line with no remaining purpose is a source you can remove."}, {"c": 23, "s": "Ch 23, section 23.1 Central line-associated bloodstream infection", "q": "A 70-year-old woman with a central line has a fever but is hemodynamically stable. Which culture approach is best?", "o": ["Start antimicrobials first and draw the cultures later in the day once stable", "Culture only the peripheral site after antimicrobials have begun, to avoid contamination", "Culture only the line tip after the line has been removed from the patient", "Draw line and peripheral cultures before antimicrobials, unless this delays care", "Skip cultures and treat empirically by the local protocol for line infections"], "k": 3, "e": "Cultures are drawn before antimicrobials, including from the line and a peripheral site, when this does not delay treatment. If the patient is in shock, treatment starts at once and does not wait for results. Starting drugs first can sterilize cultures and reduce their value."}, {"c": 23, "s": "Ch 23, section 23.1 Central line-associated bloodstream infection", "q": "A 74-year-old patient with a central line, afebrile and without chills or hypotension, has one blood culture bottle growing a common skin commensal. Does this meet the NHSN laboratory-confirmed bloodstream infection definition?", "o": ["No, a commensal needs two or more specimens plus fever, chills, or hypotension", "Yes, because any organism found in blood counts when a central line is present", "Yes, simply because a central line is currently in place", "No, because common skin commensals can never count toward the surveillance definition", "Yes, but only if the line is a peripherally inserted catheter rather than another type"], "k": 0, "e": "A recognized pathogen can count on its own, but a common skin commensal counts only when it appears in two or more specimens together with fever, chills, or hypotension. A single bottle in an asymptomatic patient does not qualify. This is a surveillance rule that does not decide bedside care."}, {"c": 23, "s": "Ch 23, section 23.1 Central line-associated bloodstream infection", "q": "A team places a peripherally inserted central catheter for convenience in a patient who could receive therapy through peripheral access. A nurse asks whether it counts as a central line for infection prevention. What is the correct answer?", "o": ["No, it is a peripheral device and needs no daily review of its necessity", "No, only tunneled catheters count as central lines for review purposes", "Yes, but only after it has been in place for seven days or longer", "Yes, but daily review applies only to ventilated patients in the ICU", "Yes, it is a central line, so the daily question of need applies"], "k": 4, "e": "A PICC placed for convenience is still a central line and carries the same infection risk. The first prevention question is whether the patient still needs the line, asked and documented every day. The line should come out when it is not needed."}, {"c": 23, "s": "Ch 23, section 23.1 Central line-associated bloodstream infection", "q": "Which statement best describes when to remove a central line in a patient with a suspected line infection?", "o": ["Always keep it in place to preserve access during the whole course of treatment", "Remove it only after two separate positive cultures have returned from different sites", "Remove it if the patient is septic, the site is purulent, or the organism demands it", "Remove it only when the exit site shows redness or tenderness at the skin", "Leave the decision about the line to infection prevention alone without bedside input"], "k": 2, "e": "Septic physiology, a purulent site, or an organism that usually requires removal are reasons to take the line out, and a line with no purpose should go regardless. Keeping it by default preserves a source of infection. Infection prevention supports the team, but the treating clinicians decide about the line."}, {"c": 23, "s": "Ch 23, section 23.2 Catheter-associated urinary tract infection", "q": "A 69-year-old man with an indwelling urinary catheter has fever and suprapubic tenderness. How should urine be obtained for culture?", "o": ["From the drainage bag, since it holds the most urine", "From the old catheter after flushing it with saline", "From a freshly placed catheter or a fresh voided sample", "From the old drainage port after irrigating the bladder with saline", "From a swab of the urethral meatus sent with the sample"], "k": 2, "e": "A specimen should come from a new catheter or a fresh voided sample, not from the old bag, because the old system is colonized and misleads. Replacing or removing the catheter is also part of treating a suspected catheter-related infection. Routine irrigation or flushing is not advised."}, {"c": 23, "s": "Ch 23, section 23.2 Catheter-associated urinary tract infection", "q": "A nurse reports cloudy, foul-smelling urine in the drainage bag of a 77-year-old man. He is afebrile, comfortable, and has no new confusion. What is the best response?", "o": ["Start empiric antibiotics for a presumed urinary infection based on the urine appearance", "Send a culture from the bag and treat whatever organism it grows", "Irrigate the bladder to clear the cloudy urine and reduce the odor", "Swab the meatus and continue the catheter unchanged for now", "Treat symptoms and signs, not color or smell, and review the catheter need"], "k": 4, "e": "Cloudy or foul urine in a catheterized patient is not a diagnosis. Treatment follows symptoms and signs of infection, and the more useful question is whether the catheter is needed. Routine irrigation or swabbing is not advised."}, {"c": 23, "s": "Ch 23, section 23.3 Hospital-acquired and ventilator-associated pneumonia", "q": "Which sequence lists the NHSN ventilator-associated event tiers from the broadest to the most specific?", "o": ["Ventilator-associated condition, infection-related complication, possible ventilator-associated pneumonia", "Possible ventilator-associated pneumonia, ventilator-associated condition, infection-related complication", "Infection-related complication, ventilator-associated condition, possible ventilator-associated pneumonia", "Ventilator-associated condition, possible ventilator-associated pneumonia, infection-related complication", "Possible ventilator-associated pneumonia, infection-related complication, ventilator-associated condition"], "k": 0, "e": "A ventilator-associated condition is the base tier, defined by oxygenation changes. An infection-related complication adds evidence of infection and a new antimicrobial course, and a possible pneumonia adds a qualifying culture, purulent secretions, or another test. Each tier requires the one before it."}, {"c": 23, "s": "Ch 23, section 23.3 Hospital-acquired and ventilator-associated pneumonia", "q": "On ventilator day 6, a patient's oxygen requirement rises, and infection prevention reports that a ventilator-associated event was triggered. What is the best bedside response?", "o": ["Diagnose ventilator-associated pneumonia and start broad antibiotics at once for the event", "Evaluate for pulmonary edema, atelectasis, ARDS, aspiration, embolism, and infection", "Ignore it, since it is only a surveillance label with no clinical meaning for care", "Increase sedation to improve ventilator synchrony and oxygenation over the next day", "Treat with antibiotics only if the chest radiograph also shows a new change"], "k": 1, "e": "A ventilator-associated event is not a diagnosis, and a drop in oxygenation has many causes. The fix is to look for the cause and not to stack antibiotics because a surveillance tier was triggered. Ignoring it is also wrong, because the patient may have a real deterioration."}, {"c": 23, "s": "Ch 23, section 23.3 Hospital-acquired and ventilator-associated pneumonia", "q": "Which measure is among the commonly taught ways to reduce pneumonia in ventilated patients?", "o": ["Keep the patient deeply sedated to prevent any self-extubation", "Keep the head of the bed flat for comfort", "Give stress ulcer prophylaxis to every ventilated patient routinely", "Minimize sedation and run daily awakening and breathing trials", "Delay mobilization until the tube is out"], "k": 3, "e": "Sedation minimization with daily awakening and breathing trials is part of the ABCDEF bundle, along with early tube removal, a raised head of bed, and mouth care. Deep sedation, a flat bed, and delayed mobilization all increase risk. Stress ulcer prophylaxis is not recommended for medical inpatients unless gastrointestinal bleeding risk is high."}, {"c": 23, "s": "Ch 23, section 23.4 Surgical site infection and Clostridioides difficile", "q": "A patient on day 6 after colon surgery has fever and wound redness with a fluctuant area. What is the highest-value action?", "o": ["Open and drain the collection; source control outweighs longer antibiotics", "Extend the antibiotic course and simply observe the wound for now", "Cover the wound with a dressing and wait for it to declare itself over several days", "Add an antimotility drug for the patient's comfort", "Wait for the surveillance definition to be met before acting on the wound"], "k": 0, "e": "Opening and draining a collection is source control, which matters more than a longer course of antibiotics. A septic patient after surgery should also be assessed for a deep or organ-space infection. The surgical team usually owns the preventive steps."}, {"c": 23, "s": "Ch 23, section 23.4 Surgical site infection and Clostridioides difficile", "q": "A 72-year-old on laxatives has formed stool and asks for a C. difficile test because he recently took antibiotics. What is the best approach?", "o": ["Test any patient who has recently taken antibiotics, whatever the stool looks like", "Test now and repeat in two days to confirm cure of the infection", "Do not test formed stool; test only diarrhea not explained by laxatives", "Treat empirically for C. difficile without any testing at all, given the history", "Test only after the patient develops a fever or a raised white count"], "k": 2, "e": "Send a stool test only for clinically significant diarrhea not explained by laxatives, and do not test formed stool or repeat a test shortly afterward to confirm cure. Many patients carry the organism without disease, so a positive test in someone without diarrhea may be colonization. Laxatives and tube feeds should be reviewed first."}, {"c": 23, "s": "Ch 23, section 23.4 Surgical site infection and Clostridioides difficile", "q": "A patient on a prolonged antibiotic course and an acid suppressant started in the ICU develops watery diarrhea, and C. difficile is suspected. Contact precautions are started. Which additional step is best?", "o": ["Add loperamide to reduce the stool volume and the nursing burden on the unit overnight", "Continue the acid suppressant for gastrointestinal protection during the critical illness and recovery", "Add a second broad antibiotic as extra cover against other organisms that may be present", "Stop the inciting antibiotic if possible, drop unneeded acid suppression, and avoid antimotility drugs", "Delay isolation until the stool test result has returned from the laboratory and been reviewed"], "k": 3, "e": "The inciting antibiotic should be stopped if possible, acid suppression without a clear indication should go, and antimotility drugs should be avoided when infection is suspected. Precautions begin on suspicion, not after the result. Loperamide can hide worsening disease."}, {"c": 23, "s": "Ch 23, section 23.4 Surgical site infection and Clostridioides difficile", "q": "A patient with C. difficile infection stops having diarrhea, but his abdomen becomes distended and tender, with a rising white count and lactate. What is the best interpretation and action?", "o": ["Resolution of infection; end precautions and discharge him soon after review", "Possible fulminant colitis; call senior surgical and infectious disease help", "Expected improvement; add an antimotility drug to hold the diarrhea off", "Constipation; give a laxative and recheck his abdomen in the morning", "Colonization only; repeat the stool test again tomorrow to see the trend"], "k": 1, "e": "Diarrhea that stops while the abdomen grows distended and tender, with rising white count and lactate, signals fulminant colitis with possible toxic megacolon. Early surgical and infectious disease help, the protocol regimen, and shock management are needed. Treating this as improvement is a dangerous misread."}, {"c": 23, "s": "Ch 23, section 23.5 Isolation, hand hygiene, and outbreak response", "q": "On the second day of treatment for C. difficile, a patient's diarrhea has resolved. A resident proposes ending precautions and using alcohol hand rub in the room. What is the best response?", "o": ["End precautions now and rely on alcohol hand rub in the room from here on", "Keep gloves only and rely on alcohol hand rub in the room during care", "End precautions but keep a dedicated stethoscope for the patient at the bedside", "Switch to airborne precautions for the rest of the stay in a shared room", "Continue contact precautions per policy and wash hands with soap and water"], "k": 4, "e": "Diarrhea may resolve while spores are still shed, so precautions continue for the period your policy sets. Alcohol-based rub is the usual choice for clean hands but is not reliable against spores, so soap and water is preferred for C. difficile. Contact precautions include gown and gloves for room entry."}, {"c": 23, "s": "Ch 23, section 23.5 Isolation, hand hygiene, and outbreak response", "q": "A 58-year-old with cough, night sweats, and weight loss is admitted, and tuberculosis is suspected. Which isolation is appropriate?", "o": ["Contact precautions with gown and gloves only until the test results return", "Droplet precautions with a surgical ma
