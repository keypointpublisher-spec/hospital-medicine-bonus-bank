sk in a shared room until cultures finalize", "Standard precautions only until the test is positive and the diagnosis is confirmed", "Contact precautions with soap-and-water hand washing for every entry into the room", "Airborne precautions, negative-pressure room, and a fit-tested respirator, started now"], "k": 4, "e": "Tuberculosis spreads by the airborne route and needs a negative-pressure room and a fit-tested respirator. Precautions begin on suspicion, before the test returns. A surgical mask is adequate for droplet organisms but not for airborne ones."}, {"c": 23, "s": "Ch 23, section 23.5 Isolation, hand hygiene, and outbreak response", "q": "Two patients on the same unit develop bloodstream infections with the same unusual organism within days. What should the hospitalist do?", "o": ["Wait for the laboratory report before telling anyone outside the unit", "Call infection prevention the same day, tighten the basics, and help trace the link", "Wait for a third case before involving infection prevention", "Handle the cases quietly within the team to avoid alarming other staff", "Leave all steps to infection prevention and stop reviewing devices on the unit"], "k": 1, "e": "Two or more linked cases or an unusual organism suggests an outbreak. The hospitalist should call infection prevention immediately, reinforce hand hygiene, isolation, cleaning, and device review, and help look for shared rooms, staff, equipment, and procedures. Infection prevention leads the investigation."}, {"c": 23, "s": "Ch 23, section 23.6 Venous thromboembolism and other hospital-based prevention strategies", "q": "A 70-year-old man admitted with pneumonia has no venous thromboembolism prophylaxis statement in his admission note. What is the best practice?", "o": ["Assume the admission order set already covers the decision for this patient", "Document it only if bleeding occurs during the stay or a procedure is planned", "Defer the decision entirely to the pharmacist on duty during the admission", "Record pharmacologic, mechanical, or none, with the reason, and revisit as risk changes", "Record the decision only at the time of discharge in the summary"], "k": 3, "e": "A patient who receives neither prophylaxis nor a documented reason falls through the gap. Each admission needs a recorded decision, revisited when risk or bleeding changes. An order set is not a substitute for a decision."}, {"c": 23, "s": "Ch 23, section 23.6 Venous thromboembolism and other hospital-based prevention strategies", "q": "An asymptomatic inpatient has a low hemoglobin but no coronary disease, heart failure, or stroke. A resident wants to transfuse to reach a round-number target. What does the Society of Hospital Medicine Choosing Wisely list advise?", "o": ["Avoid transfusing to an arbitrary threshold without symptoms or those conditions", "Transfuse to reach the round-number target the resident named for the patient", "Transfuse routinely on the day of any planned procedure or imaging study", "Repeat the hemoglobin daily and transfuse at any decline from the prior value", "Give a transfusion now to prevent symptoms from developing later in the stay"], "k": 0, "e": "The list advises against transfusing on arbitrary thresholds in patients without symptoms or coronary disease, heart failure, or stroke. This reduces avoidable exposure. The decision rests on the patient's condition."}, {"c": 23, "s": "Ch 23, section 23.6 Venous thromboembolism and other hospital-based prevention strategies", "q": "Which list matches the conditions covered by the Hospital Readmissions Reduction Program?", "o": ["CLABSI, CAUTI, SSI after colon surgery, MRSA bacteremia, and C. difficile infection", "Sepsis, stroke, diabetic ketoacidosis, acute kidney injury, and hip fracture", "Acute myocardial infarction, COPD, heart failure, pneumonia, CABG, and hip or knee replacement", "Cellulitis, urinary tract infection, GI bleeding, syncope, and chest pain", "Pulmonary embolism, atrial fibrillation, cirrhosis, gout, and pancreatitis"], "k": 2, "e": "The readmissions program covers those six conditions. The infection list belongs to the Hospital-Acquired Condition Reduction Program, which also uses PSI 90. Neither program tells you how to care for the patient."}, {"c": 24, "s": "Ch 24, section 24.1 Medication reconciliation", "q": "An 80-year-old man is admitted confused, with no family present. Only an outpatient pharmacy list is available. What is the best approach?", "o": ["Copy the pharmacy list into the orders as verified and proceed with admission", "Copy the last admission list into the orders as verified without further checks", "Use the patient's confused recall as the only available source of the history", "Hold every home drug until the history is fully complete and signed off", "Label the list unverified, call the pharmacy and family, and finish it soon"], "k": 4, "e": "The best possible history uses at least two sources, and a confused patient cannot be the only one. The list is labeled unverified until completed. Copying a single list without checking is a common cause of error."}, {"c": 24, "s": "Ch 24, section 24.1 Medication reconciliation", "q": "Which source of medication information is most likely to miss cash purchases, samples, other pharmacies, and over-the-counter drugs?", "o": ["Patient or caregiver interview", "Outpatient pharmacy fill history", "Pill bottles or a pill organizer", "Prior clinic or hospital records", "Prescription monitoring program"], "k": 1, "e": "A fill history shows what was dispensed but misses those items. The interview misses names and doses, bottles miss whether the drugs are taken as labeled, prior records miss changes made elsewhere, and a monitoring program misses anything not controlled. No single source is complete."}, {"c": 24, "s": "Ch 24, section 24.1 Medication reconciliation", "q": "Which group of home medicines can cause harm if stopped abruptly on admission?", "o": ["Multivitamins, antacids, and over-the-counter stool softeners taken at home", "Topical creams, eye drops, nasal sprays, and throat lozenges for minor complaints", "Calcium supplements, herbal teas, and fiber supplements taken with meals", "Beta-blockers, antiepileptics, long-term corticosteroids, and benzodiazepines", "Short antibiotic courses that were completed last month and not repeated"], "k": 3, "e": "The admission decision for each drug is continue, adjust, hold, or stop, with a reason. Drugs whose abrupt stop can cause harm include beta-blockers, antiepileptics, long-term corticosteroids, and benzodiazepines. The other groups carry little risk from interruption."}, {"c": 24, "s": "Ch 24, section 24.1 Medication reconciliation", "q": "A hospital's discharge process cites a published checklist that includes medication reconciliation, teach-back, and sending the summary to the patient, pharmacy, and primary care clinician. How should the team regard this checklist?", "o": ["A published checklist its authors call untested, not an official Joint Commission document", "A formal Joint Commission requirement for all discharges from the hospital", "A checklist validated by a randomized controlled trial in several hospitals", "An official Society of Hospital Medicine mandate for discharge planning", "A federal payment rule that hospitals must follow for every discharge"], "k": 0, "e": "The checklist includes the elements described, but its authors call it untested, and it is not an official society or Joint Commission document. Elements such as follow-up timing need a separate source. For every discharge drug, state whether it is new, changed, unchanged, or stopped."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A hospitalized patient takes a single morning dose of a corticosteroid, and glucose rises in the afternoon and evening while fasting values are normal. What is the best insulin approach?", "o": ["Make no change, since the fasting values are normal on the morning checks each day", "Stop all insulin to avoid hypoglycemia overnight while the steroid acts", "Time NPH insulin to the steroid, and expect mealtime and correction doses to rise", "Move to bedtime basal insulin only and ignore the daytime values", "Switch to a sliding scale as the only insulin order on the chart"], "k": 2, "e": "Steroid-induced hyperglycemia peaks in the afternoon and evening with morning dosing, so NPH timed to the steroid is the strategy in the ADA 2024 text. Fasting values can be misleadingly normal. A sliding scale alone is discouraged because it adds hypoglycemia risk without better control."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A patient with acute kidney injury has recurrent low glucose values on unchanged insulin. What is the best response?", "o": ["Increase insulin doses to offset the effect of the kidney injury", "Check glucose less often to reduce stress on the patient", "Reduce total insulin doses and check glucose more often", "Switch to sliding scale alone and stop the scheduled insulin", "Leave the dose unchanged since low values are random events"], "k": 2, "e": "The insulin label says kidney impairment raises the risk of low glucose, so doses are reduced and checks are more frequent. The plan is reviewed after any low value. A sliding scale alone is not a safer substitute."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A patient on insulin has a low glucose and cannot swallow safely. According to the Endocrine Society's 2009 guidance, what is best?", "o": ["Glucagon or intravenous glucose, then a regimen review", "Oral juice taken by mouth right away in small sips", "Repeat the glucose check in an hour's time and decide then", "Hold only the next mealtime insulin dose and recheck later", "Increase the basal insulin dose tonight to prevent a rebound"], "k": 0, "e": "The guidance advises urgent oral carbohydrate when the patient can swallow and glucagon or intravenous glucose when not. After severe hypoglycemia the regimen should be reviewed. Giving oral juice to a patient who cannot swallow safely risks aspiration."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A patient takes apixaban for atrial fibrillation and is started on a drug that strongly inhibits both P-glycoprotein and CYP3A4. What does the label advise?", "o": ["Make no change, since the order screen will flag any problems that matter", "Double the dose to offset the expected interaction with the new drug", "Switch to a once-daily regimen of the same total dose to improve adherence at home", "Stop apixaban with no replacement anticoagulant until the course is over", "Reduce the apixaban dose by 50 percent and name the combination to the pharmacist"], "k": 4, "e": "Such a drug raises apixaban exposure, and the label reduces the dose by 50 percent when they are combined. The order screen alone should not be relied on. Doubling the dose would worsen the exposure."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A patient on warfarin has a major gastrointestinal bleed and a high INR. Which reversal approach is labeled for urgent use?", "o": ["Idarucizumab given as an intravenous infusion with supportive care", "Four-factor prothrombin complex concentrate with vitamin K", "Andexanet alfa given as an intravenous bolus followed by an infusion", "Protamine sulfate given as a slow intravenous infusion with monitoring", "Watchful observation until the INR falls on its own"], "k": 1, "e": "Four-factor prothrombin complex concentrate with vitamin K is the labeled urgent option for vitamin K antagonist bleeding, after stopping the drug, finding the source, and supporting the patient. Idarucizumab is specific for dabigatran. Andexanet alfa was withdrawn from the US market."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "A patient on dabigatran has life-threatening bleeding. Which statement is correct?", "o": ["Andexanet alfa is the approved antidote for dabigatran", "Intravenous vitamin K reverses the effect of dabigatran", "Protamine sulfate is the approved antidote for dabigatran", "Idarucizumab is the only approved specific antidote", "No antidote exists for dabigatran at present"], "k": 3, "e": "Idarucizumab is the only approved specific antidote for dabigatran. Andexanet alfa was aimed at factor Xa inhibitors and has been withdrawn. Vitamin K and protamine act on other agents."}, {"c": 24, "s": "Ch 24, section 24.2 High-alert medications: insulin, anticoagulants, and opioids", "q": "Which group is explicitly excluded from the scope of the CDC 2022 opioid prescribing guideline?", "o": ["Adults aged 18 or older with chronic noncancer pain in outpatient care settings", "Patients with sickle cell disease, cancer, or receiving palliative care", "Outpatients prescribed an opioid for acute pain after an injury", "Patients discharged with a short opioid prescription after surgery", "Adults who also take a benzodiazepine for anxiety or sleep"], "k": 1, "e": "The guideline is for outpatients aged 18 or older and excludes sickle cell disease, cancer, and palliative care. It does not apply to hospitalized patients, but it does apply to prescribing at discharge. The other groups fall within its scope."}, {"c": 24, "s": "Ch 24, section 24.3 Adverse drug reactions and drug interactions", "q": "A patient develops a new symptom three days after starting a drug and is then prescribed a second drug for that symptom. What is the best first action?", "o": ["Add the second drug and continue taking both for now to see the response", "Increase the dose of the first drug to cover the new symptom", "Order imaging before any review of the drug list is considered", "Ask whether the first drug caused the symptom and consider stopping it instead", "Record an allergy to the second drug in the chart before dispensing"], "k": 3, "e": "This pattern is a prescribing cascade, where a side effect is read as a new disease. The remedy is to ask what the new drug could have caused and to consider stopping the first drug. Adding drugs for drug effects adds risk."}, {"c": 24, "s": "Ch 24, section 24.3 Adverse drug reactions and drug interactions", "q": "Four hours after a serotonergic drug was increased, a patient has agitation, sweating, tremor, clonus, and fever. What is the most likely diagnosis?", "o": ["Serotonin syndrome", "Opioid toxicity", "Sedative-hypnotic toxicity", "Anticholinergic toxicity with dry skin", "Sympathomimetic stimulant toxicity"], "k": 0, "e": "Agitation, sweating, tremor, clonus, and fever after a serotonergic drug is added or increased define serotonin syndrome. Opioid and sedative toxicity produce slow breathing and sedation, and anticholinergic toxicity gives dry skin. A sympathomimetic picture overlaps in agitation, but clonus and tremor after a serotonergic drug point away from it."}, {"c": 24, "s": "Ch 24, section 24.4 Prescribing in kidney and liver disease", "q": "A septic patient's creatinine looks normal, but the trend is rising over a day. The pharmacist asks about a renally cleared drug. What is the best approach?", "o": ["Use the normal value as proof of good kidney clearance when dosing the drug", "Use a baseline value from several months ago for dosing decisions now", "Recognize that creatinine lags off steady state; dose cautiously and recheck daily", "Dose by body weight alone and ignore kidney function in the septic patient", "Wait for the creatinine to peak before giving any dose of the drug"], "k": 2, "e": "In acute illness creatinine lags, so a normal value with a rising trend does not mean good clearance. A dose calculated during an acute change should be revisited as creatinine moves. Patients with changing kidney function merit daily dose review."}, {"c": 24, "s": "Ch 24, section 24.4 Prescribing in kidney and liver disease", "q": "A patient at risk of acute kidney injury needs a contrast study. What does KDIGO 2012 support?", "o": ["Withhold the study because of the patient's kidney risk, whatever its clinical value to him", "Give a loop diuretic beforehand to prevent kidney injury from the contrast load", "Arrange prophylactic dialysis immediately after the study to clear the contrast", "Use a colloid solution for volume expansion before the study in place of saline", "Give the study with low- or iso-osmolar contrast and isotonic saline or bicarbonate, no prophylactic dialysis"], "k": 4, "e": "KDIGO 2012 advises low- or iso-osmolar contrast and intravenous isotonic saline or bicarbonate in at-risk patients, and suggests no prophylactic dialysis. It favors isotonic crystalloid over colloid and advises against diuretics to prevent injury. A needed study should not be withheld only because of kidney function."}, {"c": 24, "s": "Ch 24, section 24.4 Prescribing in kidney and liver disease", "q": "A patient with cirrhosis has overt hepatic encephalopathy. Which approach is best?", "o": ["Give a benzodiazepine to settle the patient's agitation and help him sleep through the night", "Stop lactulose and give a sedative to help him rest through the night", "Start an NSAID to treat his pain and reduce inflammation in the joints", "Treat with an opioid for comfort and observe him overnight on the ward", "Give lactulose and look for precipitants such as sedatives, constipation, and bleeding"], "k": 4, "e": "Lactulose is first line for overt hepatic encephalopathy, and precipitants should be sought. Sedatives can provoke or worsen it, so the lowest effective dose or avoidance is advised. The 2014 row may be out of date."}, {"c": 24, "s": "Ch 24, section 24.5 Sedatives, antipsychotics, and the Beers criteria", "q": "A ventilated patient needs light sedation, and the team wants to limit delirium. What does the 2025 intensive care sedation update suggest?", "o": ["Dexmedetomidine over propofol, with bradycardia as the main risk", "Propofol over dexmedetomidine, with bradycardia as the main risk", "Deep sedation with a benzodiazepine", "Scheduled haloperidol to treat delirium", "Dexmedetomidine for ward sedation"], "k": 0, "e": "The 2025 update suggests dexmedetomidine over propofol when lighter sedation or less delirium is the priority, with bradycardia as the main risk. The 2018 guideline favored light over deep sedation. Dexmedetomidine and propofol doses are for ICU use under protocol, not ward sedation."}, {"c": 24, "s": "Ch 24, section 24.6 Preventing medication errors", "q": "A resident overrides an interaction alert for a high-alert drug and assumes pharmacy will catch any error. What is the best correction?", "o": ["Rely on the next layer of review, since several independent checks exist", "Turn off interaction alerts to reduce alert fatigue among the team", "Defer all high-alert orders to the pharmacist on duty for review", "Treat yours as the last check, and write the reason for the override", "Override silently, since alert fatigue is expected on the ward"], "k": 3, "e": "No single check is reliable, and each layer assumes the others will catch the error. For high-alert drugs, treat yours as the last check and document why an alert was overridden. Alert fatigue is a real hazard but not a reason to ignore alerts."}, {"c": 24, "s": "Ch 24, section 24.7 Toxicology and overdose basics", "q": "A patient wakes after naloxone for opioid overdose. What is the best next step?", "o": ["Discharge him as soon as he is awake and talking to staff", "Monitor him, since the opioid may outlast naloxone, and titrate to breathing", "Give repeated large doses until he is fully alert and oriented", "Remove monitoring since he is awake and breathing on his own", "Stop observation after the first hour has passed without events"], "k": 1, "e": "Naloxone's effect can be shorter than that of the opioid, so sedation and slow breathing may return. It can precipitate withdrawal in dependent patients, so it is titrated to breathing, not full wakefulness. Monitoring continues."}, {"c": 24, "s": "Ch 24, section 24.7 Toxicology and overdose basics", "q": "A young adult is found drowsy after an unclear ingestion and looks otherwise well. He says he took only a few sleeping pills. What is the best step?", "o": ["Observe him closely for now, since he looks well at present", "Skip a level unless he becomes visibly jaundiced or vomits", "Send a serum acetaminophen level and call poison control", "Wait for liver injury to show up before testing the blood", "Treat only the sleeping pills he reported taking, with standard care"], "k": 2, "e": "Acetaminophen is common, silent early, and treatable, so a level is sent for any intentional or unknown ingestion. Poison control or a toxicologist should be called early. By the time liver injury appears, treatment is less effective."}, {"c": 25, "s": "Ch 25, section Measuring quality and safety in the hospital", "q": "A 70-year-old woman with an indwelling urinary catheter has no fever, no suprapubic or flank pain, and no change in mental status. The nurse notes foul-smelling urine and asks whether to send a culture. What is the best response?", "o": ["Do not send a culture now; order one if she develops signs of infection, since culturing by habit can create a counted infection", "Send the culture now, because a strong odor alone justifies testing in any catheterized patient, even without symptoms", "Send the culture and start antibiotics right away so that a possible early infection is not missed in a catheterized patient", "Send the culture only if the result would improve the hospital's quality score and public ranking", "Send the culture daily while the catheter stays in place, so that any change can be caught early"], "k": 0, "e": "Infections are counted by surveillance definitions, not by clinical impressions, so a culture sent for odor alone in an asymptomatic patient can generate a counted infection with no benefit to her. Cultures belong with signs of infection. Sending cultures by habit or to manage a score reverses the purpose of measurement."}, {"c": 25, "s": "Ch 25, section Measuring quality and safety in the hospital", "q": "A hospital leader wants to rank two hospitals by raw in-hospital mortality. A hospitalist objects that the comparison is unfair. What is the best reason?", "o": ["Outcome measures are less important to patients than process measures, so they should not be used to compare hospitals", "Mortality can only be compared between hospitals of identical size and teaching status", "Process measures are always more accurate than outcome measures, so outcomes can be ignored", "Outcome measures depend on case mix, so they need risk adjustment before comparison", "Outcome measures cannot be changed by care, so differences reflect only patient factors"], "k": 3, "e": "Outcome measures matter most to patients but are shaped by how sick the patients are at the start, which is why they need risk adjustment. Ranking raw rates would penalize hospitals that take sicker patients. The other options misstate the relative value or the changeability of the measures."}, {"c": 25, "s": "Ch 25, section Measuring quality and safety in the hospital", "q": "A unit's catheter-associated urinary tract infection count is above target. A colleague proposes sending fewer urine cultures to lower the count. Which action best addresses the underlying harm?", "o": ["Stop all urine cultures in catheterized patients, including those who develop fever or flank pain", "Change the documentation wording and coding so that fewer infections meet the surveillance definition on the unit", "Review daily whether each catheter is still needed, remove those that are not, and culture only for symptoms", "Replace every catheter on a fixed schedule, whether or not it is still needed", "Start prophylactic antibiotics for all catheterized patients so that no infection is counted"], "k": 2, "e": "The common error is to chase the metric instead of the harm; the real problem is usually a catheter left in too long. Removing unneeded catheters and culturing for symptoms protects the patient and lets the numbers follow. Reducing testing or altering documentation distorts the measure without reducing harm."}, {"c": 25, "s": "Ch 25, section Measuring quality and safety in the hospital", "q": "A hospital's score in the Medicare program for hospital-acquired conditions includes five infection measures reported through the National Healthcare Safety Network. Which of the following is one of them?", "o": ["Ventilator-associated pneumonia", "Community-acquired pneumonia", "Surgical site infection after colon surgery", "Cellulitis present on admission", "Influenza acquired in the community before arrival"], "k": 2, "e": "The five infection measures are central line-associated bloodstream infection, catheter-associated urinary tract infection, surgical site infection after colon surgery and abdominal hysterectomy, methicillin-resistant Staphylococcus aureus bacteremia, and Clostridioides difficile infection. Ventilator-associated pneumonia is not one of the five, which makes it the most tempting distractor. Community-acquired and present-on-admission conditions are not hospital-acquired."}, {"c": 25, "s": "Ch 25, section Measuring quality and safety in the hospital", "q": "A 66-year-old man in the hospital has had a central venous catheter in place since the day he was admitted. A blood culture grows a pathogen. For this to count as a central line-associated bloodstream infection under the surveillance definition, what must be true about the line?", "o": ["It must have been placed in the intensive care unit", "It must have been inserted by a trainee", "It must have been in place on the day of the culture only, however briefly", "It must have been in place for more than two consecutive calendar days", "It must have been replaced over a guidewire at least once"], "k": 3, "e": "The surveillance definition depends on the line having been in place for more than two consecutive calendar days. Where the line was placed, who placed it, or whether it was exchanged does not define the event. This is why daily review of line necessity affects both patient safety and the hospital's score."}, {"c": 25, "s": "Ch 25, section Root-cause analysis and the culture of safety", "q": "A nurse gives a wrong dose. Review shows the pump default was wrong, the pharmacy label was unclear, and the order set did not flag the patient's kidney problem. Which view best fits the Swiss cheese model?", "o": ["Harm follows when holes in several defenses line up, so fixing the pump, label and order set helps the next patient", "The nurse's lapse is the single cause, so the response should focus on retraining and disciplining her", "Only the layer closest to the patient needs repair, since earlier layers do not contribute to harm", "Each layer of defense is perfect, and errors arise only from bad luck rather than from design", "Fixing the nurse changes more than fixing the system, because people cause nearly every error"], "k": 0, "e": "Most harm arises from a chain of small failures in a system, with each defense layer having holes that occasionally align. Repairing the pump, label and order set closes several holes at once. Focusing on one person changes little for the next patient."}, {"c": 25, "s": "Ch 25, section Root-cause analysis and the culture of safety", "q": "A pharmacist catches a wrong-dose order before it reaches the patient and reports it. What is the best response from the unit leader?", "o": ["Treat it as unimportant because no harm occurred and the patient was never affected", "Thank the pharmacist and review the event as a free lesson about the ordering process", "Discipline the prescriber immediately and close the case without further review of the ordering system", "Ask the pharmacist to report only events that reach patients, to limit the number of reports", "Share the report only with the prescriber and keep it off the unit's safety agenda"], "k": 1, "e": "A near miss is an error caught before it reached the patient, and it offers a lesson at no cost to anyone. A culture that rewards near-miss reports finds problems before patients are hurt. Dismissing or punishing the report teaches staff to stay silent."}, {"c": 25, "s": "Ch 25, section Root-cause analysis and the culture of safety", "q": "During a root-cause analysis, the team has found that a medication was given at the wrong dose because the order screen did not display kidney function. What is the best way to continue the \"why\" questioning?", "o": ["Stop at the first person who made an error, since that person is the root cause", "Keep asking why until reaching conditions the organization controls, such as design, staffing, equipment or policy", "Stop once the team agrees that staff should be more careful when entering orders in the future", "Move directly to writing a reminder email telling all staff to double-check kidney function before ordering", "Ask the clinicians involved to propose their own discipline and a plan for correcting their behavior"], "k": 1, "e": "The analysis should continue until it reaches conditions the organization can change, such as design, communication, training and policy. Stopping at an individual or at a call for more care means the analysis has not reached a root cause. Strong fixes alter the system rather than rely on memory."}, {"c": 25, "s": "Ch 25, section Root-cause analysis and the culture of safety", "q": "After a new nonpunitive reporting program is introduced, a medical unit's number of reported errors rises over the following months. How should the leadership interpret this?", "o": ["It proves that care on the unit has become less safe over the same months", "It shows the program has failed and should be stopped before reporting rises further", "It may reflect higher psychological safety, since teams that feel safe speaking up report more errors", "It means staff are being careless and need education about error prevention on the unit", "It indicates that errors on other units are rarer, since staff there report fewer events than this unit does"], "k": 2, "e": "Psychological safety means any team member can speak up without fear of humiliation, and such teams report more errors, not fewer. A rise in reports after a cultural change can therefore be a good sign. Reading it as proof of worse care would drive reporting back underground."}, {"c": 25, "s": "Ch 25, section Disclosing errors and adverse events", "q": "A patient received a dose of a drug that needs kidney-based adjustment, and no symptoms have appeared yet. Her creatinine needs closer monitoring. The attending asks whether disclosure is needed since there is no clear harm. What is the best answer?", "o": ["No; disclosure is needed only after the investigation proves that the error caused harm", "Yes; the error reached her and affects her care, so tell her what is known now and that more will follow", "No; disclosure applies only to deaths or to errors that cause lasting permanent injury", "Yes, but only after the root-cause analysis is complete and the cause has been confirmed by the team", "Yes, but only if her family asks about the dose or the monitoring plan"], "k": 1, "e": "Disclose when an error reached the patient and is relevant to her care, including errors with no apparent harm when the patient would want to know, such as a wrong-dose drug needing monitoring. Do not wait for the investigation to finish; share what is known and promise more. Waiting converts a recoverable event into a breach of trust."}, {"c": 25, "s": "Ch 25, section Disclosing errors and adverse events", "q": "A resident discovers a medication error and the patient looks unwell. What should come first?", "o": ["Call the patient's family to explain what happened before anyone examines her", "Write a detailed incident narrative before examining the patient, while events are fresh", "Wait for the risk office to arrive before doing anything for the patient", "Hold the disclosure conversation first so that the patient hears it from the physician herself", "Treat the harm, monitor the patient and call for help before the disclosure conversation"], "k": 4, "e": "The first step is clinical: treat the harm, monitor and call help. The conversation, the review of the chart, notifying the risk office and the documentation follow. Disclosure matters, but not ahead of caring for a patient who may be deteriorating."}, {"c": 25, "s": "Ch 25, section Disclosing errors and adverse events", "q": "You are preparing to tell a patient that she received too high a dose of an antibiotic. How should the conversation begin?", "o": ["With a detailed explanation of the pharmacology of the drug and how its doses are chosen", "With an assurance that nothing could have been done differently to prevent the event", "With a list of possible legal consequences for the hospital and the clinicians involved", "With a statement that mistakes were made in her care, without saying what happened to her", "With a warning that you have something to tell her about her care, then the facts in plain language"], "k": 4, "e": "A useful sequence is a warning shot, then the facts, then a response to feelings, in plain language without blame or jargon. Saying that \"mistakes were made\" without naming what happened is one of the listed errors. Reassurance that no one erred would be false if an error occurred."}, {"c": 25, "s": "Ch 25, section Disclosing errors and adverse events", "q": "A patient asks why she received the wrong dose. The review is still under way and the cause is unclear. Which statement is best?", "o": ["\"The nurse made an error, and she will be dealt with according to hospital policy.\"", "\"It was a computer problem, and it has been fixed so it will not happen again.\"", "\"There is nothing to worry about, so no further explanation is needed from us.\"", "\"I cannot discuss any part of this until the legal review is finished and the lawyers approve a statement.\"", "\"We do not yet know all the reasons. I will update you, and here is how we will watch you meanwhile.\""], "k": 4, "e": "Disclosure includes saying what is unknown and committing to return with updates. Offering a cause before it is known, blaming another clinician, or giving false reassurance are mistakes to avoid. Refusing to discuss it until a legal review ends leaves the patient without information she needs."}, {"c": 25, "s": "Ch 25, section Disclosing errors and adverse events", "q": "A resident worries that apologizing to a patient for an error will be treated as an admission of legal liability. What is the best advice?", "o": ["Avoid the conversation until the lawyers advise otherwise, so the hospital is protected", "Disclose only facts and never express regret, because regret can be used as evidence", "Let the risk office handle the entire conversation without the clinician present, since lawyers understand liability best", "Involve the risk office early; a sincere apology is not admitting liability, and legal fear must not replace honesty", "Delay the apology until the patient asks for it, so that it cannot be seen as an admission"], "k": 3, "e": "A sincere apology and acknowledgment of what happened are different from admitting legal liability, and the risk office should help rather than silence the clinician. The aim is candor with support. Staying silent or withholding regret fails the patient."}, {"c": 25, "s": "Ch 25, section Interprofessional communication and professionalism", "q": "A night-shift physician is handing off a patient with a shaky blood pressure to a colleague. Which handoff practice is best?", "o": ["Read the full chart aloud from start to finish so that nothing is left out", "Give a brief verbal note and leave the written version for later, when time allows, since the colleague can check the chart", "Describe only the diagnosis and leave the plan to the receiver to decide after reviewing the chart", "Give severity and a one-line summary, a timed to-do list with contingencies, your biggest worry, and a receiver read-back", "Hand off while answering pages so that no time is lost between the two physicians"], "k": 3, "e": "A good handoff gives the receiver what they need to act: severity, a short summary, timed actions, if-then contingencies, and the main worry, with the receiver restating key items. Handoffs fail when they are rushed, interrupted, or done by reading the chart aloud. A current written version should accompany the spoken one."}, {"c": 25, "s": "Ch 25, section Interprofessional communication and professionalism", "q": "A nurse tells a physician, \"I am worried about this patient, please look at him now.\" The physician says he is busy and will come later. The nurse remains concerned. What should the nurse do next?", "o": ["Restate the concern and the stakes, and if still unresolved, use the chain of command", "Wait quietly for the physician to arrive, since he said he would come later", "Document the concern in the chart and take no further action until the physician arrives on the unit", "Ask a student to watch the patient instead while the nurse returns to other duties", "Wait until the next scheduled vital signs are due before deciding whether to escalate"], "k": 0, "e": "Any team member should be able to stop a process when they see danger, with a clear script for concern. When the first attempt is not heard, the second step is to restate the concern and the stakes, then use the chain of command. A nurse who says something is wrong is often the first sign of deterioration."}, {"c": 25, "s": "Ch 25, section Value-based care and high-value care", "q": "A 72-year-old man is admitted to a general medical ward with cellulitis. He is stable and has no cardiac history. The admitting team ordered continuous telemetry with no plan for when to stop it. Which statement best reflects the Society of Hospital Medicine Choosing Wisely list?", "o": ["Continuous telemetry should be ordered for every hospitalized adult on admission to the ward", "Telemetry should continue until discharge to be safe, even after the reason for monitoring has resolved", "Telemetry is advised only on weekends, when fewer staff are available to check patients", "Telemetry has no cost or harm, so no limits or stopping rules are needed", "Avoid continuous telemetry outside the intensive care unit unless a protocol exists for stopping it"], "k": 4, "e": "The list advises against continuous telemetry outside the intensive care unit without a protocol for stopping it, citing alarms, cost and cascading tests. This item is conditional and works as a default. The row is provisional, so the Society's current endorsement should be confirmed."}, {"c": 25, "s": "Ch 25, section Procedural complications and consent", "q": "An unresponsive 58-year-old man arrives after a collapse with a life-threatening condition that needs immediate treatment. No surrogate can be reached. What is the best approach?", "o": ["Wait until a surrogate is found, whatever the delay, because treatment without consent is never allowed", "Treat under the emergency exception because delay would cause serious harm, and document why", "Obtain consent from the nearest bystander, who can speak for the patient", "Withhold all treatment until a court order is available, however long that takes", "Treat but avoid documenting, to prevent disputes later with the family"], "k": 1, "e": "In a true emergency where delay would cause serious harm and no surrogate is available, treatment can proceed under the emergency exception, and the reasoning should be documented. Waiting for consent in this setting would cause harm. Documentation protects both the patient and the clinician."}, {"c": 25, "s": "Ch 25, section Procedural complications and consent", "q": "A 64-year-old woman on apixaban needs a procedure that would involve neuraxial anesthesia. What is the best step before proceeding?", "o": ["Check the drug, last dose, kidney function and label rules, including the boxed warning for spinal or epidural hematoma", "Proceed, because direct oral anticoagulants such as apixaban carry no warnings about neuraxial procedures or spinal bleeding", "Check only the platelet count, since it reflects the effect of all anticoagulants", "Rely on the patient's recall of her last dose without other information or records", "Skip the check if the procedure is brief, since short procedures carry little bleeding risk"], "k": 0, "e": "Before any procedure in an anticoagulated patient, review the drug, last dose, kidney function and the label rules. The enoxaparin, apixaban and rivaroxaban labels carry boxed warnings for spinal or epidural hematoma with neuraxial anesthesia. Specific hold and restart intervals should come from the primary guideline."}, {"c": 25, "s": "Ch 25, section Procedural complications and consent", "q": "A hospitalist obtains a signature for a bedside procedure after a very brief explanation. Later the patient says, \"No one told me about the risks.\" What does this illustrate?", "o": ["A properly signed form is sufficient evidence of consent in all circumstances, whatever was or was not discussed", "Consent requires only that the patient has capacity and is willing to sign the form", "A signed form is not informed consent; consent is a conversation about purpose, risks, benefits and alternatives", "Consent conversations should avoid mentioning rare but serious risks so patients do not refuse", "Consent is a legal formality that does not affect care or the patient's later trust"], "k": 2, "e": "Informed consent is a conversation covering the purpose, main risks including serious rare ones, benefits and alternatives, including doing nothing, with plain language and time for questions. The signature documents the conversation and does not replace it. When a patient says no one told her, the first action is to treat any harm, disclose honestly, and review the consent process."}, {"c": 26, "s": "Ch 26, section Goals-of-care conversations", "q": "A 78-year-old man with advanced heart failure and pneumonia is declining. His daughter says, \"Just do everything.\" Which next question is most useful for understanding what to do?", "o": ["\"What matters most to him, and what would he find unacceptable if he could see himself now?\"", "\"Do you want everything done, including a ventilator and chest compressions if his heart stops?\"", "\"Do you want us to stop all treatment and focus only on keeping him comfortable now?\"", "\"Which of the following life-support options would you pick for him from the list I give you?\"", "\"Have you discussed this with an attorney, and have you completed the legal forms?\""], "k": 0, "e": "Asking whether the family wants everything done invites a yes, because nobody wants everything when it includes a prolonged ventilator with no chance of going home. Better questions explore outcomes, trade-offs and values. The goal is to learn what the patient would accept for a chance at more time."}, {"c": 26, "s": "Ch 26, section Goals-of-care conversations", "q": "After a clear explanation of a patient's worsening illness and a pause for the family's emotion, what is the best next step for the physician?", "o": ["Present a menu of all possible treatments and ask the family to make the final choice alone", "Ask about the patient's values, then make a clear recommendation based on what the family said", "Defer any suggestion to avoid influencing the family, and let them reach a choice without clinician input", "Leave the family to decide alone and return tomorrow to ask what they have decided", "Quote survival statistics in detail to support a choice, then wait for the family to pick"], "k": 1, "e": "Families are not abandoned by a clear suggestion; they are abandoned by a menu. After eliciting values, a recommendation that follows from what the family said helps them decide. The conversation should then be written where the next team will look."}, {"c": 26, "s": "Ch 26, section Goals-of-care conversations", "q": "A hospitalist is leading goals-of-care discussions for several patients. Family conflict about the plan is now blocking decisions for one of them, and symptoms are hard to control in another. How should palliative care be used?", "o": ["As a mandatory consult for every patient with a serious illness, regardless of the clinician's judgment", "Only after the patient has died, when the family needs bereavement support from the team", "As a resource for harder situations at the clinician's judgment, not as a routine consult for every patient", "As a replacement for the hospitalist's own conversation, with no further involvement of the hospitalist", "Never, since the hospitalist can handle every situation without help from other specialists"], "k": 2, "e": "The critical care guideline suggests against routine formal palliative consultation for all and favors consultation at clinician judgment, with low certainty. Specialist help is useful for difficult symptoms, family conflict, repeated divergence between goals and plan, or uncertainty about how to talk with a family. Do not hand off the conversation and walk away."}, {"c": 26, "s": "Ch 26, section Prognosis and serious-illness communication", "q": "The daughter of a patient who is clearly worsening asks, \"How long does he have?\" What is the best response?", "o": ["Refuse to answer because prognosis is unknowable and any estimate would only be a guess", "Give a single exact number of days so that the family can plan around it", "Say, \"We will see how he does,\" and avoid giving any specifics about time", "Give a range in time words, such as days or weeks, and state the uncertainty clearly", "Offer a numeric score from a prognostic calculator and explain what the score means"], "k": 3, "e": "Families want a range and a direction. Time words with a clear statement of uncertainty are honest and usable, whereas refusing to answer or giving a single number are the common mistakes. No numeric prognostic tool is endorsed in the text."}, {"c": 26, "s": "Ch 26, section Prognosis and serious-illness communication", "q": "A son says the family is \"hoping for a miracle\" for his critically ill mother. What is the best response from the physician?", "o": ["Tell him that miracles do not happen and that the family needs to accept the medical facts today", "Ask what he is hoping for and what worries him, and offer to plan in case treatment does not work", "Agree with him and promise that a miracle will occur if the family keeps faith", "Avoid the subject until the patient dies, then offer support to the family", "Tell him that hope interferes with good decisions and should be set aside now"], "k": 1, "e": "Do not argue with hope. Hope and worry can both be true, and asking about each opens the door to planning: hoping for time while preparing for the worst. Dismissing or encouraging false hope both damage trust."}, {"c": 26, "s": "Ch 26, section Prognosis and serious-illness communication", "q": "A Spanish-speaking patient with a new terminal diagnosis will hear serious news. His adult son offers to translate. What is the best approach?", "o": ["Allow the son to interpret to save time, since he knows his father best", "Have the son receive the news first and relay it to his father in Spanish in whatever way he thinks best", "Give the news in English and provide written materials in Spanish later", "Use a qualified medical interpreter, and ask the patient how he wants information shared and with whom", "Skip the conversation until the patient can speak English or a relative is available"], "k": 3, "e": "A qualified medical interpreter, not a family member, should be used for serious-illness conversations. Patients differ in whether they want to hear news themselves or have family hear it first, and asking is better than guessing. The conversation should not be delayed because of language."}, {"c": 26, "s": "Ch 26, section Prognosis and serious-illness communication", "q": "A resident says, \"I would not be surprised if this patient died within the next year, so I will place a hospice order.\" What is the best interpretation of this thought?", "o": ["It is a screening habit that should prompt a conversation about goals and a decision-maker, not a validated cutoff", "It is a validated cutoff that qualifies the patient for hospice, so placing the referral without discussion is appropriate", "It is a proven mortality prediction tool that can set the timing of hospice referral", "It is a reason to avoid talking with the family until the patient's condition changes", "It replaces the need for a prognosis discussion with the patient or the family"], "k": 0, "e": "The surprise question is a screening habit, not a validated threshold. A \"no, I would not be surprised\" answer should lead to asking about goals, naming a decision-maker, and considering whether palliative care or hospice would add support. It should lead to a conversation rather than a label."}, {"c": 26, "s": "Ch 26, section Symptom management at the end of life", "q": "A patient is actively dying and the goal is comfort only. The chart still shows scheduled vital signs, daily blood draws and telemetry. What is the best action?", "o": ["Continue all monitoring in case the family changes its mind about the goals of care", "Continue daily blood tests but stop telemetry only, because laboratory results still guide comfort decisions", "Review the orders and stop monitoring, tests and drugs that no longer serve the comfort goal", "Stop all medications including those for comfort, since the patient is dying anyway", "Leave orders unchanged so the next team can decide when it takes over the care"], "k": 2, "e": "In a dying patient the aim is comfort, and each order should be judged by whether it makes the patient more comfortable or only produces data. Routine vital signs, labs, telemetry and non-beneficial medications should be stopped. Comfort medications, however, are continued."}, {"c": 26, "s": "Ch 26, section Symptom management at the end of life", "q": "A dying patient with advanced lung disease is short of breath. A chest radiograph suggests a pleural effusion, and goals are still disease-directed. What is the best sequence?", "o": ["Start oxygen reflexively and take no further steps, since oxygen treats all breathlessness", "Use only pharmacologic measures, avoiding positioning or a fan because they have no effect", "Ignore the effusion because the patient is dying, and withhold treatment for any cause of the breathlessness", "Treat reversible causes that fit the goals, add a fan, upright position and calm presence, and trial oxygen", "Treat the family's distress and ignore the patient's symptoms until the family is calm"], "k": 3, "e": "First treat anything reversible, such as an effusion, pneumonia, bronchospasm, heart failure or anemia, when it fits the goals. Then use measures that need no prescription. Oxygen helps hypoxic patients and may comfort some who are not, but it should be a trial."}, {"c": 26, "s": "Ch 26, section Symptom management at the end of life", "q": "A 85-year-old hospitalized man with terminal illness becomes agitated. Reversible causes such as retention and constipation have been addressed and behavioral measures have been tried. His agitation is severe and threatens harm. Which approach fits the geriatric surgical statement?", "o": ["Start a benzodiazepine as the first-line drug, since sedation controls agitation fastest", "Give a high loading dose of an antipsychotic to ensure control of the agitation at once and prevent a repeat", "Use physical restraints as the preferred option, since they avoid drug side effects", "Add several sedatives at once so that at least one of them works quickly", "Use the lowest effective antipsychotic dose briefly, and avoid benzodiazepines unless he is in withdrawal"], "k": 4, "e": "For severe agitation that threatens harm after behavioral measures fail, antipsychotics belong at the lowest dose for the shortest time, and benzodiazepines are not first-line except for withdrawal. The first response is nonpharmacologic. At the end of life, comfort may outweigh some cautions, and the team and family decide together."}, {"c": 26, "s": "Ch 26, section Symptom management at the end of life", "q": "A dying patient has noisy breathing from pooled secretions, and the family is alarmed that he is choking. What is the best approach?", "o": ["Reposition him, explain the sound, reassure the family it is not choking, and treat only if it helps", "Tell the family nothing, to avoid upsetting them while the patient is dying", "Insert a breathing tube to clear the airway and protect it from further secretions", "Reassure the family that the patient is suffering, so that they will accept treatment", "Provide deep suctioning on a fixed schedule regardless of its effect or the patient's tolerance"], "k": 0, "e": "Noisy breathing from pooled secretions is usually more distressing to the family than to the patient. Repositioning, explanation and mouth care come first, and a treatment is used only if it helps. Reassuring the family that it does not mean choking is part of the plan."}, {"c": 26, "s": "Ch 26, section Symptom management at the end of life", "q": "A team is considering palliative sedation for a dying patient whose suffering has not been relieved by other measures. Which statement is most accurate?", "o": ["It is reserved for otherwise refractory suffering and done with specialist support and a written goal", "It is a first-line therapy for any dying patient who appears uncomfortable or restless", "It is the same as euthanasia, because both aim to end the patient's life by the same means", "It requires no specialist support or documentation when the family agrees to the plan", "It is appropriate to relieve family distress alone, even when the patient is comfortable and not suffering"], "k": 0, "e": "Palliative sedation is for the few patients whose suffering no other measure relieves, and it is done with specialist support, the family's understanding and a written goal. It is not euthanasia and not a means of hastening death. Doses and protocols are not given in the text."}, {"c": 26, "s": "Ch 26, section Pain management and opioid conversion", "q": "A hospitalist plans pain management for a dying cancer patient on an inpatient ward and considers following the 2022 CDC opioid guideline. Which statement is correct?", "o": ["The guideline applies to all hospitalized patients, including those receiving palliative care", "The guideline was written specifically for cancer pain, so it fits this patient well", "The guideline is for outpatients and excludes cancer pain and palliative care, so it should not run this plan", "The guideline applies to palliative care but not to outpatients, so it should direct this patient's pain plan", "The guideline mandates tapering for all patients, including those who are dying"], "k": 2, "e": "The CDC guideline covers outpatients 18 or older and excludes sickle cell disease, cancer pain and palliative care. It states it does not apply to hospitalized patients, though it does apply to prescriptions written at discharge. Do not use it to manage a dying patient's pain."}, {"c": 26, "s": "Ch 26, section Pain management and opioid conversion", "q": "A hospitalist must switch a patient with cancer pain from one opioid to another. A resident proposes using a morphine milligram equivalent table. What is the main concern?", "o": ["MME tables are too complex for inpatient use, so a pharmacist must do every switch", "MME tables apply only to extended-release products, not to short-acting drugs", "MME tables are required by the FDA for every switch between opioids, in hospitalized and outpatient settings", "MME tables are accurate only for kidney failure, where they were first validated", "The CDC states that MME factors describe risk and must not be used to calculate the dose when switching drugs"], "k": 4, "e": "The CDC states that MME factors exist to describe risk and must not be used to compute a switch dose. The text gives no official equianalgesic table, so the switch should use a reference endorsed by the hospital pharmacy, a pharmacist's calculation checked by a second clinician, and close monitoring."}, {"c": 26, "s": "Ch 26, section Capacity, surrogates, and advance directives", "q": "A 70-year-old man has delirium from pneumonia and cannot weigh a treatment decision at 2 a.m. What is the best way to assess capacity?", "o": ["Declare permanent incapacity because he has delirium, and have a surrogate make all of his future decisions", "Assume capacity is present since he is talking and answering questions politely", "Treat reversible contributors, reassess at his best time of day, and have him explain the decision in his own words", "Accept any choice he makes without questions, since delirium does not affect decisions", "Assess him only at night, when the problem is most visible and the team is present"], "k": 2, "e": "Capacity is decision-specific and can change with delirium. Assess it at the bedside at the patient's best time of day after treating reversible contributors such as pain, drugs, infection and low sodium. A diagnosis alone does not prove lack of capacity."}, {"c": 26, "s": "Ch 26, section Capacity, surrogates, and advance directives", "q": "A patient lacks capacity. Her chart names a health care agent, but her brother, who is at the bedside, demands that all treatment be stopped. What is the best action?", "o": ["Follow the brother because he is present at the bedside and is the nearest relative", "Ask the brother and the agent to vote on the plan, with the team breaking any tie", "Choose the plan the team prefers, since the family members disagree and the patient cannot speak", "Wait for a court to appoint a guardian before making any decision about her care", "Contact the named agent, who decides, guided by the patient's own known wishes and documents"], "k": 4, "e": "If there is a named agent, that person decides, and the patient's own voice, such as an advance directive or POLST, comes first. A relative with no legal standing should not override the agent. The agent's task is substituted judgment, meaning what the patient would choose."}, {"c": 26, "s": "Ch 26, section Capacity, surrogates, and advance directives", "q": "A 82-year-old man with advanced frailty has a signed do-not-resuscitate order and develops pneumonia. His daughter asks whether the order means the team will stop all treatment. What is the best response?", "o": ["Confirm that all other treatments will now stop, since the order limits his care", "Explain that code status is an order about resuscitation only, and ask what he wants for the rest of his care", "Treat the order as a statement that his goals are comfort only, so antibiotics and hospital care are not offered", "Remove the order so that full treatment can resume, since pneumonia is treatable", "Avoid answering until the next day, when the primary team can discuss the plan"], "k": 1, "e": "Code status is an order, not a goal. A do-not-resuscitate patient can still receive intensive treatment, antibiotics and surgery, and a full-code patient can choose comfort-focused care for everything else. Always ask about the whole picture and not just the arrest."}, {"c": 26, "s": "Ch 26, section Withholding and withdrawing treatment", "q": "A family has agreed to withdraw ventilator support for a patient. They ask what to expect. Which explanation is best?", "o": ["Death will always occur within minutes of the ventilator being turned off", "The patient will certainly show no change in breathing once support is withdrawn", "Nothing unusual will happen, so no preparation of the family is needed before the support is withdrawn", "The timing of death varies, breathing may change, and the team will stay available", "The team will leave the family alone during the process, to give them privacy"], "k": 3, "e": "Explain what you expect to see so the family is not surprised by breathing patterns, and stay available. Comfort orders should be in place before the change. The timing of death varies, and claiming it will be quick or that nothing will change is inaccurate."}, {"c": 26, "s": "Ch 26, section Withholding and withdrawing treatment", "q": "A surrogate insists on a treatment that the physician believes cannot work. The physician is tempted to argue that it is futile. What is the best approach?", "o": ["Argue about the meaning of the word futility until the surrogate finally agrees to stop the treatment", "Unilaterally withdraw the treatment without telling the surrogate about the decision", "Ignore the request and continue the treatment silently, giving the surrogate no explanation or alternative plan", "Transfer the conflict to the nursing staff so the physician can avoid the discussion", "Explain what the treatment can and cannot do, offer alternatives, and use an ethics consult if conflict persists"], "k": 4, "e": "Arguing about the word futile rarely helps; explain the treatment's limits and offer alternatives. If the conflict persists, use the hospital process, usually an ethics consult and a second opinion. Treatment should not be withdrawn against the stated wishes of a valid surrogate unless policy and law explicitly allow it."}, {"c": 26, "s": "Ch 26, section Hospice referral and the dying patient", "q": "A patient with advanced illness is being transferred home with hospice. The ambulance can leave late in the evening. Which preparation is most important before he leaves?", "o": ["Wait until the family arrives home to arrange comfort medications, and let hospice sort out any gaps in the plan", "Confirm hospice acceptance, comfort medications at home or en route, a 24-hour number, and code status paperwork", "Provide only a verbal handoff to the family, since written papers can follow later", "Transfer him late at night so that traffic is lighter and the trip is quicker", "Cancel all medications before leaving, to simplify the hospice's first visit"], "k": 1, "e": "A failed hospice transition shows up as a patient who cannot get comfort medication for hours or a family who does not know whom to call. Confirming acceptance, medications, a 24-hour number and travelling code status prevents this. A patient can die in transit, so transfers early in the day are preferred."}, {"c": 27, "s": "Ch 27, section The safe discharge: readiness and checklist", "q": "On the day of discharge, a medically stable 80-year-old woman admitted with pneumonia mentions that she lives alone on a third floor with no elevator and cannot afford her new inhaler. Which earlier action would have prevented this delay?", "o": ["Waiting until the final day to assess social needs, once the medical problem is resolved and the orders are written", "Discharging her first and arranging services afterward, when the home needs become clear", "Beginning discharge planning on the day of admission, asking about living situation, help, function and medicines", "Assuming that stable vital signs mean she is ready, without asking about home", "Asking only the family about the home, without involving the patient"], "k": 2, "e": "A safe discharge starts at admission. Asking early where the patient lives, who helps, and what would make going home unsafe turns surprises into plans. Learning these facts on the last afternoon turns a medically ready patient into a delayed one."}, {"c": 27, "s": "Ch 27, section The safe discharge: readiness and checklist", "q": "A 79-year-old woman with heart failure is stable on oral therapy. Physical therapy reports that she needs help to rise from a chair, and she lives with a husband who has memory loss. Which assessment best describes her readiness?", "o": ["Medical stability alone is not readiness; function, caregiver capacity and home safety must be addressed first", "She is ready, because medical stability is all that matters for discharge to home", "She is ready, because the husband can manage any task she needs help with", "She should go home and receive therapy only if she falls or loses function later", "She needs a facility regardless of her wishes or her husband's ability, because therapy has found a need"], "k": 0, "e": "Medical stability is not the same as readiness. Therapy findings on transfers and the caregiver's ability must be matched to the plan, with services or a facility arranged when needed. A frail patient sent home alone can fall on the first night."}, {"c": 27, "s": "Ch 27, section The safe discharge: readiness and checklist", "q": "A 76-year-old man recovering from a urinary infection is still intermittently confused, and his delirium has not cleared. He is otherwise stable. How does this affect discharge planning?", "o": ["It is irrelevant because the infection is treated and his vital signs are stable", "It requires keeping him in hospital until fully back to baseline, with no exceptions", "It changes the plan, since uncleared delirium or inability to follow a regimen affects which supports are safe", "It means he must go to a long-term facility permanently, whatever his recovery, his family's wishes or the home situation", "It is a reason to add a sedative before discharge so that he stays calm at home"], "k": 2, "e": "Cognition is part of readiness. Delirium that has not cleared, or dementia that prevents following a regimen, changes the plan and the supports needed. The geriatric statement supports multicomponent nonpharmacologic delirium programs and avoiding delirium-inducing drugs."}, {"c": 27, "s": "Ch 27, section The safe discharge: readiness and checklist", "q": "It is Friday afternoon. A patient with a new drug, a test still pending and no follow-up date asks to go home. The pharmacy and clinic are closing. What is the best approach?", "o": ["Complete what is possible tonight, such as a pharmacy fill and a named call-back, or keep the patient until safe", "Discharge now and ask the patient to arrange everything on Monday when offices reopen", "Discharge now and rely on the laboratory to call the patient if the pending result turns out to be abnormal and nobody else follows it", "Cancel the pending test to simplify the discharge, since it can be repeated later", "Discharge now and hope the patient returns if there is a problem over the weekend"], "k": 0, "e": "Sending a patient home late on a Friday with a new drug, a pending test and no follow-up is a classic error. If the steps cannot be completed safely before the weekend, do what can be done tonight or keep the patient. Speed is not the goal of discharge, safety is."}, {"c": 27, "s": "Ch 27, section The safe discharge: readiness and checklist", "q": "A hospitalist is deciding which patients need the most intensive discharge support. Which patient is most likely to be high risk?", "o": ["A patient admitted once for a short, uncomplicated stay, with a caregiver at home and a clear follow-up plan", "A patient with one chronic illness and a stable regimen that has not changed in a long time", "A healthy patient with a simple procedure and no new medicines at discharge", "A patient with several chronic illnesses, recent admissions, many medicines and no caregiver", "A patient with a clear understanding, strong support and few medicines to manage"], "k": 3, "e": "No validated readmission tool is given, so risk is judged by adding up factors such as multiple chronic illnesses, recent admissions, many medicines, a high-risk drug, cognitive impairment, no caregiver, low health literacy, a new serious diagnosis and a long stay. The others have few or no risk factors."}, {"c": 27, "s": "Ch 27, section Discharge summaries and handoff to primary care", "q": "A discharge summary for a patient with two pending cultures says \"follow pending labs.\" What is wrong with this entry?", "o": ["It is accurate and sufficient because the primary care clinician will see the results", "It should mention only results that are normal, since abnormal results will be reported separately", "It assigns no one; each result should list the test, why it matters and who is responsible", "It should wait for the patient's next admission, when the cultures can be reviewed", "It should remove the pending items to shorten the summary and keep it easy to read"], "k": 2, "e": "A summary that says \"follow pending labs\" assigns no person. Each pending result should include the test, the date sent, why it matters, who is responsible and what to do with each result. A result with no named owner is a missed result waiting to happen."}, {"c": 27, "s": "Ch 27, section Discharge summaries and handoff to primary care", "q": "A hospitalist is drafting a discharge summary for a primary care clinician. Which approach best serves the reader?", "o": ["Include a day-by-day diary of the entire stay so that nothing is left out for the reader", "List only the principal diagnosis and nothing else, to keep the summary short for the reader", "Write \"follow up as needed\" for all items, so the clinician can decide what is needed", "Leave out the medicine changes and their reasons if a full list is attached, since the reader can compare them and the list is complete", "Give brief reasoning for decisions, medicine changes and reasons, follow-up with responsible people, and no diary"], "k": 4, "e": "A short, useful, on-time summary does more good than a long one nobody reads. The course should be summarized with its reasoning, and medicine changes should carry reasons and monitoring. \"Follow up as needed\" and unexplained changes leave the next clinician guessing."}, {"c": 27, "s": "Ch 27, section Discharge summaries and handoff to primary care", "q": "A frail patient is being sent to a skilled nursing facility late in the day after a complex stay. Which handoff is best?", "o": ["Send only a written summary to arrive after the first evening of care at the facility", "Send the patient with no information and let the facility call the hospital back if it needs anything", "Provide a verbal report only, with no written medication list or code status document", "Give the family the paperwork and ask them to forward it to the facility's physician", "Send the summary, medication changes and code status, and speak to the receiving clinician or nurse"], "k": 4, "e": "For complex patients a call or secure message adds to the written summary, which could arrive after the first visit. The receiving team needs the code status, the medication list and the monitoring plan. A transfer with no medication list or code status can go wrong overnight."}, {"c": 27, "s": "Ch 27, section Discharge summaries and handoff to primary care", "q": "A patient with advanced lung disease and a signed POLST form is being discharged to a facility. What is the best way to handle the document?", "o": ["Leave it in the hospital chart, where the receiving team can request it if needed", "Include the POLST form and named decision-maker in the summary so the receiving team can honor it", "Replace it with a verbal note to the family, who can pass the wishes on to the facility staff when the patient arrives", "Mention only that the patient is \"full code\" and leave the other details out", "Remove it because it applies only in the hospital and has no force at a facility"], "k": 1, "e": "For seriously ill patients the summary should include the goals discussion, the named decision-maker and any POLST form. A signed POLST is an actionable medical order for people with serious, chronic or progressive illness or advanced frailty. A receiving team that does not see it cannot honor it."}, {"c": 27, "s": "Ch 27, section Medication reconciliation at discharge", "q": "A pharmacist asks about the best way to learn what a patient took before admission. Which approach is most reliable?", "o": ["Rely solely on the previous hospital record, since a clinician already entered it and it is likely to be complete and thorough", "Ask the patient, caregiver and pharmacy, and inspect the bottles, including over-the-counter drugs and supplements", "Ask only about prescription drugs, since over-the-counter products rarely matter for admission", "Use only the hospital medication record, since it lists everything the patient receives", "Skip this step if the patient seems well, since a healthy patient takes few drugs"], "k": 1, "e": "Medication reconciliation builds one accurate list from three sources: before admission, in hospital and at discharge. The pre-admission list should reflect what the patient actually took, not only what the record says. Over-the-counter drugs and supplements must be included."}, {"c": 27, "s": "Ch 27, section Medication reconciliation at discharge", "q": "A 81-year-old woman is being discharged on an opioid, a benzodiazepine, a sedating antihistamine and a sleep drug. Which Beers criteria concern applies?", "o": ["Opioids are advised only when combined with benzodiazepines in older adults, to ensure that pain is controlled in every patient", "Sedating antihistamines are recommended for delirium, because they calm the patient", "Several central nervous system drugs together are preferred for better control of pain, sleep and anxiety", "Avoiding opioids with benzodiazepines, and avoiding three or more central nervous system drugs, in older adults", "There is no concern because each drug is individually approved for use in adults"], "k": 3, "e": "The Beers summary advises avoiding opioids with benzodiazepines, first-generation antihistamines in those at risk of delirium, and three or more central nervous system drugs in older adults. It is a screen, not a ban, so use judgment about the individual. The row is provisional, so check the primary text."}, {"c": 27, "s": "Ch 27, section Medication reconciliation at discharge", "q": "A 74-year-old man with diabetes is on sliding-scale insulin alone in hospital. The team plans to send him home on the same approach. What is the main concern from the Beers summary?", "o": ["Sliding-scale insulin alone causes more hypoglycemia without better control", "It gives better glucose control but costs more and needs more nursing time", "It is the preferred home regimen for older adults because it is flexible", "It causes less hypoglycemia than basal regimens because doses follow each reading", "It is recommended for patients who cannot self-monitor, since nurses are not needed"], "k": 0, "e": "The Beers summary advises that sliding-scale insulin alone carries more hypoglycemia without better glucose control, so it is a poor home plan. The regimen should match the discharge diet and glucose pattern, with teaching on recognizing hypoglycemia. The other options reverse the finding."}, {"c": 27, "s": "Ch 27, section Medication reconciliation at discharge", "q": "A resident notes that one guideline advises against extending pharmacologic prophylaxis after discharge in acutely ill medical patients, whereas a rivaroxaban label describes an extended regimen. How should this be handled?", "o": ["Always follow the label because it is newer and carries regulatory weight", "Always follow the guideline because it is written by a professional society and reviewed by experts", "Choose whichever is cheaper for the hospital and the patient", "Recognize that the sources disagree, read both texts and hospital policy, and assume neither is right", "Ignore both and continue prophylaxis indefinitely, since longer is always safer"], "k": 3, "e": "Two ledger rows point in different directions: the guideline, read at abstract level, advises against extension, and the label describes a regimen that continues after discharge. The text does not choose a winner. The sensible step is to read both primary sources and your hospital policy before deciding."}, {"c": 27, "s": "Ch 27, section Medication reconciliation at discharge", "q": "A 70-year-old man received a stress ulcer prophylaxis drug in the hospital for a stay in the medical ward, and has no gastrointestinal bleeding risk. What should happen at discharge?", "o": ["Continue it indefinitely to be safe, since acid suppression is harmless and may prevent bleeding at home", "Increase the dose for the home setting, where he will be less closely watched", "Continue it until the next primary care visit with no review of why it was started or whether it is still needed", "Switch to a second acid-lowering drug that is easier to take at home", "Stop it as a hospital-only drug, since it is not advised for medical inpatients at low gastrointestinal risk"], "k": 4, "e": "Deprescribing is part of reconciliation. Drugs started in hospital for a hospital-only reason, such as stress ulcer prophylaxis, should be stopped unless risk is high. Both the Choosing Wisely row and the Beers row on long courses of acid suppression are provisional, so verify them before teaching."}, {"c": 27, "s": "Ch 27, section Skilled nursing, home health, and rehabilitation decisions", "q": "A 78-year-old man after a hospitalization needs daily skilled nursing and therapy but cannot tolerate intensive therapy sessions. Which setting best fits?", "o": ["Inpatient rehabilitation", "A skilled nursing facility", "Home with self-care and no services", "Long-term custodial care only", "Hospice, regardless of his goals"], "k": 1, "e": "A skilled nursing facility fits a patient who needs skilled nursing or therapy but not intensive rehabilitation. Inpatient rehabilitation suits a patient who can tolerate intense therapy and has a goal. The choice should follow function and need, not just the diagnosis, and coverage criteria need a reviewed source."}, {"c": 27, "s": "Ch 27, section Skilled nursing, home health, and rehabilitation decisions", "q": "A 77-year-old woman with capacity declines a recommended skilled nursing facility and wants to go home. What is the best approach?", "o": ["Override her decision and send her to the facility against her wishes, because the team knows what is safest for her", "Discharge her without further discussion, since she has made her choice", "Explain the risks, find her reason, offer the next best option, document, and arrange the safest plan she will accept", "Declare her lacking capacity because she disagrees with the team's recommendation", "Withhold services until she changes her mind about going to the facility"], "k": 2, "e": "A patient with capacity may refuse a facility or services. The role of the physician is to explain the risks, understand the reason, offer alternatives and document. Disagreement alone does not prove lack of capacity."}, {"c": 27, "s": "Ch 27, section Preventing readmission", "q": "A reviewer states that every readmission shows a failure of care. How should you respond?", "o": ["Agree, since all readmissions are preventable and every return to hospital proves that the discharge process failed", "Not every readmission is a failure; some reflect disease progression or patient choice, and the aim is to find preventable ones", "Agree, but only for heart failure, where readmissions are always a sign of poor care", "Disagree, because readmissions never reflect hospital care, since they are caused only by disease", "Disagree, because readmissions are never a quality concern for any hospital or condition"], "k": 1, "e": "Readmission is costly and often avoidable, but not every return is a failure. Disease progression, patient choice and planned returns are not failures. The task is to look for the preventable ones."}, {"c": 27, "s": "Ch 27, section Preventing readmission", "q": "A hospital team focuses its transition efforts only on the six condition
