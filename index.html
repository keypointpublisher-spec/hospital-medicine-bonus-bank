s in the Medicare readmissions program. What is the best advice?", "o": ["Focus only on the six conditions and ignore the others, since only they are penalized", "Delay discharges to lower readmission counts, even when patients are ready to leave", "Discharge sooner to avoid penalties, since a shorter stay cannot lead to a readmission", "Use the checklist only for patients with insurance, since only they count toward penalties or payments", "Use the same checklist for every high-risk patient, and time discharge by safety rather than penalty"], "k": 4, "e": "Treating the penalty rather than the patient is an error. The same transition steps help every high-risk patient. A rule built to reduce readmissions should not delay discharge for a penalty or hurry a patient out."}, {"c": 27, "s": "Ch 27, section Follow-up of pending results", "q": "A urine culture result that returns after discharge shows an organism resistant to the antibiotic the patient is taking. The patient did not answer the first call. What is the best next step?", "o": ["Leave a note in the chart and take no further action, because the patient has already left the hospital and can call if worried", "Wait until the next scheduled visit, when the result can be discussed in person", "Assume the result is a contaminant, since the patient has already gone home", "Try a second contact, involve the primary care clinician, record attempts, and arrange the needed follow-up", "Ask the laboratory to cancel the result, since the patient was discharged already"], "k": 3, "e": "If a pending result calls for a change after the patient has left, reach the patient and not only the chart. Use a second contact and the primary care clinician, record each attempt, and arrange the needed follow-up. Passive documentation alone leaves the patient unprotected."}, {"c": 27, "s": "Ch 27, section Follow-up of pending results", "q": "A chest CT during a hospital stay for pneumonia shows an incidental small lung nodule unrelated to the admission. The patient is about to be discharged. What is the best way to prevent it from being lost?", "o": ["Record the finding, follow-up and responsible clinician in the summary and instructions, and tell her in words she can repeat", "Mention it only in the radiology report, where the primary care clinician can find it if they look", "Tell only the family and not the patient, so that they can decide how to explain it", "Leave it for the primary care clinician to discover at the first outpatient visit", "Omit it from the summary and instructions because it is unrelated to the pneumonia and the reason for admission"], "k": 0, "e": "An incidental nodule, mass or abnormal lab is easy to lose at discharge. The finding, the follow-up and the responsible person belong in the summary and in the patient's instructions, explained in words she can repeat. Specific follow-up intervals are not printed in the text, so they should come from the relevant guideline."}], "titles": {"1": "Admission, Triage, and the Hospitalist's Daily Workflow", "2": "Clinical Reasoning, Test Interpretation, and Diagnostic Error", "3": "Ischemic Heart Disease and Acute Coronary Syndromes", "4": "Heart Failure, Arrhythmias, and Syncope", "5": "Valvular Disease, Endocarditis, Pericardial and Vascular Disease, and Hypertensive Emergencies", "6": "Obstructive Lung Disease, Pneumonia, and Respiratory Failure", "7": "Pulmonary Embolism, Pleural, Interstitial, and Pulmonary Vascular Disease", "8": "Critical Care for the Hospitalist: Sepsis, Shock, and Ventilation", "9": "Infections in the Hospitalized Patient and Antimicrobial Stewardship", "10": "Gastrointestinal Bleeding and Luminal, Pancreatic, and Biliary Disease", "11": "Liver Disease and Cirrhosis", "12": "Acute Kidney Injury and Chronic Kidney Disease", "13": "Fluids, Electrolytes, and Acid-Base Disorders", "14": "Urinary Tract Disease, Stones, and Genitourinary Infection", "15": "Diabetes, Hypoglycemia, and Thyroid, Adrenal, Calcium, and Pituitary Disorders", "16": "Hematology, Anticoagulation, Transfusion, and Oncologic Complications", "17": "Neurologic Disorders in the Hospitalized Patient", "18": "Allergic, Immunologic, Dermatologic, and Rheumatologic Disorders", "19": "Perioperative Medicine I: Risk Assessment, Cardiac and Pulmonary Care", "20": "Perioperative Medicine II: Hematologic, Endocrine, Neurologic, Renal, and Infectious Issues", "21": "Co-Management Beyond Surgery and Pregnancy in the Hospitalized Patient", "22": "Delirium, Falls, Immobility, and the Older Inpatient", "23": "Healthcare-Associated Infections and Hospital-Based Prevention", "24": "Medication Safety and Adverse Drug Effects", "25": "Quality, Value-Based Care, Communication, and Error Disclosure", "26": "Palliative Care, Ethics, Pain, and Hospice", "27": "Discharge, Transitions of Care, and Readmission"}}</script>
<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
var Q=P.q,T=P.titles,NCH=Object.keys(T).length;window.BANK=Q;
var app=document.getElementById('app');
var perf={}; // in memory only
var S=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function ids(ch){var r=[];for(var i=0;i<Q.length;i++)if(ch==null||Q[i].c===ch)r.push(i);return r}
function start(list,label){S={list:list,pos:0,label:label,ans:{},sel:{},rev:{}};render()}
function home(){
 S=null;var tot=Q.length,done=0,right=0;for(var k in perf){done++;if(perf[k])right++}
 var h='<h2>Start a set</h2><div class="row modes"><button class="primary" id="mix">Mixed set: 20 random questions</button><button id="weak">Weak-area drill: 20 questions</button></div>';
 h+='<p class="tag">The weak-area drill starts with questions you missed in this session, then fills the set from the chapters where you have scored lowest. Your score is kept only while this page is open.</p>';
 if(done)h+='<div class="score">This session: '+right+' correct of '+done+' answered ('+Math.round(100*right/done)+'%).</div>';
 h+='<h2>Choose a chapter</h2><ul class="chs">';
 for(var c=1;c<=NCH;c++){var n=ids(c).length;h+='<li><button class="name" data-ch="'+c+'">Chapter '+c+'. '+esc(T[c])+' <span>('+n+' questions)</span></button><button class="rnd" data-rnd="'+c+'" title="20 random questions from this chapter">Random 20</button></li>'}
 h+='</ul>';app.innerHTML=h;
 document.getElementById('mix').onclick=function(){start(shuffle(ids()).slice(0,20),'Mixed set')};
 document.getElementById('weak').onclick=weak;
 app.querySelectorAll('[data-ch]').forEach(function(b){b.onclick=function(){var c=+b.dataset.ch;start(ids(c),'Chapter '+c)}});
 app.querySelectorAll('[data-rnd]').forEach(function(b){b.onclick=function(){var c=+b.dataset.rnd;start(shuffle(ids(c)).slice(0,20),'Chapter '+c+', random 20')}});
 window.scrollTo(0,0)}
function weak(){
 var missed=[],i;for(i=0;i<Q.length;i++)if(perf[i]===false)missed.push(i);
 var list=shuffle(missed).slice(0,20);
 if(list.length<20){var st={};for(i=0;i<Q.length;i++){if(perf[i]!==undefined){var c=Q[i].c;st[c]=st[c]||[0,0];st[c][1]++;if(perf[i])st[c][0]++}}
  var order=Object.keys(st).map(Number).sort(function(a,b){return st[a][0]/st[a][1]-st[b][0]/st[b][1]});
  var pool=[];order.forEach(function(c){shuffle(ids(c)).forEach(function(j){if(list.indexOf(j)<0&&perf[j]===undefined)pool.push(j)})});
  var rest=shuffle(ids()).filter(function(j){return list.indexOf(j)<0&&pool.indexOf(j)<0&&perf[j]===undefined});
  pool=pool.concat(rest);while(list.length<20&&pool.length)list.push(pool.shift())}
 start(list,'Weak-area drill')}
function render(){
 if(S.pos>=S.list.length)return summary();
 var qi=S.list[S.pos],q=Q[qi],rev=S.rev[qi],sel=S.sel[qi];
 var h='<div class="bar"><span>'+esc(S.label)+': question '+(S.pos+1)+' of '+S.list.length+'</span><span id="sc"></span></div>';
 h+='<div class="tag">Chapter '+q.c+(q.s?', '+esc(q.s.replace(/^Ch \d+,?\s*/,'').replace(/^section /i,'Section ')):'')+'</div>';
 h+='<p class="stem" id="stem">'+esc(q.q)+'</p><ul class="opts">';
 for(var i=0;i<5;i++){var cl='opt';if(rev){if(i===q.k)cl+=' right';else if(i===sel)cl+=' wrong'}else if(i===sel)cl+=' sel';
  h+='<li><button class="'+cl+'" data-o="'+i+'"'+(rev?' disabled':'')+'><span class="l">'+'ABCDE'[i]+'</span><span>'+esc(q.o[i])+'</span></button></li>'}
 h+='</ul><div class="row"><button class="primary" id="show"'+(rev?' disabled':'')+'>Show Answer</button><button id="jump">Jump to explanation</button></div>';
 h+='<div id="ex" class="exp'+(rev?'':' hidden')+'"><div id="verdict" class="verdict"></div><h3>Explanation (correct answer: '+'ABCDE'[q.k]+')</h3><div>'+esc(q.e)+'</div><div class="row"><button id="back">Back to question</button></div></div>';
 h+='<div class="row"><button id="prev"'+(S.pos?'':' disabled')+'>Previous</button><button id="next">'+(S.pos===S.list.length-1?'Finish':'Next')+'</button><button id="quit">Quit to menu</button></div>';
 app.innerHTML=h;score();if(rev)verdict(qi);
 app.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(){S.sel[qi]=+b.dataset.o;render()}});
 document.getElementById('show').onclick=function(){reveal(qi)};
 document.getElementById('jump').onclick=function(){if(!S.rev[qi])reveal(qi);document.getElementById('ex').scrollIntoView({behavior:'smooth',block:'start'})};
 document.getElementById('back').onclick=function(){document.getElementById('stem').scrollIntoView({behavior:'smooth',block:'start'})};
 document.getElementById('prev').onclick=function(){S.pos--;render();window.scrollTo(0,0)};
 document.getElementById('next').onclick=function(){S.pos++;render();window.scrollTo(0,0)};
 document.getElementById('quit').onclick=home}
function reveal(qi){var q=Q[qi];S.rev[qi]=true;if(S.sel[qi]!==undefined){perf[qi]=(S.sel[qi]===q.k)}var p=S.pos;render();
 document.getElementById('ex').classList.remove('hidden')}
function verdict(qi){var q=Q[qi],v=document.getElementById('verdict'),s=S.sel[qi];
 if(s===undefined){v.className='verdict';v.textContent='You did not choose an answer, so this question is not scored.'}
 else if(s===q.k){v.className='verdict ok';v.textContent='Correct.'}else{v.className='verdict no';v.textContent='Not quite. You chose '+'ABCDE'[s]+'.'}}
function score(){var n=0,r=0;S.list.forEach(function(i){if(S.rev[i]&&S.sel[i]!==undefined){n++;if(S.sel[i]===Q[i].k)r++}});document.getElementById('sc').textContent='Score: '+r+' / '+n}
function summary(){
 var n=0,r=0,by={},missed=[];S.list.forEach(function(i){if(S.rev[i]&&S.sel[i]!==undefined){n++;var c=Q[i].c;by[c]=by[c]||[0,0];by[c][1]++;if(S.sel[i]===Q[i].k){r++;by[c][0]++}else missed.push(i)}});
 var h='<h2>Set complete</h2><div class="score">'+esc(S.label)+': '+r+' correct of '+n+' scored'+(n?' ('+Math.round(100*r/n)+'%)':'')+' out of '+S.list.length+' questions.</div>';
 var keys=Object.keys(by).map(Number).sort(function(a,b){return a-b});
 if(keys.length){h+='<table><tr><th>Chapter</th><th>Correct</th></tr>';keys.forEach(function(c){h+='<tr><td>'+c+'. '+esc(T[c])+'</td><td>'+by[c][0]+' / '+by[c][1]+'</td></tr>'});h+='</table>'}
 h+='<div class="row"><button class="primary" id="rev"'+(missed.length?'':' disabled')+'>Review missed ('+missed.length+')</button><button id="again">Repeat this set</button><button id="menu">Back to menu</button></div>';
