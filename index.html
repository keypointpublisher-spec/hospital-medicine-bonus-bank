mbolus", "Get an MRI of the spine now, and ask about leg weakness and bladder function"], "k": 4, "e": "Back pain with fever in a bacteremic patient deserves an MRI before the deficit appears. Plain films lag by weeks. A new neurologic deficit makes epidural abscess a surgical emergency."}, {"c": 9, "s": "Ch 9, section Bone, joint, and prosthetic infection", "q": "A 70-year-old with a chronic heel ulcer and suspected osteomyelitis has a swab of the ulcer surface that grows mixed skin organisms. What should be done?", "o": ["Treat the organisms grown on the swab with matching drugs", "Send tissue or bone for culture rather than the swab", "Repeat the swab weekly until a single organism grows", "Treat all organisms with the broadest agent available, and skip bone culture", "Culture only the dressing and the surrounding skin"], "k": 1, "e": "A swab from the surface of a chronic ulcer grows skin and environmental organisms and does not show what is in the bone. Bone biopsy or surgical culture gives the organism and guides therapy."}, {"c": 9, "s": "Ch 9, section Bone, joint, and prosthetic infection", "q": "A stable 74-year-old man has a chronic painful prosthetic knee with drainage. When should antibiotics be started?", "o": ["Immediately, before any cultures are taken, to protect the implant", "Never; surgery alone is enough once the implant is removed", "Only after the surgeon has decided with certainty that the implant will be retained", "After a swab of the sinus tract has been sent for culture", "After tissue or joint fluid cultures, with an orthopedic plan for the implant"], "k": 4, "e": "In a stable patient with a chronic prosthetic infection, starting antibiotics before obtaining tissue or fluid cultures lowers the chance of identifying the organism. Late or chronic infection usually needs implant exchange or removal, because biofilm protects bacteria on the device."}, {"c": 9, "s": "Ch 9, section Antimicrobial selection, de-escalation, and duration", "q": "A 38-year-old woman is labeled penicillin-allergic because of a remote, unclear childhood rash. What is the best stewardship approach?", "o": ["Avoid penicillins for life, since a remote rash may recur", "Treat any reaction as anaphylaxis and avoid all beta-lactams", "Take a careful history; a low-risk history may be tested or challenged", "Remove the label without asking anything or reviewing the record", "Give a broader drug whenever the label is present, whatever the history"], "k": 2, "e": "Most patients labeled penicillin-allergic are not allergic. Patients with severe reactions such as anaphylaxis or severe skin reactions should avoid the drug, while remote, mild or unclear reactions can be tested or challenged. A wrong label causes broader, more toxic and costlier therapy."}, {"c": 9, "s": "Ch 9, section Antimicrobial selection, de-escalation, and duration", "q": "A catheterized 80-year-old man is afebrile and has no urinary symptoms or sepsis. His urine culture is positive. What is the best approach?", "o": ["Treat with a broad antibiotic for a full course to clear the bacteriuria", "Treat symptoms and signs, not the culture; usually no treatment is needed", "Change the catheter and add a second antibiotic to cover resistant organisms", "Repeat the culture daily until it turns negative", "Start an antifungal for possible yeast"], "k": 1, "e": "Bacteria in the urine of a patient with no urinary symptoms and no sepsis usually do not need treatment, and catheter urine often grows bacteria. Treating the culture exposes the patient to harm without benefit."}, {"c": 9, "s": "Ch 9, section Clostridioides difficile and drug-resistant organisms", "q": "A patient with Clostridioides difficile infection is on a ward. Which care is appropriate?", "o": ["Alcohol hand rub alone, because it reliably kills spores on the hands of staff", "Airborne precautions in a negative-pressure room, with alcohol hand rub", "Contact precautions with soap-and-water hand hygiene; avoid antimotility drugs", "Antimotility drugs to reduce diarrhea and limit environmental spread", "No precautions once treatment has started and diarrhea is improving"], "k": 2, "e": "Alcohol does not kill spores, so soap and water is used along with contact precautions. Antimotility drugs are avoided in active infection. Cases should also reach infection prevention."}, {"c": 9, "s": "Ch 9, section Clostridioides difficile and drug-resistant organisms", "q": "A 66-year-old man's Clostridioides difficile diarrhea has resolved on treatment. A resident wants to repeat the stool test to confirm cure. What is the best response?", "o": ["Do not retest; a positive result can reflect residual spores or DNA", "Retest weekly and continue treatment until the result finally turns negative", "Extend treatment by several weeks to be certain of clearance", "Add a second antibiotic to clear residual spores", "Isolate the patient indefinitely until the test turns negative"], "k": 0, "e": "Repeating the test in a patient who is better can return a positive result from residual spores or DNA. A new antibiotic given for a minor reason can also prolong diarrhea and invite recurrence."}, {"c": 9, "s": "Ch 9, section Clostridioides difficile and drug-resistant organisms", "q": "A 72-year-old man with heart failure has a recurrent Clostridioides difficile infection, and the team considers bezlotoxumab as an added measure. Which statement is correct?", "o": ["It is preferred and carries no caution in patients with heart failure", "The FDA cautions about its use in patients with heart failure", "It replaces all antibiotic therapy", "It rules out fidaxomicin", "It is used first, before any antibiotic"], "k": 1, "e": "For recurrence the update suggests fidaxomicin over vancomycin and bezlotoxumab as an added measure, with low or very low certainty, and the FDA has issued a caution for heart failure. It is an addition to antibiotic therapy, not a replacement."}, {"c": 9, "s": "Ch 9, section HIV and the immunocompromised inpatient", "q": "A 45-year-old man with HIV on antiretroviral therapy is admitted and cannot swallow, and his regimen is not on the formulary. What is the best approach?", "o": ["Hold all antiretrovirals until discharge, then restart the usual regimen at home", "Stop the regimen to avoid interactions with the formulary drugs", "Wait until the next outpatient visit to sort out the regimen", "Substitute any available drugs without review by pharmacy or the HIV team", "Check on day one, call pharmacy and the HIV team, and bridge so therapy continues"], "k": 4, "e": "Missed doses lead to viral rebound and resistance, so antiretroviral therapy continues without interruption unless there is a reason to change it. Every new drug should be reviewed with pharmacy because many antiretrovirals boost or reduce other drug levels."}, {"c": 9, "s": "Ch 9, section HIV and the immunocompromised inpatient", "q": "A 55-year-old man receiving chemotherapy has fever and neutropenia. What is the best approach?", "o": ["Wait for a chest film before starting treatment, as a source is needed", "Observe for a day first to see whether the fever settles", "Treat it as an emergency: cultures, then antibiotics at once", "Start an antifungal first, then add antibacterials if the fever persists", "Wait for an infectious disease consult before giving any antibiotic dose"], "k": 2, "e": "Fever in a neutropenic patient is a medical emergency. Immunocompromised patients can have few signs and become septic quickly, and a normal chest film or a missing fever does not exclude infection. Early input from infectious disease helps but should not delay antibiotics."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "A 70-year-old man vomits bright red blood. His pulse is 120 and his pressure is low, but the first hemoglobin is reported as normal. How should this result be interpreted?", "o": ["It may be falsely reassuring in brisk bleeding; trust the pulse and pressure, and repeat it after resuscitation", "It excludes significant bleeding, so resuscitation can wait until the next set of laboratory results is back and reviewed", "It proves the bleeding is slow, so endoscopy can be deferred to the next week", "It means the vomited blood came from the nose or throat rather than from the stomach or upper gut", "It should be repeated only if the patient later becomes drowsy or confused"], "k": 0, "e": "In brisk bleeding, blood volume and red cells fall together, so an early hemoglobin can look normal. The trend and the hemodynamics guide care. Treating the single number as reassurance delays resuscitation."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "Which medication does the 2021 ACG upper gastrointestinal bleeding guideline suggest giving as an infusion before endoscopy to help clear the stomach?", "o": ["Octreotide", "Metoclopramide", "Tranexamic acid", "Erythromycin", "A proton pump inhibitor"], "k": 3, "e": "The guideline suggests an erythromycin infusion before endoscopy (conditional, very low certainty). It makes no recommendation for or against a proton pump inhibitor before the scope, so that option is not the guideline-supported pre-endoscopy drug. Tranexamic acid is not addressed by the guideline."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "A 62-year-old woman admitted with melena has been resuscitated and is hemodynamically stable. The team asks when endoscopy should occur. What does the 2021 ACG guideline suggest?", "o": ["Only after the hemoglobin has stabilized for 72 hours", "Within 24 hours of presentation", "At the next routine endoscopy list in the following week", "Only if she rebleeds after discharge", "Within 24 hours of discharge as an outpatient"], "k": 1, "e": "The guideline suggests endoscopy within 24 hours of presentation. A patient who stays unstable after resuscitation should be scoped sooner, decided with the endoscopist. Delaying to a routine list misses the window in which therapy changes outcomes."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "During endoscopy a duodenal ulcer is found with active bleeding. The endoscopist proposes epinephrine injection as the only treatment. What is the best response?", "o": ["Epinephrine alone is the preferred single therapy for active bleeding", "Endoscopic therapy should be skipped in favor of a proton pump inhibitor alone", "Epinephrine should be given only after embolization has been tried", "A second method is needed only if the patient is on an anticoagulant", "Epinephrine alone is not adequate; it should be combined with a second endoscopic method"], "k": 4, "e": "For active bleeding or a visible vessel the guideline gives a strong recommendation for endoscopic therapy, and epinephrine injection alone is not enough. A second method should be added. A proton pump inhibitor supports therapy but does not replace it."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "A man with a bleeding ulcer has had endoscopic therapy twice and continues to bleed. What is the next step?", "o": ["A third identical endoscopic attempt only, with no other service involved", "Switching from a proton pump inhibitor to an H2 blocker", "Transcatheter arterial embolization, with surgery as the backstop", "Observation for 48 hours before involving any other service", "Starting a vasoactive drug as the standard ulcer rescue"], "k": 2, "e": "When endoscopic therapy fails, the next step is transcatheter arterial embolization, with surgery as the backstop. Calling interventional radiology and surgery early keeps those options open. Changing acid suppression does not address ongoing arterial bleeding."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "A 41-year-old man presents with epigastric discomfort and a single episode of dark stool. He is hemodynamically stable and his Glasgow-Blatchford score is 0. What is the most appropriate disposition?", "o": ["Admit to the intensive care unit for close hemodynamic monitoring and repeat bloods", "Discharge for outpatient evaluation, as suggested for very low risk patients", "Admit for urgent endoscopy within 6 hours", "Keep for 72 hours of observation before any decision about endoscopy", "Transfuse and then discharge regardless of the initial hemoglobin or symptoms"], "k": 1, "e": "The ACG guideline suggests very low risk patients, for example a score of 0 to 1, can be managed as outpatients (conditional, very low certainty). Intensive care or urgent endoscopy would be reserved for unstable patients, ongoing bleeding, or serious comorbidity."}, {"c": 10, "s": "Ch 10, section Lower gastrointestinal bleeding", "q": "A 68-year-old man has red stool, a pulse of 125, and a falling blood pressure. The team plans bowel preparation for colonoscopy. What is the best action?", "o": ["Proceed with bowel preparation because red stool always means a lower source", "Order a barium enema to localize the bleeding", "Give a PPI and discharge with outpatient colonoscopy", "Treat as hemorrhoidal bleeding and observe", "Think upper source first and resuscitate before any colonoscopy preparation"], "k": 4, "e": "Brisk upper bleeding can pass as red or maroon stool with shock. An unstable patient with red stool needs resuscitation and consideration of an upper source first. Sending a shocked patient for preparation is the pitfall."}, {"c": 10, "s": "Ch 10, section Upper gastrointestinal bleeding", "q": "Which of the following topics is NOT addressed by the 2021 ACG upper gastrointestinal bleeding guideline as described in this text?", "o": ["The hemoglobin threshold for transfusion", "Timing of endoscopy after presentation", "Testing for and treating Helicobacter pylori", "Erythromycin before endoscopy", "Endoscopic therapy for a visible vessel"], "k": 2, "e": "The guideline does not address tranexamic acid, anticoagulant reversal, antiplatelet management, or H. pylori. The other options are covered by specific statements. Where the guideline is silent, decisions rest on clinical judgment and other sources."}, {"c": 10, "s": "Ch 10, section Acute pancreatitis", "q": "A resident wants to give a patient with acute pancreatitis as much intravenous fluid as fast as possible, citing older teaching. What is the main risk with this approach?", "o": ["Pulmonary edema and abdominal compartment syndrome", "Hypoglycemia and ketosis from reduced oral intake and prolonged fasting", "Impaired gallstone passage through the common bile duct", "Drug-induced pancreatitis from the infused crystalloid", "Hypercalcemia and tetany from dilution of serum calcium"], "k": 0, "e": "The ACG 2024 guideline suggests moderately aggressive rather than very aggressive fluid resuscitation, with reassessment within hours. Overly aggressive fluid risks pulmonary edema and abdominal compartment syndrome. Stop pushing fluid once volume is restored."}, {"c": 10, "s": "Ch 10, section Acute pancreatitis", "q": "A 55-year-old man has severe acute pancreatitis with a sterile inflammatory picture and no documented infection. The team asks about prophylactic antibiotics. What does the guideline suggest?", "o": ["Broad-spectrum antibiotics for all severe cases", "Antibiotics only if the lipase stays high past 72 hours", "Antibiotics for 14 days in all patients with organ failure", "Against prophylactic antibiotics; give antibiotics for documented infection", "Antibiotics only if the patient is also fasting"], "k": 3, "e": "The guideline suggests against prophylactic antibiotics in severe disease (conditional, very low certainty). Antibiotics are for a documented infection, not for inflammation. Elevated lipase or organ failure alone is not an indication."}, {"c": 10, "s": "Ch 10, section Acute pancreatitis", "q": "A patient with acute pancreatitis cannot eat enough by mouth and needs nutrition support. Which route does the ACG 2024 guideline prefer?", "o": ["Parenteral nutrition, to rest the gut completely", "Parenteral nutrition for the first week, then enteral", "Enteral nutrition rather than parenteral nutrition", "Either route, with parenteral preferred in mild disease", "No nutrition until the lipase normalizes"], "k": 2, "e": "When nutrition support is needed, the guideline prefers enteral over parenteral feeding. Parenteral nutrition is for patients who cannot be fed by the gut and carries line, infection, and metabolic risks. Waiting for lipase to normalize is a recognized ward mistake."}, {"c": 10, "s": "Ch 10, section Acute pancreatitis", "q": "A 52-year-old man has gallstone pancreatitis with pain and a high lipase but no fever, jaundice, or evidence of cholangitis. Which approach does the ACG 2024 guideline suggest regarding ERCP?", "o": ["Medical therapy rather than urgent ERCP", "Urgent ERCP in every patient with a high lipase", "ERCP only after the lipase returns to normal", "Percutaneous drainage as first-line therapy", "Immediate surgery before any fluids"], "k": 0, "e": "Without cholangitis, the guideline suggests medical therapy over ERCP within 72 hours (conditional, low certainty). Urgent ERCP is reserved for cholangitis. A high lipase alone does not make ERCP urgent."}, {"c": 10, "s": "Ch 10, section Cholecystitis, cholangitis, and biliary obstruction", "q": "A 74-year-old woman with gallstones has fever, rising bilirubin, and right upper quadrant pain, but no jaundice has yet been noted and her confusion is mild. A colleague says cholangitis cannot be diagnosed without the full classic triad. What is the best response?", "o": ["Wait until all three signs of the classic triad have appeared before calling the endoscopist, since two signs are not enough to act", "Rule out cholangitis because jaundice has not yet been seen and the mental status is normal", "Treat with antibiotics alone and reassess in one week before involving any endoscopist", "The full triad is often absent; suspect cholangitis in a febrile patient with biliary disease and rising bilirubin, and call early", "Order only a repeat lipase and delay imaging until the next routine ward round"], "k": 3, "e": "The full Charcot triad is often missing, and waiting for it delays drainage. Cholangitis is a drainage problem; antibiotics buy time but do not replace ERCP. Suspicion should be high in any febrile patient with biliary disease and a rising bilirubin."}, {"c": 10, "s": "Ch 10, section Cholecystitis, cholangitis, and biliary obstruction", "q": "A patient with cholangitis is hypotensive and confused. Antibiotics and fluids have been started, but ERCP is not available at the hospital. What is the best alternative?", "o": ["Continue antibiotics alone until ERCP can be scheduled next week", "Percutaneous biliary drainage by interventional radiology or transfer for drainage", "Order a repeat ultrasound and wait for the next morning", "Stop antibiotics to avoid masking the culture result", "Start a proton pump inhibitor and observe"], "k": 1, "e": "Cholangitis requires biliary drainage, and antibiotics alone do not substitute for it. If ERCP is not available, percutaneous drainage by interventional radiology is the alternative. Delay risks septic shock within hours."}, {"c": 10, "s": "Ch 10, section Lower gastrointestinal bleeding", "q": "What is the purpose of the Oakland score in lower gastrointestinal bleeding, as described in the 2023 summary?", "o": ["To decide the hemoglobin threshold for transfusion", "To choose the bowel preparation regimen", "To predict the need for emergency surgery in all patients", "To determine whether tranexamic acid is indicated", "To estimate the chance of safe early discharge"], "k": 4, "e": "The Oakland score is a tool to estimate the likelihood of safe early discharge in lower bleeding. It does not set a transfusion threshold or choose preparation. Patients who are unstable or have ongoing bleeding are admitted regardless."}, {"c": 10, "s": "Ch 10, section Lower gastrointestinal bleeding", "q": "A 66-year-old man admitted with painless hematochezia has stopped bleeding and is hemodynamically stable. Which colonoscopy plan is supported by the 2023 ACG guideline summary?", "o": ["Emergency colonoscopy within hours without preparation", "Colonoscopy only after one year of observation", "No colonoscopy, with a barium study instead", "Nonurgent inpatient colonoscopy after adequate preparation", "Colonoscopy only if he becomes hypotensive"], "k": 3, "e": "For most patients the guideline favors nonurgent inpatient colonoscopy, since urgent colonoscopy within 24 hours has not been shown to improve outcomes. Preparation and stability make the examination safer and more accurate. Emergency unprepared examination offers no proven advantage."}, {"c": 10, "s": "Ch 10, section Lower gastrointestinal bleeding", "q": "A patient on an anticoagulant with a life-threatening lower gastrointestinal bleed receives a prothrombin complex concentrate. Which new problem should prompt immediate concern afterward?", "o": ["A fall in serum sodium from dilution of the plasma volume", "Chest pain, a swollen leg, or stroke signs from a thrombotic complication", "New hypoglycemia from impaired hepatic glucose output", "A rise in serum bilirubin only, with no clinical signs of any other complication", "Severe diarrhea from the volume of the concentrate infused"], "k": 1, "e": "The prothrombin complex concentrate label carries a boxed warning for arterial and venous thromboembolic complications. New chest pain, a swollen leg, or stroke signs should be treated as a thrombotic event. This is why reversal is reserved for life-threatening bleeding."}, {"c": 10, "s": "Ch 10, section Inflammatory bowel disease flares and colitis", "q": "A 35-year-old man with ulcerative colitis is admitted with a flare. He has some rectal bleeding but is hemodynamically stable. How should venous thromboembolism prophylaxis be approached?", "o": ["Withhold all pharmacologic and mechanical prophylaxis because any rectal bleeding is present during an inflammatory bowel disease flare", "Use aspirin alone as sufficient prophylaxis for the flare", "Use direct oral anticoagulants as the preferred prophylaxis in all hospitalized patients with a flare", "Prophylaxis is not needed in young patients because their clot risk during a flare is low", "Pharmacologic prophylaxis is supported when bleeding risk is acceptable; colitis bleeding alone should not always stop it"], "k": 4, "e": "Hospitalized IBD flares carry a high clot risk. The ASH abstract supports pharmacologic prophylaxis for acutely ill inpatients when bleeding risk is acceptable, with mechanical methods otherwise. Bleeding from colitis alone should be discussed with gastroenterology rather than automatically excluding prophylaxis."}, {"c": 10, "s": "Ch 10, section Esophageal and gastric disease", "q": "A 60-year-old man in the intensive care unit is mechanically ventilated and has risk factors for gastrointestinal bleeding. A nurse asks whether stress ulcer prophylaxis is reasonable. What is the best answer?", "o": ["No, prophylaxis is never appropriate in the intensive care unit, even with risk factors", "Yes, and it should be continued for years after discharge to protect the stomach lining", "Yes, a PPI is reasonable with bleeding risk factors; write the indication and review it when risk ends", "Only an antacid is permitted; a PPI should never be used in this setting", "Yes, but only after a confirmed bleed has already occurred in the unit"], "k": 2, "e": "Stress ulcer prophylaxis with a PPI is reasonable in critical illness when GI bleeding risk factors exist. Choosing Wisely advises against it for medical inpatients without high risk. The pitfall is a prophylactic PPI continued for years, so the indication and stop date should be documented."}, {"c": 10, "s": "Ch 10, section Nutrition, feeding tubes, and refeeding", "q": "What is the main pathophysiologic mechanism of refeeding syndrome?", "o": ["Insulin release moves phosphate, potassium, and magnesium into cells", "Excess protein causes direct hepatic necrosis within the first days of feeding", "Gastric acid hypersecretion causes ulceration of the stomach lining during feeding", "Rapid sodium retention causes hypernatremia only, with no effect on other electrolytes", "Vitamin K deficiency causes bleeding after the first meals are restarted"], "k": 0, "e": "After a period of starvation, restarting nutrition releases insulin, which moves phosphate, potassium, and magnesium into cells. Resulting complications include heart failure, arrhythmia, respiratory failure, seizures, and delirium. Thiamine deficiency worsens the risk, especially in alcohol use disorder."}, {"c": 10, "s": "Ch 10, section Bowel obstruction, ileus, and the acute abdomen", "q": "A 78-year-old man with a small bowel obstruction develops constant abdominal pain, fever, tachycardia, a rising lactate, and peritonitis. What is the best next step?", "o": ["Continue nonoperative care and repeat the film in 48 hours", "Start oral contrast and wait for transit", "Treat as ileus with prokinetic agents", "Discharge once pain is controlled", "Urgent surgical review with resuscitation"], "k": 4, "e": "Constant pain, fever, rising lactate, and peritonitis suggest strangulation, which needs urgent surgery and resuscitation in parallel. Imaging does not replace the examination. A stable partial obstruction without these red flags is the setting for non-operative care with surgical oversight."}, {"c": 11, "s": "Ch 11, section Evaluating abnormal liver tests and acute liver failure", "q": "A patient's liver panel shows aminotransferases markedly raised compared with a modestly raised alkaline phosphatase. How is this pattern classified?", "o": ["Hepatocellular", "Cholestatic", "Infiltrative only", "Synthetic failure only", "Obstructive by definition"], "k": 0, "e": "A hepatocellular pattern is a large rise in AST and ALT relative to alkaline phosphatase. A cholestatic pattern is the reverse, with raised alkaline phosphatase and bilirubin. Classifying the pattern guides the next tests."}, {"c": 11, "s": "Ch 11, section Evaluating abnormal liver tests and acute liver failure", "q": "A previously healthy 30-year-old woman has new jaundice, an elevated INR, and drowsiness. She has no history of cirrhosis. What is the best disposition?", "o": ["Routine ward admission with repeat labs in the morning", "Discharge with outpatient hepatology in two weeks", "Admission to a psychiatric unit for confusion", "Intensive care, with a same-day call to a transplant center", "Correct the INR to normal with plasma before any other step is taken or any call is made"], "k": 3, "e": "New liver injury with coagulopathy and altered mental status in a patient without cirrhosis describes acute liver failure. She needs intensive care and early contact with a transplant center, even before all results are back. Plasma to normalize the INR hides a marker of liver function."}, {"c": 11, "s": "Ch 11, section Drug-induced liver injury and acetaminophen toxicity", "q": "A 24-year-old man arrives with very high aminotransferases and a strong history of repeated acetaminophen ingestion over two days. The serum level is not yet back. What is the best step?", "o": ["Wait for the serum level to return before giving any treatment at all", "Start acetylcysteine early and call poison control; adjust once the level is known", "Give corticosteroids as first-line therapy to calm the liver inflammation", "Observe without treatment because the injury is idiosyncratic rather than dose related", "Start lactulose and await the level before considering any antidote"], "k": 1, "e": "Acetaminophen toxicity is dose-dependent and acetylcysteine is the antidote. When the story is strong, waiting for a level is a pitfall; start early and adjust. In staggered or unknown-time ingestions, treatment rests on history, liver tests, and poison center advice."}, {"c": 11, "s": "Ch 11, section Decompensated cirrhosis: ascites and spontaneous bacterial peritonitis", "q": "A hospitalist sends ascitic fluid from a paracentesis. Which handling of the culture is advised?", "o": ["Send it in a dry sterile cup to the laboratory in the morning", "Culture only if the white cell count is normal", "Skip culture and rely on the serum albumin", "Freeze it for later testing", "Inoculate the fluid into blood culture bottles at the bedside"], "k": 4, "e": "Ascitic fluid should be sent for cell count with differential, culture inoculated into blood culture bottles at the bedside, albumin, and total protein. Bedside inoculation improves the chance of recovering organisms. A delayed dry cup lowers yield."}, {"c": 11, "s": "Ch 11, section Decompensated cirrhosis: ascites and spontaneous bacterial peritonitis", "q": "What is the benefit of giving albumin to a patient with spontaneous bacterial peritonitis, according to the secondary summary of the 2021 AASLD guidance?", "o": ["It replaces the need for antibiotics", "It treats hepatic encephalopathy directly", "It lowers the risk of kidney injury and death", "It reduces the need for diagnostic paracentesis", "It prevents variceal bleeding"], "k": 2, "e": "Albumin in SBP lowers the risk of kidney injury and death as far as the summary says. It is given with an antibiotic, never instead of one. SBP often triggers hepatorenal syndrome, so kidney protection matters."}, {"c": 11, "s": "Ch 11, section Decompensated cirrhosis: ascites and spontaneous bacterial peritonitis", "q": "A patient with cirrhosis has new ascites. Which combination describes the first measures for managing it?", "o": ["Fluid loading with normal saline and a high-sodium diet to maintain the circulating volume", "Sodium restriction plus a mineralocorticoid antagonist and loop diuretic, increased stepwise", "An NSAID for discomfort plus an ACE inhibitor for the blood pressure and kidneys", "Immediate liver transplantation as the first step before any medical measures", "Protein restriction and a benzodiazepine to settle the patient overnight"], "k": 1, "e": "The first measures are sodium restriction and diuretics, a stepwise combination of a mineralocorticoid antagonist and a loop diuretic. Monitor weight, sodium, potassium, and creatinine. NSAIDs and ACE inhibitors can precipitate kidney failure in cirrhosis."}, {"c": 11, "s": "Ch 11, section Decompensated cirrhosis: ascites and spontaneous bacterial peritonitis", "q": "A patient with cirrhosis on diuretics for ascites develops cramps, new confusion, and a rising creatinine after a dose increase. What is the best first action?", "o": ["Double the diuretic dose and recheck the creatinine in a few days", "Add an NSAID for the cramps and continue the current diuretic dose", "Start a sedative for the confusion and continue the diuretic at the same dose without changes", "Give a large sodium load through a rapid saline infusion", "Stop the diuretic, check electrolytes and creatinine, and look for infection or bleeding"], "k": 4, "e": "Diuretics should be stopped if sodium falls severely, potassium becomes abnormal, kidney function worsens, or encephalopathy appears. New confusion and a rising creatinine also call for a search for infection or bleeding. Escalating the diuretic would worsen the picture."}, {"c": 11, "s": "Ch 11, section Alcohol-associated hepatitis and withdrawal", "q": "A 56-year-old man with alcohol use disorder, treated for hyponatremia, develops new dysarthria, dysphagia, and weakness of all limbs several days after rapid sodium correction. What is the likely process and the first action?", "o": ["Hepatic encephalopathy; give a large protein load", "Wernicke encephalopathy only; start sodium restriction", "Osmotic demyelination; stop the correction and involve neurology", "Alcohol withdrawal seizure; increase the sodium infusion", "Hepatorenal syndrome; start terlipressin"], "k": 2, "e": "Chronic alcohol use and advanced liver disease raise the risk of osmotic demyelination after rapid sodium correction. Early signs include dysarthria, dysphagia, and quadriparesis. The first action is to stop the correction and call neurology."}, {"c": 11, "s": "Ch 11, section Variceal bleeding and portal hypertension", "q": "A patient with cirrhosis and a suspected variceal bleed is hypotensive. A colleague wants to transfuse generously to a high hemoglobin. What is the concern?", "o": ["Over-transfusion can raise portal pressure and cause rebleeding", "Over-transfusion lowers portal pressure too far", "Transfusion causes hepatic encephalopathy in every patient", "Transfusion is contraindicated in cirrhosis", "Over-transfusion improves hemostasis without risk"], "k": 0, "e": "In variceal bleeding, resuscitate with care because over-transfusion can raise portal pressure and cause rebleeding. A patient in shock still needs blood because of the shock. The numeric threshold specific to varices needs the primary guidance."}, {"c": 11, "s": "Ch 11, section Variceal bleeding and portal hypertension", "q": "A patient with known cirrhosis has hematemesis. A resident calls it variceal and plans no endoscopy. What is the best response?", "o": ["Agree, since every bleed in cirrhosis is variceal in origin", "Cancel endoscopy and treat only with a proton pump inhibitor, since the source is already known", "Order colonoscopy first to look for the bleeding source", "Scope early and let endoscopy decide, since ulcers and gastropathy are also common", "Wait for the INR to normalize before any scope is done"], "k": 3, "e": "Not every bleed in a patient with cirrhosis is variceal. Ulcers and portal gastropathy occur, and non-variceal bleeding is managed like other upper bleeds. Early endoscopy confirms the source."}, {"c": 11, "s": "Ch 11, section Variceal bleeding and portal hypertension", "q": "Which antibiotic class does a secondary summary advise for a patient with cirrhosis and upper gastrointestinal bleeding?", "o": ["A first-generation macrolide", "An aminoglycoside", "A third-generation cephalosporin", "An oral antifungal", "No antibiotic, since bleeding is not infectious"], "k": 2, "e": "Antibiotic prophylaxis belongs in the first-line plan for cirrhosis with upper GI bleeding, and the summary names a third-generation cephalosporin. Aminoglycosides should be avoided in cirrhosis with ascites because they can precipitate kidney failure. Dose and duration need the primary text."}, {"c": 11, "s": "Ch 11, section Hepatic encephalopathy", "q": "A confused patient with cirrhosis has a normal ammonia level. How should this be interpreted?", "o": ["A normal level makes encephalopathy less likely, but an elevated level alone does not prove it", "A normal level excludes every other cause of confusion in this patient", "An elevated level is required for the diagnosis", "Treatment should be guided solely by the ammonia number, repeated each day until it normalizes", "The level proves a hepatic trigger is absent from the picture"], "k": 0, "e": "Do not rely on the ammonia level; hepatic encephalopathy is diagnosed at the bedside after other causes are excluded. Treat the patient and the trigger. Chasing the number adds little."}, {"c": 11, "s": "Ch 11, section Hepatic encephalopathy", "q": "A patient with cirrhosis presents with overt hepatic encephalopathy after several days of opioids for back pain and constipation. Besides lactulose, what is the best next step?", "o": ["Restrict protein strictly until the encephalopathy has cleared completely and the ammonia is normal", "Add a benzodiazepine for sleep and agitation at night", "Give no further workup beyond lactulose and the current medications", "Look for and treat precipitants, stopping or reducing the opioid and correcting constipation", "Increase the opioid dose for comfort and watch for improvement overnight"], "k": 3, "e": "Precipitants include infection, bleeding, constipation, dehydration, electrolyte disturbance, sedatives, opioids, and missed lactulose. Treating the trigger is a core step. Sedatives can worsen the encephalopathy."}, {"c": 11, "s": "Ch 11, section Hepatic encephalopathy", "q": "After a second episode of overt encephalopathy on lactulose, what does the 2014 AASLD and EASL guideline recommend adding to prevent recurrence?", "o": ["A benzodiazepine", "Rifaximin", "Strict protein restriction", "Neomycin as first choice", "Stopping lactulose"], "k": 1, "e": "The guideline recommends adding rifaximin to lactulose for prevention of recurrence after a repeat episode (strong recommendation). Protein restriction is not advised. Exact dose and trigger details need the primary text."}, {"c": 11, "s": "Ch 11, section Hepatic encephalopathy", "q": "A dietitian suggests restricting protein in a malnourished patient admitted with hepatic encephalopathy. What is the best response?", "o": ["Agree, because dietary protein is the main cause of the encephalopathy", "Make the patient nil by mouth for a week or longer", "Restrict all calories until the ammonia level has normalized", "Substitute high-dose sedatives for nutrition in the meantime", "Do not restrict protein; starvation worsens muscle loss"], "k": 4, "e": "The 2014 guideline advises against protein restriction and supports a daily protein intake in a defined range. Starvation worsens muscle loss and encephalopathy. The 2026 ACG guideline may update this, so check the current version."}, {"c": 11, "s": "Ch 11, section Hepatic encephalopathy", "q": "A drowsy but intermittently agitated patient with cirrhosis and encephalopathy is pulling at lines. What is the best initial approach to agitation?", "o": ["Start a scheduled benzodiazepine to keep the patient calm and safe", "Give a high-dose antipsychotic at once, repeating it until the agitation has fully settled", "Physically restrain and sedate heavily until the patient is settled", "Reorientation and treating the cause; benzodiazepines are not first-line except in withdrawal", "Withhold lactulose until the patient is calm and cooperative"], "k": 3, "e": "Benzodiazepines are not first-line for delirium except in alcohol and sedative withdrawal. Try reorientation and treat the cause first, and use a low-dose, short-course drug only if unavoidable. Sedatives can worsen encephalopathy."}, {"c": 11, "s": "Ch 11, section Alcohol-associated hepatitis and withdrawal", "q": "A hospitalized man with heavy alcohol use becomes agitated and tremulous on day two and receives an antipsychotic. What is the recommended fix?", "o": ["Increase the antipsychotic dose until the agitation and tremor have settled completely", "Ask about alcohol on admission and use a withdrawal protocol with a benzodiazepine", "Withhold all medication and observe for several days", "Give lactulose only, since the cause is hepatic", "Restrict fluids until the tremor settles"], "k": 1, "e": "Missed withdrawal is a common pitfall in patients admitted for another reason. Benzodiazepines are the standard class for withdrawal, and the delirium guidance names withdrawal as the exception to avoiding them. Antipsychotics do not treat withdrawal."}, {"c": 11, "s": "Ch 11, section Hepatorenal syndrome and transplant referral", "q": "A patient with cirrhosis and ascites has a rising creatinine after an infection. Which initial steps are used when hepatorenal syndrome is suspected?", "o": ["Increase diuretics and add an NSAID to improve urine output and clear the ascites quickly", "Start dialysis immediately, without any evaluation of the cause or of the response to albumin", "Give high-volume saline only, without albumin, and recheck the creatinine in a few days", "Biopsy the kidney first, before any other step or any change in medications", "Stop diuretics and nephrotoxins, treat infection, perform a diagnostic paracentesis, and give albumin"], "k": 4, "e": "HRS-AKI is a diagnosis of exclusion. Usual steps are stopping diuretics and nephrotoxins, withdrawing blood-pressure-lowering drugs, treating infection, giving albumin, and tapping the ascites for SBP. Escalating diuretics or NSAIDs would worsen kidney perfusion."}, {"c": 11, "s": "Ch 11, section Hepatorenal syndrome and transplant referral", "q": "Which treatment is first-line for HRS-AKI, per the secondary summary of AASLD 2021?", "o": ["Midodrine plus octreotide as the preferred first-choice combination", "A loop diuretic infusion", "A vasoconstrictor, terlipressin or norepinephrine, together with albumin", "An ACE inhibitor", "A high-dose NSAID"], "k": 2, "e": "The summary names terlipressin or norepinephrine with albumin as first-line therapy. Midodrine plus octreotide is a lower-efficacy second choice. Diuretics, ACE inhibitors, and NSAIDs worsen kidney perfusion in cirrhosis."}, {"c": 11, "s": "Ch 11, section Hepatorenal syndrome and transplant referral", "q": "A patient with HRS-AKI on terlipressin develops volume overload. What measure does the text advise for the overload?", "o": ["Reduce the albumin and monitor the lungs and oxygen saturation", "Increase the albumin dose to expand the volume further", "Add a high-volume saline bolus to support the circulation", "Continue the albumin unchanged without any monitoring of the lungs or oxygen levels", "Stop oxygen saturation monitoring once the albumin is running"], "k": 0, "e": "Terlipressin carries a boxed warning for serious or fatal respiratory failure, and patients with volume overload are at higher risk, managed by reducing the albumin. The lungs and oxygen saturation should be checked before and during treatment. More fluid raises the risk."}, {"c": 12, "s": "Ch 12, section Acute kidney injury: prerenal, intrinsic, and postrenal", "q": "Which finding satisfies the urine output criterion for AKI in the KDIGO 2012 definition used in this text?", "o": ["Urine output below 0.5 mL/kg/h for 6 hours", "One small void overnight in a patient who is asleep", "Urine output lower than the patient's usual evening volume", "Dark urine on a single sample", "Any output below the laboratory reference range"], "k": 0, "e": "The KDIGO 2012 triggers include a creatinine rise of 0.3 mg/dL within 48 hours, a rise to 1.5 times baseline within 7 days, or urine output below 0.5 mL/kg/h for 6 hours. A sustained fall over several hours is required, not a single void or an impression of dark urine."}, {"c": 12, "s": "Ch 12, section Acute kidney injury: prerenal, intrinsic, and postrenal", "q": "A 66-year-old man with sepsis has just developed shock. His creatinine is still at baseline, yet the team worries about AKI. Why can creatinine be misleading in this setting?", "o": ["Creatinine rises before filtration falls, so a normal value reliably excludes injury in sepsis", "Creatinine is unaffected by any kidney injury, including injury to the filter", "Creatinine only reflects liver function and has no link to the kidney", "Creatinine lags behind filtration, so it can be normal in the first hours of a real injury", "Creatinine falls first in tubular injury, before filtration changes"], "k": 3, "e": "Creatinine lags behind filtration and may remain normal early. It can also rise without injury when a drug blocks tubular secretion. The definition is a prompt to look for a cause, not a diagnosis."}, {"c": 12, "s": "Ch 12, section Acute kidney injury: prerenal, intrinsic, and postrenal", "q": "A hospitalized patient develops AKI after a prolonged period of low blood pressure and sepsis. Which type of intrinsic injury is the usual cause of hospital-acquired AKI?", "o": ["Glomerulonephritis", "Acute tubular injury", "Renal artery occlusion", "Atheroembolic disease", "Acute interstitial nephritis"], "k": 1, "e": "Tubular injury from prolonged hypoperfusion, sepsis, toxins, or contrast is the usual cause of hospital-acquired AKI. Interstitial nephritis is often drug-related and glomerulonephritis is less common. Prolonged prerenal states can progress to tubular injury."}, {"c": 12, "s": "Ch 12, section Urine studies and the diagnostic approach", "q": "A patient with AKI has urine microscopy showing red cell casts and dysmorphic red cells, with hypertension and edema. What is the best next step?", "o": ["Give a large fluid bolus for presumed prerenal disease", "Start a diuretic infusion to protect the kidney", "Place a catheter and observe for 48 hours", "Discharge with outpatient labs", "Early nephrology input, since this points to a glomerular source"], "k": 4, "e": "Red cell casts and dysmorphic red cells point to a glomerular source. Serologic tests, the biopsy decision, and immunosuppression belong to a team that does this often, so call nephrology early. Fluid or diuretics do not address the cause."}, {"c": 12, "s": "Ch 12, section Urine studies and the diagnostic approach", "q": "A patient with AKI has muddy brown granular casts on urine microscopy after a period of shock. What does this support?", "o": ["Postrenal obstruction", "Simple prerenal azotemia", "Acute tubular injury", "Glomerulonephritis", "Interstitial nephritis from a drug"], "k": 2, "e": "Muddy brown or granular casts support tubular injury. A bland sediment fits prerenal or obstructive causes, red cell casts suggest glomerular disease, and white cell casts suggest interstitial or infectious disease. The first move is to remove the insult and support the patient."}, {"c": 12, "s": "Ch 12, section Acute kidney injury: prerenal, intrinsic, and postrenal", "q": "A patient on day 4 of a beta-lactam has a rising creatinine, a new rash, fever, and sterile pyuria. Which intrinsic cause is most likely, and what is the first move?", "o": ["Acute tubular injury; increase intravenous fluids and continue the current medications", "Acute interstitial nephritis; stop the likely drug and call nephrology", "Postrenal obstruction; place a catheter and image the bladder", "Glomerulonephritis; start diuretics and restrict all fluids", "Prerenal azotemia; give a vasoconstrictor to raise the pressure"], "k": 1, "e": "New drug exposure with rash, fever, and sterile pyuria suggests interstitial nephritis. Beta-lactams, proton pump inhibitors, and NSAIDs are common culprits. Stop the suspected drug and call nephrology."}, {"c": 12, "s": "Ch 12, section Urine studies and the diagnostic approach", "q": "Why should urine sodium and fractional excretion of sodium be used only as supporting clues?", "o": ["They are reliable in every patient, including those on diuretics, so they can be used to decide the diagnosis alone", "They replace the need for bladder scanning and for any review of the urine sediment", "They are valid only in children and are not meaningful in adult patients on the ward", "They distinguish glomerular from tubular disease with certainty in most patients", "The classic cutoffs fail with diuretics, in cirrhosis, in early obstruction, and in some forms of sepsis"], "k": 4, "e": "A low urine sodium or fractional excretion points toward prerenal states, but these cutoffs fail in several common ward situations. They support but do not decide the diagnosis. The bedside history and sediment remain central."}, {"c": 12, "s": "Ch 12, section Urine studies and the diagnostic approach", "q": "A 70-year-old man with AKI has small, bright kidneys on ultrasound without hydronephrosis. What is the most reasonable interpretation?", "o": ["It proves a pure prerenal state with no chronic component to the injury", "It excludes chronic disease completely, so the injury must be new", "It suggests chronic kidney disease, though normal-sized kidneys do not exclude it", "It proves acute glomerulonephritis, which should be treated at once", "It shows that obstruction is certain despite the absence of hydronephrosis"], "k": 2, "e": "Small, bright kidneys suggest chronic disease. A kidney of normal size does not exclude it, and hydronephrosis may be absent early in obstruction or in volume depletion. Ultrasound helps rule out obstruction and estimate chronicity."}, {"c": 12, "s": "Ch 12, section Urine studies and the diagnostic approach", "q": "A patient's creatinine has not improved after a measured fluid challenge for presumed prerenal AKI. What is the best next step?", "o": ["Stop and re-sort: rescan the bladder, repeat the sediment, and review for missed nephrotoxins", "Give several more liters of fluid by default and keep repeating the challenge until creatinine falls", "Label the patient prerenal and wait a week before any further testing", "Start a diuretic to produce urine and keep the patient dry overnight", "Cancel the renal ultrasound and the sediment review"], "k": 0, "e": "Calling every creatinine rise prerenal and giving fluid for days risks missing obstruction, interstitial nephritis, or a drug effect. When creatinine does not respond to a reasonable challenge, re-sort the cause. Reassess the lungs after each portion of fluid."}, {"c": 12, "s": "Ch 12, section Contrast, nephrotoxins, and prevention", "q": "A 62-year-old patient with suspected large-vessel occlusion stroke has an unknown creatinine. The team hesitates to order vessel imaging with contrast. What principle applies?", "o": ["Wait for the creatinine result in every case, however urgent, because the contrast is always unsafe", "Give prophylactic dialysis before imaging to protect the kidneys from the contrast", "Use only high-osmolar contrast to limit the volume given", "Do not delay the scan for a creatinine result; a missed occlusion costs more than the contrast", "Cancel imaging and treat empirically without any vessel assessment"], "k": 3, "e": "The 2026 stroke guidance, as read through secondary sources, states that vessel imaging in suspected large-vessel occlusion should not wait for a creatinine result. The principle generalizes: weigh risk and benefit, document the discussion, and give prevention measures if time allows."}, {"c": 12, "s": "Ch 12, section Contrast, nephrotoxins, and prevention", "q": "Which contrast agent type does KDIGO 2012 advise for patients at risk of contrast-associated AKI?", "o": ["High-osmolar contrast to limit volume", "Any agent, since osmolality does not matter", "Iso-osmolar or low-osmolar contrast rather than high-osmolar agents", "Gadolinium instead of iodinated contrast in all patients", "Contrast mixed with a loop diuretic"], "k": 2, "e": "KDIGO 2012 advises iso-osmolar or low-osmolar contrast over high-osmolar agents, plus isotonic saline or bicarbonate volume expansion in at-risk patients. It does not support prophylactic dialysis after contrast."}, {"c": 12, "s": "Ch 12, section Contrast, nephrotoxins, and prevention", "q": "An older patient with diabetes is admitted with hypotension and dehydration and needs a contrast study that will change management. Which measure helps most before the scan?", "o": ["Correct volume depletion with isotonic fluid and pause nephrotoxins such as NSAIDs", "Give a loop diuretic to flush the contrast out through the kidneys as quickly as possible", "Order dialysis to clear the contrast out of the blood afterward", "Add an NSAID to prevent headache after the study", "Withhold all fluid to avoid overload and protect the heart"], "k": 0, "e": "Practical steps include using the lowest useful dose, correcting volume depletion with isotonic fluid, and pausing drugs that add risk. Diuretics and dialysis are not preventive. The prevention checklist should be tailored to the patient."}, {"c": 12, "s": "Ch 12, section Indications for dialysis", "q": "A patient with AKI develops pericarditis and encephalopathy attributed to uremia. How should this be viewed?", "o": ["As reason to wait until the creatinine peaks before deciding", "As an indication only for increased oral fluids and observation", "As unrelated to renal replacement, which is reserved for potassium", "As an urgent indication for dialysis in its own right", "As an indication for a diuretic infusion alone, without dialysis"], "k": 3, "e": "Pericarditis, encephalopathy, or bleeding attributable to uremia are urgent indications. KDIGO 2012 teaches that renal replacement should begin emergently for life-threatening fluid, electrolyte, or acid-base changes. Otherwise the decision rests on the clinical picture, not one value."}, {"c": 12, "s": "Ch 12, section Indications for dialysis", "q": "A resident wants to start dialysis solely because the creatinine reached a particular number, though the patient is comfortable with normal potassium, bicarbonate, and oxygenation. What does KDIGO 2012 teach?", "o": ["Always start when the creatinine passes any fixed value, however well the patient looks and whatever the trend", "Absent a life-threatening problem, decide on clinical context and trend, not one creatinine value", "Dialysis is never appropriate in AKI, whatever the potassium or acid-base status", "Start dialysis only after a kidney biopsy has confirmed the cause of injury", "Start when urine output is normal, to prevent later volume overload"], "k": 1, "e": "KDIGO 2012 advises emergent dialysis for life-threatening fluid, electrolyte, or acid-base changes and context-based decisions otherwise. No single numeric threshold is given in this text, and the 2026 draft is reported to revise timing."}, {"c": 12, "s": "Ch 12, section Indications for dialysis", "q": "The UK Renal Association guideline classes severe hyperkalemia as 6.5 mmol/L or higher. What does this cutoff mean?", "o": ["It requires immediate dialysis in every patient", "It applies only to patients on dialysis", "It is a threshold for starting digoxin", "It excludes treatment with calcium", "It classifies severity but does not by itself mean dialysis"], "k": 4, "e": "The cutoff classifies severity. Dialysis is considered when hyperkalemia or ECG changes persist despite calcium, insulin with glucose, and other measures. Call nephrology at the same time as starting emergency treatment."}, {"c": 12, "s": "Ch 12, section Indications for dialysis", "q": "A patient on chronic dialysis is admitted after missing sessions. Which approach is best?", "o": ["Draw routine blood tests from the dialysis access by default, whatever the unit policy", "Ignore dry weight and give maintenance fluid until the next session", "Cancel dialysis until the creatinine falls to the usual range", "Coordinate with the dialysis unit and use the patient's own schedule and dry weight", "Treat as new AKI without any history of dialysis dependence"], "k": 3, "e": "Dialysis patients have their own schedule, access, and dry weight. Missed sessions commonly cause overload and hyperkalemia. The access should not be used for routine draws unless unit policy allows."}, {"c": 12, "s": "Ch 12, section Chronic kidney disease in the hospitalized patient", "q": "A patient with CKD has a creatinine that is in the usual CKD range but higher than all of her prior results. How should it be interpreted?", "o": ["As a stable baseline because it falls within the usual CKD range, so no further review is needed", "As possible new AKI, since the comparison is the patient's own baseline, not the reference range", "As normal for any patient with this level of kidney disease", "As laboratory error requiring no action", "As proof of end-stage disease"], "k": 1, "e": "In CKD, compare with the patient's own baseline and trend. A creatinine can be in the CKD range and still show a new injury. Look at several earlier results before accepting a baseline."}, {"c": 12, "s": "Ch 12, section Chronic kidney disease in the hospitalized patient", "q": "Why are SGLT2 inhibitors usually held during acute illness with poor oral intake?", "o": ["Because they cause hyperkalemia", "Because they cause hypoglycemia on their own", "Because they raise INR", "Because they cause contrast reactions", "Because of the risk of ketoacidosis"], "k": 4, "e": "SGLT2 inhibitors help the kidney over the long term but are usually held before surgery or during acute illness with poor intake because of ketoacidosis risk. The exact hold interval needs a primary source."}, {"c": 12, "s": "Ch 12, section Dosing medications in kidney disease", "q": "A hospitalized patient's kidney function declines and insulin requirements fall. Which statement is correct?", "o": ["Insulin clearance rises with declining kidney function, so doses must increase to keep the glucose controlled", "Kidney function does not affect insulin", "Insulin clearance falls in kidney impairment, so hypoglycemia risk rises and doses need adjusting", "Hypoglycemia is impossible with insulin in CKD", "Insulin should be stopped permanently"], "k": 2, "e": "Kidney impairment raises the hypoglycemia risk with regular insulin. Reduce the dose or monitor glucose more closely as kidney function declines. This is part of reviewing every renally affected drug when function changes."}, {"c": 12, "s": "Ch 12, section Chronic kidney disease in the hospitalized patient", "q": "A 70-year-old man had his ACE inhibitor held after surgery for low blood pressure and AKI. What should be written in the plan?", "o": ["A specific plan to restart it, since delayed restart was linked to higher short-term mortality", "Nothing, since it should never be restarted", "An automatic restart on the first postoperative day regardless of kidney function or blood pressure", "Replace it permanently with an NSAID", "Leave it to chance at the next clinic visit"], "k": 0, "e": "Held renin-angiotensin drugs should be restarted with a plan rather than by default. The perioperative review linked delayed restart to higher short-term mortality. The written plan should state when and under what conditions to restart."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "A 64-year-old woman is recovering from abdominal surgery. She is nauseated and in pain, cannot drink, and has a serum sodium that is already low. The covering team wants to run a hypotonic maintenance fluid overnight. What is the best response?", "o": ["Run it, because maintenance fluid should always be hypotonic in a patient who cannot drink and has no other source of water", "Run it, because free water corrects a low sodium", "Run it only if the urine output is brisk, since dilute fluid is harmless then", "Switch to hypotonic fluid at a faster rate to speed correction", "Avoid it, because pain, nausea, and surgery raise antidiuretic hormone and she cannot excrete free water"], "k": 4, "e": "Pain, nausea, and the postoperative state raise antidiuretic hormone, so free water is retained and the sodium falls further. Hypotonic fluid is the wrong choice in a patient who is already hyponatremic; the idea that water treats a low sodium reverses the physiology."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "A 70-year-old man with sepsis has received initial fluid and the team is unsure whether more is needed. Which approach to judging fluid responsiveness is favored by the Surviving Sepsis Campaign 2026 guideline?", "o": ["Central venous pressure alone as the main trigger for giving more fluid to a patient who is hypotensive", "Dynamic measures of fluid responsiveness, not static measures such as central venous pressure", "Skin turgor as the primary measure", "A fixed volume for every patient regardless of response, repeated until the blood pressure normalizes", "Daily weight alone, checked each morning"], "k": 1, "e": "The guideline favors dynamic measures, such as a passive leg raise with a measured response, over static pressures. A central venous pressure is a static number and does not reliably predict who will respond to fluid."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "A 68-year-old man is on day 3 of sepsis care. Shock has resolved, he received large crystalloid volumes, and he now has crackles and rising oxygen needs. According to the Surviving Sepsis Campaign 2026 guideline, what is the best approach?", "o": ["Consider active fluid removal, with diuretics first, now that resuscitation is over", "Give another bolus to maintain a high central venous pressure and keep the blood pressure up", "Continue maintenance fluid at the same rate until discharge, regardless of lung findings", "Switch to hypotonic fluid to support free water", "Start a starch solution to keep volume in the vessels and reduce further crystalloid"], "k": 0, "e": "After the resuscitation phase the question reverses: has the patient had enough? The guideline suggests active fluid removal, with diuretics first. More fluid would worsen the overload, and starch is advised against."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "A 55-year-old man with cirrhosis and sepsis has received a large volume of crystalloid and remains hypotensive. Which statement about albumin is most accurate?", "o": ["Albumin should replace crystalloid as the first-line resuscitation fluid in every patient with septic shock, whatever the volume already given", "Albumin is not first-line, but may be considered case by case after large crystalloid volumes or in cirrhosis", "Albumin is advised against in every patient with sepsis", "Albumin should be given instead of any crystalloid in cirrhosis from the start, to avoid fluid overload", "Albumin has no role at any point in cirrhosis"], "k": 1, "e": "Crystalloids alone are suggested over crystalloids plus albumin, yet albumin remains an option case by case after large crystalloid volumes or in cirrhosis. Making it first-line goes beyond the guidance, and ruling it out ignores the cirrhosis exception."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "A 41-year-old man with acute pancreatitis is hypovolemic on arrival. Which fluid strategy fits the 2024 American College of Gastroenterology guideline as described?", "o": ["Lactated Ringer's over saline, with moderately aggressive fluids and reassessment within hours", "0.9% saline over lactated Ringer's, with the most aggressive rate possible and no reassessment in the first day", "Starch solution for the first day", "Dextrose in water to supply free water", "No fluid until the amylase falls"], "k": 0, "e": "The guideline suggests lactated Ringer's over saline and moderately aggressive rather than very aggressive hydration, with early reassessment. Very aggressive fluid risks overload, and saline or free water offers no advantage."}, {"c": 13, "s": "Ch 13, section Volume status and choosing intravenous fluids", "q": "An 82-year-old woman with heart failure and chronic dialysis dependence presents in diabetic ketoacidosis. How should the initial fluid plan differ from that for a younger patient?", "o": ["Use the same large boluses as for a younger patient, since volume depletion is the same", "Avoid all fluid until insulin has worked", "Use half-normal saline as the first fluid", "Isotonic saline or a balanced crystalloid, but with smaller boluses and frequent reassessment", "Give hypertonic saline to limit total volume and avoid overloading the heart and dialysis circuit"], "k": 3, "e": "Isotonic or balanced crystalloid is still the starting fluid, but older adults and patients with heart failure or on dialysis get smaller boluses with reassessment. Withholding fluid would leave the volume deficit untreated."}, {"c": 13, "s": "Ch 13, section Hyponatremia and its safe correction", "q": "A 49-year-old woman with a serum sodium that is low because the plasma is truly hypotonic has a urine osmolality at or below 100 mOsm/kg. What does this finding most suggest?", "o": ["Antidiuretic hormone is acting, as in SIADH, with concentrated urine and a normal volume status", "Adrenal insufficiency with salt wasting", "Relative water excess, such as primary polydipsia or low solute intake", "Heart failure with effective volume depletion and a high antidiuretic hormone drive", "Laboratory artifact from high glucose"], "k": 2, "e": "A low urine osmolality means the kidney is excreting dilute urine, so the problem is excess water relative to solute. A higher value means antidiuretic hormone is acting, which points toward SIADH or other causes."}, {"c": 13, "s": "Ch 13, section Hyponatremia and its safe correction", "q": "A 77-year-old man has hyponatremia with urine osmolality showing that antidiuretic hormone is acting. His urine sodium is at or below 30 mmol/L. What does this most suggest?", "o": ["Primary polydipsia", "Confirmed SIADH with no need to assess volume", "Pseudohyponatremia from lab artifact", "Excess solute intake", "Low effective volume"], "k": 4, "e": "A urine sodium at or below 30 mmol/L suggests low effective volume (a weak, very low quality recommendation). A higher value means the volume status and diuretic exposure must be judged at the bedside."}, {"c": 13, "s": "Ch 13, section Hyponatremia and its safe correction", "q": "A 36-year-old man with no unusual risk factors for osmotic demyelination is treated for severe hyponatremia. Under the 2013 US expert panel, which limit applies to him in addition to the 24 hour limit?", "o": ["8 mmol/L over 48 hours", "18 mmol/L over 48 hours", "25 mmol/L over 48 hours", "No limit after the first day", "4 mmol/L over 48 hours"], "k": 1, "e": "For patients at normal risk the panel allowed 10 to 12 mmol/L in 24 hours and 18 mmol/L in 48 hours. The 8 mmol/L figure belongs to the high-risk group and applies to 24 hours."}, {"c": 13, "s": "Ch 13, section Hyponatremia and its safe correction", "q": "A 67-year-old man with heart failure and hypervolemic hyponatremia asks why he is not getting saline. What is the best explanation?", "o": ["Saline is always the best treatment because sodium treats low sodium, and heart failure should not change that", "He needs hypertonic saline in every case, since symptoms can appear without warning", "Water restriction and treating the heart failure are the base of care; saline does not fix excess water", "He needs hypotonic fluid to dilute the sodium and relieve the fluid overload", "Nothing should be done until symptoms occur"], "k": 2, "e": "In hypervolemic hyponatremia from heart failure or cirrhosis the problem is excess water and total body sodium, so restricting water and treating the underlying disease is the approach. Giving saline in the belief that sodium treats low sodium can worsen overload."}, {"c": 13, "s": "Ch 13, section Hyponatremia and its safe correction", "q": "A 79-year-old woman develops hyponatremia on a thiazide diuretic. Her sodium has recovered after the drug was stopped. What is the best decision about the thiazide?", "o": ["Restart it at the same dose once the sodium is normal and the diuretic is needed", "Restart it and add a daily salt tablet", "Do not restart it, since hyponatremia developed on it", "Restart it only on weekends", "Replace it with a second thiazide-type drug"], "k": 2, "e": "Drug-induced hyponatremia is treated by stopping or changing the agent, and a thiazide should not be restarted in a patient who became hyponatremic on one. Older adults on thiazides often have recurrent episodes."}, {"c": 13, "s": "Ch 13, section Hypernatremia", "q": "A 74-year-old man with sepsis, hypotension, and a high serum sodium is thirsty and confused. What is the best first fluid?", "o": ["Free water by vein as fast as possible to normalize the sodium and relieve the thirst", "Isotonic fluid to restore perfusion, then correct the water deficit slowly", "Hypertonic saline to support the blood pressure", "Fluid restriction until the sodium falls", "Oral water only, with no IV fluid"], "k": 1, "e": "If a hypernatremic patient is in shock, perfusion comes first with isotonic fluid, then the water deficit is corrected slowly. Fast correction of sodium risks cerebral edema, so speed is not the goal."}, {"c": 13, "s": "Ch 13, section Potassium disorders", "q": "A 62-year-old woman with kidney disease has a serum potassium of 6.2 mmol/L and a normal ECG after a repeat sample. How does the UK Renal Association guideline, as described in the chapter, classify this?", "o": ["Moderate hyperkalemia", "Mild hyperkalemia", "Severe hyperkalemia", "Normal, because the ECG is normal", "Pseudohyperkalemia by definition"], "k": 0, "e": "The guideline classes 5.5 to 5.9 mmol/L as mild, 6.0 to 6.4 as moderate, and 6.5 or higher as severe. A value of 6.2 falls in the moderate band."}, {"c": 13, "s": "Ch 13, section Potassium disorders", "q": "A 58-year-old man on an ACE inhibitor and a mineralocorticoid antagonist has a potassium of 5.8 mmol/L, which sits in the mild range, and new peaked T waves on the ECG. What is the best interpretation?", "o": ["The potassium is in the mild range, so no treatment is needed and the ECG can be disregarded", "Repeat the level tomorrow and decide then", "Treat only if the potassium reaches the severe range", "The ECG changes raise urgency more than the number, so treat him now", "Assume hemolysis and ignore the ECG"], "k": 3, "e": "The chapter stresses that ECG changes change the urgency more than the number does. A patient with ECG changes needs treatment now, starting with IV calcium to protect the heart."}, {"c": 13, "s": "Ch 13, section Potassium disorders", "q": "A 70-year-old man with severe hyperkalemia is given intravenous insulin with glucose. Which monitoring step is most important afterward?", "o": ["Repeat ECG only, since glucose does not matter once the potassium has been lowered", "Urine ketones every hour", "Serum calcium before every dose, since the insulin can lower it quickly", "Monitor glucose for hypoglycemia, with extra glucose if the starting glucose was low", "No monitoring is needed after a single dose, because the effect is brief and predictable"], "k": 3, "e": "The guideline recommends insulin with glucose and glucose monitoring afterward because of the risk of hypoglycemia, with extra glucose if the starting glucose is low. Insulin shifts potassium into cells but can drop the glucose."}, {"c": 13, "s": "Ch 13, section Potassium disorders", "q": "A 25-year-old woman presents in diabetic ketoacidosis. Her first potassium is low. What is the safest approach to insulin?", "o": ["Start insulin first, then check potassium the next day", "Give insulin alone, since potassium corrects itself with acidosis treatment and the level will rise", "Give bicarbonate instead of potassium", "Avoid potassium because the body total is high", "Replace potassium before or along with insulin, because insulin drives potassium into cells"], "k": 4, "e": "If the potassium is low when treatment starts, replace it before or with insulin, because insulin moves potassium into cells and can cause arrhythmia. Total body potassium is low in DKA even when serum values look normal or high."}, {"c": 13, "s": "Ch 13, section Calcium, magnesium, and phosphate", "q": "A 52-year-old man with alcohol use disorder has refractory low potassium and low calcium despite repeated replacement. What should be checked and replaced?", "o": ["Phosphate only", "Sodium", "Magnesium", "Chloride", "Albumin only"], "k": 2, "e": "Low magnesium makes potassium and calcium repletion fail, and it is a common hidden cause in alcohol use disorder, diarrhea, diuretic use, and proton pump inhibitor use. Until the magnesium is repleted, the other values will not correct."}, {"c": 13, "s": "Ch 13, section Metabolic acidosis and the anion gap", "q": "A 66-year-old woman with septic shock has a high lactate. The resident wants to keep giving fluid boluses until the lactate normalizes, even though she is not otherwise fluid responsive. What does the Surviving Sepsis guideline suggest?", "o": ["Measure and trend lactate, but do not give fluid solely to normalize it", "Give fluid until the lactate is normal, regardless of response or lung findings", "Stop measuring lactate in sepsis", "Give bicarbonate as the primary treatment", "Treat the number with large saline volumes"], "k": 0, "e": "Lactate is a signal of poor perfusion or altered metabolism, and treatment is aimed at the cause. The guideline suggests trending it but not giving fluid just to normalize it."}, {"c": 13, "s": "Ch 13, section Metabolic alkalosis and respiratory acid-base disorders", "q": "A 45-year-old man with persistent vomiting has metabolic alkalosis, a contracted volume, and a low urine chloride. What is the best treatment?", "o": ["Acetazolamide alone", "Treat for mineralocorticoid excess", "Restrict fluids", "Loop diuretic to excrete the bicarbonate and correct the alkalosis", "Isotonic saline with potassium replacement"], "k": 4, "e": "Low urine chloride marks a chloride-responsive alkalosis, as with vomiting or nasogastric suction, and the patient is volume contracted. Volume and potassium correct it, while a higher urine chloride would point toward mineralocorticoid excess or current diuretic use."}, {"c": 13, "s": "Ch 13, section Metabolic alkalosis and respiratory acid-base disorders", "q": "A 73-year-old man with COPD arrives with acute hypercapnic respiratory acidosis and drowsiness. Which treatment is strongly recommended by the ERS/ATS 2017 guideline as described in the chapter?", "o": ["Supplemental oxygen at high flow only", "Intravenous bicarbonate", "Sedation to reduce breathing effort", "Bilevel noninvasive ventilation", "No ventilatory support and observation"], "k": 3, "e": "For COPD with acute hypercapnic acidosis, bilevel noninvasive ventilation is strongly recommended with high certainty. In non-acidotic hypercapnic COPD, it is only suggested against, so the presence of acidosis is the key."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "An 84-year-old woman with mild dementia becomes more confused over one day. She is afebrile, has no urinary symptoms, and a urine culture sent by the night team grows bacteria. What is the best next step?", "o": ["Look for another cause of the confusion first; bacteria in urine without urinary symptoms or signs rarely need an antibiotic", "Start an antibiotic, since new confusion plus a positive urine culture proves a urinary infection in an older patient with dementia", "Repeat the culture every day until it clears", "Start a broad-spectrum antibiotic and add a second agent for gram-negative cover, since she may be septic", "Place a urinary catheter to monitor output and defer other evaluation of the confusion until the culture finalizes"], "k": 0, "e": "New confusion with a positive culture is a classic trap in older or cognitively impaired patients. Asymptomatic bacteriuria usually needs no treatment, and treating it exposes the patient to resistant organisms and Clostridioides difficile without benefit."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A 71-year-old man with an indwelling catheter develops fever and you suspect a urinary source. The nurse offers urine from the collection bag. What is the best approach to the specimen?", "o": ["Use the bag urine, since it is the most convenient and gives the highest yield of the true pathogen", "Send the tip of the old catheter", "Send the bag urine but ignore the species that grow", "Skip the culture, since catheter urine always has bacteria and the result would not change care", "Sample from a newly placed catheter or the sampling port, since bag urine reflects growth in the system"], "k": 4, "e": "Bag urine reflects colonization in the drainage system and is a poor guide to what is infecting the patient. The culture should be taken before the first antibiotic dose whenever that does not delay care."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A nurse on the medical floor calls because a patient's urine looks cloudy and smells strong. The patient is alert, afebrile, and has no urinary complaints. What is the best response?", "o": ["Do not send urine just because it is cloudy or smells; assess for symptoms and signs and review any catheter", "Send a culture and start an antibiotic while waiting for the result, because cloudy urine suggests infection in a patient who looks well", "Order a CT of the abdomen", "Replace the catheter every day", "Start prophylactic antibiotics for the length of stay to prevent a urinary infection from developing"], "k": 0, "e": "Cloudy or malodorous urine is not a diagnosis, and a positive culture is not a symptom. Testing and treating without symptoms or signs leads to harm from antibiotics without benefit."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A hospital quality team asks what single measure best prevents catheter-associated urinary infection on the wards. What is the best answer?", "o": ["Change the catheter on a fixed schedule regardless of need, so bacteria cannot build up on the surface", "Give a short antibiotic course at catheter removal", "Avoid placing a catheter without an indication and remove it early, with a daily check of the need", "Place catheters in all immobile patients for nursing convenience and to keep the skin dry", "Culture the urine of every catheterized patient each week and treat any growth that is found"], "k": 2, "e": "Most hospital urinary infections occur with a catheter in place, so the best prevention is not placing one without an indication and taking it out early. The Society of Hospital Medicine Choosing Wisely list advises against catheters for convenience in patients who are not critically ill."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A 68-year-old man has had an indwelling catheter for 4 consecutive days. He has a fever above 38.0 C, no other symptoms, and a urine culture grows 100,000 CFU/mL of one organism. How does this relate to the NHSN symptomatic urinary tract infection definition (SUTI 1a)?", "o": ["It is not met, because dysuria is absent", "It is not met, because suprapubic pain is required in every case of catheter-associated infection", "Device duration, a qualifying sign, and the culture count and species limit are all met", "It is not met, because the catheter must be in place for longer than a week before it counts", "It is not met, because the definition excludes men with fever"], "k": 2, "e": "SUTI 1a for a catheterized patient needs a catheter in place more than 2 consecutive days, a qualifying sign such as fever above 38.0 C, and a culture of 100,000 CFU/mL or more with no more than two species. Dysuria is not usable with a catheter and is not required."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A 79-year-old woman with a catheter has flank pain, new hypotension, and rigors. She does not clearly meet any one element of the NHSN surveillance definition. What is the best management?", "o": ["Treat her clinically as possible urinary sepsis, since the surveillance definition counts cases and does not guide treatment", "Withhold treatment until she meets every element of the surveillance definition, then start an antibiotic", "Treat only after a second culture confirms the first, to avoid unnecessary antibiotics", "Assume infection is impossible because the definition is not met, and look for a noninfectious cause of the low blood pressure and rigors", "Reassure her and observe without cultures"], "k": 0, "e": "The NHSN definition counts cases for reporting; it is not a rule for when to treat. A patient who meets none of the elements may still be infected, so sepsis care and a search for a source that needs drainage should go ahead."}, {"c": 14, "s": "Ch 14, section Urinary tract infection, pyelonephritis, and catheter-associated infection", "q": "A 60-year-old man is treated for pyelonephritis with an active antibiotic but remains febrile after treatment. What is the best next step?", "o": ["Extend the same antibiotic for a longer course without further evaluation, since fever can persis
